name: DisDex Stopped Runner Production LIVE Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor == 'dunamishajime-bit'
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Static recovery safety audit
        shell: bash
        run: |
          set -euo pipefail
          FILE=scripts/ops/deploy/disdex_stopped_runner_live_recovery.py
          python3 -m py_compile "$FILE"
          node --test tests/stopped-runner-live-recovery-contract.test.mjs
          grep -Fq 'START_ORDER = ("PENGU_V8", "HYPE_TREND_LONG", "IDLE_PRIORITY_SHORT")' "$FILE"
          ! grep -Eq '(placeMarketOrder|placeConditionalOrder|placeStopMarketOrder|cancelOrder|setLeverage|setMarginType)' "$FILE"
          ! grep -Eq 'systemctl", "(stop|restart)' "$FILE"
          echo RECOVERY_STATIC_AUDIT=PASS
          echo TEST_ORDER_CODE=0
          echo STOP_MUTATION_CODE=0

      - name: Configure pinned root SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/stopped-runner-recovery-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/stopped-runner-recovery-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/stopped-runner-recovery-ssh/"*

      - name: Upload exact recovery helper
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          scp -i "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts" -P "$PORT" scripts/ops/deploy/disdex_stopped_runner_live_recovery.py "root@$HOST:/tmp/disdex_stopped_runner_live_recovery.$GITHUB_RUN_ID.py"
          ssh -T -i "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts" -p "$PORT" "root@$HOST" "chmod 0700 /tmp/disdex_stopped_runner_live_recovery.$GITHUB_RUN_ID.py"

      - name: Recover exact pinned LIVE runners
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -T -i "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts" -o ConnectTimeout=12 -p "$PORT" "root@$HOST" "exec python3 /tmp/disdex_stopped_runner_live_recovery.$GITHUB_RUN_ID.py --run-id $GITHUB_RUN_ID"

      - name: Postflight exact services and V4 LIVE permission
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          SSH=(ssh -T -i "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts" -p "$PORT" "root@$HOST")
          "${SSH[@]}" "test \"\$(systemctl is-active disdex-pengu-dual-ls-v2@1657e173d250ad58f53e62f7bb0a3428fb405496.service)\" = active"
          "${SSH[@]}" "test \"\$(systemctl is-active disdex-hype-long@d6bcc94512a6416189cd92d7203b9ac3b2c98e70.service)\" = active"
          "${SSH[@]}" "test \"\$(systemctl is-active disdex-idle-priority-short@7688ed7c93a1918d8b44837339b7da5584a868f5.service)\" = active"
          "${SSH[@]}" "python3 -c 'import json; h=json.load(open(\"/var/lib/disdex/v12-v4/heartbeat.json\")); assert h.get(\"safetyState\")!=\"BLOCKED\" and h.get(\"status\")!=\"blocked\" and h.get(\"orderEnabled\") is True and h.get(\"ordersAllowed\") is True; print(\"V4_LIVE_POSTFLIGHT=PASS\")'"
          echo STOPPED_RUNNER_RECOVERY_ACTION=PASS

      - name: Cleanup
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set +e
          PORT="${PORT:-22}"
          if [[ -s "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" && -n "$HOST" ]]; then
            ssh -T -i "$RUNNER_TEMP/stopped-runner-recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/stopped-runner-recovery-ssh/known_hosts" -p "$PORT" "root@$HOST" "rm -f -- /tmp/disdex_stopped_runner_live_recovery.$GITHUB_RUN_ID.py" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/stopped-runner-recovery-ssh"
