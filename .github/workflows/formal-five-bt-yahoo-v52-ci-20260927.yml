name: Formal BT Yahoo V52 assumption-model CI
on:
  push:
    branches: [research/formal-five-bt-yahoo-v52-20260927]
    paths:
      - research/formal_five_bt/v52_yahoo.py
      - tests/formal_five_bt/test_v52_yahoo.py
      - .github/workflows/formal-five-bt-yahoo-v52-ci-20260927.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate no lookahead and exact basis gate vs Yahoo reference-only fill
        run: |
          python -m unittest discover -s tests/formal_five_bt -p test_v52_yahoo.py -v
          python -m py_compile research/formal_five_bt/v52_yahoo.py
          python - <<'PY'
          from pathlib import Path
          s=Path("research/formal_five_bt/v52_yahoo.py").read_text()
          assert "COUNTERFACTUAL_NOT_OBSERVED" in s
          assert "YAHOO_EQUITY_REFERENCE_NOT_ASTER_PERP_FILL" in s
          assert "YAHOO_OR_ASTER_PRICE_AT_SIGNAL_OR_ENTRY_UNAVAILABLE" in s
          assert "ASTER_HISTORICAL_L2" not in s
          print("YAHOO_V52_NO_BOOK_ASSUMPTION_AND_SOURCE_PROVENANCE=PASS")
          PY
