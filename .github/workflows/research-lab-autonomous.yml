name: Win80 Main Audit and Lineage Research Lab

# Scheduled runs deepen related research logic. Manual runs default to auditing the actual production main strategy.
on:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/research-lab-autonomous.yml"
      - "scripts/research-lab-autonomous-runner.ts"
      - "scripts/research-lab-main-strategy-audit-runner.ts"
      - "scripts/research-lab-main-strategy-audit-selftest.ts"
      - "lib/research-lab/perp/deep-research.ts"
      - "lib/research-lab/perp/deep-autonomous.ts"
      - "lib/research-lab/perp/deep-discussion.ts"
      - "lib/research-lab/perp/main-strategy-research-policy.ts"
      - "lib/research-lab/perp/main-strategy-audit-discussion.ts"
  workflow_dispatch:
    inputs:
      discussion_mode:
        description: Manual action: audit current main logic or run related deep research
        type: choice
        required: true
        default: main_strategy_audit
        options:
          - main_strategy_audit
          - lineage_deep_research
      profile:
        description: Research profile used only for lineage deep research
        type: choice
        required: true
        default: auto
        options:
          - auto
          - attack
          - balanced
      champions:
        description: Parent lineage strategies used only for lineage deep research
        required: true
        default: "3"
      experiments_per_champion:
        description: Single-parameter child experiments used only for lineage deep research
        required: true
        default: "2"
      start_date:
        description: Research start date used only for lineage deep research
        required: true
        default: "2023-01-01"
      end_date:
        description: Research end date used only for lineage deep research
        required: true
        default: "2026-07-01"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: autonomous-research-lab
  cancel-in-progress: false

jobs:
  autonomous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout research source
        uses: actions/checkout@v4
        with:
          ref: master
          path: source
          fetch-depth: 1

      - name: Checkout persistent research state
        uses: actions/checkout@v4
        with:
          ref: research-autonomous-state
          path: state-repo
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Resolve research mode and configuration
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          manual_mode="${{ inputs.discussion_mode }}"
          if [[ -z "$manual_mode" ]]; then
            manual_mode="main_strategy_audit"
          fi
          echo "RESEARCH_MANUAL_DISCUSSION_MODE=$manual_mode" >> "$GITHUB_ENV"

          if [[ "$event" == "schedule" || ( "$event" == "workflow_dispatch" && "$manual_mode" == "lineage_deep_research" ) ]]; then
            if [[ "$event" == "workflow_dispatch" ]]; then
              echo "PERP_DEEP_CHAMPIONS=${{ inputs.champions }}" >> "$GITHUB_ENV"
              echo "PERP_DEEP_EXPERIMENTS_PER_CHAMPION=${{ inputs.experiments_per_champion }}" >> "$GITHUB_ENV"
              echo "PERP_RESEARCH_START_DATE=${{ inputs.start_date }}" >> "$GITHUB_ENV"
              echo "PERP_RESEARCH_END_DATE=${{ inputs.end_date }}" >> "$GITHUB_ENV"
              if [[ "${{ inputs.profile }}" != "auto" ]]; then
                echo "PERP_RESEARCH_PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"
              fi
            else
              echo "PERP_DEEP_CHAMPIONS=3" >> "$GITHUB_ENV"
              echo "PERP_DEEP_EXPERIMENTS_PER_CHAMPION=2" >> "$GITHUB_ENV"
              echo "PERP_RESEARCH_START_DATE=2023-01-01" >> "$GITHUB_ENV"
              echo "PERP_RESEARCH_END_DATE=2026-07-01" >> "$GITHUB_ENV"
            fi
            echo "PERP_RESEARCH_MODE=win80_ultra90_lineage" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_ROUNDS=1" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_POPULATION=9" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINALISTS=9" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_ELITES=3" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_CONCURRENCY=1" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_WALK_FORWARD_FOLDS=3" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_TARGET_MONTHLY_PCT=30" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINAL_OOS_MONTHLY_PCT=30" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINAL_STRESS_MONTHLY_PCT=20" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_SYMBOLS=BTC,ETH,BNB,SOL,XRP,ADA,AVAX,LINK,LTC,ATOM,AAVE,NEAR,INJ" >> "$GITHUB_ENV"
          fi
          echo "RESEARCH_AUTONOMOUS_STATE_DIR=.research-state" >> "$GITHUB_ENV"

      - name: Restore previous autonomous state
        shell: bash
        run: |
          mkdir -p source/.research-state
          if [[ -d state-repo/.research-state ]]; then
            cp -a state-repo/.research-state/. source/.research-state/
          fi

      - name: Restore USD-M market data cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode == 'lineage_deep_research') }}
        uses: actions/cache@v4
        with:
          path: source/.cache/perp-research-usdm
          key: champion-deep-usdm-v1-${{ env.PERP_RESEARCH_START_DATE }}-${{ env.PERP_RESEARCH_END_DATE }}-${{ hashFiles('source/lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            champion-deep-usdm-v1-
            autonomous-usdm-v2-

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: TypeScript check
        working-directory: source
        run: npm run typecheck

      - name: Production main strategy rule self-test
        working-directory: source
        run: npm run strategy:main:selftest

      - name: Current main strategy audit self-test
        working-directory: source
        run: npm run research:main-strategy:audit:selftest

      - name: Main-lineage policy self-test
        working-directory: source
        run: npm run research:main-lineage:selftest

      - name: Funding and temporal self-test
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode == 'lineage_deep_research') }}
        working-directory: source
        run: npm run research:perp:selftest

      - name: Champion deep research self-test
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode == 'lineage_deep_research') }}
        working-directory: source
        run: npm run research:champion:selftest

      - name: Research discussion self-test
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode == 'lineage_deep_research') }}
        working-directory: source
        run: npm run research:discussion:selftest

      - name: Run current production main strategy audit discussion
        id: main_audit
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode != 'lineage_deep_research') }}
        working-directory: source
        run: npm run research:main-strategy:audit

      - name: Run Win80 Ultra90 lineage deep research cycle
        id: research
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discussion_mode == 'lineage_deep_research') }}
        working-directory: source
        run: npm run research:perp:autonomous

      - name: Publish cycle or audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f source/.research-state/latest-report.md ]]; then
            cat source/.research-state/latest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f source/.research-state/last-error.json ]]; then
            echo "## Last error" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat source/.research-state/last-error.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist autonomous research state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf state-repo/.research-state
          mkdir -p state-repo/.research-state
          if [[ -d source/.research-state ]]; then
            cp -a source/.research-state/. state-repo/.research-state/
          fi
          cd state-repo
          git config user.name "disdex-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .research-state
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "research: state update run ${GITHUB_RUN_NUMBER}"
            git push origin research-autonomous-state
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-evidence-${{ github.run_number }}
          path: |
            source/.research-state
            source/reports/research-lab-autonomous
          if-no-files-found: warn
          retention-days: 30

      - name: Open Forward Paper candidate issue
        if: steps.research.outputs.final_candidates != '' && steps.research.outputs.final_candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Win80 Lineage Research: Forward Paper candidate cycle ${{ steps.research.outputs.cycle }}" \
            --body-file source/.research-state/forward-paper-candidates.md

      - name: Report or update autonomous failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Win80 Main Audit and Lineage Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="Research workflow failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Current production main strategy remains unchanged and real trading stays disabled."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Win80 Main Audit and Lineage Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "Research workflow recovered automatically in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
