name: Win80 Ultra90 Main-Lineage Research Lab

# A workflow-only push is also an intentional immediate research kickoff.
on:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/research-lab-autonomous.yml"
      - "scripts/research-lab-autonomous-runner.ts"
      - "lib/research-lab/perp/deep-research.ts"
      - "lib/research-lab/perp/deep-autonomous.ts"
      - "lib/research-lab/perp/deep-discussion.ts"
      - "lib/research-lab/perp/main-strategy-research-policy.ts"
      - "scripts/research-lab-main-strategy-policy-selftest.ts"
  workflow_dispatch:
    inputs:
      profile:
        description: Research profile (auto follows saved Champion state)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - attack
          - balanced
      champions:
        description: Parent Champion strategies (maximum 3)
        required: true
        default: "3"
      experiments_per_champion:
        description: Single-parameter child experiments per Champion
        required: true
        default: "2"
      start_date:
        description: Research start date
        required: true
        default: "2023-01-01"
      end_date:
        description: Research end date
        required: true
        default: "2026-07-01"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: autonomous-research-lab
  cancel-in-progress: false

jobs:
  autonomous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout research source
        uses: actions/checkout@v4
        with:
          ref: master
          path: source
          fetch-depth: 1

      - name: Checkout persistent research state
        uses: actions/checkout@v4
        with:
          ref: research-autonomous-state
          path: state-repo
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Resolve Champion Deep configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PERP_DEEP_CHAMPIONS=${{ inputs.champions }}" >> "$GITHUB_ENV"
            echo "PERP_DEEP_EXPERIMENTS_PER_CHAMPION=${{ inputs.experiments_per_champion }}" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_START_DATE=${{ inputs.start_date }}" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_END_DATE=${{ inputs.end_date }}" >> "$GITHUB_ENV"
            if [[ "${{ inputs.profile }}" != "auto" ]]; then
              echo "PERP_RESEARCH_PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"
            fi
          else
            echo "PERP_DEEP_CHAMPIONS=3" >> "$GITHUB_ENV"
            echo "PERP_DEEP_EXPERIMENTS_PER_CHAMPION=2" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_START_DATE=2023-01-01" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_END_DATE=2026-07-01" >> "$GITHUB_ENV"
          fi
          echo "PERP_RESEARCH_MODE=win80_ultra90_lineage" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_ROUNDS=1" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_POPULATION=9" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_FINALISTS=9" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_ELITES=3" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_CONCURRENCY=1" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_WALK_FORWARD_FOLDS=3" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_TARGET_MONTHLY_PCT=30" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_FINAL_OOS_MONTHLY_PCT=30" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_FINAL_STRESS_MONTHLY_PCT=20" >> "$GITHUB_ENV"
          echo "PERP_RESEARCH_SYMBOLS=BTC,ETH,BNB,SOL,XRP,ADA,AVAX,LINK,LTC,ATOM,AAVE,NEAR,INJ" >> "$GITHUB_ENV"
          echo "RESEARCH_AUTONOMOUS_STATE_DIR=.research-state" >> "$GITHUB_ENV"

      - name: Restore previous autonomous state
        shell: bash
        run: |
          mkdir -p source/.research-state
          if [[ -d state-repo/.research-state ]]; then
            cp -a state-repo/.research-state/. source/.research-state/
          fi

      - name: Restore USD-M market data cache
        uses: actions/cache@v4
        with:
          path: source/.cache/perp-research-usdm
          key: champion-deep-usdm-v1-${{ env.PERP_RESEARCH_START_DATE }}-${{ env.PERP_RESEARCH_END_DATE }}-${{ hashFiles('source/lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            champion-deep-usdm-v1-
            autonomous-usdm-v2-

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: TypeScript check
        working-directory: source
        run: npm run typecheck

      - name: Funding and temporal self-test
        working-directory: source
        run: npm run research:perp:selftest

      - name: Champion deep research self-test
        working-directory: source
        run: npm run research:champion:selftest

      - name: Main strategy lineage policy self-test
        working-directory: source
        run: npm run research:main-lineage:selftest

      - name: Research discussion self-test
        working-directory: source
        run: npm run research:discussion:selftest

      - name: Run Win80 Ultra90 Main-Lineage Research cycle
        id: research
        working-directory: source
        run: npm run research:perp:autonomous

      - name: Publish cycle summary
        if: always()
        shell: bash
        run: |
          if [[ -f source/.research-state/latest-report.md ]]; then
            cat source/.research-state/latest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f source/.research-state/last-error.json ]]; then
            echo "## Last error" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat source/.research-state/last-error.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist autonomous state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf state-repo/.research-state
          mkdir -p state-repo/.research-state
          if [[ -d source/.research-state ]]; then
            cp -a source/.research-state/. state-repo/.research-state/
          fi
          cd state-repo
          git config user.name "disdex-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .research-state
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "research: win80 ultra90 lineage cycle ${GITHUB_RUN_NUMBER}"
            git push origin research-autonomous-state
          fi

      - name: Upload Champion Deep Research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win80-ultra90-lineage-cycle-${{ github.run_number }}
          path: |
            source/.research-state
            source/reports/research-lab-autonomous
          if-no-files-found: warn
          retention-days: 30

      - name: Open Forward Paper candidate issue
        if: steps.research.outputs.final_candidates != '' && steps.research.outputs.final_candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Win80 Ultra90 Lineage: Forward Paper candidate cycle ${{ steps.research.outputs.cycle }}" \
            --body-file source/.research-state/forward-paper-candidates.md

      - name: Report or update autonomous failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Win80 Ultra90 Main-Lineage Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="Win80 Ultra90 Main-Lineage Research failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The next scheduled cycle will retry without replacing the fixed production main strategy."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Win80 Ultra90 Main-Lineage Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "Win80 Ultra90 Main-Lineage Research recovered automatically in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
