name: Win80 Direct Main Strategy Research Lab

# Scheduled and push runs research the actual production main strategy. Legacy Champion research is optional only.
on:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/research-lab-autonomous.yml"
      - "scripts/research-lab-main-strategy-research-runner.ts"
      - "scripts/research-lab-main-strategy-research-selftest.ts"
      - "scripts/research-lab-main-strategy-audit-runner.ts"
      - "scripts/research-lab-main-strategy-audit-selftest.ts"
      - "lib/research-lab/perp/main-strategy-research-program.ts"
      - "lib/research-lab/perp/main-strategy-audit-discussion.ts"
      - "lib/win80-ultra90-main-strategy.ts"
      - "config/strategyConfig.ts"
  workflow_dispatch:
    inputs:
      discussion_mode:
        description: Manual action
        type: choice
        required: true
        default: main_strategy_research
        options:
          - main_strategy_research
          - main_strategy_audit
          - related_logic_exploration
      profile:
        description: Profile used only for optional related logic exploration
        type: choice
        required: true
        default: auto
        options:
          - auto
          - attack
          - balanced
      champions:
        description: Parent strategies used only for optional related logic exploration
        required: true
        default: "3"
      experiments_per_champion:
        description: Child experiments used only for optional related logic exploration
        required: true
        default: "2"
      start_date:
        description: Start date used only for optional related logic exploration
        required: true
        default: "2023-01-01"
      end_date:
        description: End date used only for optional related logic exploration
        required: true
        default: "2026-07-01"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: autonomous-research-lab
  cancel-in-progress: false

jobs:
  autonomous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout research source
        uses: actions/checkout@v4
        with:
          ref: master
          path: source
          fetch-depth: 1

      - name: Checkout persistent research state
        uses: actions/checkout@v4
        with:
          ref: research-autonomous-state
          path: state-repo
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Resolve research mode and configuration
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [[ "$event" == "workflow_dispatch" ]]; then
            mode="${{ inputs.discussion_mode }}"
          else
            mode="main_strategy_research"
          fi
          if [[ -z "$mode" ]]; then
            mode="main_strategy_research"
          fi
          echo "RESEARCH_DISCUSSION_MODE=$mode" >> "$GITHUB_ENV"
          echo "RESEARCH_AUTONOMOUS_STATE_DIR=.research-state" >> "$GITHUB_ENV"

          if [[ "$mode" == "related_logic_exploration" ]]; then
            echo "PERP_DEEP_CHAMPIONS=${{ inputs.champions }}" >> "$GITHUB_ENV"
            echo "PERP_DEEP_EXPERIMENTS_PER_CHAMPION=${{ inputs.experiments_per_champion }}" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_START_DATE=${{ inputs.start_date }}" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_END_DATE=${{ inputs.end_date }}" >> "$GITHUB_ENV"
            if [[ "${{ inputs.profile }}" != "auto" ]]; then
              echo "PERP_RESEARCH_PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"
            fi
            echo "PERP_RESEARCH_MODE=win80_ultra90_lineage" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_ROUNDS=1" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_POPULATION=9" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINALISTS=9" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_ELITES=3" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_CONCURRENCY=1" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_WALK_FORWARD_FOLDS=3" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_TARGET_MONTHLY_PCT=30" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINAL_OOS_MONTHLY_PCT=30" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_FINAL_STRESS_MONTHLY_PCT=20" >> "$GITHUB_ENV"
            echo "PERP_RESEARCH_SYMBOLS=BTC,ETH,BNB,SOL,XRP,ADA,AVAX,LINK,LTC,ATOM,AAVE,NEAR,INJ" >> "$GITHUB_ENV"
          fi

      - name: Restore previous autonomous state
        shell: bash
        run: |
          mkdir -p source/.research-state
          if [[ -d state-repo/.research-state ]]; then
            cp -a state-repo/.research-state/. source/.research-state/
          fi

      - name: Restore USD-M market data cache
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'related_logic_exploration' }}
        uses: actions/cache@v4
        with:
          path: source/.cache/perp-research-usdm
          key: related-logic-usdm-v1-${{ env.PERP_RESEARCH_START_DATE }}-${{ env.PERP_RESEARCH_END_DATE }}-${{ hashFiles('source/lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            related-logic-usdm-v1-
            champion-deep-usdm-v1-
            autonomous-usdm-v2-

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: TypeScript check
        working-directory: source
        run: npm run typecheck

      - name: Production main strategy rule self-test
        working-directory: source
        run: npm run strategy:main:selftest

      - name: Direct main strategy program self-test
        working-directory: source
        run: npm run research:main-strategy:program:selftest

      - name: Current main strategy audit self-test
        working-directory: source
        run: npm run research:main-strategy:audit:selftest

      - name: Main-lineage policy self-test
        working-directory: source
        run: npm run research:main-lineage:selftest

      - name: Funding and temporal self-test
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'related_logic_exploration' }}
        working-directory: source
        run: npm run research:perp:selftest

      - name: Champion deep research self-test
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'related_logic_exploration' }}
        working-directory: source
        run: npm run research:champion:selftest

      - name: Research discussion self-test
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'related_logic_exploration' }}
        working-directory: source
        run: npm run research:discussion:selftest

      - name: Run direct production main strategy research
        id: main_program
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'main_strategy_research' }}
        working-directory: source
        run: npm run research:main-strategy:program

      - name: Run current production main strategy audit
        id: main_audit
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'main_strategy_audit' }}
        working-directory: source
        run: npm run research:main-strategy:audit

      - name: Run optional related logic exploration
        id: related_research
        if: ${{ env.RESEARCH_DISCUSSION_MODE == 'related_logic_exploration' }}
        working-directory: source
        run: npm run research:perp:autonomous

      - name: Publish research summary
        if: always()
        shell: bash
        run: |
          if [[ -f source/.research-state/latest-report.md ]]; then
            cat source/.research-state/latest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f source/.research-state/last-error.json ]]; then
            echo "## Last error" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat source/.research-state/last-error.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist autonomous research state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf state-repo/.research-state
          mkdir -p state-repo/.research-state
          if [[ -d source/.research-state ]]; then
            cp -a source/.research-state/. state-repo/.research-state/
          fi
          cd state-repo
          git config user.name "disdex-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .research-state
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "research: ${RESEARCH_DISCUSSION_MODE} state update run ${GITHUB_RUN_NUMBER}"
            git push origin research-autonomous-state
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-evidence-${{ github.run_number }}
          path: |
            source/.research-state
            source/reports/research-lab-autonomous
          if-no-files-found: warn
          retention-days: 30

      - name: Open Forward Paper candidate issue for optional related exploration
        if: steps.related_research.outputs.final_candidates != '' && steps.related_research.outputs.final_candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Related Logic Research: Forward Paper candidate cycle ${{ steps.related_research.outputs.cycle }}" \
            --body-file source/.research-state/forward-paper-candidates.md

      - name: Report or update research failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Win80 Direct Main Strategy Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="Research workflow failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Production main strategy remains unchanged and real trading stays disabled."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Win80 Direct Main Strategy Research failure"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "Direct main strategy research recovered automatically in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
