name: PENGU V16 Relative Thesis Development

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'PRE_REGISTER_V16.md'
      - 'scripts/research_pengu_short_v16_relative_thesis.py'
      - '.github/workflows/pengu-v16-relative-thesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run frozen V16 on known venues only
        run: python scripts/research_pengu_short_v16_relative_thesis.py
      - name: Validate preregistration and holdout lock
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-short-v16/development-result.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate']=='COUNTERWIND_RELATIVE_THESIS_PROBATION'
          assert x['preRegistrationSha']=='1528d182ad3593460d325e2c1e1f6bacf0b07795'
          assert x['candidateCount']==1 and x['thresholdSweep'] is False and x['ruleChangeCount']==1
          assert x['kucoinPerformanceObserved'] is False
          assert x['promotionPass'] is False
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          if x['developmentPass']:
              assert x['kucoinHoldoutStatus']=='ELIGIBLE_TO_OPEN'
          else:
              assert x['kucoinHoldoutStatus']=='RESERVED_UNOPENED'
          print(json.dumps({'developmentPass':x['developmentPass'],'venuePasses':x['venuePasses'],'kucoinHoldoutStatus':x['kucoinHoldoutStatus'],'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v16-development-${{ github.run_id }}
          path: .research-state/pengu-short-v16
          if-no-files-found: error
