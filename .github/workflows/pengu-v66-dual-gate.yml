name: PENGU V66 Dual Gate

on:
  push:
    branches:
      - research/pengu-wave-sleeve-v47
    paths:
      - scripts/research_lab_pengu_v66_dual_gate.py
      - .github/workflows/pengu-v66-dual-gate.yml
  pull_request:
    branches:
      - research/pengu-wave-sleeve-v47
    paths:
      - scripts/research_lab_pengu_v66_dual_gate.py
      - .github/workflows/pengu-v66-dual-gate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
  ISOLATED_PR_RUN: "1"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research_lab_pengu_wave_sleeve_v47.py scripts/research_lab_pengu_wave_sleeve_v49.py scripts/research_lab_pengu_wave_sleeve_v50.py scripts/research_lab_pengu_wave_sleeve_v52.py scripts/research_lab_pengu_v57_extended_bt.py scripts/research_lab_pengu_v57_extended_bt_v3.py scripts/research_lab_pengu_v60_delayed_exit.py scripts/research_lab_pengu_v62_adaptive_sizing.py scripts/research_lab_pengu_v63_robustness.py scripts/research_lab_pengu_v65_conditional_distribution.py scripts/research_lab_pengu_v66_dual_gate.py
      - name: Run dual-gate validation
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_pengu_v66_dual_gate.py 2>&1 | tee .research-state/pengu-v66-dual-gate.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pengu-v66-dual-gate
          path: |
            .research-state/pengu-v66-dual-gate.json
            .research-state/pengu-v66-dual-gate.md
            .research-state/pengu-v66-dual-gate.log
          if-no-files-found: warn
          retention-days: 30
