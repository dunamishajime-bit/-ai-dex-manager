name: V52 Frequency Expansion V2 Research

on:
  pull_request:
    paths:
      - 'scripts/research_lab_v52_frequency_expansion_v2.py'
      - '.github/workflows/v52-frequency-expansion-v2-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v52-frequency-expansion-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1

      - name: Checkout frozen V13 dependency source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .cache/perp-research-usdm
            .cache/v96-crypto-v11-v13d-one-year
          key: v52-frequency-expansion-v2-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v52_frequency_expansion_v2.py') }}
          restore-keys: |
            v52-gate-sensitivity-relative-${{ runner.os }}-
            v52-gate-sensitivity-${{ runner.os }}-
            v96-v52-dual-slot-one-year-${{ runner.os }}-
            aster-only-v52-v39cache-${{ runner.os }}-
            aster-only-v39-${{ runner.os }}-

      - name: Compile and self-test
        run: |
          python -m py_compile \
            scripts/research_lab_v52_gate_sensitivity.py \
            scripts/research_lab_v52_frequency_expansion_v2.py
          python scripts/research_lab_v52_frequency_expansion_v2.py --self-test

      - name: Run disciplined frequency expansion
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .research-state/v52-frequency-expansion-v2
          python scripts/research_lab_v52_frequency_expansion_v2.py \
            --cache-root .cache/aster-only-v39-overnight-open \
            --output-dir .research-state/v52-frequency-expansion-v2 \
            2>&1 | tee .research-state/v52-frequency-expansion-v2/backtest.log

      - name: Validate research-only contract
        run: |
          test -s .research-state/v52-frequency-expansion-v2/result.json
          test -s .research-state/v52-frequency-expansion-v2/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/v52-frequency-expansion-v2/result.json').read_text())
          assert p['strategyId']=='DISDEX_V52_FREQUENCY_EXPANSION_V2_RESEARCH_ONLY'
          assert p['period']['calendarDays']==365
          assert p['selectionDiscipline']['holdoutUsedForSelection'] is False
          assert p['selectionDiscipline']['clockGateChanged'] is False
          assert p['selectionDiscipline']['top1RuleChanged'] is False
          assert p['selectionDiscipline']['costRatioChanged'] is False
          assert p['selectionDiscipline']['grossCapChanged'] is False
          assert p['searchSpace']['v50CandidateCount']==1215
          assert p['searchSpace']['v11CandidateCount']==36
          assert p['safety']=={
              'mode':'RESEARCH_ONLY',
              'orderSubmissionAllowed':False,
              'productionChanged':False,
              'liveChanged':False,
              'vpsChanged':False,
              'realPositionsChanged':False,
          }
          assert p['recommendation']['productionChangeAllowed'] is False
          assert p['recommendation']['liveGateChanged'] is False
          for block in (p['baseline'], p['lockedWinner']):
              assert block['full']['NORMAL']['routing']['maximumObservedGross'] <= 1.5 + 1e-9
              assert block['full']['NORMAL']['routing']['maximumObservedV50DailyTrades'] <= 3
          print(json.dumps({
              'status':p['status'],
              'baseline':p['baseline']['full']['NORMAL'],
              'winner':p['lockedWinner']['full']['NORMAL'],
              'winnerP95':p['lockedWinner']['full']['P95'],
              'winnerHoldout':p['lockedWinner']['holdout']['NORMAL'],
              'winnerV11':p['lockedWinner']['v11'],
              'winnerV50':p['lockedWinner']['v50'],
              'checks':p['finalChecks'],
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-frequency-expansion-v2-${{ github.run_id }}
          path: .research-state/v52-frequency-expansion-v2
          retention-days: 90
          if-no-files-found: warn
