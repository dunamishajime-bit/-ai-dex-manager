name: PENGU Baseline Short Entry Path Diagnostic

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'PENGU_ENTRY_PATH_DIAGNOSTIC.md'
      - 'scripts/research_pengu_entry_path_diagnostic.py'
      - '.github/workflows/pengu-entry-path-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Diagnose baseline Short entry paths
        run: python scripts/research_pengu_entry_path_diagnostic.py
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-entry-path-diagnostic/diagnostic.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['diagnosticOnly'] is True
          assert x['candidateCount']==0 and x['thresholdSweep'] is False
          assert set(x['summary'])=={'OKX','Binance','Gate','Bitget'}
          assert x['kucoinPerformanceObserved'] is False
          assert all(len(v)>0 for v in x['summary'].values())
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'shortCounts':{k:len(v) for k,v in x['summary'].items()},'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-entry-path-diagnostic-${{ github.run_id }}
          path: .research-state/pengu-entry-path-diagnostic
          if-no-files-found: error
