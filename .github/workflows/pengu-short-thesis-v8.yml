name: PENGU Short Thesis V8 Robustness

on:
  pull_request:
    branches:
      - research/pengu-short-progression-v6-20260824
    paths:
      - 'scripts/research_pengu_short_thesis_v8.ts'
      - 'scripts/research_pengu_short_thesis_v8_crossvenue.py'
      - '.github/workflows/pengu-short-thesis-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Populate official Binance Vision cache using frozen V7 downloader
        run: python scripts/research_pengu_short_progression_v7_crossvenue.py >/tmp/v7-cache.log
      - name: Run single-candidate V8 across three environments
        run: python scripts/research_pengu_short_thesis_v8_crossvenue.py
      - name: Validate anti-overfit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-thesis-v8-crossvenue/result.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate'].startswith('ATR_ARM_EMA72_RECLAIM')
          assert set(x['checks'])=={'binancePrior','binanceOverlap','asterCurrent'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'promotion':x['promotion'],'checks':{k:v['pass'] for k,v in x['checks'].items()}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-short-thesis-v8-${{ github.run_id }}
          path: .research-state/pengu-short-thesis-v8-crossvenue
          if-no-files-found: error
