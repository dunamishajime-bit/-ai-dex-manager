name: Aster-only V19 Exact Trailing One-Year Backtest

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v19_trailing_one_year_bt.py'
      - 'docs/research/ASTER_ONLY_V19_TRAILING_ONE_YEAR_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v19-trailing-one-year-bt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v19-trailing-one-year-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D benchmark source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v19-trailing-one-year
          key: aster-only-v19-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v19_trailing_one_year_bt.py') }}
          restore-keys: |
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile scripts/research_lab_aster_only_v19_trailing_one_year_bt.py
          python - <<'PY'
          import datetime as dt
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v19_trailing_one_year_bt as v19
          assert (v19.BT_END_EXCLUSIVE - v19.BT_START).days == 365
          assert v19.BT_START.isoformat() == '2025-07-25T00:00:00+00:00'
          assert v19.BT_END_EXCLUSIVE.isoformat() == '2026-07-25T00:00:00+00:00'
          assert v19.CANDIDATE.candidate_id == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert v19.CANDIDATE.threshold == 2.0
          assert v19.CANDIDATE.entry_policy == 'SLOT_1230'
          assert v19.CANDIDATE.maximum_holding_hours == 2
          print('V19 freeze assertions: PASS')
          PY
      - name: Run exact trailing one-year backtest
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v19-trailing-one-year
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v19_trailing_one_year_bt.py \
            --cache-dir ../.cache/aster-only-v19-trailing-one-year \
            --output-dir ../.research-state/aster-only-v19-trailing-one-year \
            2>&1 | tee ../.research-state/aster-only-v19-trailing-one-year/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v19-trailing-one-year/result.json
          test -s .research-state/aster-only-v19-trailing-one-year/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v19-trailing-one-year/result.json').read_text())
          assert p['version'] == 19
          assert p['period']['calendarDays'] == 365
          assert p['period']['startInclusiveUtc'] == '2025-07-25T00:00:00+00:00'
          assert p['period']['endExclusiveUtc'] == '2026-07-25T00:00:00+00:00'
          assert p['candidate']['candidate_id'] == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert p['method']['candidateRetuned'] is False
          assert p['method']['thresholdsChanged'] is False
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          assert p['status'] in {
            'ASTER_ONLY_V19_TRAILING_YEAR_PASS_SHADOW_ONLY',
            'ASTER_ONLY_V19_TRAILING_YEAR_DID_NOT_PASS',
          }
          print(json.dumps({
            'status': p['status'],
            'period': p['period'],
            'normal': p['results']['NORMAL'],
            'p95': p['results']['P95'],
            'checks': p['checks'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v19-trailing-one-year-${{ github.run_id }}
          path: .research-state/aster-only-v19-trailing-one-year
          retention-days: 90
          if-no-files-found: warn
