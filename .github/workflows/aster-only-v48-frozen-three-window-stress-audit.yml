name: Aster-only V48 Frozen Three-Window Stress Audit

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v48_frozen_three_window_stress_audit.py'
      - 'docs/research/ASTER_ONLY_V48_FROZEN_THREE_WINDOW_STRESS_AUDIT_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v48-frozen-three-window-stress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v48-frozen-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore successful V39 market caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v39-overnight-open
          key: aster-only-v48-v39cache-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v48_frozen_three_window_stress_audit.py') }}
          restore-keys: |
            aster-only-v39-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v39_overnight_open_router.py \
            scripts/research_lab_aster_only_v40_overnight_residual_router.py \
            scripts/research_lab_aster_only_v42_idiosyncratic_open_residual.py \
            scripts/research_lab_aster_only_v46_closing_overlay.py \
            scripts/research_lab_aster_only_v47_three_window_router.py \
            scripts/research_lab_aster_only_v48_frozen_three_window_stress_audit.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v48_frozen_three_window_stress_audit as v48
          assert (v48.v47.v39.v19.BT_END_EXCLUSIVE - v48.v47.v39.v19.BT_START).days == 365
          assert v48.FROZEN.candidate_id == 'REV_C75_H1_G0.1_SHORT_ONLY__CLOSE_CROSS_LONG__BLOCK_SAME'
          assert len(v48.NEIGHBOR_CANDIDATES) == 18
          assert v48.CUSTOM_COSTS == (50.0, 60.0)
          assert v48.v47.v39.BASELINE_NORMAL == 72.276908
          assert v48.v47.v39.BASELINE_P95 == 68.080022
          assert v48.v47.v39.BASELINE_FALLBACK_NORMAL == 7.813259
          assert v48.v47.v39.BASELINE_FALLBACK_P95 == 7.400908
          print('V48 freeze assertions: PASS')
          PY
      - name: Run V48 frozen stress audit
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v48-frozen-stress
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v48_frozen_three_window_stress_audit.py \
            --cache-dir ../.cache/aster-only-v39-overnight-open \
            --output-dir ../.research-state/aster-only-v48-frozen-stress \
            2>&1 | tee ../.research-state/aster-only-v48-frozen-stress/audit.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v48-frozen-stress/result.json
          test -s .research-state/aster-only-v48-frozen-stress/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v48-frozen-stress/result.json').read_text())
          assert p['version'] == 48
          assert p['period']['calendarDays'] == 365
          assert p['frozenCandidate']['candidate_id'] == 'REV_C75_H1_G0.1_SHORT_ONLY__CLOSE_CROSS_LONG__BLOCK_SAME'
          assert p['selectionDisclosure'] == {
              'selectedAfterReviewingV47Diagnostics': True,
              'independentHoldout': False,
              'productionPromotionAllowed': False,
              'allowedNextStage': 'ORDERLESS_FORWARD_SHADOW_ONLY',
          }
          assert p['architecture'] == {
              'venue': 'ASTER_ONLY',
              'maximumConcurrentGross': 1.0,
              'maximumConcurrentPositions': 1,
              'sequentialIntradayEntriesAllowed': True,
              'reversalGross': 0.1,
              'sameSymbolReuseBlocked': True,
              'v11EqPriority': True,
              'hyperliquidUsed': False,
          }
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V48_HISTORICAL_STRESS_PASS_FORWARD_SHADOW_ONLY',
              'ASTER_ONLY_V48_HISTORICAL_STRESS_DID_NOT_PASS',
          }
          if p['status'] == 'ASTER_ONLY_V48_HISTORICAL_STRESS_PASS_FORWARD_SHADOW_ONLY':
              assert p['allChecksPassed'] is True
              assert all(p['checks'].values())
          print(json.dumps({
              'status': p['status'],
              'frozenCandidate': p['frozenCandidate'],
              'baseNormal': p['baseAudit']['full']['NORMAL'],
              'baseP95': p['baseAudit']['full']['P95'],
              'baseFallback': p['baseAudit']['fallbackFull'],
              'checks': p['checks'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v48-frozen-stress-${{ github.run_id }}
          path: .research-state/aster-only-v48-frozen-stress
          retention-days: 90
          if-no-files-found: warn
