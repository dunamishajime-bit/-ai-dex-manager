name: PENGU Recovery Successor Guard
on:
  workflow_dispatch:
  push:
    branches: [research/pengu-recovery-validation-20260827]
    paths:
      - 'scripts/research_patch_pengu_recovery_successor_guard.py'
      - '.github/workflows/pengu-recovery-successor-guard.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: pengu-recovery-successor-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: a76fd7aaa0788209532a5a2c6489135dd8e4a27e, path: .pengu-current, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run F1/F2-only successor guard study
        env:
          PRODUCTION_SOURCE_SHA: a76fd7aaa0788209532a5a2c6489135dd8e4a27e
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.pengu-current/tsconfig.pengu-dual-ls-v2.json
          PENGU_DIAG_OUTPUT_DIR: ${{ github.workspace }}/.research-state/pengu-recovery-successor-guard
        run: |
          npm ci
          ln -s ../node_modules .pengu-current/node_modules
          python -m py_compile scripts/research_patch_pengu_recovery_successor_guard.py
          python scripts/research_generate_pengu_v57_from_v56.py
          python scripts/research_patch_v57_replacement_audit.py
          python scripts/research_patch_v57_economic_winner_guard.py
          python scripts/research_patch_v64_supplemental_sizing.py
          python scripts/research_patch_pengu_missed_opportunity_map.py
          python scripts/research_patch_pengu_directional_wave_map.py
          python scripts/research_patch_pengu_recovery_study.py
          python scripts/research_patch_pengu_recovery_backtest.py
          python scripts/research_patch_pengu_recovery_backtest_fold_fix.py
          python scripts/research_patch_pengu_recovery_v2_subordinate.py
          python scripts/research_patch_pengu_recovery_successor_guard.py
          npx tsx .pengu-current/scripts/.research_pengu_v57.generated.ts
      - name: Verify successor guard contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/pengu-recovery-successor-guard/missed-opportunity-map.json').read_text())
          assert x['v64']['trades']==41 and x['v64']['longTrades']==13 and x['v64']['shortTrades']==28
          assert abs(x['v64']['metrics']['returnPct']-303.9903920953809)<1e-9
          g=x['recoverySuccessorGuard']
          assert g['schema']=='pengu-recovery-successor-guard/v1'
          assert g['methodology']['status']=='POST_HOC_FEATURE_FAMILY_DEVELOPMENT'
          assert g['methodology']['candidateCount']==8
          assert g['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print('SUCCESSOR_GUARD='+json.dumps({'thresholds':g['derivedThresholds'],'survivors':g['survivorCount'],'decision':g['decision'],'selected':g['selected'],'f3Diagnostic':g['f3Diagnostic']},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-recovery-successor-guard-${{ github.run_id }}
          path: .research-state/pengu-recovery-successor-guard
          include-hidden-files: true
          retention-days: 90
