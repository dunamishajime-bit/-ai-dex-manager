name: Active4 V129 Monetization Lifecycle Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/active4-v129-trigger.txt"

permissions:
  contents: read

concurrency:
  group: active4-v129-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_probe_core_handoff, btc_long_ownership_cash, eth_abs_rel_consensus, bnb_cash_hold_extension, avax_dual_phase_burst]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_active4_v129_run.py
      - name: Run V129 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v129_run.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v129-${{ matrix.candidate }}
          path: |
            .research-state/active4-v129-${{ matrix.candidate }}.json
            .research-state/active4-v129-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research only. BTC/ETH/BNB/AVAX only; LINK/SOL untouched/frozen.
# No production/VPS/live/credentials/orders/accounts/positions changes.
