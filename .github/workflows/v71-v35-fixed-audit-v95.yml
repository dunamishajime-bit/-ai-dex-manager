name: V71 V35 Fixed Audit V95

on:
  push:
    branches:
      - research/v71-v35-final-v95
    paths:
      - scripts/research_lab_v71_v35_fixed_audit_v95.py
      - .github/workflows/v71-v35-fixed-audit-v95.yml
  pull_request:
    branches:
      - research/v71-v35-final-base-20260721
    paths:
      - scripts/research_lab_v71_v35_fixed_audit_v95.py
      - .github/workflows/v71-v35-fixed-audit-v95.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/research_lab_v71_v35_fixed_audit_v95.py \
            scripts/research_lab_v35_weight_band_v90.py \
            scripts/research_lab_v35_exhaustion_guard_v93.py \
            scripts/research_lab_v71_whipsaw_guard_v84.py \
            scripts/research_lab_v35_core_pengu_v67_v70_dynamic_cap.py
      - name: Run fixed-checkout audit
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_v71_v35_fixed_audit_v95.py 2>&1 | tee .research-state/v71-v35-fixed-audit-v95.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-v35-fixed-audit-v95
          path: |
            .research-state/v71-v35-fixed-audit-v95.json
            .research-state/v71-v35-fixed-audit-v95.md
            .research-state/v71-v35-fixed-audit-v95.log
          if-no-files-found: warn
          retention-days: 30
