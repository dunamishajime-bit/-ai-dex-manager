name: STABLE4 DD30 gross-cap repair

on:
  pull_request:
    paths:
      - ".github/workflows/disdex-stable4-dd30-gross-cap-repair.yml"
      - "scripts/ops/deploy/disdex_stable4_dd30_gross_cap_repair.py"
      - "scripts/ops/deploy/disdex_stable4_dd30_live_preflight.py"
      - "scripts/ops/test_disdex_stable4_dd30_gross_cap_repair.py"
      - "config/disdex-stable4-dd30-allrunner-live-order-enable-plan.json"
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only cap diagnostic or approved Root repair; neither mode enables orders
        type: choice
        options:
          - preflight
          - execute
        default: preflight
        required: true
      source_sha:
        description: Exact installed STABLE4 release SHA
        type: string
        required: true
      plan_sha256:
        description: Exact SHA-256 of the checked-in DD30 plan
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: disdex-stable4-dd30-gross-cap-repair
  cancel-in-progress: false

env:
  REPOSITORY: dunamishajime-bit/-ai-dex-manager
  DEPLOYMENT_TARGET: professional-dismanager.net
  CANDIDATE_SOURCE_SHA: 74331d74f400acda21a2c1edb5f7b166e197a93f
  CANDIDATE_PLAN_SHA256: 0faddfdb33ee885ffba4538a672d7719cf5a0652e1cb5082ef8ef47b7a8a02e4

jobs:
  contract:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate cap repair helper and exact plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest scripts/ops/test_disdex_stable4_dd30_gross_cap_repair.py -v
          python3 -B -m py_compile scripts/ops/deploy/disdex_stable4_dd30_gross_cap_repair.py scripts/ops/deploy/disdex_stable4_dd30_live_preflight.py
          actual="$(sha256sum config/disdex-stable4-dd30-allrunner-live-order-enable-plan.json | awk '{print $1}')"
          test "$actual" = "$CANDIDATE_PLAN_SHA256"
          grep -q 'orders remain monitor-only' scripts/ops/deploy/disdex_stable4_dd30_gross_cap_repair.py
          grep -q 'STABLE4_DD30_GROSS_CAP_REPAIR_PASS' scripts/ops/deploy/disdex_stable4_dd30_gross_cap_repair.py

  repair:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    needs: contract
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Bind exact candidate source and plan
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source_sha }}
          INPUT_PLAN: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE" == "$CANDIDATE_SOURCE_SHA" ]]
          [[ "$INPUT_PLAN" == "$CANDIDATE_PLAN_SHA256" ]]
          actual="$(sha256sum config/disdex-stable4-dd30-allrunner-live-order-enable-plan.json | awk '{print $1}')"
          [[ "$actual" == "$INPUT_PLAN" ]]
      - name: Configure reviewed Root SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "$DEPLOYMENT_TARGET" && -n "$KEY" && -n "$KNOWN" ]]
          [[ -n "$PORT" ]] || PORT=22
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          dir="$RUNNER_TEMP/stable4-dd30-cap-ssh"
          mkdir -m 0700 -p "$dir"
          printf '%s\n' "$KEY" > "$dir/id_root"
          printf '%s\n' "$KNOWN" > "$dir/known_hosts"
          chmod 0600 "$dir/id_root" "$dir/known_hosts"
          ssh-keygen -y -f "$dir/id_root" >/dev/null
          echo "SSH_DIR=$dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
      - name: Stage reviewed helper and exact plan
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          STAGE: /tmp/disdex-stable4-dd30-cap-repair-${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$SSH_DIR/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=12 -p "$SSH_PORT")
          scp_opts=(-i "$SSH_DIR/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=12 -P "$SSH_PORT")
          ssh -nT "${ssh_opts[@]}" "root@$HOST" "install -d -o root -g root -m 0700 '$STAGE'"
          scp -q "${scp_opts[@]}" scripts/ops/deploy/disdex_stable4_dd30_gross_cap_repair.py "root@$HOST:$STAGE/repair.py"
          scp -q "${scp_opts[@]}" scripts/ops/deploy/disdex_stable4_dd30_live_preflight.py "root@$HOST:$STAGE/preflight.py"
          scp -q "${scp_opts[@]}" config/disdex-stable4-dd30-allrunner-live-order-enable-plan.json "root@$HOST:$STAGE/plan.json"
          ssh -nT "${ssh_opts[@]}" "root@$HOST" "chown root:root '$STAGE/'* && chmod 0444 '$STAGE/'*"
      - name: Run Root cap repair mode
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          STAGE: /tmp/disdex-stable4-dd30-cap-repair-${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$SSH_DIR/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=12 -p "$SSH_PORT")
          if [[ "$MODE" == preflight ]]; then
            flag=--preflight-readonly
          else
            flag=--execute-approved
          fi
          ssh -nT "${ssh_opts[@]}" "root@$HOST" "/usr/bin/python3 -B '$STAGE/repair.py' --source-sha '$SOURCE_SHA' --plan '$STAGE/plan.json' --plan-sha256 '$PLAN_SHA' $flag --run-id '${{ github.run_id }}'"
      - name: Cleanup staged helper
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          STAGE: /tmp/disdex-stable4-dd30-cap-repair-${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$SSH_DIR/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=12 -p "$SSH_PORT")
          ssh -nT "${ssh_opts[@]}" "root@$HOST" "rm -f '$STAGE/repair.py' '$STAGE/preflight.py' '$STAGE/plan.json' && rmdir '$STAGE' 2>/dev/null || true" || true
          rm -rf "$SSH_DIR"

