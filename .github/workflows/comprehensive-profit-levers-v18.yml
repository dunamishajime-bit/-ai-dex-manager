name: Comprehensive Profit Levers V18

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_comprehensive_profit_levers_v18.py"
      - "scripts/research_lab_parameter_bagged_rotation_v4.py"
      - "scripts/research_lab_asymmetric_bear_hedge_v5.py"
      - "scripts/research_lab_precomputed_multi_regime_v6.py"
      - "scripts/research_lab_fixed_candidate_robustness_v7.py"
      - "lib/research-lab/perp/**"
      - ".github/workflows/comprehensive-profit-levers-v18.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_comprehensive_profit_levers_v18.py"
      - ".github/workflows/comprehensive-profit-levers-v18.yml"

permissions:
  contents: read

concurrency:
  group: comprehensive-profit-levers-v18-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: multi-horizon-v3-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            win80-profit-v1-usdm-
            usdm-snapshot-v2-
            autonomous-usdm-v2-
      - name: Python syntax check
        run: python -m py_compile scripts/research_lab_comprehensive_profit_levers_v18.py
      - name: Run comprehensive profit levers V18
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_comprehensive_profit_levers_v18.py
      - name: Upload V18 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-profit-levers-v18
          path: |
            .research-state/comprehensive-profit-levers-v18.json
            .research-state/comprehensive-profit-levers-v18.md
          if-no-files-found: warn
          retention-days: 30
