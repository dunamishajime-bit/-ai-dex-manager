name: DisDex HYPE exact-SHA owner restore

on:
  pull_request:
    paths:
      - ".github/workflows/disdex-hype-sha-owner-restore.yml"
      - "scripts/ops/deploy/disdex_hype_sha_*"
      - "tests/test_hype_sha_restore_executor.py"
  workflow_dispatch:
    inputs:
      approval_id:
        description: Fresh HYPE-specific HP email OTP approval ID
        type: string
        required: true
      v4_approval_id:
        description: Fresh V4 peer-pin continuity HP email OTP approval ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s tests -p test_hype_sha_restore_executor.py
          python3 -m py_compile scripts/ops/deploy/disdex_hype_sha_*.py

  restore:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    environment: disdex-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check cutover safety before redeeming OTP approval
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          PORT: ${{ vars.DISDEX_PRODUCTION_SSH_PORT }}
          KEY: ${{ secrets.DISDEX_PRODUCTION_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.DISDEX_PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == professional-dismanager.net && -n "$KEY" && -n "$HOST_KEYS" ]]
          port="${PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          umask 077
          ssh_dir="$RUNNER_TEMP/hype-restore-ssh"
          mkdir -m 0700 "$ssh_dir"
          printf '%s\n' "$KEY" > "$ssh_dir/key"
          printf '%s\n' "$HOST_KEYS" > "$ssh_dir/known_hosts"
          ssh -nT -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=12 -p "$port" "root@$HOST" \
            "/usr/local/sbin/disdex-hype-sha-owner-restore --preflight-readonly" \
            > "$RUNNER_TEMP/hype-restore-plan.json"
      - name: Redeem the two independent owner approvals and execute
        shell: bash
        env:
          APPROVAL_ID: ${{ inputs.approval_id }}
          V4_APPROVAL_ID: ${{ inputs.v4_approval_id }}
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          OWNER_PUBLIC_KEY: ${{ secrets.DISDEX_HP_APPROVER_PUBLIC_KEY_PEM }}
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          PORT: ${{ vars.DISDEX_PRODUCTION_SSH_PORT }}
          PYTHONPATH: scripts/ops/deploy
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile, urllib.request
          from pathlib import Path
          from disdex_hype_sha_restore_contract import (
              CANDIDATE, COMMAND, HOST, OPERATION, OPERATOR_TARGET, OWNER, PLAN, REPOSITORY, RUNNER,
              V4_OPERATION, V4_SCOPE,
          )
          from disdex_owner_approval import verify
          approval_id=os.environ["APPROVAL_ID"]
          v4_approval_id=os.environ["V4_APPROVAL_ID"]
          run_id=os.environ["GITHUB_RUN_ID"]
          assert all(re.fullmatch(r"[0-9a-fA-F-]{36}",x) for x in (approval_id,v4_approval_id))
          assert approval_id!=v4_approval_id
          assert re.fullmatch(r"[0-9]{1,20}",run_id)
          assert os.environ["HOST"]==HOST
          port=os.environ.get("PORT") or "22"
          assert re.fullmatch(r"[0-9]{1,5}",port)
          assert os.environ["BRIDGE"] and os.environ["OWNER_PUBLIC_KEY"]
          plan=json.loads((Path(os.environ["RUNNER_TEMP"])/"hype-restore-plan.json").read_text())
          assert plan["status"]=="HYPE_SHA_RESTORE_PREFLIGHT_PASS" and plan["candidateSha"]==CANDIDATE and plan["planSha256"]==PLAN
          v4_sha,v4_plan=plan["v4Sha"],plan["v4PlanSha256"]
          assert re.fullmatch(r"[0-9a-f]{40}",v4_sha) and re.fullmatch(r"[0-9a-f]{64}",v4_plan)
          def redeem(approval_id,operation,scope,sha,plan_hash,public_key):
              body=json.dumps(dict(action="redeem",approval_id=approval_id,operation=operation,
                  scope=scope,target_sha=sha,plan_sha256=plan_hash,run_id=run_id)).encode()
              request=urllib.request.Request("https://"+HOST+"/api/system/deploy-approval",data=body,
                  method="POST",headers={"Authorization":"Bearer "+os.environ["BRIDGE"],
                                         "Content-Type":"application/json"})
              with urllib.request.urlopen(request,timeout=15) as res:
                  data=json.load(res)
              a=data.get("approval") or {}
              assert data.get("ok") is True and a.get("operation")==operation and a.get("scope")==scope
              assert a.get("targetSha")==sha and a.get("planSha256")==plan_hash and a.get("ordersEnabled") is True
              token=data["token"]
              verify(token,public_key,REPOSITORY,sha,scope,OWNER,plan_hash,route="GITHUB_ACTIONS",
                     deployment_target=HOST,operator_target=OPERATOR_TARGET,orders_enabled=True)
              return token
          with tempfile.NamedTemporaryFile(mode="w",dir=os.environ["RUNNER_TEMP"]) as key:
              key.write(os.environ["OWNER_PUBLIC_KEY"]);key.flush()
              token=redeem(approval_id,OPERATION,RUNNER,CANDIDATE,PLAN,Path(key.name))
              v4_token=redeem(v4_approval_id,V4_OPERATION,V4_SCOPE,v4_sha,v4_plan,Path(key.name))
          ssh_dir=Path(os.environ["RUNNER_TEMP"])/"hype-restore-ssh"
          cmd=["ssh","-T","-i",str(ssh_dir/"key"),"-o","BatchMode=yes","-o","IdentitiesOnly=yes",
               "-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+str(ssh_dir/"known_hosts"),
               "-o","ConnectTimeout=12","-o","ServerAliveInterval=10","-p",port,"root@"+HOST,
               f"{COMMAND} --run-id {run_id} --read-approval-stdin"]
          subprocess.run(cmd,input=json.dumps(dict(hype=token,v4=v4_token)),text=True,check=True,timeout=2100)
          PY
      - name: Remove ephemeral SSH files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/hype-restore-ssh/key" "$RUNNER_TEMP/hype-restore-ssh/known_hosts" "$RUNNER_TEMP/hype-restore-plan.json"
