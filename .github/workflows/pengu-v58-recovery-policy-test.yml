name: PENGU V58 Recovery Policy Test

on:
  workflow_dispatch:
  push:
    branches:
      - research/pengu-v57-conditional-regime-20260826
    paths:
      - 'scripts/test_research_v58_recovery_policy.py'
      - 'scripts/research_v58_recovery_policy.py'
      - '.github/workflows/pengu-v58-recovery-policy-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run V58 recovery policy test
        run: python scripts/test_research_v58_recovery_policy.py
