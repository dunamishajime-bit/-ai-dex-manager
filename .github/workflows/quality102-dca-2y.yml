name: Quality102 50 Gross Safe Two-Year DCA BT

on:
  push:
    branches:
      - research/quality102-50-dca-2y-20260830
    paths:
      - 'scripts/research_quality102_2y_bootstrap.py'
      - 'scripts/research_quality102_dca_2y.py'
      - '.github/workflows/quality102-dca-2y.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality102-dca-2y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout full research history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile two-year bootstrap
        run: python -m py_compile scripts/research_quality102_2y_bootstrap.py

      - name: Recover and verify exact Quality102 source lineage
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_quality102_2y_bootstrap.py 2>&1 | tee .research-state/quality102-2y-bootstrap.log

      - name: Enforce two-year input contract before BT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/quality102-2y-bootstrap/bootstrap.json').read_text())
          assert p['status']=='QUALITY102_2Y_SOURCE_RECOVERED',p
          assert p['requestedPeriod']=={'startInclusive':'2024-08-10T00:00:00.000Z','endExclusive':'2026-08-10T00:00:00.000Z'}
          assert p['capital']=={'initialJpy':10000,'monthlyContributionJpy':20000,'contributionCountAfterStart':24,'totalContributedJpy':490000}
          assert p['reference']['candidateCount']==102
          assert p['reference']['sha256']=='b45f492a67307cf1845fcce6af0919c5202a5853b13e7f0914daf11889bd5ead'
          assert len(p['qualityPayloads'])>=1,p['payloads']
          assert p['acceptance']['mustGenerate2024SideCausally'] is True
          assert p['acceptance']['copyOrStretchReferenceRowsForbidden'] is True
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print('QUALITY102_2Y_SOURCE_RECOVERY=PASS')
          print(json.dumps(p['qualityPayloads'],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality102-dca-2y-${{ github.run_id }}
          path: |
            .research-state/quality102-2y-bootstrap
            .research-state/quality102-2y-bootstrap.log
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
