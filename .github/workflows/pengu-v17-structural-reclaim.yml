name: PENGU V17 Structural Reclaim Development

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'PRE_REGISTER_V17.md'
      - 'scripts/research_pengu_short_v17_structural_reclaim.py'
      - '.github/workflows/pengu-v17-structural-reclaim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run frozen V17 on known venues only
        run: python scripts/research_pengu_short_v17_structural_reclaim.py
      - name: Validate preregistration and holdout lock
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-short-v17/development-result.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate']=='COUNTERWIND_STRUCTURAL_RECLAIM_PROBATION'
          assert x['preRegistrationSha']=='9b02e7ec708d02c712d7577cbd50cc548492d311'
          assert x['candidateCount']==1 and x['thresholdSweep'] is False and x['ruleChangeCount']==1
          assert x['kucoinPerformanceObserved'] is False
          assert x['promotionPass'] is False
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          if x['developmentPass']:
              assert x['kucoinHoldoutStatus']=='ELIGIBLE_TO_OPEN'
          else:
              assert x['kucoinHoldoutStatus']=='RESERVED_UNOPENED'
          print(json.dumps({'developmentPass':x['developmentPass'],'venuePasses':x['venuePasses'],'kucoinHoldoutStatus':x['kucoinHoldoutStatus'],'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v17-development-${{ github.run_id }}
          path: .research-state/pengu-short-v17
          if-no-files-found: error
