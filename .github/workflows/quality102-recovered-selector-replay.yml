name: Quality102 Recovered Selector One-Year Replay

on:
  push:
    branches:
      - research/latest-v12-pengu-v8-v52-dca-1y-20260828
    paths:
      - 'scripts/research_quality102_recovered_replay.py'
      - '.github/workflows/quality102-recovered-selector-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality102-recovered-selector-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research integration
        uses: actions/checkout@v4

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable stock cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: quality102-recovered-replay-${{ runner.os }}-${{ hashFiles('scripts/research_current_top2_pengu_v52_dca.py') }}
          restore-keys: |
            quality102-gross-cap-sweep-
            quality102-grosssafe-
            latest-v12-pengu-v8-v52-dca-
            current-v12-top2-pengu-v20-v52-dca-
            current-v12-top2-pengu-v52-dca-
            v12-v52-pengu-v2-combined-
            aster-only-v52-v39cache-
            perp-research-usdm-

      - name: Install dependencies
        run: npm ci

      - name: Compile recovered replay wrapper
        run: python -m py_compile scripts/research_quality102_recovered_replay.py

      - name: Restore prior exact integrated inputs
        uses: actions/download-artifact@v4
        with:
          name: latest-v12-pengu-v8-v52-dca-1y-33257164125
          path: .research-state/quality102-prior
          github-token: ${{ github.token }}
          repository: dunamishajime-bit/-ai-dex-manager
          run-id: 33257164125

      - name: Replay one-year BT with recovered Quality102
        run: |
          set -o pipefail
          mkdir -p .research-state/quality102-recovered-replay
          python scripts/research_quality102_recovered_replay.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --v12-ledger .research-state/quality102-prior/v12-top2-ledger.json \
            --pengu-ledger .research-state/quality102-prior/pengu-v8-ledger.json \
            --output-dir .research-state/quality102-recovered-replay \
            2>&1 | tee .research-state/quality102-recovered-replay.log

      - name: Validate exact one-year recovery contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path('.research-state/quality102-recovered-replay/result.json').read_text())
          candidate=Path('.research-state/quality102-recovered.csv').read_bytes()
          assert hashlib.sha256(candidate).hexdigest()=='da62d07f48b5d33f9c62a0777b94685bb1e164cf25b66f5f6c27287468986e75'
          assert p['status']=='PASS_RESEARCH_ONLY',p['checks']
          assert p['period']=={'startInclusive':'2025-08-10T00:00:00.000Z','endExclusive':'2026-08-10T00:00:00.000Z'}
          assert p['capital']['initialJpy']==10000.0
          assert p['capital']['monthlyContributionJpy']==10000.0
          assert p['capital']['totalContributedJpy']==130000.0
          assert p['supplementResearch']['frozenCandidateCount']==102
          assert abs(p['supplementResearch']['grossCap']-0.15)<1e-12
          assert p['supplementResearch']['entryPolicy']=='BASE_IDLE_ONE_SLOT_BASE_PRIORITY_RESIDUAL_GROSS_SHRINK'
          n=p['results']['NORMAL']; s=p['results']['SEVERE']
          assert abs(n['endingAssetJpy']-1662215.64514461)<0.01,n['endingAssetJpy']
          assert abs(n['profitFactor']-3.45324727)<1e-7,n['profitFactor']
          assert abs(n['maxDrawdownPctClosedEventTwr']-(-10.74058933))<1e-7,n['maxDrawdownPctClosedEventTwr']
          assert n['trades']==755
          assert n['bySleeve']['SUPPLEMENT_QUALITY102']['trades']==102
          assert abs(s['endingAssetJpy']-521109.41606506)<0.01,s['endingAssetJpy']
          assert abs(s['profitFactor']-2.33220987)<1e-7,s['profitFactor']
          assert abs(s['maxDrawdownPctClosedEventTwr']-(-16.16574496))<1e-7,s['maxDrawdownPctClosedEventTwr']
          assert s['trades']==622
          assert s['bySleeve']['SUPPLEMENT_QUALITY102']['trades']==102
          assert all(p['checks'].values()),p['checks']
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'status':'QUALITY102_ONE_YEAR_RECOVERY_REPLAY_PASS','normal':n,'severe':s,'checks':p['checks']},ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality102-recovered-selector-replay-${{ github.run_id }}
          path: |
            .research-state/quality102-recovered.csv
            .research-state/quality102-recovered-replay
            .research-state/quality102-recovered-replay.log
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
