name: Binance USD-M Metrics Cross-day Diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_probe_binance_usdm_metrics_crossday.py
      - .github/workflows/binance-usdm-metrics-crossday-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert frozen cross-day probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_probe_binance_usdm_metrics_crossday.py)" = "a151e98947d3d50d55a1478e9a2495edbec5b13b"
          echo METRICS_CROSSDAY_PROBE_SOURCE_PASS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile probe
        run: python -m py_compile scripts/research_probe_binance_usdm_metrics_crossday.py
      - name: Diagnose cross-day rows
        run: python scripts/research_probe_binance_usdm_metrics_crossday.py
      - name: Assert probe-only boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.research-state/binance-usdm-metrics-crossday-diagnosis.json').read_text())
          assert d['researchOnly'] is True
          assert d['strategyEvaluationPerformed'] is False
          assert d['productionChanged'] is False and d['vpsChanged'] is False and d['liveChanged'] is False
          assert d['realTradingEnabled'] is False
          assert d['freshOosRead'] is False and d['post20260701DataUsed'] is False
          assert d['endExclusive']=='2026-07-01'
          print('METRICS_CROSSDAY_PROBE_ONLY_PASS')
          PY
      - name: Upload cross-day diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: binance-usdm-metrics-crossday-diagnosis
          path: |
            .research-state/binance-usdm-metrics-crossday-diagnosis.json
            .research-state/binance-usdm-metrics-crossday-diagnosis.md
          if-no-files-found: error
          retention-days: 30
