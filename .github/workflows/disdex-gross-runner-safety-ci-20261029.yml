name: DisDex Gross and runner safety contracts

on:
  pull_request:
    paths:
      - lib/disdex-account-order-lock.ts
      - lib/disdex-integrated-gross-governor.ts
      - lib/disdex-pending-exposure-registry.ts
      - lib/disdex-strict-portfolio-planner.ts
      - scripts/disdex_pending_exposure_registry.py
      - tests/account-lock-release-race.test.ts
      - tests/disdex-production-safety-gross-boundaries.test.ts
      - tests/strict_bt33404708902_contract.test.ts
      - tests/integrated_gross_governor.test.ts
      - tests/pending-exposure-registry.test.ts
      - tests/test_pending_exposure_registry.py
      - tests/test_final_dynamic_gross_strict_caps.py
      - tests/v52-worst-case-capacity.test.py
      - tests/v12-preorder-gross-reservation.test.ts
      - tests/fet-core-preemption.test.ts
      - tests/fet-brk48-live-runner.test.ts
      - tests/quality102-preflight-protective-order.test.ts
      - tests/hype-zec-preemption.test.ts
      - tests/idle-residual-long-preemption.test.ts
      - tests/idle-residual-v52-owner-sha.test.ts
      - lib/idle-residual-owner-sha.ts
      - scripts/disdex-idle-residual-long-core-preempt.ts
      - package.json
      - package-lock.json
      - .github/workflows/disdex-gross-runner-safety-ci-20261029.yml
  push:
    branches:
      - codex/disdex-production-safety-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gross-and-runner-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx --no-install tsx --test
          tests/account-lock-release-race.test.ts
          tests/disdex-production-safety-gross-boundaries.test.ts
          tests/strict_bt33404708902_contract.test.ts
          tests/integrated_gross_governor.test.ts
          tests/v12-preorder-gross-reservation.test.ts
          tests/fet-core-preemption.test.ts
          tests/fet-brk48-live-runner.test.ts
          tests/quality102-preflight-protective-order.test.ts
          tests/quality102-preflight-rate-budget.test.ts
          tests/hype-zec-preemption.test.ts
          tests/idle-residual-long-preemption.test.ts
          tests/idle-residual-v52-owner-sha.test.ts
          tests/idle-residual-long-contract.test.ts
          tests/fet_core_preemption_wiring.test.ts
      - run: npx --no-install tsc --noEmit --pretty false
      - run: python -m unittest tests.test_pending_exposure_registry tests.test_final_dynamic_gross_strict_caps tests.test_fet_v52_ownership tests.test_v52_safety_regressions -v
      - run: python tests/v52-worst-case-capacity.test.py -v
      - name: Enforce fixed Gross and non-live test boundaries
        shell: bash
        run: |
          ! grep -R -n -E 'tier[[:space:]]*=[[:space:]]*"PROFIT_|desired(Crypto|Total)[[:space:]]*=[[:space:]]*(3\.25|3\.5|4\.0|5\.0|6\.0|7\.0|8\.0)' \
            lib/disdex-integrated-gross-governor.ts
          ! grep -R -n -E 'place(Market|Conditional|Stop)|cancelOrder|DISDEX_API_KEY|ASTER_API_SECRET|curl .*aster' \
            tests/account-lock-release-race.test.ts \
            tests/disdex-production-safety-gross-boundaries.test.ts
