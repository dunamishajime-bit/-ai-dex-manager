name: PENGU Wave Cover Stage1
on:
  push:
    branches:
      - research/pengu-wave-cover-stage1-20260924
    paths:
      - scripts/research_pengu_wave_cover_stage1_20260924.ts
      - .github/workflows/pengu-wave-cover-stage1-20260924.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run PENGU wave-cover stage1
        env:
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_wave_cover_stage1_20260924.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-wave-cover-stage1
          path: .research-state/pengu-wave-cover-stage1
          retention-days: 90
