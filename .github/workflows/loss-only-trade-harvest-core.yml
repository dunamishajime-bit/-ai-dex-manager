name: Loss Only Trade Harvest Core

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_loss_only_trade_harvest_core.py
      - .github/workflows/loss-only-trade-harvest-core.yml

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen core harvest sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_loss_only_trade_harvest.py)" = "26c6389bf25f6a2160b164a7916c0b1fbf5a648e"
          test "$(git hash-object scripts/research_loss_only_trade_harvest_core.py)" = "b4c7e28a255c44e2068ebf27240c90e8a2e187e3"
          echo LOSS_ONLY_CORE_HARVEST_SOURCE_PASS
      - name: Compile
        run: python -m py_compile scripts/research_loss_only_trade_harvest.py scripts/research_loss_only_trade_harvest_core.py
      - name: Harvest high-confidence trade-bearing artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_loss_only_trade_harvest_core.py
      - name: Assert one-way boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/loss-only-core-harvest-summary.json').read_text())
          assert x['researchOnly'] and x['winnerFeaturesInspected'] is False and x['blockersSelected'] is False
          assert x['productionChanged'] is False and x['vpsChanged'] is False and x['liveChanged'] is False and x['realTradingEnabled'] is False and x['freshOosRead'] is False
          print('LOSS_ONLY_CORE_HARVEST_BOUNDARY_PASS')
          PY
      - name: Upload core harvest
        uses: actions/upload-artifact@v4
        with:
          name: loss-only-trade-harvest-core
          path: |
            .research-state/loss-only-core-normalized-trades.jsonl
            .research-state/loss-only-core-losing-trades.jsonl
            .research-state/loss-only-core-harvest-summary.json
          retention-days: 30
