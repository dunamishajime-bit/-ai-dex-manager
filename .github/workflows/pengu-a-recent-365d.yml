name: PENGU A Recent 365-Day Standalone BT

on:
  pull_request:
    branches:
      - chatgpt/v12-live-adapter-final-20260817
    paths:
      - '.github/workflows/pengu-a-recent-365d.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pengu-a-recent-365d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build exact recent-365d baseline and A harnesses
        run: |
          mkdir -p .research-state/pengu-a-recent
          cp scripts/research_pengu_v2_aster_ledger.ts scripts/.pengu_recent_baseline.ts
          cp scripts/research_pengu_v2_aster_ledger.ts scripts/.pengu_recent_a.ts
          python - <<'PY'
          from pathlib import Path

          START='2025-08-23T15:00:00Z'
          END='2026-08-23T15:00:00Z'
          WARM='2025-08-01T00:00:00Z'

          def patch(path: str, gate: bool):
              p=Path(path)
              s=p.read_text()
              s=s.replace('const WARM_START = Date.parse("2025-07-20T00:00:00Z");', f'const WARM_START = Date.parse("{WARM}");')
              s=s.replace('const EVAL_START = Date.parse("2025-08-10T00:00:00Z");', f'const EVAL_START = Date.parse("{START}");')
              s=s.replace('const EVAL_END = Date.parse("2026-08-10T00:00:00Z");', f'const EVAL_END = Date.parse("{END}");')

              if gate:
                  old='''    const side: Side | undefined = rows[index].shortSignal ? "S" : rows[index].longSignal ? "L" : undefined;\n    if (!side || !rows[index].features) { index += 1; continue; }\n    const entryIndex = index + 1;'''
                  new='''    const side: Side | undefined = rows[index].shortSignal ? "S" : rows[index].longSignal ? "L" : undefined;\n    if (!side || !rows[index].features) { index += 1; continue; }\n    if (side === "S" && rows[index].features!.rsi14 > 45) { index += 1; continue; }\n    const entryIndex = index + 1;'''
                  if old not in s:
                      raise SystemExit(f'signal gate patch target missing in {path}')
                  s=s.replace(old,new)

              old2='''  assert.ok(pengu.length >= 9_200 && btc.length >= 9_200, `Insufficient Aster rows: PENGU=${pengu.length}, BTC=${btc.length}`);\n  const history: PenguDualLsV2History = { pengu1h: pengu, btc1h: btc, penguFunding: funding.map((row) => ({ fundingTime: row.fundingTime, fundingRate: row.fundingRate })) };'''
              new2='''  const expectedEvalRows = Math.floor((EVAL_END - EVAL_START) / HOUR);\n  const penguEvalRows = pengu.filter((row) => row.openTime >= EVAL_START && row.openTime < EVAL_END).length;\n  const btcEvalRows = btc.filter((row) => row.openTime >= EVAL_START && row.openTime < EVAL_END).length;\n  assert.equal(penguEvalRows, expectedEvalRows, `PENGU exact-period rows mismatch: ${penguEvalRows} != ${expectedEvalRows}`);\n  assert.equal(btcEvalRows, expectedEvalRows, `BTC exact-period rows mismatch: ${btcEvalRows} != ${expectedEvalRows}`);\n  const penguTimestamps = new Set(pengu.map((row) => row.openTime));\n  const alignedBtc = btc.filter((row) => penguTimestamps.has(row.openTime));\n  assert.equal(alignedBtc.length, pengu.length, `PENGU/BTC warm-period alignment mismatch: ${pengu.length} vs ${alignedBtc.length}`);\n  const history: PenguDualLsV2History = { pengu1h: pengu, btc1h: alignedBtc, penguFunding: funding.map((row) => ({ fundingTime: row.fundingTime, fundingRate: row.fundingRate })) };'''
              if old2 not in s:
                  raise SystemExit(f'history patch target missing in {path}')
              s=s.replace(old2,new2)

              # The frozen 2025-08-10..2026-08-10 checkpoint is informational only
              # for this deliberately different exact recent-365d period.
              s=s.replace('''  assert.ok(normalMetrics.trades >= 25 && normalMetrics.trades <= 40, `Implausible Aster production replay trade count: ${normalMetrics.trades}`);\n  assert.ok(normalMetrics.returnPct > 0 && finiteMetric(normalMetrics.profitFactor) > 1.5, `Aster production replay lost its normal edge: ${JSON.stringify(normalMetrics)}`);\n  assert.ok(stressMetrics.returnPct > 0 && finiteMetric(stressMetrics.profitFactor) > 1.2, `Aster production replay lost its stress edge: ${JSON.stringify(stressMetrics)}`);''','''  assert.ok(normalMetrics.trades > 0, `No normal trades in exact recent period`);\n  assert.ok(stressMetrics.trades > 0, `No stress trades in exact recent period`);''')
              p.write_text(s)

          patch('scripts/.pengu_recent_baseline.ts', False)
          patch('scripts/.pengu_recent_a.ts', True)
          PY

      - name: Run current PENGU V2 baseline
        env:
          PRODUCTION_SOURCE_SHA: ac254e897b7514d14c3a34c0679388978b5c3d32
          PENGU_LEDGER_OUT: .research-state/pengu-a-recent/baseline.json
        run: |
          set -o pipefail
          npx tsx scripts/.pengu_recent_baseline.ts 2>&1 | tee .research-state/pengu-a-recent/baseline.log

      - name: Run A RSI45 entry-time gate
        env:
          PRODUCTION_SOURCE_SHA: ac254e897b7514d14c3a34c0679388978b5c3d32
          PENGU_LEDGER_OUT: .research-state/pengu-a-recent/a-rsi45.json
        run: |
          set -o pipefail
          npx tsx scripts/.pengu_recent_a.ts 2>&1 | tee .research-state/pengu-a-recent/a-rsi45.log
          rm -f scripts/.pengu_recent_baseline.ts scripts/.pengu_recent_a.ts

      - name: Compare exact recent year
        run: |
          python - <<'PY'
          import json, math
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('.research-state/pengu-a-recent')
          b=json.loads((root/'baseline.json').read_text())
          a=json.loads((root/'a-rsi45.json').read_text())
          expected={'startInclusive':'2025-08-23T15:00:00.000Z','endExclusive':'2026-08-23T15:00:00.000Z'}
          assert b['period']==expected, b['period']
          assert a['period']==expected, a['period']
          assert b['strategyId']=='PENGU_DUAL_LS_V2_FINAL'
          assert a['strategyId']=='PENGU_DUAL_LS_V2_FINAL'
          assert b['safety']=={'ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          assert a['safety']=={'ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}

          def month(ts):
              return datetime.fromtimestamp(ts/1000, tz=timezone.utc).strftime('%Y-%m')

          def detail(payload, mode):
              rows=payload['modes'][mode]['trades']
              m=payload['modes'][mode]['metrics']
              reasons=Counter(x['exitReason'] for x in rows)
              sides=Counter(x['side'] for x in rows)
              monthly=defaultdict(list)
              for x in rows:
                  monthly[month(x['exitTs'])].append(float(x['accountReturn']))
              monthly_ret={}
              for k,v in sorted(monthly.items()):
                  eq=1.0
                  for r in v: eq*=1+r
                  monthly_ret[k]=(eq-1)*100
              return {
                  'metrics':m,
                  'exitReasons':dict(reasons),
                  'sides':dict(sides),
                  'monthlyReturnPct':monthly_ret,
              }

          out={
              'status':'PASS_RESEARCH_ONLY',
              'schema':'pengu-a-recent-365d-standalone/v1',
              'period':expected,
              'definition':{
                  'baseline':'current PENGU_DUAL_LS_V2_FINAL',
                  'A':'same production state machine with entry-time short gate RSI14 <= 45',
                  'capitalBasis':'standalone compounded account-return series; no monthly deposits',
              },
              'baseline':{'NORMAL':detail(b,'normal'),'SEVERE':detail(b,'stress')},
              'A':{'NORMAL':detail(a,'normal'),'SEVERE':detail(a,'stress')},
              'delta':{},
              'safety':{'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False},
          }
          for mode in ('NORMAL','SEVERE'):
              bm=out['baseline'][mode]['metrics']; am=out['A'][mode]['metrics']
              out['delta'][mode]={
                  'returnPctPp':am['returnPct']-bm['returnPct'],
                  'profitFactor':(am['profitFactor'] or 0)-(bm['profitFactor'] or 0),
                  'maxDrawdownPctPp':am['maxDrawdownPct']-bm['maxDrawdownPct'],
                  'winRatePctPp':am['winRatePct']-bm['winRatePct'],
                  'trades':am['trades']-bm['trades'],
              }
          (root/'comparison.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Validate no production mutation
        run: |
          git diff --exit-code -- lib config ops || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/pengu-a-recent/comparison.json').read_text())
          assert p['status']=='PASS_RESEARCH_ONLY'
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print('PENGU_A_RECENT_365D_RESEARCH_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-a-recent-365d-${{ github.run_id }}
          path: .research-state/pengu-a-recent
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
