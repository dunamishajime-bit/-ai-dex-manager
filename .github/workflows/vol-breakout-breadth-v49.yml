name: Volatility Breakout Breadth V49

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_vol_breakout_breadth_v49.py"
      - ".github/workflows/vol-breakout-breadth-v49.yml"
      - "scripts/research_lab_parameter_bagged_rotation_v4.py"
      - "lib/research-lab/perp/**"

permissions:
  contents: read

concurrency:
  group: vol-breakout-breadth-v49-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: vol-breakout-v49-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            btc-lead-lag-v47-usdm-
            utc-session-v26-usdm-
            multi-horizon-v3-usdm-
            win80-profit-v1-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_lab_vol_breakout_breadth_v49.py
      - name: Run chronological V49 research
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_vol_breakout_breadth_v49.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol-breakout-breadth-v49
          path: |
            .research-state/vol-breakout-breadth-v49.json
            .research-state/vol-breakout-breadth-v49.md
          if-no-files-found: warn
          retention-days: 30

# Research-only. No production, VPS, .env, account/order, or live-trading changes.
