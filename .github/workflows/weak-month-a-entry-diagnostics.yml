name: Weak-Month A Entry-Known Diagnostics

on:
  pull_request:
    branches:
      - chatgpt/v12-live-adapter-final-20260817
    paths:
      - '.github/workflows/weak-month-a-entry-diagnostics.yml'
      - 'scripts/research_weak_month_a_diagnostics.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weak-month-a-entry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable research caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/perp-research-usdm
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: current-v12-top2-pengu-v52-stock-resume-${{ runner.os }}
          restore-keys: |
            current-v12-top2-pengu-v52-stock-resume-
            v12-v52-pengu-v2-combined-
            perp-research-usdm-

      - run: npm ci

      - name: Reuse formal current ledgers
        uses: actions/download-artifact@v4
        with:
          name: current-v12-top2-pengu-v52-dca-32631037372
          path: .research-state/a-input
          github-token: ${{ github.token }}
          run-id: 32631037372

      - name: Build entry-feature-enriched PENGU ledger
        env:
          PRODUCTION_SOURCE_SHA: ac254e897b7514d14c3a34c0679388978b5c3d32
          PENGU_LEDGER_OUT: .research-state/a-input/pengu-enriched.json
        run: |
          cp scripts/research_pengu_v2_aster_ledger.ts scripts/.research_pengu_enriched.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/.research_pengu_enriched.ts')
          s=p.read_text()
          s=s.replace('const WARM_START = Date.parse("2025-07-20T00:00:00Z");','const WARM_START = Date.parse("2025-07-01T00:00:00Z");')
          s=s.replace('const EVAL_START = Date.parse("2025-08-10T00:00:00Z");','const EVAL_START = Date.parse("2025-08-01T00:00:00Z");')
          s=s.replace('const EVAL_END = Date.parse("2026-08-10T00:00:00Z");','const EVAL_END = Date.parse("2026-08-01T00:00:00Z");')
          s=s.replace('  exitReason: Reason;\n}', '  exitReason: Reason;\n  signalFeatures?: Record<string, number>;\n}')
          needle='        exitReason,\n      });'
          repl='        exitReason,\n        signalFeatures: rows[index].features as unknown as Record<string, number>,\n      });'
          if needle not in s: raise SystemExit('trade push patch missing')
          s=s.replace(needle,repl)
          old='  assert.ok(pengu.length >= 9_200 && btc.length >= 9_200, `Insufficient Aster rows: PENGU=${pengu.length}, BTC=${btc.length}`);\n  const history: PenguDualLsV2History = { pengu1h: pengu, btc1h: btc, penguFunding: funding.map((row) => ({ fundingTime: row.fundingTime, fundingRate: row.fundingRate })) };'
          new='''  const expectedEvalRows = Math.floor((EVAL_END - EVAL_START) / HOUR);
  const penguEvalRows = pengu.filter((row) => row.openTime >= EVAL_START && row.openTime < EVAL_END).length;
  const btcEvalRows = btc.filter((row) => row.openTime >= EVAL_START && row.openTime < EVAL_END).length;
  assert.equal(penguEvalRows, expectedEvalRows);
  assert.equal(btcEvalRows, expectedEvalRows);
  const penguTimestamps = new Set(pengu.map((row) => row.openTime));
  const alignedBtc = btc.filter((row) => penguTimestamps.has(row.openTime));
  assert.equal(alignedBtc.length, pengu.length);
  const history: PenguDualLsV2History = { pengu1h: pengu, btc1h: alignedBtc, penguFunding: funding.map((row) => ({ fundingTime: row.fundingTime, fundingRate: row.fundingRate })) };'''
          if old not in s: raise SystemExit('history patch missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          mkdir -p .research-state/a-output
          npx tsx scripts/.research_pengu_enriched.ts | tee .research-state/a-output/pengu-enriched.log
          rm -f scripts/.research_pengu_enriched.ts

      - name: Run entry-known A diagnostics
        run: |
          python scripts/research_weak_month_a_diagnostics.py \
            --pengu .research-state/a-input/pengu-enriched.json \
            --v12 .research-state/a-input/v12-top2-ledger.json \
            --stock-cache .cache/aster-only-v39-overnight-open \
            --output .research-state/a-output/result.json | tee .research-state/a-output/diagnostics.log

      - name: Validate research-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/a-output/result.json').read_text())
          assert p['status']=='PASS_RESEARCH_ONLY'
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          assert p['pengu']['shortTrades'] >= 20
          assert p['v50Meta']['shortTrades'] >= 10
          print('A_ENTRY_DIAGNOSTICS_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weak-month-a-entry-${{ github.run_id }}
          path: .research-state/a-output
          retention-days: 90
          if-no-files-found: warn
