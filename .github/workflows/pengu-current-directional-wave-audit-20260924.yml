name: PENGU Current Directional Wave Audit
on:
  push:
    branches:
      - research/pengu-continuation-reentry-20260923
    paths:
      - scripts/research_pengu_current_directional_wave_audit_20260924.ts
      - .github/workflows/pengu-current-directional-wave-audit-20260924.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run current PENGU directional wave audit
        env:
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_current_directional_wave_audit_20260924.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-current-directional-wave-audit
          path: .research-state/pengu-current-directional-wave-audit
          retention-days: 90
