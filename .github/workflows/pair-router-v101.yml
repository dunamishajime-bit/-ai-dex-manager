name: Pair Router V101

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_router_v101.py"
      - "research/pair-router-v101-trigger.txt"
      - ".github/workflows/pair-router-v101.yml"

permissions:
  contents: read

concurrency:
  group: pair-router-v101-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore genuine public USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-router-v101-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            pair-router-v100-usdm-
            six-pair-v98-usdm-
            event-regime-v53-usdm-
            win80-profit-v1-usdm-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch genuine public six-pair USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile V101 research source
        run: python -m py_compile scripts/research_lab_pair_router_v101.py
      - name: Run accelerated pair-specific systems
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_router_v101.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-router-v101
          path: .research-state/pair-router-v101.json
          if-no-files-found: warn
          retention-days: 30

# Research only. Pair-specific systems frozen after Development.
