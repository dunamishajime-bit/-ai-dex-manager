name: Win80 Ultra90 Live Runner CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/win80-ultra90-live-runner-v1
    paths:
      - "lib/aster-v3-client.ts"
      - "lib/direct-trade-executor.ts"
      - "lib/live-runner-state.ts"
      - "lib/paper-direct-trade-executor.ts"
      - "lib/win80-ultra90-live-runner.ts"
      - "scripts/win80-ultra90-live-runner.ts"
      - "scripts/win80-ultra90-live-runner-selftest.ts"
      - "scripts/patch-win80-live-runner-type-narrowing.py"
      - "tsconfig.live-runner.json"
      - "package.json"
      - ".github/workflows/win80-live-runner-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "lib/aster-v3-client.ts"
      - "lib/direct-trade-executor.ts"
      - "lib/live-runner-state.ts"
      - "lib/paper-direct-trade-executor.ts"
      - "lib/win80-ultra90-live-runner.ts"
      - "scripts/win80-ultra90-live-runner.ts"
      - "scripts/win80-ultra90-live-runner-selftest.ts"
      - "scripts/patch-win80-live-runner-type-narrowing.py"
      - "tsconfig.live-runner.json"
      - "package.json"
      - "config/strategyConfig.ts"
      - ".github/workflows/win80-live-runner-ci.yml"

permissions:
  contents: write

concurrency:
  group: win80-live-runner-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[live-runner-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: feature/win80-ultra90-live-runner-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply idempotent source patch
        run: python scripts/patch-win80-live-runner-type-narrowing.py

      - name: Install dependencies
        run: npm ci

      - name: Main strategy policy self-test
        run: npm run strategy:main:selftest

      - name: Live runner state and failure self-test
        run: npm run strategy:live:selftest

      - name: Live runner TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npm run strategy:live:typecheck 2>&1 | tee live-runner-typecheck.log

      - name: Repository TypeScript checks
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee repository-typecheck.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log

      - name: Commit verified source patch
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/win80-ultra90-live-runner.ts
          git commit -m "Fix live runner reconciliation narrowing [live-runner-patched]"
          git push origin HEAD:feature/win80-ultra90-live-runner-v1

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win80-live-runner-ci-logs
          path: |
            live-runner-typecheck.log
            repository-typecheck.log
            production-build.log
          if-no-files-found: ignore
          retention-days: 7
