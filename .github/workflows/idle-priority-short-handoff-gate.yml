name: Idle Priority SHORT handoff gate
on:
  push:
    branches: [design/idle-priority-bt-parity-20260929]
    paths:
      - ".github/workflows/idle-priority-short-handoff-gate.yml"
      - "config/idlePriorityShort*.ts"
      - "lib/idle-priority-short-*.ts"
      - "scripts/idle-priority-short-*.ts"
      - "research/idle_priority_63_candidate_keys.json"
      - "scripts/disdex-idle-priority-short-live-runner.ts"
      - "scripts/disdex-idle-priority-short-benign-state-recovery.ts"
      - "scripts/ops/root/disdex-current-runtime-wiring"
      - "scripts/ops/root/disdex-live-operator-activation-gate.mjs"
      - "ops/systemd/disdex-idle-priority-short@.service"
      - "scripts/disdex-hype-zec-long-state-migrate.ts"
      - "scripts/disdex-hype-zec-benign-market-data-recovery.ts"
      - "tests/hype-zec-long-state-migration.test.ts"
      - "tests/hype-zec-benign-market-data-recovery.test.ts"
      - "tests/hype-zec-runner-gate.test.ts"
      - "tests/q102-symbol-ownership-contract.test.ts"
      - "tests/idle-priority-short-systemd-contract.test.mjs"
      - "tests/idle-priority-short-*.test.ts"
      - "docs/implementation/IDLE_PRIORITY_SHORT_CODEX_PRODUCTION_HANDOFF_20260929.md"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci
      - run: npm run strategy:idle-priority-short:selftest
      - run: npm run strategy:idle-priority-short:live:selftest
      - run: npm run strategy:idle-priority-short:benign-recovery:selftest
      - run: npx tsc --noEmit
      - run: npx tsx --test tests/hype-zec-long-state-migration.test.ts tests/idle-priority-short-systemd-contract.test.mjs
      - run: npm run strategy:hype-zec-long:state:migrate:selftest
      - run: npx tsx --test tests/hype-zec-benign-market-data-recovery.test.ts tests/hype-zec-runner-gate.test.ts
      - run: npx tsx --test tests/idle-priority-short-benign-state-recovery.test.ts
      - run: npx tsx --test tests/q102-symbol-ownership-contract.test.ts
      - run: bash scripts/ops/root/disdex-current-runtime-wiring --self-test
      - name: Replay LIVE signal evaluator against exact 63-candidate fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bt-v12-score100-volume080-normalonly-20260928 --repo dunamishajime-bit/-ai-dex-manager --pattern 'bt-v12-score100-volume080-normalonly-20260928.tar.gz'
          echo '891c36d8a5957cafe3aae65656a98b7c02a3c437c4f520fe63756d550f08b4fb  bt-v12-score100-volume080-normalonly-20260928.tar.gz' | sha256sum -c -
          mkdir -p evidence
          tar -xzf bt-v12-score100-volume080-normalonly-20260928.tar.gz -C evidence
          BTC="$(find evidence -type f -path '*/market-Aster-H1-funding-and-manifests/normalized/aster/klines/BTCUSDT.jsonl' | head -1)"
          test -n "$BTC"
          DATA="$(python -c "from pathlib import Path; print(Path('$BTC').resolve().parents[3])")"
          npx tsx scripts/idle-priority-short-live-signal-replay.ts --data-root "$DATA" --expected research/idle_priority_63_candidate_keys.json
      - name: Verify fail-closed handoff artifacts
        shell: bash
        run: |
          test -f docs/implementation/IDLE_PRIORITY_SHORT_CODEX_PRODUCTION_HANDOFF_20260929.md
          test -f ops/systemd/disdex-idle-priority-short@.service
          grep -q IDLE_PRIORITY_SHORT scripts/disdex-idle-priority-short-live-runner.ts
          grep -q requireVenueMargin5xCross lib/idle-priority-short-runner.ts
          grep -q placeStopMarket lib/idle-priority-short-runner.ts
          grep -q IDLE_LIVE_ORDER_PATH_NOT_CERTIFIED scripts/idle-priority-short-runner.ts
      - name: Verify no unguarded LIVE order path
        shell: bash
        run: |
          ! grep -q IDLE_LIVE_ORDER_PATH_NOT_CERTIFIED scripts/disdex-idle-priority-short-live-runner.ts
          grep -q 'IDLE_LIVE_ACTIVATION_REQUIRED' lib/idle-priority-short-live.ts
          grep -q 'FULL_1X_CAPACITY_UNAVAILABLE' lib/idle-priority-short-live.ts
