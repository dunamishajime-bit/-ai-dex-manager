name: PENGU V2 Frozen Older OOS

on:
  workflow_dispatch:
  push:
    branches:
      - research/pengu-dual-ls-v2-20260810
    paths:
      - 'scripts/research/pengu_v2_frozen_older_oos.py.gz.b64'
      - '.github/workflows/pengu-v2-frozen-older-oos.yml'

permissions:
  contents: read

jobs:
  frozen-older-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas
      - name: Decode frozen evaluator
        run: base64 -d scripts/research/pengu_v2_frozen_older_oos.py.gz.b64 | gzip -d > /tmp/pengu_v2_frozen_older_oos.py
      - name: Syntax check
        run: python -m py_compile /tmp/pengu_v2_frozen_older_oos.py
      - name: Run frozen older-history test
        run: python /tmp/pengu_v2_frozen_older_oos.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pengu-v2-frozen-older-oos-${{ github.sha }}
          path: research/pengu-v2-frozen-oos/
          if-no-files-found: warn
          retention-days: 30
# trigger: frozen parameters, no optimization
