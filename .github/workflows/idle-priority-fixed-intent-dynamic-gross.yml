name: Idle Priority fixed intent dynamic gross diagnostic
on:
  push:
    branches: [design/idle-priority-bt-parity-20260929]
    paths:
      - ".github/workflows/idle-priority-fixed-intent-dynamic-gross.yml"
      - "research/idle_priority_fixed_intent_dynamic_gross.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical release and run coherent 8bps/10bps comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bt-v12-score100-volume080-normalonly-20260928 --repo dunamishajime-bit/-ai-dex-manager --pattern 'bt-v12-score100-volume080-normalonly-20260928.tar.gz'
          echo '891c36d8a5957cafe3aae65656a98b7c02a3c437c4f520fe63756d550f08b4fb  bt-v12-score100-volume080-normalonly-20260928.tar.gz' | sha256sum -c -
          mkdir evidence
          tar -xzf bt-v12-score100-volume080-normalonly-20260928.tar.gz -C evidence
          DIR10="$(find evidence -type d -path '*/selected-five-logic-all-cases-all-costs/BRK0P75_MR0P75_FET1_DUAL_GATE/PRICE_MODEL_10BPS' | head -1)"
          DIR8="$(find evidence -type d -path '*/selected-five-logic-all-cases-all-costs/BRK0P75_MR0P75_FET1_DUAL_GATE/PRICE_MODEL_8BPS' | head -1)"
          test -n "$DIR10"
          test -n "$DIR8"
          BTC="$(find evidence -type f -path '*/market-Aster-H1-funding-and-manifests/normalized/aster/klines/BTCUSDT.jsonl' | head -1)"
          test -n "$BTC"
          DATA="$(python -c "from pathlib import Path; print(Path('$BTC').resolve().parents[3])")"
          BASE_ARGS="--idle-intents research/idle_priority_61_intents.json --idle-target-net research/idle_priority_61_target_net.json --data-root $DATA --request-mode candidate --idle-fee-path split"

          python research/idle_priority_fixed_intent_dynamic_gross.py \
            --baseline-trades "$DIR10/portfolio-trades.jsonl" --baseline-events "$DIR10/portfolio-events.jsonl" --baseline-metrics "$DIR10/metrics.json" \
            $BASE_ARGS --roundtrip-bps 10 --without-idle --output coherent-10bps-baseline.json | tee coherent-10bps-baseline.log
          python research/idle_priority_fixed_intent_dynamic_gross.py \
            --baseline-trades "$DIR10/portfolio-trades.jsonl" --baseline-events "$DIR10/portfolio-events.jsonl" --baseline-metrics "$DIR10/metrics.json" \
            $BASE_ARGS --roundtrip-bps 10 --output coherent-10bps-integrated.json | tee coherent-10bps-integrated.log

          python research/idle_priority_fixed_intent_dynamic_gross.py \
            --baseline-trades "$DIR8/portfolio-trades.jsonl" --baseline-events "$DIR8/portfolio-events.jsonl" --baseline-metrics "$DIR8/metrics.json" \
            $BASE_ARGS --roundtrip-bps 8 --without-idle --output coherent-8bps-baseline.json | tee coherent-8bps-baseline.log
          python research/idle_priority_fixed_intent_dynamic_gross.py \
            --baseline-trades "$DIR8/portfolio-trades.jsonl" --baseline-events "$DIR8/portfolio-events.jsonl" --baseline-metrics "$DIR8/metrics.json" \
            $BASE_ARGS --roundtrip-bps 8 --output coherent-8bps-integrated.json | tee coherent-8bps-integrated.log

          python - <<'PY'
          import json
          files=["coherent-10bps-baseline.json","coherent-10bps-integrated.json","coherent-8bps-baseline.json","coherent-8bps-integrated.json"]
          keys=["roundtrip_bps","baseline_completed","idle_completed","baseline_rejected","idle_rejected","combined_completed",
                "final_equity_jpy","baseline_anchor_jpy","profit_factor","max_mtm_drawdown","idle_pnl_jpy_final_fx",
                "idle_profit_factor","strategy_counts","rejections_by_strategy"]
          rows={}
          for p in files:
              x=json.load(open(p))
              rows[p]={k:x.get(k) for k in keys}
              print("COST_RECONCILIATION",p,rows[p])
          json.dump(rows,open("idle-priority-cost-reconciliation.json","w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: idle-priority-fixed-intent-dynamic-gross
          path: |
            coherent-10bps-baseline.json
            coherent-10bps-baseline.log
            coherent-10bps-integrated.json
            coherent-10bps-integrated.log
            coherent-8bps-baseline.json
            coherent-8bps-baseline.log
            coherent-8bps-integrated.json
            coherent-8bps-integrated.log
            idle-priority-cost-reconciliation.json
          retention-days: 30
