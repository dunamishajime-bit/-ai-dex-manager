name: STABLE4 Safety Repair CI

on:
  pull_request:
    paths:
      - "scripts/ops/deploy/disdex_stable4_safety_repair_cutover.py"
      - "scripts/ops/deploy/disdex_order_disable_quiesce.py"
      - "scripts/ops/test_disdex_stable4_safety_repair*.py"
      - "tests/stable4-monitor-dropin-contract.test.mjs"
      - "scripts/disdex-quality102-causal-v1-monitor.ts"
      - "tests/quality102-monitor-only.test.ts"
      - "tests/test_disdex_order_disable_quiesce.py"
      - "tests/test_disdex_stable4_order_disable_workflow.py"
      - ".github/workflows/disdex-stable4-safety-repair*.yml"
      - ".github/workflows/disdex-stable4-order-disable-quiesce.yml"
  push:
    branches:
      - "ops/stable4-safety-repair-cutover-20261120"
    paths:
      - "scripts/ops/deploy/disdex_stable4_safety_repair_cutover.py"
      - "scripts/ops/test_disdex_stable4_safety_repair*.py"
      - "tests/stable4-monitor-dropin-contract.test.mjs"
      - "scripts/disdex-quality102-causal-v1-monitor.ts"
      - "tests/quality102-monitor-only.test.ts"
      - ".github/workflows/disdex-stable4-safety-repair*.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and run safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/deploy/disdex_stable4_safety_repair_cutover.py
          python3 scripts/ops/test_disdex_stable4_safety_repair_cutover.py
          python3 scripts/ops/test_disdex_stable4_safety_repair_workflow.py
          node --test tests/stable4-monitor-dropin-contract.test.mjs
          python3 -m unittest tests/test_disdex_order_disable_quiesce.py tests/test_disdex_stable4_order_disable_workflow.py -v
          echo 'STABLE4_SAFETY_REPAIR_CI=PASS'

