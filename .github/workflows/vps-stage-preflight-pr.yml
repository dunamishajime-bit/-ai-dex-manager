name: Stage and Preflight V96 V52 VPS

on:
  pull_request:
    branches:
      - feature/v96-v52-dual-slot-live
    paths:
      - '.github/workflows/vps-stage-preflight-pr.yml'

permissions:
  contents: read

concurrency:
  group: disdex-vps-stage-preflight
  cancel-in-progress: false

jobs:
  stage-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/vps-runtime-safety-sync'
    runs-on: [self-hosted, linux, x64, disdex-vps]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASES_DIR: /home/deploy/disdex-trading/releases
      STAGED_LINK: /home/deploy/disdex-trading/staged
      LIVE_REPO: /home/deploy/ai-dex-manager-v96-paper
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect runtime path metadata without reading contents
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(sudo -n /usr/local/sbin/disdex-vps-control trading-state)" == "inactive" ]]
          [[ "$(sudo -n /usr/local/sbin/disdex-vps-control trading-pid)" == "0" ]]
          candidates=(
            "$LIVE_REPO"
            "$LIVE_REPO/.runtime-state"
            "$LIVE_REPO/.runtime-state/disdex-v13d-v11eq-v96"
            "$LIVE_REPO/.runtime-state/disdex-v96"
            "$LIVE_REPO/.runtime-state/crypto-v96"
            "$LIVE_REPO/.runtime-state/stock"
            "$LIVE_REPO/.runtime-approval"
            "$LIVE_REPO/.runtime-approval/disdex-v96-operator-override.json"
            "$LIVE_REPO/.runtime-approval/disdex-v96-execution-parity.json"
            "$RELEASES_DIR"
            "/home/deploy/disdex-ops"
          )
          for path in "${candidates[@]}"; do
            if [[ -e "$path" || -L "$path" ]]; then
              stat -c 'path=%n type=%F owner=%U:%G mode=%a' "$path"
            else
              printf 'path=%s exists=false\n' "$path"
            fi
          done
          echo '--- systemd unit path declarations ---'
          systemctl cat disdex-v96-v52-live.service --no-pager | \
            grep -E '^(WorkingDirectory|EnvironmentFile|ExecStart|StateDirectory|ReadWritePaths|ReadOnlyPaths)=' || true
          echo '--- filtered recent failure evidence ---'
          sudo -n /usr/local/sbin/disdex-vps-control trading-log | \
            grep -Ei 'approval|fingerprint|forward-evidence|state|migration|preflight|failed|error|runtime.commit|operator.override' | \
            sed -E 's/(api[-_ ]?key|secret|token|password|private[-_ ]?key)[=:][^ ,;]+/\1=[REDACTED]/Ig' | tail -120 || true
          echo 'diagnostic_only=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'service_state=inactive' >> "$GITHUB_STEP_SUMMARY"
          echo 'orders_sent=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'runtime_state_changed=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'approval_changed=false' >> "$GITHUB_STEP_SUMMARY"
