name: V96 Stock Overnight Session Tournament V7

on:
  pull_request:
    paths:
      - 'research/v96_stock_overnight_session_tournament_v7.py'
      - 'research/v96_stock_funding_carry_tournament_v4.py'
      - 'research/v96_stock_swing_tournament_v3.py'
      - 'research/v96_stock_intraday_theme_flow_backtest.py'
      - '.github/workflows/v96-stock-overnight-session-tournament-v7.yml'
  workflow_dispatch:

concurrency:
  group: v96-stock-overnight-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore price and Funding cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/v96-stock-intraday-theme-flow
            .cache/v96-stock-funding
          key: v96-stock-overnight-v7-${{ runner.os }}-${{ hashFiles('research/v96_stock_overnight_session_tournament_v7.py') }}
          restore-keys: |
            v96-stock-overnight-v7-${{ runner.os }}-
            v96-stock-funding-v4-${{ runner.os }}-
            v96-stock-intraday-15m-${{ runner.os }}-
      - name: Compile and self-test
        run: |
          python -m py_compile research/v96_stock_intraday_theme_flow_backtest.py
          python -m py_compile research/v96_stock_swing_tournament_v3.py
          python -m py_compile research/v96_stock_funding_carry_tournament_v4.py
          python -m py_compile research/v96_stock_overnight_session_tournament_v7.py
          cd research
          python v96_stock_overnight_session_tournament_v7.py --self-test
      - name: Run overnight-session tournament
        run: |
          cd research
          python v96_stock_overnight_session_tournament_v7.py \
            --price-cache-dir ../.cache/v96-stock-intraday-theme-flow \
            --funding-cache-dir ../.cache/v96-stock-funding \
            --output-dir ../.research-state/v96-stock-overnight-session-tournament-v7
      - name: Validate evidence
        run: |
          test -s .research-state/v96-stock-overnight-session-tournament-v7/v96-stock-overnight-session-tournament-v7.json
          test -s .research-state/v96-stock-overnight-session-tournament-v7/v96-stock-overnight-session-tournament-v7.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v96-stock-overnight-session-tournament-v7/v96-stock-overnight-session-tournament-v7.json').read_text())
          assert p['candidateCount'] == 24
          assert p['familyCount'] == 8
          assert p['status'] in {
              'CRYPTO_LIKE_OVERNIGHT_EDGE_FOUND_REUSED_HISTORY_SHADOW_ONLY',
              'ROBUST_POSITIVE_OVERNIGHT_EDGE_FOUND_REUSED_HISTORY_SHADOW_ONLY',
              'OVERNIGHT_VALIDATION_LEAD_FAILED_REUSED_HOLDOUT',
              'NO_VALIDATION_PASSING_OVERNIGHT_FAMILY',
          }
          assert p['selectionDiscipline']['holdoutRetuningAllowed'] is False
          assert p['safety']['orderSubmissionAllowed'] is False
          assert p['safety']['productionChanged'] is False
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v96-stock-overnight-session-tournament-v7
          path: .research-state/v96-stock-overnight-session-tournament-v7
          retention-days: 90
