name: Formal BT Yahoo V52 1Y Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - codex/formal-five-logic-bt-20260926
    paths:
      - ".github/workflows/formal-five-bt-yahoo-coverage.yml"

permissions:
  contents: read

jobs:
  yahoo-historical-hourly-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ephemeral Yahoo Finance 60m stock bars; never publish raw data
        run: python -m research.formal_five_bt.yahoo_acquire --output-root "$RUNNER_TEMP/formal-five-bt-yahoo" --start 2025-08-10 --end-exclusive 2026-08-11
      - name: Publish coverage status only and fail on incomplete year
        env:
          YAHOO_LOCAL_ROOT: ${{ runner.temp }}/formal-five-bt-yahoo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["YAHOO_LOCAL_ROOT"])
          data = json.loads((root / "yahoo-v52-coverage.json").read_text())
          acceptable = True
          for symbol, row in sorted(data["symbols"].items()):
              print(f"{symbol}: status={row['status']}, rows={row['rows']}, missing_session_hours={row.get('missing_session_hours')}, unexpected_session_hours={row.get('unexpected_session_hours')}, page_errors={row.get('page_errors')}")
              acceptable &= row["status"] == "COVERAGE_COMPLETE"
          if not acceptable:
              raise SystemExit("Coverage incomplete. No full-year V52 backtest or P&L claim can be made.")
          print("All five Yahoo reference ticker hourly sessions fully covered.")
          PY
