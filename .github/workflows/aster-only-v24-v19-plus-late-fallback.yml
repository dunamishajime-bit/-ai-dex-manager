name: Aster-only V24 V19 Plus Late Fallback

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v24_v19_plus_late_fallback.py'
      - 'docs/research/ASTER_ONLY_V24_V19_PLUS_LATE_FALLBACK_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v24-v19-plus-late-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v24-late-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v24-late-fallback
          key: aster-only-v24-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v24_v19_plus_late_fallback.py') }}
          restore-keys: |
            aster-only-v24-${{ runner.os }}-
            aster-only-v23-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v24_v19_plus_late_fallback.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v24_v19_plus_late_fallback as v24
          assert len(v24.SECONDARY_CANDIDATES) == 84
          assert all(c.entry_policy == 'SLOT_1330' for c in v24.SECONDARY_CANDIDATES)
          assert v24.v19.CANDIDATE.candidate_id == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert v24.MIN_VALIDATION_ROUTER_TRADES == 8
          assert v24.MIN_VALIDATION_SECONDARY_TRADES == 3
          assert v24.v20.STRICT_HURDLES['minimumNormalReturnPct'] == 50.0
          print('V24 late fallback freeze assertions: PASS')
          PY
      - name: Run V24 late fallback tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v24-late-fallback
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v24_v19_plus_late_fallback.py \
            --cache-dir ../.cache/aster-only-v24-late-fallback \
            --output-dir ../.research-state/aster-only-v24-late-fallback \
            2>&1 | tee ../.research-state/aster-only-v24-late-fallback/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v24-late-fallback/result.json
          test -s .research-state/aster-only-v24-late-fallback/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v24-late-fallback/result.json').read_text())
          assert p['version'] == 24
          assert p['period']['calendarDays'] == 365
          assert p['candidateUniverse'] == 84
          assert p['selectionDiscipline']['secondaryCandidateGridPredeclared'] is True
          assert p['selectionDiscipline']['v19AlwaysEvaluatedBeforeSecondary'] is True
          assert p['selectionDiscipline']['validationSelectsAtMostOne'] is True
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['architecture']['priority'][1] == 'V19_FALLBACK_1230'
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          assert p['status'] in {
            'ASTER_ONLY_V24_NO_VALIDATED_LATE_FALLBACK',
            'ASTER_ONLY_V24_LATE_FALLBACK_STRICT_IMPROVEMENT_SHADOW_ONLY',
            'ASTER_ONLY_V24_VALIDATED_LATE_FALLBACK_NOT_STRICT_IMPROVEMENT',
          }
          if p['status'] == 'ASTER_ONLY_V24_LATE_FALLBACK_STRICT_IMPROVEMENT_SHADOW_ONLY':
              assert p['allImprovementChecksPassed'] is True
              assert all(p['improvementChecks'].values())
          print(json.dumps({
            'status': p['status'],
            'developmentSurvivors': p['developmentSurvivors'],
            'validationSurvivors': p['validationSurvivors'],
            'selectedCandidate': p.get('selectedCandidate'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v24-late-fallback-${{ github.run_id }}
          path: .research-state/aster-only-v24-late-fallback
          retention-days: 90
          if-no-files-found: warn
