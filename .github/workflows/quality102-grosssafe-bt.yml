name: Quality102 GrossSafe One-Year BT

on:
  push:
    branches:
      - research/latest-v12-pengu-v8-v52-dca-1y-20260828
    paths:
      - 'scripts/research_latest_v8_quality102_grosssafe.py'
      - '.github/workflows/quality102-grosssafe-bt.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality102-grosssafe-bt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research integration
        uses: actions/checkout@v4

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable stock cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: quality102-grosssafe-${{ runner.os }}-${{ hashFiles('scripts/research_current_top2_pengu_v52_dca.py') }}
          restore-keys: |
            latest-v12-pengu-v8-v52-dca-
            current-v12-top2-pengu-v20-v52-dca-
            current-v12-top2-pengu-v52-dca-
            v12-v52-pengu-v2-combined-
            aster-only-v52-v39cache-
            perp-research-usdm-

      - name: Install dependencies
        run: npm ci

      - name: Compile gross-safe launcher
        run: python -m py_compile scripts/research_latest_v8_quality102_grosssafe.py

      - name: Restore prior exact Quality102 run inputs
        uses: actions/download-artifact@v4
        with:
          name: latest-v12-pengu-v8-v52-dca-1y-33257164125
          path: .research-state/quality102-prior
          github-token: ${{ github.token }}
          repository: dunamishajime-bit/-ai-dex-manager
          run-id: 33257164125

      - name: Run GrossSafe Quality102 unified BT
        run: |
          mkdir -p .research-state/quality102-grosssafe
          set -o pipefail
          python scripts/research_latest_v8_quality102_grosssafe.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --v12-ledger .research-state/quality102-prior/v12-top2-ledger.json \
            --pengu-ledger .research-state/quality102-prior/pengu-v8-ledger.json \
            --output-dir .research-state/quality102-grosssafe \
            2>&1 | tee .research-state/quality102-grosssafe/combined-dca.log

      - name: Validate GrossSafe contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/quality102-grosssafe/result.json').read_text())
          assert p['status']=='PASS_RESEARCH_ONLY',p['checks']
          assert p['capital']['initialJpy']==10000.0
          assert p['capital']['monthlyContributionJpy']==10000.0
          assert p['capital']['contributionCountAfterStart']==12
          assert p['capital']['totalContributedJpy']==130000.0
          assert p['supplementResearch']['entryPolicy']=='BASE_IDLE_ONE_SLOT_BASE_PRIORITY_RESIDUAL_GROSS_SHRINK'
          assert p['supplementResearch']['resizePnlAccounting']=='ZERO_PNL_ON_TRIMMED_NOTIONAL'
          assert all(p['checks'].values()),p['checks']
          for mode in ('NORMAL','SEVERE'):
              r=p['results'][mode]
              g=r['grossVerification']
              assert g['entryTimeMaxTotalGross'] <= 2.5 + 1e-9,g
              assert g['entryTimeMaxSupplementGross'] <= 0.15 + 1e-9,g
              assert len(g['supplementGrossConflicts']) == 0,g
              assert p['checks'][f'{mode}_baseParity_V12_ENTERED']
              assert p['checks'][f'{mode}_baseParity_PENGU_ENTERED']
              assert p['checks'][f'{mode}_baseParity_V11_EQ_ENTERED']
              assert p['checks'][f'{mode}_baseParity_V50_POST_OPEN_BASIS_ENTERED']
          assert len(p['results']['NORMAL']['grossVerification']['supplementGrossResizes']) > 0
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'status':p['status'],'normal':p['results']['NORMAL'],'severe':p['results']['SEVERE'],'supplementResearch':p['supplementResearch']},ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality102-grosssafe-bt-${{ github.run_id }}
          path: .research-state/quality102-grosssafe
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
