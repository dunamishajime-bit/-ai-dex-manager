name: BT Workspace verification (read-only)

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/disdex-bt-workspace-ci.yml"
      - "app/bt-verification/**"
      - "components/bt-verification/**"
      - "lib/bt-verification/**"
      - "scripts/research/verify_bt_vps_runner_sources.py"
      - "scripts/research/build_bt_stable4_research_replays.py"
      - "tests/bt-*.test.ts"
      - "tests/test_bt_vps_runner_sources.py"
      - "tests/test_bt_stable4_live_source_pins.py"
      - "scripts/research/audit_bt_stable4_live_source_pins.py"
      - "scripts/research/audit_bt_live_dependency_closure.py"
      - "tests/test_bt_live_dependency_closure.py"
      - "scripts/research/verify_bt_live_vps_dependency_bytes.py"
      - "tests/test_bt_live_vps_dependency_bytes.py"
      - "scripts/research/audit_bt_stable4_v4_hype_git_diff.py"
      - "tests/test_bt_stable4_v4_hype_git_diff.py"
      - "scripts/research/audit_bt_stable4_static_graph_delta.py"
      - "tests/test_bt_stable4_static_graph_delta.py"
      - "scripts/research/audit_bt_stable4_model_loss_forensics.py"
      - "tests/test_bt_stable4_model_loss_forensics.py"
      - "scripts/research/replay_pinned_hype_closed_h1_signals.ts"
      - "scripts/research/audit_bt_hype_signal_decisions.py"
      - "tests/test_bt_hype_signal_decisions.py"
      - "tests/test_bt_hype_pure_signal_report.py"
      - "scripts/research/audit_bt_hype_missing_candidate_exposure.py"
      - "tests/test_bt_hype_missing_candidate_exposure.py"
      - "docs/research-results/BT_HYPE_PINNED_PURE_SIGNAL_REPLAY_20261119_UNCERTIFIED.json"
      - "docs/research-results/BT_HYPE_PURE_SIGNAL_MODEL_DECISION_RECONCILE_20261119_UNCERTIFIED.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [feat/bt-workspace-phase1-20261118]
    paths:
      - ".github/workflows/disdex-bt-workspace-ci.yml"
      - "app/bt-verification/**"
      - "components/bt-verification/**"
      - "lib/bt-verification/**"
      - "scripts/research/verify_bt_vps_runner_sources.py"
      - "scripts/research/build_bt_stable4_research_replays.py"
      - "tests/bt-*.test.ts"
      - "tests/test_bt_vps_runner_sources.py"
      - "tests/test_bt_stable4_live_source_pins.py"
      - "scripts/research/audit_bt_stable4_live_source_pins.py"
      - "scripts/research/audit_bt_live_dependency_closure.py"
      - "tests/test_bt_live_dependency_closure.py"
      - "scripts/research/verify_bt_live_vps_dependency_bytes.py"
      - "tests/test_bt_live_vps_dependency_bytes.py"
      - "scripts/research/audit_bt_stable4_v4_hype_git_diff.py"
      - "tests/test_bt_stable4_v4_hype_git_diff.py"
      - "scripts/research/audit_bt_stable4_static_graph_delta.py"
      - "tests/test_bt_stable4_static_graph_delta.py"
      - "scripts/research/audit_bt_stable4_model_loss_forensics.py"
      - "tests/test_bt_stable4_model_loss_forensics.py"
      - "scripts/research/replay_pinned_hype_closed_h1_signals.ts"
      - "scripts/research/audit_bt_hype_signal_decisions.py"
      - "tests/test_bt_hype_signal_decisions.py"
      - "tests/test_bt_hype_pure_signal_report.py"
      - "scripts/research/audit_bt_hype_missing_candidate_exposure.py"
      - "tests/test_bt_hype_missing_candidate_exposure.py"
      - "docs/research-results/BT_HYPE_PINNED_PURE_SIGNAL_REPLAY_20261119_UNCERTIFIED.json"
      - "docs/research-results/BT_HYPE_PURE_SIGNAL_MODEL_DECISION_RECONCILE_20261119_UNCERTIFIED.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: bt-workspace-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: BT tests, typecheck and website build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: npm ci
      - name: Python BT parity verifier unit tests (no SSH)
        run: python -m unittest discover -s tests -p 'test_bt_vps_runner_sources.py' -v
      - name: STABLE4 vs LIVE pin mismatch unit tests (no SSH)
        run: python -m unittest discover -s tests -p 'test_bt_stable4_live_source_pins.py' -v
      - name: Generate untrusted STABLE4 mismatch audit (no live access)
        run: python scripts/research/audit_bt_stable4_live_source_pins.py --output /tmp/disdex-bt-study-vs-live.json
      - name: Pinned LIVE Git dependency graph unit tests
        run: python -m unittest discover -s tests -p 'test_bt_live_dependency_closure.py' -v
      - name: Reconstruct pinned LIVE Git dependency graph (no VPS)
        run: python scripts/research/audit_bt_live_dependency_closure.py --output /tmp/disdex-bt-live-git-closure.json
      - name: VPS dependency byte comparison unit tests (offline)
        run: python -m unittest discover -s tests -p 'test_bt_live_vps_dependency_bytes.py' -v
      - name: V4/HYPE research-to-live source diff tests
        run: python -m unittest discover -s tests -p 'test_bt_stable4_v4_hype_git_diff.py' -v
      - name: V4/HYPE research-to-live Git diff (no VPS)
        run: python scripts/research/audit_bt_stable4_v4_hype_git_diff.py --output /tmp/disdex-bt-v4-hype-git-diff.json
      - name: STABLE4-to-LIVE static execution graph delta tests
        run: python -m unittest discover -s tests -p 'test_bt_stable4_static_graph_delta.py' -v
      - name: Compare STABLE4-to-LIVE static execution graphs (no VPS)
        run: python scripts/research/audit_bt_stable4_static_graph_delta.py --output /tmp/disdex-bt-static-graph-diff.json
      - name: V4/HYPE model loss forensics tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_bt_stable4_model_loss_forensics.py' -v
      - name: HYPE pure-signal and modeled decision evidence unit tests (no market data downloads)
        run: |
          python -m unittest discover -s tests -p 'test_bt_hype_signal_decisions.py' -v
          python -m unittest discover -s tests -p 'test_bt_hype_pure_signal_report.py' -v
          python -m unittest discover -s tests -p 'test_bt_hype_missing_candidate_exposure.py' -v
      - name: BT replay and UI unit tests
        run: ./node_modules/.bin/tsx --test tests/bt-*.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build website (no deployment)
        run: npm run build
