name: Aster-only V49 Standalone Residual Engine

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v49_standalone_residual_engine.py'
      - 'docs/research/ASTER_ONLY_V49_STANDALONE_RESIDUAL_ENGINE_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v49-standalone-residual-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v49-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore successful V39 market caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v39-overnight-open
          key: aster-only-v49-v39cache-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v49_standalone_residual_engine.py') }}
          restore-keys: |
            aster-only-v39-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v39_overnight_open_router.py \
            scripts/research_lab_aster_only_v46_closing_overlay.py \
            scripts/research_lab_aster_only_v49_standalone_residual_engine.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v49_standalone_residual_engine as v49
          assert len(v49.CANDIDATES) == 216
          assert v49.WINDOWS == ('OPEN_1030', 'MID_1230', 'CLOSE_1500')
          assert (v49.v19.BT_END_EXCLUSIVE - v49.v19.BT_START).days == 365
          assert v49.TP_PCT == 1.0 and v49.SL_PCT == 1.0
          print('V49 freeze assertions: PASS')
          PY
      - name: Run V49 standalone tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v49-standalone
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v49_standalone_residual_engine.py \
            --cache-dir ../.cache/aster-only-v39-overnight-open \
            --output-dir ../.research-state/aster-only-v49-standalone \
            2>&1 | tee ../.research-state/aster-only-v49-standalone/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v49-standalone/result.json
          test -s .research-state/aster-only-v49-standalone/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v49-standalone/result.json').read_text())
          assert p['version'] == 49
          assert p['candidateCount'] == 216
          assert p['period']['calendarDays'] == 365
          assert p['architecture']['otherStrategyReturnsIncluded'] is False
          assert p['architecture']['v11EqIncluded'] is False
          assert p['architecture']['v19Included'] is False
          assert p['architecture']['v48Included'] is False
          assert p['architecture']['maximumConcurrentGross'] == 1.0
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v48Changed': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V49_NO_VALIDATED_STANDALONE_50PCT_ENGINE',
              'ASTER_ONLY_V49_STANDALONE_50PCT_SHADOW_LEAD',
              'ASTER_ONLY_V49_VALIDATION_WINNER_FAILED_FINAL_HURDLES',
          }
          print(json.dumps({'status': p['status'], 'winner': p['winner'], 'top': p['topDiagnostics'][:3]}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v49-standalone-${{ github.run_id }}
          path: .research-state/aster-only-v49-standalone
          retention-days: 90
          if-no-files-found: warn
