name: DisDex HP Deployment Approval CI

on:
  pull_request:
    paths:
      - "lib/deploy-approval-token.ts"
      - "lib/owner-goal-approval.ts"
      - "lib/server/owner-goal-attestation.ts"
      - "tests/owner-goal-approval.test.ts"
      - "tests/owner-goal-store-concurrency.test.ts"
      - ".github/workflows/disdex-owner-goal-candidate-ci.yml"
      - ".github/workflows/disdex-owner-goal-approval-request.yml"
      - ".github/workflows/disdex-v4-formal-production-live.yml"
      - ".github/workflows/disdex-allrunner-v4-idle-live-resume.yml"
      - "lib/server/deploy-approval-store.ts"
      - "lib/server/deploy-approval-redis-cas.ts"
      - "lib/server/owner-session.ts"
      - "lib/server/password-hash.ts"
      - "lib/server/otp-challenge-store.ts"
      - "lib/server/request-security.ts"
      - "app/api/auth/**"
      - "app/api/admin/**"
      - "app/api/admin/deploy-approval/**"
      - "app/api/production-approval/**"
      - "app/production-approval/**"
      - "components/layout/Sidebar.tsx"
      - "app/page.tsx"
      - "app/realtime/**"
      - "app/decision-status/**"
      - "app/performance/**"
      - "scripts/ops/disdex-hp-ui-regression-guard.mjs"
      - "app/settings/page.tsx"
      - "app/api/system/deploy-approval/**"
      - "lib/stable4-runner-bundle.ts"
      - "tests/stable4-runner-bundle.test.ts"
      - "tests/stable4-runner-bundle-approval.test.mjs"
      - ".github/workflows/disdex-stable4-runner-bundle-order-enable.yml"
      - "scripts/ops/test_disdex_stable4_runner_bundle.py"
      - "app/admin/page.tsx"
      - "scripts/disdex-hp-deploy-approval-selftest.ts"
      - "tests/deploy-approval-store-concurrency.test.ts"
      - "tests/fixtures/approval-store-writer.ts"
      - "tests/deploy-approval-direct-writer.test.mjs"
      - "tests/deploy-approval-redis-cas-source.test.mjs"
      - "tests/password-hash-hardening.test.ts"
      - "tests/owner-session-hardening.test.ts"
      - "tests/otp-challenge-store.test.ts"
      - "tests/auth-boundary-source.test.mjs"
      - "tests/production-workflow-protected-environment.test.mjs"
      - "tests/hp-ui-dropin-canonical-selection.test.mjs"
      - ".github/workflows/disdex-v4-hp-approval-request.yml"
      - ".github/workflows/disdex-v4-doge-missed-time-exit-approval-request.yml"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/disdex-v4-hp-approval-request.yml"
      - ".github/workflows/disdex-hp-approval-ui-production-deploy.yml"
      - ".github/workflows/disdex-hp-standard-approval-ui-deploy.yml"
      - ".github/workflows/disdex-hp-deploy-approval-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reject legacy homepage regression
        run: node scripts/ops/disdex-hp-ui-regression-guard.mjs

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Python verifier syntax
        run: python3 -m py_compile scripts/ops/deploy/disdex_owner_approval.py scripts/ops/deploy/disdex_deployment_contract.py

      - name: HP approval token interoperability
        run: npm run deploy:hp-approval:selftest

      - name: STABLE4 six-Runner bundle approval contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest \
            scripts/ops/test_disdex_stable4_runner_bundle.py \
            scripts/ops/test_disdex_stable4_runner_bundle_workflow.py -v
          npx tsx tests/stable4-runner-bundle.test.ts
          npx tsx tests/stable4-runner-bundle-approval.test.mjs

      - name: Approval store concurrency and corruption
        run: node --import tsx --test tests/deploy-approval-store-concurrency.test.ts

      - name: One goal approval across revised SHA, plans, and concurrent sessions
        run: |
          node --import tsx --test tests/owner-goal-approval.test.ts
          node --import tsx --test tests/owner-goal-store-concurrency.test.ts

      - name: Redis actual Lua CAS - one goal ID, conflict rejection, owner revocation
        shell: bash
        run: |
          set -euo pipefail
          npx tsx -e 'import fs from "node:fs"; import {REDIS_APPROVAL_CAS_SCRIPT} from "./lib/server/deploy-approval-redis-cas.ts"; fs.writeFileSync("/tmp/disdex-goal-cas.lua", REDIS_APPROVAL_CAS_SCRIPT)'
          docker run --rm -d --name disdex-goal-redis redis:7-alpine >/dev/null
          trap 'docker rm -f disdex-goal-redis >/dev/null 2>&1 || true' EXIT
          for i in {1..25}; do
            if docker exec disdex-goal-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker cp /tmp/disdex-goal-cas.lua disdex-goal-redis:/tmp/disdex-goal-cas.lua
          args=(approval:goal1 approval:latest approval:history approval:goal-index)
          first="$(docker exec disdex-goal-redis redis-cli --eval /tmp/disdex-goal-cas.lua "${args[@]}" , 0 '' '{"id":"goal1","storeRevision":"r1"}' 3600 1 goal1 1 1 1 1)"
          test "$first" = 1
          test "$(docker exec disdex-goal-redis redis-cli GET approval:goal-index)" = goal1
          duplicate="$(docker exec disdex-goal-redis redis-cli --eval /tmp/disdex-goal-cas.lua approval:goal2 approval:latest approval:history approval:goal-index , 0 '' '{"id":"goal2","storeRevision":"r1"}' 3600 1 goal2 1 1 1 1)"
          test "$duplicate" = 0
          revoked="$(docker exec disdex-goal-redis redis-cli --eval /tmp/disdex-goal-cas.lua "${args[@]}" , 1 r1 '{"id":"goal1","storeRevision":"r2"}' 3600 1 goal1 1 0 1 0)"
          test "$revoked" = 1
          test "$(docker exec disdex-goal-redis redis-cli EXISTS approval:goal-index)" = 0
          echo REDIS_GOAL_ONCE_ATOMIC=PASS

      - name: Owner auth and password contracts
        run: node --import tsx --test tests/password-hash-hardening.test.ts tests/owner-session-hardening.test.ts tests/otp-challenge-store.test.ts

      - name: Authentication boundary source contracts
        run: node --test tests/auth-boundary-source.test.mjs tests/deploy-approval-atomic-redeem-source.test.mjs

      - name: Legacy direct-writer and atomic redeem contract
        run: node --import tsx --test tests/deploy-approval-direct-writer.test.mjs tests/deploy-approval-redis-cas-source.test.mjs

      - name: Protected Production workflow contracts
        run: node --test tests/production-workflow-protected-environment.test.mjs

      - name: Canonical HP UI systemd drop-in contract
        run: node --test tests/hp-ui-dropin-canonical-selection.test.mjs

      - name: Owner auth, password and OTP contracts
        run: node --import tsx --test tests/password-hash-hardening.test.ts tests/owner-session-hardening.test.ts tests/otp-challenge-store.test.ts

      - name: Authentication boundary source contracts
        run: node --test tests/auth-boundary-source.test.mjs

      - name: Signed owner-session probe and portfolio display security
        run: |
          node --test tests/hp-independent-owner-probe.test.mjs tests/hp-live-portfolio-session-expiry.test.mjs
          bash -n scripts/ops/disdex-hp-independent-owner-probe-nginx-cutover.sh
      - name: Fail-closed user login second-factor source and runtime contracts
        run: |
          node --test tests/hp-server-side-user-login-2fa.test.mjs
          node --import tsx --test tests/user-login-otp-store.test.ts
      - name: Resume interrupted second-factor UI without bypassing owner login
        run: node --test tests/hp-resume-pending-factor.test.mjs
      - name: Ordered switchable login factors and server-bound passkey
        run: node --test tests/hp-login-factor-order-switch.test.mjs
      - name: Production HP build
        run: |
          npm run build
          test -f .next/standalone/server.js
          test -f .next/standalone/.next/BUILD_ID
          node --check .next/standalone/server.js
