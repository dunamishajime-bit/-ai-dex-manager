name: DisDex All-Runner Order Enable Helper Install

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact master SHA containing the reviewed helper
        required: true
        type: string
      plan_sha256:
        description: Exact SHA-256 of the canonical all-runner order-enable plan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  install-helper:
    if: >-
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and canonical plan
        id: bind
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          actual="$(sha256sum config/disdex-allrunner-order-enable-DD1296_FINAL_ALLIN_10BPS.json | awk '{print $1}')"
          [[ "$actual" == "$PLAN_SHA256" ]]
          echo "source_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "plan_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Configure reviewed Production SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/order-enable-install-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/order-enable-install-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/order-enable-install-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/order-enable-install-ssh/"*
          ssh-keygen -y -f "$RUNNER_TEMP/order-enable-install-ssh/key" >/dev/null

      - name: Build reviewed bootstrap bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/ops/deploy/disdex_allrunner_order_enable.py
            scripts/ops/deploy/disdex_allrunner_order_enable_prep.py
            scripts/ops/deploy/disdex_owner_approval.py
            scripts/ops/deploy/disdex_deployment_contract.py
            scripts/ops/deploy/disdex_allrunner_final_verify.py
            scripts/ops/root/disdex-allrunner-order-enable
            scripts/ops/root/disdex-allrunner-order-enable-prep
            scripts/ops/root/install-disdex-allrunner-order-enable
            config/disdex-allrunner-order-enable-DD1296_FINAL_ALLIN_10BPS.json
          )
          umask 077
          sha256sum "${files[@]}" > "$RUNNER_TEMP/order-enable-install.sha256"
          tar -czf "$RUNNER_TEMP/order-enable-install.tar.gz" "${files[@]}"
          archive_sha="$(sha256sum "$RUNNER_TEMP/order-enable-install.tar.gz" | awk '{print $1}')"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/order-enable-install.sha256" | awk '{print $1}')"
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ && "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"

      - name: Install exact root-owned helper only
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          PORT: ${{ vars.DISDEX_PRODUCTION_SSH_PORT }}
          TARGET_SHA: ${{ steps.bind.outputs.source_sha }}
          PLAN_SHA256: ${{ steps.bind.outputs.plan_sha }}
          ARCHIVE_SHA: ${{ steps.bundle.outputs.archive_sha }}
          MANIFEST_SHA: ${{ steps.bundle.outputs.manifest_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ && "$RUN_ID" =~ ^[0-9]{1,20}$ ]]
          ssh_args=(
            -T
            -i "$RUNNER_TEMP/order-enable-install-ssh/key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
             -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/order-enable-install-ssh/known_hosts"
            -o ConnectTimeout=10
            -p "$PORT"
          )
          remote="/var/lib/unified-deploy/order-enable-helper-install-$RUN_ID"
          ssh "${ssh_args[@]}" "root@$HOST" \
            "set -eu; umask 077; install -d -o root -g root -m 0700 /var/lib/unified-deploy; test ! -e '$remote'; install -d -o root -g root -m 0700 '$remote/source'"
          scp -q -i "$RUNNER_TEMP/order-enable-install-ssh/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/order-enable-install-ssh/known_hosts" \
            -P "$PORT" "$RUNNER_TEMP/order-enable-install.tar.gz" "$RUNNER_TEMP/order-enable-install.sha256" \
            "root@$HOST:$remote/"
          result="$(
            ssh "${ssh_args[@]}" "root@$HOST" \
              "set -eu
               test \"\$(sha256sum '$remote/order-enable-install.tar.gz' | awk '{print \$1}')\" = '$ARCHIVE_SHA'
               test \"\$(sha256sum '$remote/order-enable-install.sha256' | awk '{print \$1}')\" = '$MANIFEST_SHA'
               tar -xzf '$remote/order-enable-install.tar.gz' -C '$remote/source'
               cd '$remote/source'
               sha256sum -c '$remote/order-enable-install.sha256'
               /bin/sh scripts/ops/root/install-disdex-allrunner-order-enable '$remote/source' '$TARGET_SHA' '$PLAN_SHA256'
               test \"\$(cat /usr/local/lib/disdex-allrunner-order-enable/source-sha)\" = '$TARGET_SHA'
               test \"\$(sha256sum /usr/local/lib/disdex-allrunner-order-enable/order-enable-plan.json | awk '{print \$1}')\" = '$PLAN_SHA256'
               printf '%s  %s\n' \
                 \"\$(sha256sum scripts/ops/deploy/disdex_allrunner_order_enable.py | awk '{print \$1}')\" /usr/local/lib/disdex-allrunner-order-enable/disdex_allrunner_order_enable.py \
                 \"\$(sha256sum scripts/ops/deploy/disdex_allrunner_order_enable_prep.py | awk '{print \$1}')\" /usr/local/lib/disdex-allrunner-order-enable/disdex_allrunner_order_enable_prep.py \
                 \"\$(sha256sum scripts/ops/deploy/disdex_owner_approval.py | awk '{print \$1}')\" /usr/local/lib/disdex-allrunner-order-enable/disdex_owner_approval.py \
                 \"\$(sha256sum scripts/ops/deploy/disdex_deployment_contract.py | awk '{print \$1}')\" /usr/local/lib/disdex-allrunner-order-enable/disdex_deployment_contract.py \
                 \"\$(sha256sum scripts/ops/deploy/disdex_allrunner_final_verify.py | awk '{print \$1}')\" /usr/local/lib/disdex-allrunner-order-enable/disdex_allrunner_final_verify.py \
                 \"\$(sha256sum scripts/ops/root/disdex-allrunner-order-enable | awk '{print \$1}')\" /usr/local/sbin/disdex-allrunner-order-enable \
                 \"\$(sha256sum scripts/ops/root/disdex-allrunner-order-enable-prep | awk '{print \$1}')\" /usr/local/sbin/disdex-allrunner-order-enable-prep |
                 sha256sum -c -"
          )"
          grep -q 'ALLRUNNER_ORDER_ENABLE_HELPERS_INSTALLED_SOURCE_READY_NOT_LIVE' <<<"$result"
          echo "ALLRUNNER_ORDER_ENABLE_HELPERS_INSTALLED_SOURCE_READY_NOT_LIVE"

      - name: Cleanup local bootstrap material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/order-enable-install-ssh" \
            "$RUNNER_TEMP/order-enable-install.tar.gz" \
            "$RUNNER_TEMP/order-enable-install.sha256"
