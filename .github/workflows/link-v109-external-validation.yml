name: V109 External Venue Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_link_v109_external_validation.py"
      - ".github/workflows/link-v109-external-validation.yml"
      - "research/link-v109-external-trigger.txt"
      - "research/sol-v109-external-trigger.txt"

permissions:
  contents: read

concurrency:
  group: v109-external-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Install dependencies
        run: npm ci
      - name: Refresh genuine public six-pair USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Normalize exact cache filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated')
          for sym in ['BTC','ETH','BNB','SOL','LINK','AVAX']:
              for end in ('1782864000000','1786287600000'):
                  exact=root/f'{sym}USDT-1661990400000-{end}-v2.json'
                  if exact.exists():
                      continue
                  matches=sorted(root.glob(f'{sym}USDT-1661990400000-*-v*.json'))
                  if not matches:
                      raise SystemExit(f'MISSING_GENUINE_CACHE:{sym}')
                  exact.write_bytes(matches[-1].read_bytes())
          PY

  validate:
    needs: data
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [LINK, SOL]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Restore external venue cache
        uses: actions/cache@v4
        with:
          path: .cache/v109-external
          key: v109-external-20260811-v1
          restore-keys: |
            v109-external-20260811-
            link-v109-external-20260811-
      - name: Compile
        run: python -m py_compile scripts/research_link_v109_external_validation.py
      - name: Validate frozen V109 regime-wave logic across Bybit and OKX plus prior-year causal replication
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_link_v109_external_validation.py --symbol "${{ matrix.symbol }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v109-external-validation
          path: |
            .research-state/${{ lower(matrix.symbol) }}-v109-external-validation.json
            .research-state/${{ lower(matrix.symbol) }}-v109-external-validation.md
          if-no-files-found: warn
          retention-days: 30

# Research-only validation. Public market data only. No API keys, orders, accounts, VPS, or production changes.
