name: DisDex Q102 Owner-approved LIVE promotion

# No push, pull_request, schedule, or CI-triggered Production updates.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character SHA of the audited Q102 release'
        required: true
        type: string
      expected_live_sha:
        description: 'Exact SHA of currently running Q102 service'
        required: true
        type: string
      owner_approval:
        description: 'Type I_APPROVE_Q102_LIVE_<target_sha> for real-money cutover'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: q102-owner-production-promotion
  cancel-in-progress: false

jobs:
  verify-exact-release:
    name: Owner dispatch, SHA/diff verification, CI provenance
    if: github.event_name == 'workflow_dispatch' && github.actor == 'dunamishajime-bit' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require owner, explicit SHA confirmation and exact-SHA successful CI
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ops/q102-owner-manual-approval-selftest.py
          python3 scripts/ops/q102-owner-manual-approval-check.py
      - name: Audit approval request without touching LIVE
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
        run: |
          printf '### Owner-approved Q102 exact-SHA request\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Candidate: %s\n\nExpected old LIVE: %s\n' "$TARGET_SHA" "$EXPECTED_LIVE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy-only-after-owner-review:
    name: Delegate to validated VPS operator-controlled Q102 promoter
    needs: verify-exact-release
    # Setup MUST include required reviewer dunamishajime-bit.
    environment: q102-production-manual
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fail closed if protected owner-review environment is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/environments/q102-production-manual'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req, timeout=15) as response:
              environment = json.load(response)
          rules = environment.get('protection_rules') or []
          owner_review_required = any(
              rule.get('type') == 'required_reviewers' and any(
                  r.get('reviewer', {}).get('login') == 'dunamishajime-bit'
                  for r in rule.get('reviewers', [])
              ) for rule in rules
          )
          if not owner_review_required:
              raise SystemExit('FAIL_CLOSED: production environment owner reviewer not configured')
          print('Q102_GITHUB_OWNER_REVIEW_POLICY_PASS')
          PY
      - name: Verify dedicated SSH identity and pinned host fingerprint
        env:
          HOST: ${{ secrets.Q102_DEPLOY_HOST }}
          USER: ${{ secrets.Q102_DEPLOY_USER }}
          KEY: ${{ secrets.Q102_DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.Q102_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$HOST_KEYS" || {
            echo 'FAIL_CLOSED: Q102 environment deploy credentials missing'; exit 3;
          }
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 3
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/q102_deploy_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/q102_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/q102_deploy_key" >/dev/null
      - name: Invoke separately installed Q102 exact-SHA operator promoter
        env:
          HOST: ${{ secrets.Q102_DEPLOY_HOST }}
          USER: ${{ secrets.Q102_DEPLOY_USER }}
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The VPS-side reviewed promoter independently certifies new release,
          # operator activation SHA, economics, STOPs, pending orders, shared
          # risk and rollback. This workflow NEVER writes approval artifacts or
          # changes units/symlinks itself. No promoter installed -> FAIL CLOSED.
          ssh -i "$HOME/.ssh/q102_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$USER@$HOST" \
            "sudo -n /usr/local/sbin/disdex-q102-owner-approved-promote '$TARGET_SHA' '$EXPECTED_LIVE_SHA'"
