name: Formal five BT FRED/ECB source connectivity via readonly VPS
on:
  push:
    branches: [research/formal-five-bt-handoff-completion-20260927]
    paths: [.github/workflows/formal-five-bt-fx-connectivity-probe-20260927.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - name: Configure pinned root SSH for readonly public-data test
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          d=pathlib.Path.home()/".ssh"
          def norm(k):return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (d/"id_root").write_text(norm("ROOT_KEY"))
          (d/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
      - name: Query public official FX endpoints only, print status and hash not prices
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' <<'PY'
          import urllib.request,urllib.error,hashlib,json,time
          urls={
          "FRED":"https://fred.stlouisfed.org/graph/fredgraph.csv?id=DEXJPUS&cosd=2025-01-01&coed=2026-08-11",
          "ECB":"https://data-api.ecb.europa.eu/service/data/EXR/D.JPY+USD.EUR.SP00.A?startPeriod=2025-01-01&endPeriod=2026-08-11&format=csvdata",
          }
          for name,url in urls.items():
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 DisDex-public-FX-audit/1.0"})
              with urllib.request.urlopen(request,timeout=22) as r:
                b=r.read(3_000_000)
                print("FX_READONLY_SOURCE",json.dumps({"source":name,"http":r.status,
                  "bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),
                  "csv_header":b.splitlines()[0][:170].decode("utf-8-sig","replace"),
                  "rows":len(b.splitlines())-1},sort_keys=True))
            except Exception as e:
              print("FX_READONLY_SOURCE",json.dumps({"source":name,"error":type(e).__name__,
                "http":e.code if isinstance(e,urllib.error.HTTPError) else None},sort_keys=True))
          print("VPS_FX_PROBE_FINISHED READ_ONLY=TRUE LIVE_ORDERS=0")
          PY
