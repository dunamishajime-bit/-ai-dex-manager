name: DisDex Health Snapshot Pin Consolidation

on:
  pull_request:
    paths:
      - 'scripts/ops/deploy/disdex_health_pin_consolidation.py'
      - '.github/workflows/disdex-health-pin-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and verify monitoring-only contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=scripts/ops/deploy/disdex_health_pin_consolidation.py
          python3 -m py_compile "$FILE"
          grep -Fq 'SERVICE="disdex-runner-health-snapshot.service"' "$FILE"
          grep -Fq 'EnvironmentFile=' "$FILE"
          grep -Fq 'tradingEffects' "$FILE"
          grep -Fq '"ordersSent":0' "$FILE"
          grep -Fq '"cancelsSent":0' "$FILE"
          grep -Fq '"positionChangesSent":0' "$FILE"
          ! grep -Eq 'place(Order|MarketOrder|ConditionalOrder|StopMarketOrder)|cancelOrder|setLeverage|setMarginType|reduceOnly' "$FILE"
          ! grep -Eq 'systemctl.*(start|restart).*(v12-v4|pengu|hype|idle|quality102|v52|fet|shared-crypto-risk|margin-guard)' "$FILE"
          echo HEALTH_PIN_CONSOLIDATION_STATIC_AUDIT=PASS
          echo TRADING_MUTATION_CODE=0

  apply:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'dunamishajime-bit'
    needs: validate
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned root SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/health-pin-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/health-pin-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/health-pin-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/health-pin-ssh/"*

      - name: Upload monitoring-only helper
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          scp -i "$RUNNER_TEMP/health-pin-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/health-pin-ssh/known_hosts"             -P "$PORT" scripts/ops/deploy/disdex_health_pin_consolidation.py             "root@$HOST:/tmp/disdex_health_pin_consolidation.$GITHUB_RUN_ID.py"

      - name: Read-only preview
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -T -i "$RUNNER_TEMP/health-pin-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/health-pin-ssh/known_hosts"             -p "$PORT" "root@$HOST"             "python3 /tmp/disdex_health_pin_consolidation.$GITHUB_RUN_ID.py"

      - name: Apply consolidated health-snapshot pins
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -T -i "$RUNNER_TEMP/health-pin-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/health-pin-ssh/known_hosts"             -p "$PORT" "root@$HOST"             "python3 /tmp/disdex_health_pin_consolidation.$GITHUB_RUN_ID.py --apply"

      - name: Exact monitoring postflight
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -T -i "$RUNNER_TEMP/health-pin-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/health-pin-ssh/known_hosts"             -p "$PORT" "root@$HOST"             "python3 -c 'import json; p=json.load(open("/etc/disdex/runner-pins.json"))["runners"]; h=json.load(open("/var/lib/disdex/runner-health/current.json")); rp=h["runnerPins"]; assert all(rp[k]["expectedSha"]==v["sha"] and rp[k]["serviceUnit"]==v["serviceUnit"] and rp[k]["releaseRoot"]==v["releaseRoot"] for k,v in p.items() if k in rp); e=h.get("tradingEffects",{}); assert all(int(e.get(k,0))==0 for k in ("ordersSent","cancelSent","positionChangesSent")); print("HEALTH_PIN_POSTFLIGHT=PASS"); print("ORDERS_SENT=0"); print("CANCELS_SENT=0"); print("POSITION_CHANGES_SENT=0")'"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set +e
          PORT="${PORT:-22}"
          if [[ -s "$RUNNER_TEMP/health-pin-ssh/key" && -n "$HOST" ]]; then
            ssh -T -i "$RUNNER_TEMP/health-pin-ssh/key"               -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes               -o UserKnownHostsFile="$RUNNER_TEMP/health-pin-ssh/known_hosts"               -p "$PORT" "root@$HOST"               "rm -f -- /tmp/disdex_health_pin_consolidation.$GITHUB_RUN_ID.py" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/health-pin-ssh"
