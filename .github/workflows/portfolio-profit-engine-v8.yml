name: Portfolio Profit Engine V8

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_portfolio_profit_engine_v8.py
      - research/RESEARCH_PERFORMANCE_CHARTER_20260816.md
      - .github/workflows/portfolio-profit-engine-v8.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen research base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_pairwise_clean_sheet_3y.py)" = "65419f4d0699f07366dea89385bc571a35e1d211"
          echo FROZEN_RESEARCH_BASE_PASS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore exact 3Y research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811
            pair-specific-v104-exact-usdm-v3-20260810

      - name: Check exact inputs
        id: exact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('.cache/perp-research-usdm/consolidated')
          symbols = ('BTC','SOL','LINK','ETH','BNB','AVAX')
          required = [root / f'{s}USDT-1661990400000-1782864000000-v3.json' for s in symbols]
          ready = all(p.is_file() for p in required)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n")
          print('EXACT_CACHE_READY' if ready else 'EXACT_CACHE_MISS')
          PY

      - name: Install prefetch dependencies
        if: steps.exact.outputs.ready != 'true'
        run: npm ci

      - name: Prefetch genuine Binance USD-M history
        if: steps.exact.outputs.ready != 'true'
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts

      - name: Verify exact consolidated inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.cache/perp-research-usdm/consolidated')
          symbols = ('BTC','SOL','LINK','ETH','BNB','AVAX')
          missing = [str(root / f'{s}USDT-1661990400000-1782864000000-v3.json') for s in symbols if not (root / f'{s}USDT-1661990400000-1782864000000-v3.json').is_file()]
          if missing:
              raise SystemExit('MISSING_EXACT_CONSOLIDATED_INPUTS:' + ','.join(missing))
          print('EXACT_CONSOLIDATED_INPUTS_PASS')
          PY

      - name: Compile V8 harness
        run: python -m py_compile scripts/research_pairwise_clean_sheet_3y.py scripts/research_portfolio_profit_engine_v8.py

      - name: Run V8 portfolio engine
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_portfolio_profit_engine_v8.py

      - name: Assert research-only fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.research-state/portfolio-profit-engine-v8.json').read_text())
          assert d['researchOnly'] is True
          assert d['productionChanged'] is False
          assert d['vpsChanged'] is False
          assert d['liveChanged'] is False
          assert d['realTradingEnabled'] is False
          assert d['liveEligible'] is False
          assert d['freshOosRead'] is False
          assert d['freshOosConsumed'] is False
          assert d['target']['main3YCagrPct'] == 100.0
          assert d['target']['grossExposureCapPct'] == 100.0
          assert d['target']['leverageMultiplier'] == 1.0
          assert d['antiOverfit']['parameterGrid'] is False
          assert d['antiOverfit']['sameRunRetuning'] is False
          assert d['antiOverfit']['validationUsedForSelection'] is False
          assert d['antiOverfit']['evaluationUsedForSelection'] is False
          assert d['antiOverfit']['leverageUsedToReachTarget'] is False
          print('V8_RESEARCH_ONLY_FAIL_CLOSED_PASS')
          PY

      - name: Upload V8 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-profit-engine-v8
          path: |
            .research-state/portfolio-profit-engine-v8.json
            .research-state/portfolio-profit-engine-v8-trades.jsonl
          if-no-files-found: warn
          retention-days: 30
