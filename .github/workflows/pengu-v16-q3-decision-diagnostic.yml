name: PENGU V16 Q3 Decision Diagnostic

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'V16_Q3_DECISION_DIAGNOSTIC.md'
      - 'scripts/research_pengu_v16_q3_decision_diagnostic.py'
      - '.github/workflows/pengu-v16-q3-decision-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Trace frozen V16 Gate Q3 decision
        run: python scripts/research_pengu_v16_q3_decision_diagnostic.py
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-v16-q3-decision-diagnostic/diagnostic.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['diagnosticOnly'] is True
          assert x['candidate']=='COUNTERWIND_RELATIVE_THESIS_PROBATION'
          assert x['preRegistrationSha']=='1528d182ad3593460d325e2c1e1f6bacf0b07795'
          assert x['venue']=='Gate'
          assert x['targetEntryTs']==1771560000000
          assert x['kucoinPerformanceObserved'] is False
          assert len(x['results'])==2
          assert {r['mode'] for r in x['results']}=={'NORMAL','STRESS'}
          allowed={'RESUME','RELATIVE_COST_FLOOR','DEADLINE','ORIGINAL_EXIT'}
          assert all(r['decisionReason'] in allowed for r in x['results'])
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'decisions':{r['mode']:r['decisionReason'] for r in x['results']},'kucoinPerformanceObserved':x['kucoinPerformanceObserved'],'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v16-q3-decision-diagnostic-${{ github.run_id }}
          path: .research-state/pengu-v16-q3-decision-diagnostic
          if-no-files-found: error
