name: Active3 V139 Role Redefinition

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_active3_v139_role_redefinition.py"
      - ".github/workflows/active3-v139.yml"

permissions:
  contents: read

concurrency:
  group: active3-v139-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate:
          - eth_relative_leadership_pulse_v9
          - bnb_tactical_consensus_transition_v9
          - avax_volatility_reset_event_v9
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_active3_v139_role_redefinition.py
      - name: Run V139 role candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active3_v139_role_redefinition.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active3-v139-${{ matrix.candidate }}
          path: |
            .research-state/active3-v139-${{ matrix.candidate }}.json
            .research-state/active3-v139-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only ETH/BNB/AVAX role redefinition.
# Development/Validation only; Confirmation/Holdout untouched.
# BTC/SOL/LINK and production/live/VPS/.env/credentials/orders/accounts/positions untouched.
