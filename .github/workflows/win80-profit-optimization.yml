name: Win80 Profit Optimization Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research-lab-main-strategy-profit-optimizer.ts"
      - "lib/research-lab/perp/**"
      - "lib/cycle-strategy.ts"
      - "lib/win80-ultra90-main-strategy.ts"
      - "config/**"
      - "package.json"
      - ".github/workflows/win80-profit-optimization.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research-lab-main-strategy-profit-optimizer.ts"
      - "lib/research-lab/perp/**"
      - "lib/cycle-strategy.ts"
      - "lib/win80-ultra90-main-strategy.ts"
      - "config/**"
      - "package.json"
      - ".github/workflows/win80-profit-optimization.yml"

permissions:
  contents: read

concurrency:
  group: win80-profit-optimization-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: win80-profit-v1-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            usdm-snapshot-v2-
            autonomous-usdm-v2-
            champion-deep-usdm-v1-
            related-logic-usdm-v1-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Main strategy policy self-test
        run: npm run strategy:main:selftest

      - name: Optimize entry timestamp lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path("scripts/research-lab-main-strategy-profit-optimizer.ts")
          text = target.read_text(encoding="utf-8")
          old = 'const entryIndex = candles.findIndex((candle) => candle.ts === event.entryTs);'
          new = 'const entryIndex = indexAtOrBefore(candles, event.entryTs);'
          if old not in text:
              raise SystemExit("entry lookup patch target not found")
          target.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Run chronological profit optimization
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: npm run research:main-strategy:profit-optimize

      - name: Upload optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win80-profit-optimization-v1
          path: |
            .research-state/win80-profit-optimization-v1.json
            .research-state/win80-profit-optimization-v1.md
          if-no-files-found: warn
          retention-days: 30
