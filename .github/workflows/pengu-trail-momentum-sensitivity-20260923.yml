name: PENGU Trail Momentum Sensitivity
on:
  push:
    branches:
      - research/pengu-continuation-reentry-20260923
    paths:
      - scripts/research_pengu_trail_momentum_sensitivity_20260923.ts
      - .github/workflows/pengu-trail-momentum-sensitivity-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    strategy:
      fail-fast: false
      matrix:
        venue: [ASTER, BITGET, OKX, GATE]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run momentum threshold grid
        env:
          PENGU_CROSS_VENUE: ${{ matrix.venue }}
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_trail_momentum_sensitivity_20260923.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-trail-momentum-grid-${{ matrix.venue }}
          path: .research-state/pengu-trail-momentum-grid-${{ matrix.venue == 'ASTER' && 'aster' || matrix.venue == 'BITGET' && 'bitget' || matrix.venue == 'OKX' && 'okx' || 'gate' }}
          retention-days: 90
