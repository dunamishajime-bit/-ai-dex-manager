name: PENGU Recovery Holdout Attribution
on:
  workflow_dispatch:
  push:
    branches: [research/pengu-v82-composite-regime-20260827]
    paths:
      - 'scripts/research_patch_pengu_recovery_attribution.py'
      - '.github/workflows/pengu-recovery-attribution.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: pengu-recovery-attribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: a76fd7aaa0788209532a5a2c6489135dd8e4a27e, path: .pengu-current, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reproduce selected candidate and attribute holdout
        env:
          PRODUCTION_SOURCE_SHA: a76fd7aaa0788209532a5a2c6489135dd8e4a27e
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.pengu-current/tsconfig.pengu-dual-ls-v2.json
          PENGU_DIAG_OUTPUT_DIR: ${{ github.workspace }}/.research-state/pengu-recovery-attribution
        run: |
          npm ci
          ln -s ../node_modules .pengu-current/node_modules
          python -m py_compile scripts/research_patch_pengu_missed_opportunity_map.py scripts/research_patch_pengu_directional_wave_map.py scripts/research_patch_pengu_recovery_study.py scripts/research_patch_pengu_recovery_backtest.py scripts/research_patch_pengu_recovery_backtest_fold_fix.py scripts/research_patch_pengu_recovery_attribution.py
          python scripts/research_generate_pengu_v57_from_v56.py
          python scripts/research_patch_v57_replacement_audit.py
          python scripts/research_patch_v57_economic_winner_guard.py
          python scripts/research_patch_v64_supplemental_sizing.py
          python scripts/research_patch_pengu_missed_opportunity_map.py
          python scripts/research_patch_pengu_directional_wave_map.py
          python scripts/research_patch_pengu_recovery_study.py
          python scripts/research_patch_pengu_recovery_backtest.py
          python scripts/research_patch_pengu_recovery_backtest_fold_fix.py
          python scripts/research_patch_pengu_recovery_attribution.py
          npx tsx .pengu-current/scripts/.research_pengu_v57.generated.ts
      - name: Verify and print Fold3 attribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/pengu-recovery-attribution/missed-opportunity-map.json').read_text())
          assert x['v64']['trades']==41 and abs(x['v64']['metrics']['returnPct']-303.9903920953809)<1e-9
          a=x['recoveryAttribution']; assert a['schema']=='pengu-recovery-attribution/v1' and a['available']
          assert a['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          f=a['folds']['FOLD3']
          print('FOLD3_ATTRIBUTION='+json.dumps({'cfg':a['selectedConfig'],'baseline':f['baseline'],'candidate':f['candidate'],'recovery':{'count':f['recovery']['count'],'metrics':f['recovery']['metrics'],'sumAccountReturnPct':f['recovery']['sumAccountReturnPct']},'displacedBaseline':{'count':f['displacedBaseline']['count'],'metrics':f['displacedBaseline']['metrics'],'sumAccountReturnPct':f['displacedBaseline']['sumAccountReturnPct']},'addedNonRecovery':{'count':f['addedNonRecovery']['count'],'metrics':f['addedNonRecovery']['metrics'],'sumAccountReturnPct':f['addedNonRecovery']['sumAccountReturnPct']},'recoveryTrades':f['recovery']['trades'],'displacedTrades':f['displacedBaseline']['trades']},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-recovery-attribution-${{ github.run_id }}
          path: .research-state/pengu-recovery-attribution
          include-hidden-files: true
          retention-days: 90
