name: Formal BT Aster Stock Hourly Coverage
on:
  workflow_dispatch:
  push:
    branches: [codex/formal-five-logic-bt-20260926]
    paths:
      - ".github/workflows/formal-five-bt-aster-stock-coverage.yml"
permissions:
  contents: read
jobs:
  official-public-aster-stock-price-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test strict V52 modeled lifecycle on synthetic market data
        run: python -m unittest discover -s tests/formal_five_bt -p 'test_v52_research_ledger.py' -v
      - name: Fetch exact stock-perpetual listing metadata and historical 1h candles
        run: python -m research.formal_five_bt.aster_stock_acquire --data-root "$RUNNER_TEMP/aster-stock-probe"
      - name: Print only historical availability, no raw prices
        env:
          STOCK_DATA_ROOT: ${{ runner.temp }}/aster-stock-probe
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          doc = json.loads((Path(os.environ["STOCK_DATA_ROOT"]) / "aster-stock-hourly-coverage.json").read_text())
          for ticker, item in sorted(doc["symbols"].items()):
              print(ticker, "status=", item["status"], "listed_from=", item.get("listed_from_ms"),
                    "bars=", item["bars"], "missing_hours=", item.get("missing_hours_after_listing"))
          PY
      - name: Restore exact SHA-matched audited V52 policy (read-only)
        run: |
          git fetch --filter=blob:none --no-tags --depth=1 origin a09ea45ca3cbd72100f9eb0eaae499039c40b6a0
          python -m research.formal_five_bt.restore_snapshot
      - name: Acquire Yahoo historical hourly underlying equity reference in ephemeral space
        run: python -m research.formal_five_bt.yahoo_acquire --output-root "$RUNNER_TEMP/aster-stock-probe"
      - name: Replay full-year strictly causal V50 price-only research candidates
        run: |
          python -m research.formal_five_bt.v52_price_only_scan \
            --data-root "$RUNNER_TEMP/aster-stock-probe" \
            --output-root "$RUNNER_TEMP/aster-stock-v52-model"
      - name: Research-only V52 1-year modeled one-slot entry and exit lifecycle
        run: |
          python -m research.formal_five_bt.v52_research_ledger \
            --data-root "$RUNNER_TEMP/aster-stock-probe" \
            --scan-root "$RUNNER_TEMP/aster-stock-v52-model" \
            --output-root "$RUNNER_TEMP/aster-stock-v52-ledger" \
            --round-trip-cost-bps 11
      - name: Print summary without publishing raw licensed market data
        env:
          RESEARCH_OUTPUT: ${{ runner.temp }}/aster-stock-v52-model
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RESEARCH_OUTPUT"]) / "price-only-scan-manifest.json").read_text())
          print("MODEL:", report["model"])
          print("STATUS:", report["status"])
          print("RUNTIME_SHA:", report["runtime_sha"])
          print("COUNTS:", json.dumps(report["counts"], sort_keys=True))
          print("UNVERIFIED_GATES:", ",".join(report["unverified_gates"]))
          print("PROFIT_METRICS:", report["profit_metrics"])
          modeled = json.loads((Path(os.environ["RESEARCH_OUTPUT"]).parent / "aster-stock-v52-ledger" / "v52-model-summary.json").read_text())
          print("MODELED_V52_LEDGER_STATUS:", modeled["status"])
          print("MODELED_V52_LEDGER_ENTRIES:", modeled["modeled_entries"])
          print("MODELED_V52_LEDGER_CLOSES:", modeled["modeled_closed_trades"])
          print("MODELED_V52_LEDGER_UNRESOLVED:", modeled["unresolved_exit_trades"])
          print("MODELED_V52_LEDGER_SKIPS:", modeled["skipped_reasons"])
          print("MODELED_V52_LEDGER_EXIT_REASONS:", modeled["exit_reasons"])
          print("MODELED_V52_PRICE_ONLY_MEAN_RETURN:", modeled["price_model_closed_trade_mean_return"])
          print("MODELED_V52_PRICE_ONLY_WIN_RATE:", modeled["price_model_closed_trade_win_rate"])
          print("VERIFIED_FIVE_LOGIC_PROFIT: NOT_VERIFIABLE")
          PY
