name: DisDex five-logic entry audit (read-only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event.issue.number == 132 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'DISDEX_FIVE_LOGIC_ENTRY_AUDIT_READONLY_20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - name: Configure approved VPS read-only transport
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
      - name: Inspect real five-logic decision and account path without mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' <<'PY'
          import collections,datetime,json,os,pathlib,re,shutil,subprocess,time
          NOW=int(time.time()*1000)
          ROOT=pathlib.Path("/var/lib/disdex")
          release=pathlib.Path("/home/deploy/disdex-trading/current").resolve()
          sha=(release/".disdex-release-sha").read_text().strip()
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          assert release==pathlib.Path("/home/deploy/disdex-trading/releases")/sha
          def run(cmd,timeout=18):
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=timeout)
                  return p.returncode,p.stdout,p.stderr
              except Exception as e:
                  return -1,"",type(e).__name__
          def load(p):
              try:
                  if not p.is_file(): return None
                  v=json.loads(p.read_text())
                  return v if isinstance(v,dict) else None
              except Exception: return {"PARSE_ERROR":True}
          def stamp(v):
              try:
                  n=float(v)
                  if n<10**11:n*=1000
                  return datetime.datetime.fromtimestamp(n/1000,datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M:%S JST")
              except Exception:return None
          print("AUDIT_AT_JST="+stamp(NOW))
          print("EXACT_CURRENT_SHA="+sha)
          d=shutil.disk_usage("/")
          print("DISK_USAGE_PERCENT="+str(round((d.total-d.free)/d.total*100,2)))
          print("DISK_FREE_GB="+str(round(d.free/1e9,3)))
          names=[
              "disdex-v12-x1-all","disdex-pengu-dual-ls-v2",
              "disdex-quality102-causal-v1","disdex-fet-brk48",
              "disdex-v52-aster-only","disdex-shared-crypto-risk",
              "disdex-v12-v52-margin-guard"
          ]
          for name in names:
              unit=name+"@"+sha+".service"
              _,show,_=run(["systemctl","show",unit,"-p","ActiveState","-p","SubState","-p","MainPID","-p","NRestarts","-p","Result","--no-pager"])
              fields=dict(y.split("=",1) for y in show.splitlines() if "=" in y)
              rc,raw,_=run(["journalctl","-u",unit,"--since","48 hours ago","-n","350","--no-pager","-o","cat"],timeout=24)
              event=[]
              for line in raw.splitlines():
                  idx=line.find("{")
                  if idx<0:continue
                  try:obj=json.loads(line[idx:])
                  except Exception:continue
                  if not isinstance(obj,dict):continue
                  state=obj.get("status") or obj.get("stage") or obj.get("event") or obj.get("level")
                  if not state:continue
                  reason=obj.get("reason") or obj.get("message") or ""
                  if isinstance(reason,dict):reason=str(reason.get("code") or "")
                  if not isinstance(reason,str):reason=""
                  event.append({"time":obj.get("timestamp") or obj.get("observedAt") or obj.get("updatedAt"),
                                "status":str(state)[:65],"reason":reason[:130],
                                "signal_side":(obj.get("signal") or {}).get("side") if isinstance(obj.get("signal"),dict) else None,
                                "ordersSent":obj.get("ordersSent"),
                                "newOrdersAllowed":obj.get("newOrdersAllowed")})
              stats=collections.Counter(x["status"] for x in event)
              anomalies=[x for x in event if x["status"] not in ["no-signal","no-change","HEALTHY","v52-market-closed","shared-risk-refresh"]]
              print("UNIT_SUMMARY="+json.dumps({"unit":name,"systemd":fields,"eventsLast350":stats,
                      "latest":event[-2:],"anomalies":anomalies[-4:]},ensure_ascii=False,default=str))
          states=[
              ("v12",ROOT/"v12-x1-all/runner.json"),
              ("v12_decisions",ROOT/"v12-x1-all/decision-snapshot.json"),
              ("pengu",ROOT/"pengu-dual-ls-v2/runner-live.json"),
              ("q102",ROOT/"quality102-causal-v1/state.json"),
              ("fet",ROOT/"fet-brk48-residual/state.json"),
              ("v52",ROOT/"v52-aster-only/runner-live.json"),
              ("shared_risk",ROOT/"shared/crypto-daily-risk.json"),
              ("dd_governor",ROOT/"shared/portfolio-dd-governor.json"),
              ("kill_switch",ROOT/"shared/kill-switch.json"),
              ("account_lock",ROOT/"shared/account-order.lock"),
              ("rate_budget",ROOT/"shared/aster-rate-budget.json"),
          ]
          for label,path in states:
              obj=load(path)
              if obj is None:
                  print("STATE="+json.dumps({"label":label,"exists":False}));continue
              mtime=stamp(path.stat().st_mtime) if path.is_file() else None
              keys=["schema","strategyId","mode","runtimeCommitSha","updatedAt","lastProcessedReferenceTs",
                    "lastSignalReferenceTs","lastReferenceTs","lastReconciledAt","lastError","manualReview",
                    "reason","status","stage","active","sourceComplete","tripped","currentDrawdownPct",
                    "lastRateLimitStatus","cooldownUntil","nextAllowedAt","acquiredAt","expiresAt",
                    "signalTs","referenceTs","regime","btcRegime","btcRegimeState","lastUpdatedAt"]
              summary={k:obj.get(k) for k in keys if k in obj}
              for key in ["position","pending"]:
                  if isinstance(obj.get(key),dict):
                      summary[key]={k:obj[key][k] for k in ["action","symbol","side","gross","targetGross","createdAt","updatedAt","phase","reason","lastError"] if k in obj[key]}
              for key in ["activePositions","positions","reservations","failures"]:
                  if isinstance(obj.get(key),list):summary[key+"Count"]=len(obj[key])
              if label=="pengu":
                  s=obj.get("latestSignal")
                  if isinstance(s,dict):
                      summary["latestSignal"]={k:s.get(k) for k in ["referenceTs","side","targetGross","reason"]}
                      feats=s.get("features")
                      if isinstance(feats,dict):
                          summary["latestFeatures"]={k:feats.get(k) for k in ["penguReturn24h","penguReturn72h","btcReturn24h","relativeReturn24h","volumeRatio","rsi"] if k in feats}
                  ov=obj.get("riskOverlay")
                  if isinstance(ov,dict):summary["riskOverlayKeys"]=list(ov.keys())[:14]
              if label=="v12_decisions":
                  summary["topLevelKeys"]=list(obj.keys())[:25]
                  cand=obj.get("candidates")
                  if isinstance(cand,list):
                      summary["candidateCount"]=len(cand)
                      summary["candidates"]=[{k:y.get(k) for k in ["symbol","side","score","signalEligible","signalReason","reason","entryGateReason","volumeRatio","momentum"] if k in y} for y in cand[:20] if isinstance(y,dict)]
                      summary["rejectionCounts"]=dict(collections.Counter(str(y.get("signalReason")) for y in cand if isinstance(y,dict) and not y.get("signalEligible")))
              print("STATE="+json.dumps({"label":label,"exists":True,"mtimeJST":mtime,"value":summary},ensure_ascii=False,default=str))
          # Focused gate diagnostics: whitelist operational fields only.
          pengu=load(ROOT/"pengu-dual-ls-v2/runner-live.json") or {}
          overlay=pengu.get("riskOverlay") if isinstance(pengu.get("riskOverlay"),dict) else {}
          untils=overlay.get("routeQuarantineUntilTs") if isinstance(overlay.get("routeQuarantineUntilTs"),dict) else {}
          failures=pengu.get("failures") if isinstance(pengu.get("failures"),list) else []
          print("PENGU_RISK_DETAIL="+json.dumps({
              "realizedDrawdown":overlay.get("realizedDrawdown"),
              "globalEntryHoldUntilJST":stamp(overlay.get("globalEntryHoldUntilTs")),
              "globalHoldActive":float(overlay.get("globalEntryHoldUntilTs") or 0)>NOW,
              "routeQuarantine":{k:{"untilJST":stamp(v),"active":float(v or 0)>NOW} for k,v in untils.items()},
              "last10Failures":[{"at":stamp(y.get("occurredAt") or y.get("timestamp")),"message":str(y.get("message") or y.get("reason") or "")[:120]} for y in failures[-10:] if isinstance(y,dict)]
          },ensure_ascii=False,default=str))
          for label,filename in [("base","decision-snapshot.json"),("ranked","decision-ranking-snapshot.json")]:
              p=ROOT/"quality102-causal-v1"/filename
              obj=load(p)
              if obj is None:
                  print("Q102_DECISIONS="+json.dumps({"source":label,"exists":False}))
                  continue
              items=obj.get("items") if isinstance(obj.get("items"),list) else []
              reasonCounts=collections.Counter(str(x.get("reason")) for x in items if isinstance(x,dict))
              eligible=[x for x in items if isinstance(x,dict) and x.get("eligible")]
              selected=[x for x in items if isinstance(x,dict) and x.get("selected")]
              ranked=sorted([x for x in items if isinstance(x,dict)],key=lambda x:float(x.get("rankingRank") or 9999))
              fields=["symbol","side","family","layer","eligible","reason","selected","requestedGross","rankingRank","rankingScore","rankingStage","rankingReason"]
              print("Q102_DECISIONS="+json.dumps({"source":label,"mtimeJST":stamp(p.stat().st_mtime),
                  "runtimeSha":obj.get("runtimeCommitSha"),"referenceJST":stamp(obj.get("referenceTs")),
                  "selectedReason":obj.get("selectedReason"),"selectedSymbol":obj.get("selectedSymbol"),
                  "itemCount":len(items),"eligibleCount":len(eligible),"selectedCount":len(selected),
                  "reasonCounts":reasonCounts,
                  "eligible":[{k:x.get(k) for k in fields if k in x} for x in eligible[:15]],
                  "rankedTop8":[{k:x.get(k) for k in fields if k in x} for x in ranked[:8]]},ensure_ascii=False,default=str))
          qdir=ROOT/"quality102-causal-v1"
          if qdir.is_dir():
              files=[]
              for p in qdir.rglob("*.json"):
                  if len(p.parts)-len(qdir.parts)>3:continue
                  if any(x in p.name.lower() for x in ["decision","selector","snapshot","rank"]):
                      files.append({"file":str(p.relative_to(qdir)),"mtimeJST":stamp(p.stat().st_mtime)})
              print("Q102_OBSERVABILITY_FILES="+json.dumps(files[:20]))
          lock=ROOT/"shared/account-order.lock"
          print("ACCOUNT_LOCK_PRESENT="+str(lock.exists()))
          print("TRADING_MUTATION=0")
          print("FIVE_LOGIC_ENTRY_AUDIT_COMPLETE")
          PY

      - name: Reconcile actual Aster orders, state permissions, and disk without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' <<'PY'
          import collections,json,os,pathlib,re,stat,subprocess
          release=pathlib.Path("/home/deploy/disdex-trading/current").resolve()
          sha=(release/".disdex-release-sha").read_text().strip()
          assert re.fullmatch("[0-9a-f]{40}",sha)
          unit="disdex-v12-x1-all@"+sha+".service"
          r=subprocess.run(["systemctl","show",unit,"-p","MainPID","--value"],capture_output=True,text=True,check=True)
          pid=int(r.stdout.strip())
          env={}
          raw=pathlib.Path("/proc/"+str(pid)+"/environ").read_bytes()
          for item in raw.split(b"\0"):
              if b"=" in item:
                  a,b=item.split(b"=",1)
                  key=a.decode("utf-8","replace")
                  if key in ["ASTER_FUTURES_BASE_URL","ASTER_USER_ADDRESS","ASTER_API_PRIVATE_KEY",
                             "ASTER_REQUEST_TIMEOUT_MS","ASTER_RECV_WINDOW_MS",
                             "DISDEX_ASTER_GLOBAL_RATE_BUDGET_PATH","DISDEX_ASTER_GLOBAL_RATE_MIN_INTERVAL_MS",
                             "DISDEX_ASTER_GLOBAL_RATE_MAX_QUEUE_MS","PATH","HOME"]:
                      env[key]=b.decode("utf-8","replace")
          env.setdefault("PATH","/usr/local/bin:/usr/bin:/bin")
          env.setdefault("HOME","/home/deploy")
          env["NODE_ENV"]="production"
          print("ASTER_READONLY_DIAGNOSTIC_CREDENTIALS_AVAILABLE="+str(bool(env.get("ASTER_API_PRIVATE_KEY") and env.get("ASTER_USER_ADDRESS"))))
          if env.get("ASTER_API_PRIVATE_KEY") and env.get("ASTER_USER_ADDRESS"):
              script=release/"scripts/disdex-aster-readonly-account-diagnostic.ts"
              tsx=release/"node_modules/.bin/tsx"
              try:
                  result=subprocess.run([str(tsx),str(script)],cwd=release,env=env,capture_output=True,text=True,timeout=70)
                  obj=None
                  for line in reversed(result.stdout.splitlines()):
                      try:
                          d=json.loads(line)
                          if isinstance(d,dict) and d.get("status","").startswith("ASTER_READONLY_ACCOUNT_DIAGNOSTIC_"):
                              obj=d;break
                      except Exception:pass
                  if obj and result.returncode==0 and obj.get("status")=="ASTER_READONLY_ACCOUNT_DIAGNOSTIC_PASS":
                      positions=obj.get("positions",[])
                      orders=obj.get("openOrders",[])
                      balances=obj.get("usdtBalance",[])
                      available=all(float(b.get("availableBalance") or 0)>=0 for b in balances)
                      order_types=dict(collections.Counter(str(x.get("type")) for x in orders if isinstance(x,dict)))
                      print("ASTER_ACCOUNT_PROOF="+json.dumps({
                          "pass":True,"positionsCount":len(positions),"openOrdersCount":len(orders),
                          "availableBalanceNonNegative":available,"orderTypes":order_types,
                          "nonReduceOnlyOpenOrders":sum(x.get("reduceOnly") is False for x in orders if isinstance(x,dict)),
                          "ordersSent":obj.get("ordersSent"),"cancelsSent":obj.get("cancelsSent"),
                          "positionChangesSent":obj.get("positionChangesSent")}))
                  else:
                      print("ASTER_ACCOUNT_PROOF="+json.dumps({
                          "pass":False,"errorType":"READONLY_DIAGNOSTIC_NONZERO_OR_MISSING_RESULT",
                          "returncode":result.returncode,
                          "stderrCategories":dict(collections.Counter(
                              w for w in ["RATE_BUDGET","429","418","TIMEOUT","EACCES","CREDENTIALS"]
                              if w in result.stderr.upper()))}))
              except Exception as exc:
                  print("ASTER_ACCOUNT_PROOF="+json.dumps({"pass":False,"errorType":type(exc).__name__}))
          paths=["/var/lib/disdex/shared/kill-switch.json",
                 "/var/lib/disdex/shared/crypto-daily-risk.json",
                 "/var/lib/disdex/quality102-causal-v1/state.json",
                 "/var/lib/disdex/v12-x1-all/runner.json",
                 "/var/lib/disdex/pengu-dual-ls-v2/runner-live.json"]
          for s in paths:
              p=pathlib.Path(s)
              if not p.exists():print("READ_PERMISSIONS="+json.dumps({"file":s,"exists":False}));continue
              st=p.stat()
              chk=subprocess.run(["runuser","-u","deploy","--","test","-r",s],capture_output=True)
              print("READ_PERMISSIONS="+json.dumps({"file":s,"mode":oct(stat.S_IMODE(st.st_mode)),"uid":st.st_uid,"gid":st.st_gid,
                  "deployCanRead":chk.returncode==0}))
          qpath=pathlib.Path("/var/lib/disdex/quality102-causal-v1/state.json")
          try:
              q=json.loads(qpath.read_text())
              fs=q.get("failures",[])
              last=[{"timestamp":y.get("occurredAt"),"type":str(y.get("message") or "")[:125]} for y in fs[-8:] if isinstance(y,dict)]
              print("Q102_FAILURE_HISTORY="+json.dumps({"failureCount":len(fs),"last8":last}))
          except Exception as exc:print("Q102_FAILURE_HISTORY="+json.dumps({"errorType":type(exc).__name__}))
          try:
              disk=subprocess.run(["du","-x","-B1","--max-depth=1","/home/deploy","/var/lib/disdex","/var/log"],
                  capture_output=True,text=True,timeout=45)
              dirs=[]
              for l in disk.stdout.splitlines():
                  v,_,p=l.partition("\t")
                  if v.isdigit():dirs.append({"path":p,"gb":round(int(v)/1e9,3)})
              print("DISK_TOP_DIRECTORIES="+json.dumps(sorted(dirs,key=lambda x:-x["gb"])[:13]))
          except Exception as exc:print("DISK_TOP_DIRECTORIES="+json.dumps({"errorType":type(exc).__name__}))
          print("ACCOUNT_PERMISSIONS_DISK_MUTATION=0")
          PY

      - name: Independently cross-check V12 Aster completed H2 volume ratios
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,urllib.parse,urllib.request
          target=1790409600000
          for symbol in ("BTCUSDT","LTCUSDT","ATOMUSDT"):
              args=urllib.parse.urlencode({"symbol":symbol,"interval":"1h","limit":140})
              url="https://fapi.asterdex.com/fapi/v3/klines?"+args
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"DisDex-Independent-ReadOnly-Volume-Audit/1.0"})
                  with urllib.request.urlopen(req,timeout=13) as response: raw=json.load(response)
                  by={int(r[0]):r for r in raw if isinstance(r,list) and len(r)>=7}
                  volumes={}
                  for start in sorted(k for k in by if k%7200000==0 and k+3600000 in by):
                      end=start+7200000
                      if end<=target:volumes[end]=float(by[start][5])+float(by[start+3600000][5])
                  ends=sorted(volumes)
                  prior=[volumes[e] for e in ends if e<target][-20:]
                  matched=target in volumes and len(prior)==20
                  result={"symbol":symbol,"referenceUTC":"2026-09-26T08:00:00Z","matched":matched,"historicalH2Count":len(ends),"prior20Count":len(prior)}
                  if matched:
                      result.update({"currentH2Volume":volumes[target],"prior20Mean":sum(prior)/20,
                                     "recomputedVolumeRatio":volumes[target]/(sum(prior)/20) if sum(prior)>0 else None})
                  print("INDEPENDENT_ASTER_VOLUME="+json.dumps(result))
              except Exception as exc:print("INDEPENDENT_ASTER_VOLUME="+json.dumps({"symbol":symbol,"error":type(exc).__name__+":"+str(exc)[:120]}))
          print("INDEPENDENT_ASTER_NO_PRODUCTION_MUTATION=TRUE")
          PY