name: Pairwise Final V96 Lineage

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_pairwise_final_v96_lineage.py"
      - ".github/workflows/pairwise-final-v96-lineage.yml"

permissions:
  contents: read

concurrency:
  group: pairwise-final-v96-lineage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pair: [SOL, LINK, ETH, BNB, AVAX]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || { echo FROZEN_V109_SOURCE_DRIFT >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_pairwise_final_v96_lineage.py
      - name: Run final D/V lineage candidate
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_pairwise_final_v96_lineage.py --pair "${{ matrix.pair }}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair }}-final-v96-lineage
          path: .research-state/${{ matrix.pair == 'SOL' && 'sol' || matrix.pair == 'LINK' && 'link' || matrix.pair == 'ETH' && 'eth' || matrix.pair == 'BNB' && 'bnb' || 'avax' }}-final-v96-lineage.json
          if-no-files-found: warn
          retention-days: 30

# BTC remains available to the feature engine as reference data, but no BTC trading job exists.
# Confirmation/Holdout remain untouched. Research only; no Production/LIVE/VPS changes.
