name: DisDex VPS Direct IP Bootstrap CI

on:
  pull_request:
    paths:
      - 'scripts/ops/windows/bootstrap-disdex-github-actions-vps-control-direct-ip.ps1'
      - 'scripts/ops/windows/bootstrap-disdex-v12-live-repair-git-metadata.ps1'
      - 'scripts/ops/windows/resume-disdex-v12-live-after-local-probe.ps1'
      - '.github/workflows/disdex-vps-direct-ip-bootstrap-ci.yml'

permissions:
  contents: read

jobs:
  direct-ip-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse wrappers
        shell: powershell
        run: |
          $paths = @(
            'scripts/ops/windows/bootstrap-disdex-github-actions-vps-control-direct-ip.ps1',
            'scripts/ops/windows/bootstrap-disdex-v12-live-repair-git-metadata.ps1',
            'scripts/ops/windows/resume-disdex-v12-live-after-local-probe.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "$path parse failed: $($errors[0].Message)" }
          }

      - name: Execute patch-only path
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ops/windows/bootstrap-disdex-github-actions-vps-control-direct-ip.ps1 -PatchOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Direct IP wrapper safety assertions
        shell: powershell
        run: |
          $p = 'scripts/ops/windows/bootstrap-disdex-github-actions-vps-control-direct-ip.ps1'
          $t = Get-Content $p -Raw
          if ($t -notmatch '162\.43\.50\.223') { throw 'Direct VPS IP missing' }
          if ($t -notmatch 'HostKeyAlias') { throw 'HostKeyAlias missing' }
          if ($t -notmatch 'StrictHostKeyChecking') { throw 'StrictHostKeyChecking assertion missing' }
          if ($t -match '(?m)^\s*(?:&\s*)?(?:ssh-keyscan|ssh-keyscan\.exe)\b') { throw 'ssh-keyscan execution forbidden' }
          if ($t -notmatch 'DISDEX_VPS_KNOWN_HOSTS') { throw 'Pinned known_hosts secret remap missing' }
          if ($t -notmatch 'PatchOnly') { throw 'PatchOnly test gate missing' }
          $redirect = '$installCommand = "bash $remoteInstallScript ''$sourceRepo'' ''$controlSha'' 2>&1"'
          if (-not $t.Contains($redirect)) { throw 'Remote installer stderr normalization missing' }
          if ($t -match '\$ErrorActionPreference\s*=\s*''SilentlyContinue''') { throw 'Global error suppression is forbidden' }

      - name: Git metadata repair boundary assertions
        shell: powershell
        run: |
          $p = 'scripts/ops/windows/bootstrap-disdex-v12-live-repair-git-metadata.ps1'
          $t = Get-Content $p -Raw
          $required = @(
            "`$SourceRepo = '/home/deploy/ai-dex-manager'",
            'TRUSTED_CLONE_GIT_METADATA_REPAIR=PASS',
            'DISDEX_TRUSTED_CLONE_GIT_METADATA_REPAIR_PASS',
            'workingTreeMutation=0',
            'tradingMutation=0',
            'StrictHostKeyChecking=yes',
            'HostKeyAlias=',
            'chown -R deploy:deploy "$repo/.git"',
            'find "$repo/.git" -type d -exec chmod u+rwx {} +',
            'find "$repo/.git" -type f -exec chmod u+rw {} +',
            'runuser -u deploy -- git -C "$repo" fetch --no-tags origin refs/heads/master:refs/remotes/origin/master'
          )
          foreach ($needle in $required) {
            if (-not $t.Contains($needle)) { throw "Missing repair boundary marker: $needle" }
          }
          if ($t.Contains('chown -R deploy:deploy "$repo"')) { throw 'Broad working-tree chown is forbidden' }
          if ($t -match '(?m)^\s*(?:&\s*)?(?:ssh-keyscan|ssh-keyscan\.exe)\b') { throw 'ssh-keyscan execution forbidden' }
          if ($t -match '\$ErrorActionPreference\s*=\s*''SilentlyContinue''') { throw 'Global error suppression is forbidden' }
          if ($t -notmatch 'dunamishajime-bit/-ai-dex-manager') { throw 'Exact trusted origin guard missing' }

      - name: Resume-only path safety assertions
        shell: powershell
        run: |
          $p = 'scripts/ops/windows/resume-disdex-v12-live-after-local-probe.ps1'
          $t = Get-Content $p -Raw
          $required = @(
            'FINAL PINNED resume',
            'Reuses installed constrained control; no Git repair/install',
            'ExpectedControlMasterSha',
            'ExpectedV12Sha',
            'CONTROL_MASTER_PIN=PASS',
            'V12_GREEN_PIN=PASS',
            'FINAL_RESUME_BLOCKED_US_REGULAR_SESSION',
            'DISDEX_VPS_SSH_HOST',
            'DISDEX_VPS_DEPLOY_PRIVATE_KEY',
            'DISDEX_VPS_KNOWN_HOSTS',
            'PROBE_ONLY_NO_TRADING_MUTATION',
            'I_ACKNOWLEDGE_V12_EXACT_SHA_LIVE_ACTIVATION_V3',
            'CONTROL_REQUEST_REUSED_EXACT_PAYLOAD',
            'CONTROL_REQUEST_POSTED',
            'github-actions[bot]',
            'Post-ControlComment',
            'gh api --input sends the pre-constructed UTF-8 JSON file',
            '--method POST',
            '--input $inputPath',
            'UTF8Encoding',
            'gha-probe-',
            'v12-live-',
            'STATUS: LIVE_ACTIVATED_VERIFIED',
            'V96_V12_SIMULTANEOUS_LIVE=FALSE',
            'ORDERS_SENT_FOR_TESTING=0',
            'ARTIFICIAL_LIVE_ORDERS=0',
            'VERIFICATION_SOURCE=GITHUB_ACTIONS_REMOTE_EXACT_MARKERS'
          )
          foreach ($needle in $required) {
            if (-not $t.Contains($needle)) { throw "Missing resume marker: $needle" }
          }
          if ($t -match 'chown|chmod.*\.git|git metadata repair') { throw 'Resume path must not repair Git metadata' }
          if ($t -match 'install-disdex-github-actions-control|disdex-gha-install-vps-control') { throw 'Resume path must not reinstall forced-command control' }
          if ($t -match 'ssh-keyscan') { throw 'Resume path must not learn host keys from network' }
          if ($t -match '\$ErrorActionPreference\s*=\s*''SilentlyContinue''') { throw 'Global error suppression is forbidden' }
          if ($t -match 'run_shell|run_command') { throw 'Generic shell operation is forbidden' }
          if ($t -notmatch 'Existing request ID has a different payload; refusing reuse') { throw 'Exact request payload reuse guard missing' }
          if ($t -notmatch 'No request was posted') { throw 'Pre-request SHA/time fail-closed marker missing' }
          if ($t -match 'issue comment[^\r\n]*--body\s') { throw 'Structured control JSON must not cross native --body argument boundary' }

      - name: Verify control comment JSON file round-trip
        shell: powershell
        run: |
          $payload = [ordered]@{
            requestId = 'gha-probe-0123456789abcdef-final1'
            operation = 'CONTROL_PROBE'
            sourceRef = 'master'
            targetSha = ('a' * 40)
            baseSha = ('a' * 40)
            acknowledgement = 'PROBE_ONLY_NO_TRADING_MUTATION'
            execute = $true
          } | ConvertTo-Json -Compress
          $body = "DISDEX_VPS_CONTROL_V1`n$payload"
          $api = [ordered]@{ body = $body } | ConvertTo-Json -Compress
          $roundTrip = $api | ConvertFrom-Json
          if ([string]$roundTrip.body -ne $body) { throw 'Control JSON file serialization changed the issue body' }
          $lines = @(([string]$roundTrip.body) -split '\r?\n')
          if ($lines.Count -ne 2) { throw 'Control body line count changed' }
          $parsed = $lines[1] | ConvertFrom-Json
          if ($parsed.requestId -ne 'gha-probe-0123456789abcdef-final1') { throw 'Control request JSON quotes did not survive round-trip' }
          if ($parsed.operation -ne 'CONTROL_PROBE' -or $parsed.execute -ne $true) { throw 'Control request JSON semantics changed' }
          Write-Host 'CONTROL_COMMENT_JSON_FILE_ROUNDTRIP=PASS'
