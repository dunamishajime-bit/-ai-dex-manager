name: Stop and Inspect V96 V52 VPS

on:
  pull_request:
    branches:
      - feature/v96-v52-dual-slot-live
    paths:
      - '.github/workflows/vps-stop-inspect-pr.yml'

permissions:
  contents: read

concurrency:
  group: disdex-vps-stop-inspect
  cancel-in-progress: false

jobs:
  stop-inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/vps-runtime-safety-sync'
    runs-on: [self-hosted, linux, x64, disdex-vps]
    timeout-minutes: 10
    steps:
      - name: Snapshot current service state
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'before_state='; sudo -n /usr/local/sbin/disdex-vps-control trading-state
          printf 'before_pid='; sudo -n /usr/local/sbin/disdex-vps-control trading-pid
          printf 'before_cwd='; sudo -n /usr/local/sbin/disdex-vps-control trading-cwd
          systemctl show disdex-v96-v52-live.service \
            --property=LoadState,ActiveState,SubState,Result,NRestarts,Restart,RestartUSec,ExecMainCode,ExecMainStatus \
            --no-pager

      - name: Stop restart loop
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/disdex-vps-control trading-stop
          for _ in $(seq 1 30); do
            state="$(sudo -n /usr/local/sbin/disdex-vps-control trading-state)"
            pid="$(sudo -n /usr/local/sbin/disdex-vps-control trading-pid)"
            if [[ "$state" == "inactive" && "$pid" == "0" ]]; then
              break
            fi
            sleep 1
          done
          state="$(sudo -n /usr/local/sbin/disdex-vps-control trading-state)"
          pid="$(sudo -n /usr/local/sbin/disdex-vps-control trading-pid)"
          printf 'after_state=%s\n' "$state"
          printf 'after_pid=%s\n' "$pid"
          printf 'after_cwd='; sudo -n /usr/local/sbin/disdex-vps-control trading-cwd
          [[ "$state" == "inactive" ]]
          [[ "$pid" == "0" ]]
          {
            echo 'restart_loop_stopped=true'
            echo "service_state=$state"
            echo "service_pid=$pid"
            echo 'orders_sent=false'
            echo 'positions_changed=false'
            echo 'runtime_state_changed=false'
            echo 'approval_changed=false'
          } >> "$GITHUB_STEP_SUMMARY"
