name: PENGU V2 Final Gate Frozen

on:
  workflow_dispatch:
  push:
    branches:
      - research/pengu-dual-ls-v2-20260810
    paths:
      - 'scripts/research/pengu_v2_final_gate_frozen.py'
      - '.github/workflows/pengu-v2-final-gate-frozen.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas
      - name: Syntax check
        run: python -m py_compile scripts/research/pengu_v2_final_gate_frozen.py
      - name: Run untouched Gate validation
        run: python scripts/research/pengu_v2_final_gate_frozen.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pengu-v2-final-gate-${{ github.sha }}
          path: research/pengu-v2-final-gate-frozen/
          if-no-files-found: warn
          retention-days: 30
