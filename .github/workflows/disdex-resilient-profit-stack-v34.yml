name: Dis-Dex Resilient Profit Stack V34

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_resilient_profit_stack_v34.py"
      - "scripts/research_lab_v35_core_only_v37.py"
      - "scripts/research_lab_adaptive_profit_stack_v33.py"
      - "scripts/research_lab_asymmetric_return_stack_v32.py"
      - ".github/workflows/disdex-resilient-profit-stack-v34.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_resilient_profit_stack_v34.py"
      - "scripts/research_lab_v35_core_only_v37.py"
      - ".github/workflows/disdex-resilient-profit-stack-v34.yml"

permissions:
  contents: read

concurrency:
  group: disdex-resilient-profit-stack-v34-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore frozen USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: multi-horizon-v3-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            win80-profit-v1-usdm-
            usdm-snapshot-v2-
            autonomous-usdm-v2-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile scripts/research_lab_resilient_profit_stack_v34.py scripts/research_lab_v35_core_only_v37.py scripts/research_lab_adaptive_profit_stack_v33.py scripts/research_lab_asymmetric_return_stack_v32.py
      - name: Run resilient profit stack validation
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_resilient_profit_stack_v34.py
      - name: Run V35 core-only validation
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_v35_core_only_v37.py
      - name: Upload V34 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-resilient-profit-stack-v34
          path: |
            .research-state/disdex-resilient-profit-stack-v34.json
            .research-state/disdex-resilient-profit-stack-v34.md
          if-no-files-found: warn
          retention-days: 30
      - name: Upload V37 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-v35-core-only-v37
          path: |
            .research-state/disdex-v35-core-only-v37.json
            .research-state/disdex-v35-core-only-v37.md
          if-no-files-found: warn
          retention-days: 30
