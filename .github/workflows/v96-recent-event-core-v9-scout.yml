name: V96 Recent Event Core V9 Focused Scout
on:
  workflow_dispatch:
  push:
    branches: [research/v96-recent-regime-redesign-final2]
    paths:
      - 'scripts/research_lab_v96_recent_event_core_v9.py'
      - 'scripts/research_lab_v96_recent_event_core_v9_scout_runner.py'
      - '.github/workflows/v96-recent-event-core-v9-scout.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: research/v96-v52-dual-slot-one-year-bt, path: .research-base, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: |
            .cache/perp-research-usdm
            .research-base/.cache/perp-research-usdm
          key: v96-v9-scout-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v96_recent_event_core_v9.py', 'scripts/research_lab_v96_recent_event_core_v9_scout_runner.py') }}
          restore-keys: |
            v96-v9-fixed-${{ runner.os }}-
            v96-v6-fast-${{ runner.os }}-
            v96-v52-dual-slot-one-year-${{ runner.os }}-
      - name: Compile
        run: python -m py_compile scripts/research_lab_v96_recent_event_core_v6.py scripts/research_lab_v96_recent_event_core_v9.py scripts/research_lab_v96_recent_event_core_v9_scout_runner.py
      - name: Run focused pre-ranking quality scout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research-state/v96-v9-scout
          python scripts/research_lab_v96_recent_event_core_v9_scout_runner.py --output-dir .research-state/v96-v9-scout 2>&1 | tee .research-state/v96-v9-scout/v9.log
          test -s .research-state/v96-v9-scout/v96-recent-event-core-v9.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-v9-scout-${{ github.run_id }}
          path: .research-state/v96-v9-scout
          retention-days: 90
