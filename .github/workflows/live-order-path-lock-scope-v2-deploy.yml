name: DisDex live order-path lock-scope v2 deploy

on:
  push:
    branches:
      - codex/order-path-lock-scope-v2-20260908
    paths:
      - .github/workflows/live-order-path-lock-scope-v2-deploy.yml

permissions:
  contents: read

concurrency:
  group: disdex-live-order-path-lock-scope-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, disdex-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current-runtime privileged paths
        shell: bash
        run: |
          set -u
          OLD=5c49716301e2a82e6808ac4c22554279874e3a9c
          NEW=e796cfb9f7b8e40ea165cc9f128d8f4fe189f2f3
          echo '--- systemd files ---'
          systemctl list-unit-files --type=service --no-pager | grep -Ei 'disdex.*(current|runtime|wiring|deploy|release|promot|activate)' || true
          echo '--- systemd units ---'
          systemctl list-units --all --no-pager | grep -Ei 'disdex.*(current|runtime|wiring|deploy|release|promot|activate)' || true          echo '--- installed disdex helpers ---'
          find /usr/local/libexec /usr/local/bin -maxdepth 1 -type f -name 'disdex*' -printf '%m %u:%g %p\n' 2>/dev/null || true
          getcap -r /usr/local 2>/dev/null | grep -i disdex || true
          echo '--- new unit read-only render ---'
          for unit in \
            disdex-v12-x1-all@${NEW}.service \
            disdex-pengu-dual-ls-v2@${NEW}.service \
            disdex-quality102-causal-v1@${NEW}.service \
            disdex-v52-aster-only@${NEW}.service; do
            systemctl show "$unit" -p LoadState -p ActiveState -p WorkingDirectory -p DropInPaths --no-pager || true
          done
          echo '--- no-op active-unit start permission ---'
          systemctl start "disdex-v12-x1-all@${OLD}.service" 2>&1
          echo "start_rc=$?"
          systemctl is-active "disdex-v12-x1-all@${OLD}.service" || true
          echo '--- current ---'
          sudo -n /usr/local/sbin/disdex-vps-control trading-current || true
