name: DisDex live order-path lock-scope v2 deploy

on:
  push:
    branches:
      - codex/order-path-lock-scope-v2-20260908
    paths:
      - .github/workflows/live-order-path-lock-scope-v2-deploy.yml

permissions:
  contents: read

concurrency:
  group: disdex-live-order-path-lock-scope-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, disdex-vps]
    timeout-minutes: 30
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner privilege boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          id
          sudo -n true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Deploy verified order-path release
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/ops/root/disdex-order-path-lock-scope-v2-deploy
          sudo -n bash scripts/ops/root/disdex-order-path-lock-scope-v2-deploy \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA" \
            5c49716301e2a82e6808ac4c22554279874e3a9c
