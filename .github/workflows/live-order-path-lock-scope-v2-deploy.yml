name: DisDex live order-path lock-scope v2 deploy

on:
  push:
    branches:
      - codex/order-path-lock-scope-v2-20260908
    paths:
      - .github/workflows/live-order-path-lock-scope-v2-deploy.yml

permissions:
  contents: read

concurrency:
  group: disdex-live-order-path-lock-scope-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, disdex-vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHub Actions root control
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- disdex-github-actions-entry ---'
          sed -n '1,240p' /usr/local/sbin/disdex-github-actions-entry
          echo '--- disdex-github-actions-control ---'
          sed -n '1,320p' /usr/local/sbin/disdex-github-actions-control
          echo '--- sudo permission probes ---'
          sudo -n /usr/local/sbin/disdex-vps-control trading-state
          sudo -n -l
