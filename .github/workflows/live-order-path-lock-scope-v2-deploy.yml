name: DisDex live order-path lock-scope v2 deploy

on:
  push:
    branches:
      - codex/order-path-lock-scope-v2-20260908
    paths:
      - .github/workflows/live-order-path-lock-scope-v2-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, disdex-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Final privilege-path inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- libexec ---'
          find /usr/local/libexec -maxdepth 1 -type f -name 'disdex*' -printf '%m %u:%g %p\n' 2>/dev/null | sort
          echo '--- sbin ---'
          find /usr/local/sbin -maxdepth 1 -type f -name 'disdex*' -printf '%m %u:%g %p\n' 2>/dev/null | sort
          echo '--- candidate dir ---'
          if test -d /home/deploy/disdex-trading/releases/${GITHUB_SHA}; then echo CANDIDATE_EXISTS; else echo CANDIDATE_MISSING; fi
          echo '--- current release ---'
          sudo -n /usr/local/sbin/disdex-vps-control trading-current
          echo '--- current four ---'
          OLD=5c49716301e2a82e6808ac4c22554279874e3a9c
          for u in disdex-v12-x1-all disdex-pengu-dual-ls-v2 disdex-quality102-causal-v1 disdex-v52-aster-only; do systemctl show "${u}@${OLD}.service" -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager; done
