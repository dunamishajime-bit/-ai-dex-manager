name: Active4 V127 Accepted-Core Hold Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/active4-v127-trigger.txt"

permissions:
  contents: read

concurrency:
  group: active4-v127-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_accepted_core_hold, btc_structural_ownership, eth_leadership_core_hold, bnb_regime_core_acceptance, avax_burst_core_hold]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_active4_v127_run.py
      - name: Run accepted-core hold candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v127_run.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v127-${{ matrix.candidate }}
          path: |
            .research-state/active4-v127-${{ matrix.candidate }}.json
            .research-state/active4-v127-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research only. BTC/ETH/BNB/AVAX only; LINK/SOL untouched/frozen.
# No production/VPS/live/credentials/orders/accounts/positions changes.
