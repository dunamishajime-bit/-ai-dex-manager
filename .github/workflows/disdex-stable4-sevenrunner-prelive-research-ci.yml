name: STABLE4 seven-runner research prelive source CI
on:
  pull_request:
    paths:
      - 'lib/stable4-*.ts'
      - 'lib/idle-priority-short-runner.ts'
      - 'lib/aster-v3-client.ts'
      - 'lib/v12-v4-*.ts'
      - 'lib/pengu-dual-ls-v2*.ts'
      - 'scripts/stable4-market-observe.ts'
      - 'scripts/stable4-four-sleeve-native-synthetic.ts'
      - 'scripts/disdex_public_read_resilience.py'
      - 'scripts/disdex_v13d_v11eq_stock_live_engine.py'
      - 'scripts/dd-reduction/v52_amzn_yahoo_gate.py'
      - 'tests/stable4-*.test.ts'
      - '.github/workflows/disdex-stable4-sevenrunner-prelive-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prelive-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: TypeScript entire candidate source
        run: npx tsc --noEmit --incremental false -p tsconfig.json
      - name: No-trade R21 P91, IDLE and shared API regression
        run: |
          for name in \
            tests/stable4-portfolio-cumulative-dd.test.ts \
            tests/idle-r26-entry-certificate.test.ts \
            tests/stable4-seven-runner-dryrun-gate.test.ts \
            tests/stable4-q102-hype-risk-policy-contract.test.ts \
            tests/stable4-proposed-source-integrity.test.ts \
            tests/stable4-hype-offline-m5-exit.test.ts \
            tests/stable4-fet-offline-m5-exit.test.ts \
            tests/stable4-seven-runner-dry-coordinator.test.ts \
            tests/stable4-native-pengu-q102-source-observer.test.ts \
            tests/stable4-observation-snapshot.test.ts \
            tests/stable4-r21-public-observation-feed.test.ts \
            tests/stable4-public-get-resilience.test.ts \
            tests/stable4-research-runner-observation.test.ts \
            tests/aster-common-read-resilience.test.ts \
            tests/disdex-runner-cumulative-dd.test.ts \
            tests/idle-priority-short-signal.test.ts \
            tests/idle-priority-short-live-path.test.ts \
            tests/idle-priority-short-baseline-admission.test.ts \
            tests/fet-brk48-signal.test.ts \
            tests/v12-v4-production-lifecycle.test.ts \
            tests/v12-v4-runner-engine.test.ts; do
              npx tsx "$name"
            done
          # Independently validate 23 exact-byte pins and all original safety tokens.
          # This MUST NOT replace the failing formal historical approval gate.
          python -B -m unittest -v tests.test_stable4_candidate_source_safety_contract
          # A partially regenerated/isolated sleeve study cannot stand in for one
          # complete, current-source, shared-wallet seven-runner artificial BT.
          python -B -m unittest -v tests.test_stable4_seven_native_coverage_audit
          python -B -m unittest -v tests.test_stable4_synthetic_evidence_fingerprint
          # Full-year, true Binance PENGU raw H1 trigger replay:
          # validate all 166 events against pinned native source + immutable data SHA.
          # This deliberately does not claim ASTER M5 fills or a seven-runner BT.
          python -B -m unittest -v tests.test_stable4_pengu_real_h1_ledger_audit
          python -B scripts/research/stable4_pengu_native_h1_ledger_audit.py
          # Separate partial 12-month Q102 BTC/SOL native H1 source proof.
          # Does not claim the full Q102 source universe or fills.
          # Time-contiguous V52 M5 bars have high zero-volume even in NY regular hours.
          # Verify pinned actual yearly market-data audit, never infer venue fills.
          python -B -m unittest -v tests.test_stable4_v52_regular_session_liquidity
          python -B -m unittest -v tests.test_stable4_q102_real_monthly_ledger_audit
          python -B scripts/research/stable4_q102_real_monthly_ledger_audit.py
          python -B scripts/stable4_seven_native_coverage_audit.py
          python -B tests/test_public_read_resilience_offline.py
          python -B -m unittest -q \
            tests.test_v52_market_closed_gate \
            tests.test_v52_real_tick \
            tests.test_v52_preserve_peer_protection \
            tests.test_v52_daily_loss_recovery \
            tests.test_v52_safety_regressions \
            tests.test_v52_stock_quote_local_hold_20261027 \
            tests.test_v52_q102_independent_pin \
            tests.test_v52_upstream_fail_closed \
            tests.test_v52_reference_transient
      - name: Independent V4 resident STOP and Shared Risk regressions (no formal approval)
        run: |
          python -B -m unittest -v tests.test_v4_dynamic_resident_stop_and_margin_script
          python -B -m unittest -v tests.test_stable4_dd30_shared_writer_singleton
          python -B -m unittest -v tests.test_disdex_verify_singlewriter_candidate
          node --import tsx --test \
            tests/shared-risk-writer-pin.test.ts \
            tests/shared-risk-writer-persist-guard.test.ts \
            tests/shared-risk-transient-refresh-retry.test.ts
          echo 'INDEPENDENT_RESEARCH_REGRESSION_ONLY=true'
          echo 'LIVE_ORDER_PERMIT=FALSE'
      - name: Regenerate current source synthetic report artifacts (partial, no orders)
        run: |
          set -euo pipefail
          npx tsx scripts/stable4-three-sleeve-native-synthetic.ts "$RUNNER_TEMP/three-sleeve-native-current.json"
          npx tsx scripts/stable4-four-sleeve-native-synthetic.ts "$RUNNER_TEMP/four-sleeve-native-current.json"
          npx tsx scripts/stable4-q102-hype-monthly-native-v4-synthetic.ts "$RUNNER_TEMP/q102-hype-native-current.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          from scripts.stable4_synthetic_evidence_fingerprint import canonical_result_sha256
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          review=json.loads(pathlib.Path("docs/research/STABLE4_FOUR_NATIVE_SOURCE_SYNTHETIC_COMPARISON_20261128.json").read_text(encoding="utf8"))
          if review.get("productionEligible") is not False or review.get("liveOrderAuthority") is not False:
              raise ValueError("SYNTHETIC_REVIEW_ORDER_AUTHORITY_FORBIDDEN")
          frozen={item["source"]:item for item in review["evidence"]}
          pairs=[
            ("scripts/stable4-three-sleeve-native-synthetic.ts","three-sleeve-native-current.json"),
            ("scripts/stable4-four-sleeve-native-synthetic.ts","four-sleeve-native-current.json"),
            ("scripts/stable4-q102-hype-monthly-native-v4-synthetic.ts","q102-hype-native-current.json"),
          ]
          evidence=[]
          for source,output in pairs:
              path=root/output
              obj=json.loads(path.read_text(encoding="utf-8"))
              if len(obj.get("rows",obj.get("cases",[]))) not in (8,12):
                  raise ValueError("REPLAY_EXPECTED_CASES_MISSING:"+output)
              source_digest=hashlib.sha256(pathlib.Path(source).read_bytes()).hexdigest()
              output_digest=hashlib.sha256(path.read_bytes()).hexdigest()
              canonical_digest=canonical_result_sha256(obj)
              pinned=frozen.get(source)
              if not pinned or pinned["sourceSha256"]!=source_digest or pinned["canonicalResultSha256"]!=canonical_digest:
                  raise ValueError("SYNTHETIC_CURRENT_SOURCE_OR_TRADING_RESULTS_CHANGED:"+source)
              # The Q102/HYPE output includes runtimeMs; exact raw bytes are not
              # stable across hosts. Trading outcome fields are still signed by
              # the canonical digest, excluding runtimeMs only.
              if source!="scripts/stable4-q102-hype-monthly-native-v4-synthetic.ts" and pinned["rawOutputSha256"]!=output_digest:
                  raise ValueError("SYNTHETIC_DETERMINISTIC_OUTPUT_CHANGED:"+source)
              evidence.append({"source":source,"sourceSha256":source_digest,"output":output,
                               "outputSha256":output_digest,"canonicalResultSha256":canonical_digest,
                               "status":obj["status"],"orderAuthority":False})
          (root/"source-native-replay-fingerprints.json").write_text(json.dumps({"status":"PARTIAL_SYNTHETIC_NO_SEVEN_WALLET_CERTIFICATION","evidence":evidence},indent=2)+"\n",encoding="utf8")
          print(json.dumps(evidence))
          PY
      - name: Co-observe native PENGU and Q102 H1 on independent 280d artificial prices (no trade)
        run: |
          set -euo pipefail
          npx tsx scripts/stable4-pengu-q102-native-h1-artificial-observations.ts "$RUNNER_TEMP/pengu-q102-native-h1-current.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pengu-q102-native-h1-current.json"
          o=json.loads(p.read_text(encoding="utf8"))
          if (o.get("status")!="NATIVE_H1_OBSERVATION_ONLY_NO_VENUE_CERTIFICATION"
              or len(o.get("rows",[]))!=4
              or any(len(r.get("cases",[]))!=8 for r in o["rows"])
              or o.get("orderAuthority") is not False
              or o.get("asterM5Confirmed") is not False
              or o.get("fullSevenNativeReplay") is not False
              or o.get("liveEligible") is not False):
              raise ValueError("NATIVE_H1_RESEARCH_SCOPE_OR_COVERAGE_INVALID")
          for r in o["rows"]:
              for case in r["cases"]:
                  for name in ("pengu","penguV8","q102"):
                      item=case[name]
                      if item["status"] not in ("NO_SOURCE_ENTRY","NATIVE_ENTRY_OBSERVED","BLOCKED_SOURCE"):
                          raise ValueError("NATIVE_H1_OBSERVATION_UNRECOGNISED")
          print(json.dumps({"observationOnly":True,"noOrders":True,"cases":32,"aggregate":o["aggregate"]}))
          PY
      - name: Preserve independently regenerated research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable4-native-replay-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/three-sleeve-native-current.json
            ${{ runner.temp }}/four-sleeve-native-current.json
            ${{ runner.temp }}/q102-hype-native-current.json
            ${{ runner.temp }}/source-native-replay-fingerprints.json
            ${{ runner.temp }}/pengu-q102-native-h1-current.json
      - name: Source-level validation only; NO certificate or LIVE activation
        run: |
          echo "PRELIVE_SOURCE_ONLY=true"
          echo "productionInstalled=false"
          echo "liveOrderAuthorization=false"
