name: DD reduction sequential

on:
  push:
    paths:
      - ".github/workflows/dd-reduction-sequential.yml"
      - "lib/backtest/dd-reduction/**"
      - "scripts/dd-reduction/**"
      - "tests/dd-reduction-*.test.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/dd-reduction-sequential.yml"
      - "lib/backtest/dd-reduction/**"
      - "scripts/dd-reduction/**"
      - "tests/dd-reduction-*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: dd-reduction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-dd-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic DD reduction fixtures
        run: npm run dd:reduction:test
      - name: Type-check without emitting files
        run: npx tsc --noEmit --incremental false
