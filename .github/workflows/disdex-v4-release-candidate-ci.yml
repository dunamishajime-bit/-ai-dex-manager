name: DisDex V4 release candidate CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-v4-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Fetch exact reviewed preview source
        run: git fetch --no-tags --depth=1 origin a5c52b348e1a3cf6a58a90e31318caa1d3478b2e
      - name: Fetch reviewed root refresh helpers
        run: git fetch --no-tags --depth=1 origin 3524e3676848b9260f53164e07257acdda7bcc5c
      - name: Verify candidate source lineage
        run: python3 -m unittest tests.test_v4_release_candidate_source tests.test_v4_refresh_installer_contract tests.test_pending_refresh_executor -v
      - name: Test monitoring, evidence and shared API budget
        run: npx tsx --test tests/v12-v4-monitor-only.test.ts tests/v4-production-monitor-phase.test.ts tests/v4-monitor-pending-proof-read.test.ts tests/v4-dynamic-evidence-auth-boundary.test.ts tests/v4-refresh-commit.test.ts tests/v4-refresh-publication.test.ts tests/pending-exposure-readonly-reconcile.test.ts tests/pending-refresh-root-grant.test.ts tests/v4-rate-budget-proxy.test.ts tests/v4-rate-budget-proxy-integration.test.ts tests/v4-budget-shared-lock.test.ts tests/v12-v4-recoverable-safety.test.ts tests/v4-monitor-read-scheduling.test.ts
      - name: Test V4 tick contract
        run: npx tsx --test --test-name-pattern='tick filenames|a V4 writer|writes an atomic|replaces an existing|requires explicit|same-PID|80 concurrent|rejects invalid' tests/runner-tick-heartbeat.test.ts
      - name: Test existing V4 execution, health and STOP contracts
        run: npx tsx --test tests/v12-v4-idle-baseline-snapshot.test.ts tests/v12-v4-rate-budget-resilience.test.ts tests/v12-v4-execution-foundation.test.ts tests/v12-v4-certified-gates.test.ts tests/v12-v4-production-lifecycle.test.ts
      - name: Test systemd source wiring
        run: |
          node tests/v12-v4-monitor-systemd.test.mjs
          node tests/v4-budget-broker-systemd.test.mjs
      - name: Typecheck candidate safety modules
        run: npx tsc -p tsconfig.v4-release-candidate.json --pretty false
