name: AIFX Free Early Wave Proxy

on:
  push:
    branches:
      - research/aifx-free-early-wave-20260810
    paths:
      - research/aifx_early_wave/run_early_wave_proxy.py
      - .github/workflows/aifx-free-early-wave.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aifx-free-early-wave-20260810
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run M15 early-wave proxy
        run: python research/aifx_early_wave/run_early_wave_proxy.py
      - name: Commit frozen results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/aifx_early_wave/early_wave_proxy_results.json research/aifx_early_wave/early_wave_proxy_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Record AIFX early-wave proxy results"
            git push origin HEAD:research/aifx-free-early-wave-20260810
          fi
