name: V96 Core Profit Capture Round 2

on:
  pull_request:
    branches:
      - research/v71-dd-v35-growth-v82
    paths:
      - scripts/research_lab_v96_core_profit_capture_round2.py
      - scripts/research_lab_v96_core_profit_capture_screen.py
      - .github/workflows/v96-core-profit-capture-round2.yml
      - scripts/research_lab_v35_weight_band_strong_v95.py
      - scripts/research_lab_v35_weight_band_v90.py
      - scripts/research_lab_v35_strong_growth_v86.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/research_lab_v96_core_profit_capture_screen.py
          python -m py_compile scripts/research_lab_v96_core_profit_capture_round2.py
      - name: Run conditional module screen
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_v96_core_profit_capture_round2.py
      - name: Upload round-two evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v96-core-profit-capture-round2
          path: |
            .research-state/v96-core-profit-capture-round2.json
            .research-state/v96-core-profit-capture-round2.md
          if-no-files-found: warn
          retention-days: 90
