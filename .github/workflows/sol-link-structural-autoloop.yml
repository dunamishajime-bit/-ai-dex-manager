name: SOL LINK Structural Autonomous Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_sol_link_structural_autoloop.py"
      - ".github/workflows/sol-link-structural-autoloop.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sol-link-structural-autoloop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  structural-research:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [SOL, LINK]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile research-only loop
        run: python -m py_compile scripts/research_sol_link_structural_autoloop.py
      - name: Run autonomous structural research
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_sol_link_structural_autoloop.py --pair "${{ matrix.pair }}"
      - name: Upload research lineage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair }}-structural-autoloop
          path: |
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-structural-autoloop.json
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-structural-autoloop.md
          if-no-files-found: warn
          retention-days: 30

# SOL: Frozen V109 preserved; separate Wrong-wave rejection research line.
# LINK: Frozen V109 preserved; separate Volatility-aware Cash + Forecast-horizon ownership line.
# Development/Validation only for redesign. No Confirmation/Holdout reads.
# No production/VPS/live/.env/credentials/orders/accounts/positions/realTradingEnabled changes.
