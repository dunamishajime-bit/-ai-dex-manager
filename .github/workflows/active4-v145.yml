name: Active4 V145 Clean Sheet Roles

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_active4_v145_clean_sheet_roles.py"
      - ".github/workflows/active4-v145.yml"

permissions:
  contents: read

concurrency:
  group: active4-v145-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate:
          - btc_major_wave_scout_cs_v15
          - btc_pullback_wave_scout_cs_v15
          - eth_leadership_acceleration_cs_v15
          - bnb_relative_impulse_scout_cs_v15
          - avax_volatility_event_cs_v15
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile clean-sheet script
        run: python -m py_compile scripts/research_active4_v145_clean_sheet_roles.py
      - name: Run V145 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v145_clean_sheet_roles.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v145-${{ matrix.candidate }}
          path: |
            .research-state/active4-v145-${{ matrix.candidate }}.json
            .research-state/active4-v145-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only BTC/ETH/BNB/AVAX. Development/Validation only.
# No V136-V144 signal inheritance. Confirmation/Holdout, SOL/LINK, production/live/VPS/.env/credentials/orders/accounts/positions untouched.
