name: Aster-only V26 Non-Basis Fallback Tournament

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v26_nonbasis_fallback_tournament.py'
      - 'docs/research/ASTER_ONLY_V26_NONBASIS_FALLBACK_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v26-nonbasis-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v26-nonbasis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v26-nonbasis
          key: aster-only-v26-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v26_nonbasis_fallback_tournament.py') }}
          restore-keys: |
            aster-only-v26-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v26_nonbasis_fallback_tournament.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v26_nonbasis_fallback_tournament as v26
          assert (v26.v19.BT_END_EXCLUSIVE - v26.v19.BT_START).days == 365
          assert len(v26.CANDIDATES) == 150
          assert v26.BASELINE_NORMAL == 72.276908
          assert v26.BASELINE_P95 == 68.080022
          assert v26.TP_PCT == 0.75
          assert v26.SL_PCT == 1.00
          assert all(candidate.maximum_holding_hours in {1, 2} for candidate in v26.CANDIDATES)
          print('V26 freeze assertions: PASS')
          PY
      - name: Run V26 non-basis tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v26-nonbasis
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v26_nonbasis_fallback_tournament.py \
            --cache-dir ../.cache/aster-only-v26-nonbasis \
            --output-dir ../.research-state/aster-only-v26-nonbasis \
            2>&1 | tee ../.research-state/aster-only-v26-nonbasis/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v26-nonbasis/result.json
          test -s .research-state/aster-only-v26-nonbasis/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v26-nonbasis/result.json').read_text())
          assert p['version'] == 26
          assert p['candidateCount'] == 150
          assert p['period']['calendarDays'] == 365
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V26_NO_VALIDATED_NONBASIS_FALLBACK',
              'ASTER_ONLY_V26_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V26_VALIDATED_NONBASIS_SHADOW_LEAD',
          }
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v26-nonbasis-${{ github.run_id }}
          path: .research-state/aster-only-v26-nonbasis
          retention-days: 90
          if-no-files-found: warn
