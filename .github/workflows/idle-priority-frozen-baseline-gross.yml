name: Idle Priority frozen baseline Gross diagnostic
on:
  push:
    branches: [design/idle-priority-bt-parity-20260929]
    paths:
      - ".github/workflows/idle-priority-frozen-baseline-gross.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical release and test frozen baseline Gross
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bt-v12-score100-volume080-normalonly-20260928 --repo dunamishajime-bit/-ai-dex-manager --pattern 'bt-v12-score100-volume080-normalonly-20260928.tar.gz'
          echo '891c36d8a5957cafe3aae65656a98b7c02a3c437c4f520fe63756d550f08b4fb  bt-v12-score100-volume080-normalonly-20260928.tar.gz' | sha256sum -c -
          mkdir evidence
          tar -xzf bt-v12-score100-volume080-normalonly-20260928.tar.gz -C evidence
          LEDGER="$(find evidence -type f -path '*/selected-five-logic-all-cases-all-costs/BRK0P75_MR0P75_FET1_DUAL_GATE/PRICE_MODEL_10BPS/portfolio-trades.jsonl' | head -1)"
          test -n "$LEDGER"
          BTC="$(find evidence -type f -path '*/market-Aster-H1-funding-and-manifests/normalized/aster/klines/BTCUSDT.jsonl' | head -1)"
          test -n "$BTC"
          DATA="$(python -c "from pathlib import Path; print(Path('$BTC').resolve().parents[3])")"
          python research/idle_priority_frozen_baseline_gross.py \
            --baseline-trades "$LEDGER" \
            --idle-intents research/idle_priority_61_intents.json \
            --data-root "$DATA" \
            --output frozen-baseline-gross.json | tee frozen-baseline-gross.log
      - uses: actions/upload-artifact@v4
        with:
          name: idle-priority-frozen-baseline-gross
          path: |
            frozen-baseline-gross.json
            frozen-baseline-gross.log
          retention-days: 30
