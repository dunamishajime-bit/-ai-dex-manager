name: Research V26 No-PENGU Dev Latency Prune
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/3y-entry-edge-diagnosis-20260815]
    paths:
      - scripts/research_v26_no_pengu_dev_latency_prune.ts
      - .github/workflows/research-v26-no-pengu-dev-latency-prune.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert frozen prune source
        run: test "$(git hash-object scripts/research_v26_no_pengu_dev_latency_prune.ts)" = "a6af67881c868d4a5dad6a9dc484974d0ac47d7a"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - run: npm ci
      - name: Run development-only latency prune
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_v26_no_pengu_dev_latency_prune.ts
      - name: Assert research boundary and PENGU exclusion
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/v26-no-pengu-dev-latency-prune.json','utf8'));
          if(!d.researchOnly||d.productionChanged||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(d.frozenUniverse.includes('PENGU')||d.frozenGenome.symbols.includes('PENGU')) throw new Error('PENGU_FAIL');
          if(d.frozenGenome.parameters.leverage!==1||d.combined3Y.maximumEffectiveLeverage>1.000001) throw new Error('LEVERAGE_FAIL');
          if(!d.checks.pruneRuleExact) throw new Error('PRUNE_RULE_FAIL');
          console.log('V26_NO_PENGU_DEV_LATENCY_PRUNE_BOUNDARY_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v26-no-pengu-dev-latency-prune
          path: .research-state/v26-no-pengu-dev-latency-prune.json
          include-hidden-files: true
          retention-days: 30
