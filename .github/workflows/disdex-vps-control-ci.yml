name: DisDex VPS Control Safety CI

on:
  pull_request:
    paths:
      - '.github/workflows/disdex-vps-control.yml'
      - '.github/workflows/disdex-vps-control-ci.yml'
      - 'scripts/ops/root/disdex-github-actions-entry'
      - 'scripts/ops/root/disdex-github-actions-control'
      - 'scripts/ops/root/install-disdex-github-actions-control'
      - 'docs/implementation/DISDEX_GITHUB_ACTIONS_VPS_CONTROL_20260819.md'
  push:
    branches:
      - chatgpt/github-actions-vps-control-20260819
    paths:
      - '.github/workflows/disdex-vps-control.yml'
      - '.github/workflows/disdex-vps-control-ci.yml'
      - 'scripts/ops/root/disdex-github-actions-entry'
      - 'scripts/ops/root/disdex-github-actions-control'
      - 'scripts/ops/root/install-disdex-github-actions-control'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/root/disdex-github-actions-entry
          bash -n scripts/ops/root/disdex-github-actions-control
          bash -n scripts/ops/root/install-disdex-github-actions-control

      - name: Verify forced-command boundary
        run: |
          set -Eeuo pipefail
          grep -Fq 'SSH_ORIGINAL_COMMAND' scripts/ops/root/disdex-github-actions-entry
          grep -Fq '/usr/bin/sudo -n /usr/local/sbin/disdex-github-actions-control --stdin' scripts/ops/root/disdex-github-actions-entry
          grep -Fq 'restrict,command="/usr/local/sbin/disdex-github-actions-entry"' scripts/ops/root/install-disdex-github-actions-control
          grep -Fq 'deploy ALL=(root) NOPASSWD: /usr/local/sbin/disdex-github-actions-control --stdin' scripts/ops/root/install-disdex-github-actions-control
          ! grep -Eq 'sudo[^\n]*(ALL|/bin/(ba)?sh|/usr/bin/(ba)?sh)' /etc/does-not-exist 2>/dev/null || false

      - name: Verify production allowlist and replay gates
        run: |
          set -Eeuo pipefail
          control=scripts/ops/root/disdex-github-actions-control
          grep -Fq 'DISDEX_VPS_CONTROL_V1' "$control"
          grep -Fq 'V12_LIVE_ACTIVATE_V3' "$control"
          grep -Fq 'chatgpt/v12-live-adapter-final-20260817' "$control"
          grep -Fq 'd686f6dc0b841ba6299830fe8aade797420f4597' "$control"
          grep -Fq 'I_ACKNOWLEDGE_V12_EXACT_SHA_LIVE_ACTIVATION_V3' "$control"
          grep -Fq 'DISDEX_VPS_CONTROL_REPLAY_BLOCKED' "$control"
          grep -Fq 'flock -n' "$control"
          grep -Fq 'git -C "$SOURCE_REPO" archive "$target_sha"' "$control"
          ! grep -Eq '(eval[[:space:]]|bash[[:space:]]+-c|sh[[:space:]]+-c)' "$control"

      - name: Verify GitHub workflow owner and CI gates
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/disdex-vps-control.yml
          grep -Fq "github.event.issue.number == 132" "$workflow"
          grep -Fq "github.actor == 'dunamishajime-bit'" "$workflow"
          grep -Fq "github.event.comment.author_association == 'OWNER'" "$workflow"
          grep -Fq 'cancel-in-progress: false' "$workflow"
          grep -Fq 'CONTROL_REQUIRED_CI_GREEN' "$workflow"
          grep -Fq 'StrictHostKeyChecking=yes' "$workflow"
          grep -Fq 'DISDEX_VPS_KNOWN_HOSTS' "$workflow"
          grep -Fq 'STATUS: LIVE_ACTIVATED_VERIFIED' "$workflow"
          grep -Fq 'ORDERS_SENT_FOR_TESTING=0' "$workflow"
          ! grep -Fq 'workflow_dispatch:' "$workflow"
          ! grep -Eq '(ssh-keyscan|StrictHostKeyChecking=no)' "$workflow"

      - name: Verify no arbitrary shell operation is documented or exposed
        run: |
          set -Eeuo pipefail
          ! grep -Eq 'operation[^\n]*(SHELL|COMMAND|EXEC)' scripts/ops/root/disdex-github-actions-control
          grep -Fq 'Do not add a generic `run_shell(command)` operation.' docs/implementation/DISDEX_GITHUB_ACTIONS_VPS_CONTROL_20260819.md

      - name: Diff check
        run: git diff --check
