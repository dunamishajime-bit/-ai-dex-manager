name: STABLE4 six-Runner bundle order enable

on:
  pull_request:
    paths:
      - ".github/workflows/disdex-stable4-runner-bundle-order-enable.yml"
      - "scripts/ops/deploy/disdex_runner_scoped_order_enable.py"
      - "scripts/ops/deploy/disdex_owner_approval.py"
      - "scripts/ops/deploy/disdex_deployment_contract.py"
      - "scripts/ops/root/disdex-runner-scoped-order-enable"
      - "scripts/ops/root/install-disdex-runner-scoped-order-enable"
      - "scripts/ops/test_disdex_runner_scoped_order_enable.py"
      - "scripts/ops/test_disdex_stable4_runner_bundle.py"
      - "lib/runner-order-permit.ts"
      - "lib/stable4-runner-bundle.ts"
      - "tests/stable4-runner-bundle.test.ts"
  workflow_dispatch:
    inputs:
      approval_id:
        description: Exact HP Owner-approved six-Runner bundle request ID
        type: string
        required: true
      source_sha:
        description: Exact STABLE4 bundle source SHA approved by HP
        type: string
        required: true
      plan_sha256:
        description: Exact six-Runner manifest SHA256 approved by HP
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run fail-closed bundle tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest \
            scripts/ops/test_disdex_runner_scoped_order_enable.py \
            scripts/ops/test_disdex_stable4_runner_bundle.py \
            scripts/ops/test_disdex_stable4_runner_bundle_workflow.py -v
          npx tsx tests/stable4-runner-bundle.test.ts
          npx tsc --noEmit
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/ops/deploy/disdex_runner_scoped_order_enable.py').read_text(encoding='utf-8-sig'))
          print('STABLE4_RUNNER_BUNDLE_SOURCE_OK=TRUE')
          print('TRADING_MUTATIONS=0')
          PY

  formal-owner-gate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: disdex-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact six-Runner bundle identity before redeem
        shell: bash
        env:
          APPROVAL_ID: ${{ inputs.approval_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$SOURCE_SHA" == "e0e4f1d8f22b62e9410188ef6e590a20e31f760f" ]]
          [[ "$PLAN_SHA256" == "595ab42294fe939d18e11fc9885dfb62856d6b0b22327b9d0a5e578fe448af1a" ]]
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest \
            scripts/ops/test_disdex_runner_scoped_order_enable.py \
            scripts/ops/test_disdex_stable4_runner_bundle.py -v
          npx tsx tests/stable4-runner-bundle.test.ts

      - name: Read-only Runner readiness preflight before approval redemption
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$HOST_KEYS" ]]
          port="$PORT"; [[ -n "$port" ]] || port=22
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          umask 077
          dir="$RUNNER_TEMP/stable4-bundle-readiness-ssh"; mkdir -m 0700 -p "$dir"
          printf '%s\n' "$KEY" > "$dir/id_root"
          printf '%s\n' "$HOST_KEYS" > "$dir/known_hosts"
          chmod 600 "$dir/id_root" "$dir/known_hosts"
          ssh-keygen -y -f "$dir/id_root" >/dev/null
          opts=(-i "$dir/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=12 -p "$port")
          stage="/var/lib/disdex/unified-deploy/runner-scoped-order-enable-readiness/$GITHUB_RUN_ID"
          ssh -nT ${opts[@]} "root@$HOST" "install -d -o root -g root -m 0700 '$stage'"
          for source in \
            scripts/ops/deploy/disdex_runner_scoped_order_enable.py \
            scripts/ops/deploy/disdex_owner_approval.py \
            scripts/ops/deploy/disdex_deployment_contract.py \
            lib/runner-order-permit.ts \
            scripts/ops/root/disdex-runner-scoped-order-enable \
            scripts/ops/root/install-disdex-runner-scoped-order-enable; do
            file="$(basename "$source")"
            scp -q -i "$dir/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -P "$port" "$source" "root@$HOST:$stage/$file"
            expected="$(sha256sum "$source" | awk '{print $1}')"
            actual="$(ssh -nT ${opts[@]} "root@$HOST" "chown root:root '$stage/$file' && chmod 0444 '$stage/$file' && sha256sum '$stage/$file'" | awk '{print $1}')"
            [[ "$expected" == "$actual" ]]
          done
          set +e
          # Execute the staged candidate directly for this read-only check.
          # Do not replace the installed production helper until the exact
          # Owner approval has been redeemed and the formal transaction starts.
          ssh -T ${opts[@]} "root@$HOST" "/usr/bin/python3 -B '$stage/disdex_runner_scoped_order_enable.py' --bundle-readiness-preflight" > "$RUNNER_TEMP/stable4-bundle-readiness.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/stable4-bundle-readiness.json"
          python3 - "$RUNNER_TEMP/stable4-bundle-readiness.json" "$status" <<'PY'
          import json, sys
          path, status = sys.argv[1], int(sys.argv[2])
          row = json.load(open(path, encoding='utf-8'))
          if row.get('status') != 'RUNNER_READINESS_PREFLIGHT_PASS' or status != 0:
              raise SystemExit('RUNNER_READINESS_PREFLIGHT_BLOCKED:' + json.dumps(row, sort_keys=True))
          assert row.get('ordersSent') == row.get('cancelsSent') == row.get('positionChangesSent') == 0
          print('RUNNER_READINESS_PREFLIGHT=PASS')
          print('TRADING_MUTATIONS=0')
          PY

      - name: Redeem one exact bundle Owner approval through official HP bridge
        shell: bash
        env:
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          PUBLIC_KEY: ${{ secrets.DISDEX_HP_APPROVER_PUBLIC_KEY_PEM }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ -n "$BRIDGE" && -n "$PUBLIC_KEY" ]]
          umask 077
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/stable4-bundle-public.pem"
          PYTHONPATH=scripts/ops/deploy python3 -B - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from disdex_owner_approval import verify
          aid=os.environ['APPROVAL_ID']; run_id=os.environ['GITHUB_RUN_ID']
          body=json.dumps({'action':'redeem','approval_id':aid,
              'operation':'STABLE4_RUNNERS_SCOPED_ORDER_ENABLE_BUNDLE',
              'scope':'STABLE4_SCOPED_RUNNERS','target_sha':os.environ['SOURCE_SHA'],
              'plan_sha256':os.environ['PLAN_SHA256'],'run_id':run_id}).encode()
          req=urllib.request.Request('https://professional-dismanager.net/api/system/deploy-approval',
              data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['BRIDGE'],
              'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as response:
              result=json.load(response)
          approval=result.get('approval') or {}
          assert result.get('ok') is True
          for key, want in [('id',aid),('operation','STABLE4_RUNNERS_SCOPED_ORDER_ENABLE_BUNDLE'),
                            ('scope','STABLE4_SCOPED_RUNNERS'),('targetSha',os.environ['SOURCE_SHA']),
                            ('planSha256',os.environ['PLAN_SHA256'])]:
              assert approval.get(key)==want, key
          assert approval.get('ordersEnabled') is True
          token=result['token']
          verify(token, Path(os.environ['RUNNER_TEMP'])/'stable4-bundle-public.pem',
              'dunamishajime-bit/-ai-dex-manager', os.environ['SOURCE_SHA'],
              'STABLE4_SCOPED_RUNNERS', 'dunamishajime-bit', os.environ['PLAN_SHA256'],
              route='GITHUB_ACTIONS', deployment_target='professional-dismanager.net',
              operator_target='DD1296_FINAL_ALLIN_10BPS', orders_enabled=True)
          Path(os.environ['RUNNER_TEMP'],'stable4-bundle-token').write_text(token,encoding='ascii')
          print('HP_SIGNED_STABLE4_BUNDLE_APPROVAL_EXACT_VALID=TRUE')
          print('BUNDLE_RUNNERS=6')
          print('HYPE_INCLUDED=FALSE')
          print('TRADING_MUTATIONS=0')
          PY

      - name: Stage Root-owned bundle gate and execute formally
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$HOST_KEYS" ]]
          port="$PORT"; [[ -n "$port" ]] || port=22
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          umask 077
          dir="$RUNNER_TEMP/stable4-bundle-ssh"; mkdir -m 0700 -p "$dir"
          printf '%s\n' "$KEY" > "$dir/id_root"
          printf '%s\n' "$HOST_KEYS" > "$dir/known_hosts"
          ssh-keygen -y -f "$dir/id_root" >/dev/null
          opts=(-i "$dir/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=12 -p "$port")
          stage="/var/lib/disdex/unified-deploy/runner-scoped-order-enable/$GITHUB_RUN_ID"
          ssh -nT ${opts[@]} "root@$HOST" "install -d -o root -g root -m 0700 '$stage'"
          for source in \
            scripts/ops/deploy/disdex_runner_scoped_order_enable.py \
            scripts/ops/deploy/disdex_owner_approval.py \
            scripts/ops/deploy/disdex_deployment_contract.py \
            lib/runner-order-permit.ts \
            scripts/ops/root/disdex-runner-scoped-order-enable \
            scripts/ops/root/install-disdex-runner-scoped-order-enable; do
            file="$(basename "$source")"
            scp -q -i "$dir/id_root" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -P "$port" "$source" "root@$HOST:$stage/$file"
            expected="$(sha256sum "$source" | awk '{print $1}')"
            actual="$(ssh -nT ${opts[@]} "root@$HOST" "chown root:root '$stage/$file' && chmod 0444 '$stage/$file' && sha256sum '$stage/$file'" | awk '{print $1}')"
            [[ "$expected" == "$actual" ]]
          done
          ssh -nT ${opts[@]} "root@$HOST" "chmod 0555 '$stage/disdex-runner-scoped-order-enable' '$stage/install-disdex-runner-scoped-order-enable' && '$stage/install-disdex-runner-scoped-order-enable' '$stage'"
          ssh -T ${opts[@]} "root@$HOST" "/usr/local/sbin/disdex-runner-scoped-order-enable --bundle-normalize" > "$RUNNER_TEMP/stable4-bundle-normalize.json"
          ssh -T ${opts[@]} "root@$HOST" "/usr/local/sbin/disdex-runner-scoped-order-enable --approval-id '$APPROVAL_ID' --run-id '$GITHUB_RUN_ID' --bundle-preflight-readonly --read-approval-stdin" < "$RUNNER_TEMP/stable4-bundle-token" > "$RUNNER_TEMP/stable4-bundle-preflight.json"
          ssh -T ${opts[@]} "root@$HOST" "/usr/local/sbin/disdex-runner-scoped-order-enable --approval-id '$APPROVAL_ID' --run-id '$GITHUB_RUN_ID' --bundle-execute --read-approval-stdin" < "$RUNNER_TEMP/stable4-bundle-token" > "$RUNNER_TEMP/stable4-bundle-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'stable4-bundle-result.json').read_text())
          assert result['status']=='STABLE4_RUNNER_BUNDLE_ORDER_ENABLE_INSTALLED_GLOBAL_HOLD_REMAINS_ACTIVE'
          assert len(result.get('runners') or []) == 6
          assert all(row.get('bundleOperation')=='STABLE4_RUNNERS_SCOPED_ORDER_ENABLE_BUNDLE' for row in result['runners'])
          assert all(all(row.get(k)==0 for k in ('ordersSent','cancelsSent','positionChangesSent')) for row in result['runners'])
          assert all(result.get(k)==0 for k in ('ordersSent','cancelsSent','positionChangesSent'))
          print('STABLE4_RUNNER_BUNDLE_ORDER_ENABLE=TRUE')
          print('BUNDLE_RUNNERS=6')
          print('GLOBAL_HOLD_REMAINS_ACTIVE=TRUE')
          print('TRADING_MUTATIONS=0')
          PY

      - name: Erase ephemeral approval and SSH files
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set +e
          readiness_dir="$RUNNER_TEMP/stable4-bundle-readiness-ssh"
          if [[ -s "$readiness_dir/id_root" && -s "$readiness_dir/known_hosts" && -n "${HOST:-}" ]]; then
            port="${PORT:-22}"
            ssh -nT -i "$readiness_dir/id_root" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$readiness_dir/known_hosts" \
              -o ConnectTimeout=5 -p "$port" "root@$HOST" \
              "rm -rf -- '/var/lib/disdex/unified-deploy/runner-scoped-order-enable-readiness/$GITHUB_RUN_ID'" || true
          fi
          rm -rf "$readiness_dir"
          rm -rf "$RUNNER_TEMP/stable4-bundle-ssh"
          rm -f "$RUNNER_TEMP/stable4-bundle-token" "$RUNNER_TEMP/stable4-bundle-public.pem" \
            "$RUNNER_TEMP/stable4-bundle-normalize.json" "$RUNNER_TEMP/stable4-bundle-preflight.json" \
            "$RUNNER_TEMP/stable4-bundle-result.json"
