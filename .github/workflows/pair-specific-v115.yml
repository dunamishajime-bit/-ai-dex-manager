name: Pair Specific V115 Predeclared Lifecycle State Engines

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_v115.py"
      - ".github/workflows/pair-specific-v115.yml"
      - "research/pair-specific-v115-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-v115-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [early_phase, persistence_phase, adaptive_phase]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v115.py
      - name: Run predeclared lifecycle engine
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v115.py --kind "${{ matrix.kind }}"
      - name: Verify exact fixed window
        run: |
          python - <<'PY'
          import json,pathlib
          k='${{ matrix.kind }}'; d=json.loads(pathlib.Path(f'.research-state/pair-specific-v115-{k}.json').read_text())
          if (d['periods']['fixedWindowStart'],d['periods']['fixedWindowEndExclusive']) != (1754751600000,1786287600000):
              raise SystemExit('EXACT_WINDOW_MISMATCH')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v115-${{ matrix.kind }}
          path: |
            .research-state/pair-specific-v115-${{ matrix.kind }}.json
            .research-state/pair-specific-v115-${{ matrix.kind }}.md
          retention-days: 30

# Research only. No production/VPS/live-trading changes. Parameters are predeclared and not optimized on Confirmation/Holdout.
