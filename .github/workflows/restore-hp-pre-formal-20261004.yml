name: Restore HP to pre-Formal UI 20261004

on:
  push:
    branches:
      - research/formal-priority-cooldown-20261003
    paths:
      - ".github/workflows/restore-hp-pre-formal-20261004.yml"

permissions:
  contents: read

concurrency:
  group: restore-hp-pre-formal-20261004
  cancel-in-progress: false

jobs:
  restore-hp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
      EXPECTED_BAD_UI_SHA: a23edd7628100faf314f2b341b03215f178d5cdc
      GOOD_UI_SHA: 207e0448d1c4243f7dc48a30c6479bac5e09fb77
      GOOD_UI_WORKDIR: /home/deploy/disdex-trading/ui-releases/ui-idle-207e0448d1c4
      EXPECTED_TRADING_SHA: 53eeff5417636369d4709fddfd47d7916ddcf3b1
    steps:
      - uses: actions/checkout@v4

      - name: Initialize root SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null

      - name: Restore HP release only
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=15 -p "$PORT" "root@$SSH_HOST"             "EXPECTED_BAD_UI_SHA='$EXPECTED_BAD_UI_SHA' GOOD_UI_SHA='$GOOD_UI_SHA' GOOD_UI_WORKDIR='$GOOD_UI_WORKDIR' EXPECTED_TRADING_SHA='$EXPECTED_TRADING_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ui=ai-dex-manager-ui.service
          current=/home/deploy/disdex-trading/current
          dropin_dir=/etc/systemd/system/ai-dex-manager-ui.service.d

          before_trading_sha="$(basename "$(readlink -f "$current")")"
          [[ "$before_trading_sha" == "$EXPECTED_TRADING_SHA" ]]

          runners=(disdex-v12-x1-all disdex-pengu-dual-ls-v2 disdex-quality102-causal-v1
                   disdex-v52-aster-only disdex-fet-brk48 disdex-hype-long disdex-idle-priority-short
                   disdex-shared-crypto-risk disdex-v12-v52-margin-guard)
          declare -A before_pid before_state before_restarts
          for n in "${runners[@]}"; do
            u="$n@$EXPECTED_TRADING_SHA.service"
            before_pid["$n"]="$(systemctl show "$u" -p MainPID --value 2>/dev/null || true)"
            before_state["$n"]="$(systemctl is-active "$u" 2>/dev/null || true)"
            before_restarts["$n"]="$(systemctl show "$u" -p NRestarts --value 2>/dev/null || true)"
          done

          [[ -d "$GOOD_UI_WORKDIR/.next" ]]
          [[ -d "$GOOD_UI_WORKDIR/node_modules" ]]
          [[ -f "$GOOD_UI_WORKDIR/.disdex-release-sha" ]]
          [[ "$(tr -d '[:space:]' < "$GOOD_UI_WORKDIR/.disdex-release-sha")" == "$GOOD_UI_SHA" ]]

          final_override="$(find "$dropin_dir" -maxdepth 1 -type f -name '*.conf' -printf '%f\n' | LC_ALL=C sort | tail -1)"
          [[ -n "$final_override" ]]
          override="$dropin_dir/$final_override"
          grep -Fxq "WorkingDirectory=/home/deploy/disdex-trading/ui-releases/ui-formal-a23edd762810" "$override"
          grep -Fxq "Environment=DISDEX_UI_RELEASE_SHA=$EXPECTED_BAD_UI_SHA" "$override"

          backup_dir=/var/backups/disdex-ui-overrides
          install -d -m 0700 "$backup_dir"
          cp -p "$override" "$backup_dir/formal-a23edd-final-override.conf"

          tmp="$dropin_dir/.restore-pre-formal-$$"
          cat > "$tmp" <<EOF
          [Service]
          WorkingDirectory=$GOOD_UI_WORKDIR
          Environment=DISDEX_UI_RELEASE_SHA=$GOOD_UI_SHA
          EOF
          chmod 0644 "$tmp"
          chown root:root "$tmp"
          mv -f "$tmp" "$override"

          systemctl daemon-reload
          systemctl restart "$ui"

          for _ in $(seq 1 30); do
            active="$(systemctl is-active "$ui" 2>/dev/null || true)"
            wd="$(systemctl show "$ui" -p WorkingDirectory --value 2>/dev/null || true)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:3001/ || true)"
            [[ "$active" == active && "$wd" == "$GOOD_UI_WORKDIR" && "$code" == 200 ]] && break
            sleep 1
          done

          [[ "$(systemctl is-active "$ui")" == active ]]
          [[ "$(systemctl show "$ui" -p WorkingDirectory --value)" == "$GOOD_UI_WORKDIR" ]]
          envline="$(systemctl show "$ui" -p Environment --value)"
          printf '%s' "$envline" | tr ' ' '\n' | grep -Fxq "DISDEX_UI_RELEASE_SHA=$GOOD_UI_SHA"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3001/)" == 200 ]]
          [[ "$(basename "$(readlink -f "$current")")" == "$EXPECTED_TRADING_SHA" ]]

          for n in "${runners[@]}"; do
            u="$n@$EXPECTED_TRADING_SHA.service"
            [[ "$(systemctl show "$u" -p MainPID --value 2>/dev/null || true)" == "${before_pid[$n]}" ]]
            [[ "$(systemctl is-active "$u" 2>/dev/null || true)" == "${before_state[$n]}" ]]
            [[ "$(systemctl show "$u" -p NRestarts --value 2>/dev/null || true)" == "${before_restarts[$n]}" ]]
          done

          public_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://professional-dismanager.net/ || true)"

          echo "STATUS=HP_RESTORED_TO_PRE_FORMAL_UI"
          echo "UI_SHA=$GOOD_UI_SHA"
          echo "UI_WORKDIR=$GOOD_UI_WORKDIR"
          echo "LOCAL_HTTP=200"
          echo "PUBLIC_HTTP=$public_code"
          echo "TRADING_SHA_UNCHANGED=$EXPECTED_TRADING_SHA"
          echo "TRADING_RUNNER_PIDS_UNCHANGED=PASS"
          REMOTE
