name: Pair Specific State Machine V99

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_state_machine_v99.py"
      - ".github/workflows/pair-specific-state-machine-v99.yml"
      - "research/pair-specific-state-machine-v99-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-state-machine-v99-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore genuine public USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v99-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            six-pair-v98-usdm-
            distinct-tournament-v56-usdm-
            event-regime-v53-usdm-
            win80-profit-v1-usdm-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch genuine public six-pair USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile research source
        run: python -m py_compile scripts/research_lab_pair_specific_state_machine_v99.py
      - name: Run pair-specific one-year backtest
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_state_machine_v99.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-state-machine-v99
          path: |
            .research-state/pair-specific-state-machine-v99.json
            .research-state/pair-specific-state-machine-v99.md
          if-no-files-found: warn
          retention-days: 30

# Research only. No production/VPS/live/account/order changes.
