name: Research Lab Perpetual Pilot

on:
  pull_request:
    branches:
      - master
    paths:
      - "lib/research-lab/perp/**"
      - "scripts/research-lab-perp-*.ts"
      - "scripts/research_v12_gross_compare_clean.ts"
      - ".github/workflows/research-lab-perp-pilot.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      rounds:
        description: Discovery rounds
        required: true
        default: "20"
      population:
        description: Strategies per round
        required: true
        default: "5"
      finalists:
        description: Strategies sent to Validation and OOS
        required: true
        default: "5"
      symbols:
        description: Comma-separated symbols
        required: true
        default: "BTC,ETH,BNB,SOL,XRP,ADA,AVAX,LINK,LTC,ATOM,AAVE,NEAR,INJ"
      start_date:
        description: Research start date
        required: true
        default: "2023-01-01"
      end_date:
        description: Research end date
        required: true
        default: "2026-07-01"

permissions:
  contents: read

jobs:
  perpetual-pilot:
    if: ${{ github.head_ref != 'research/v12-gross-compare-clean-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BINANCE_PUBLIC_ARCHIVE_ONLY: "true"
      PERP_RESEARCH_ROUNDS: ${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '10' }}
      PERP_RESEARCH_POPULATION: ${{ github.event_name == 'workflow_dispatch' && inputs.population || '5' }}
      PERP_RESEARCH_ELITES: "2"
      PERP_RESEARCH_FINALISTS: ${{ github.event_name == 'workflow_dispatch' && inputs.finalists || '5' }}
      PERP_RESEARCH_CONCURRENCY: "1"
      PERP_RESEARCH_WALK_FORWARD_FOLDS: "3"
      PERP_RESEARCH_TARGET_MONTHLY_PCT: "30"
      PERP_RESEARCH_FINAL_OOS_MONTHLY_PCT: "30"
      PERP_RESEARCH_FINAL_STRESS_MONTHLY_PCT: "20"
      PERP_RESEARCH_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.symbols || 'BTC,ETH,BNB,SOL,XRP,ADA,AVAX,LINK,LTC,ATOM,AAVE,NEAR,INJ' }}
      PERP_RESEARCH_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '2023-01-01' }}
      PERP_RESEARCH_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '2026-07-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research
          key: perp-market-data-v1-${{ env.PERP_RESEARCH_START_DATE }}-${{ env.PERP_RESEARCH_END_DATE }}-${{ hashFiles('lib/research-lab/perp/data-store.ts', 'lib/backtest/binance-source.ts') }}
          restore-keys: |
            perp-market-data-v1-
      - run: npm ci
      - run: npm run typecheck
      - run: npm run research:perp:selftest
      - run: npm run research:perp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-lab-perpetual-pilot
          path: reports/research-lab-perp
          if-no-files-found: warn
          retention-days: 30

  v12-gross-compare:
    if: ${{ github.head_ref == 'research/v12-gross-compare-clean-20260821' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BINANCE_PUBLIC_ARCHIVE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research
          key: v12-gross-compare-2023-07-01-2026-07-01-${{ hashFiles('lib/research-lab/perp/data-store.ts', 'lib/backtest/binance-source.ts') }}
          restore-keys: |
            perp-market-data-v1-
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/research_v12_gross_compare_clean.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-gross-compare-clean
          path: .research-state/v12-gross-compare.json
          if-no-files-found: warn
          retention-days: 30
