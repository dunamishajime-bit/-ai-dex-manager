name: Aster-only V30 Frozen IR Event Drift

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v30_sec_filing_event_drift_tournament.py'
      - 'scripts/run_aster_only_v30_frozen_ir_event_tournament.py'
      - 'docs/research/ASTER_ONLY_V30_SEC_FILING_EVENT_DRIFT_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v30-sec-filing-event-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v30-ir-event-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v30-ir-event
          key: aster-only-v30-ir-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v30_sec_filing_event_drift_tournament.py', 'scripts/run_aster_only_v30_frozen_ir_event_tournament.py') }}
          restore-keys: |
            aster-only-v30-ir-${{ runner.os }}-
            aster-only-v27-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v27_beta_squeeze_orb_tournament.py \
            scripts/research_lab_aster_only_v30_sec_filing_event_drift_tournament.py \
            scripts/run_aster_only_v30_frozen_ir_event_tournament.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v30_sec_filing_event_drift_tournament as v30
          import run_aster_only_v30_frozen_ir_event_tournament as runner
          assert (v30.v19.BT_END_EXCLUSIVE - v30.v19.BT_START).days == 365
          assert len(v30.CANDIDATES) == 640
          assert v30.BASELINE_NORMAL == 72.276908
          assert v30.BASELINE_P95 == 68.080022
          assert v30.DAILY_LOSS_LOCK == -0.02
          assert v30.TP_PCT == 1.00
          assert v30.SL_PCT == 0.75
          assert v30.load_sec_events is runner.load_frozen_ir_events
          assert v30.analyze is runner.analyze_with_frozen_ir_events
          assert set(runner.FROZEN_EARNINGS_RELEASE_DATES) == set(v30.SYMBOLS)
          assert sum(len(value) for value in runner.FROZEN_EARNINGS_RELEASE_DATES.values()) == 21
          assert all(candidate.maximum_holding_hours in {1, 2} for candidate in v30.CANDIDATES)
          assert all(candidate.slot in {1, 2} for candidate in v30.CANDIDATES)
          assert all(candidate.maximum_event_age in {0, 1} for candidate in v30.CANDIDATES)
          print('V30 frozen IR freeze assertions: PASS')
          PY
      - name: Run V30 frozen IR event tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v30-ir-event
          set -o pipefail
          cd scripts
          python run_aster_only_v30_frozen_ir_event_tournament.py \
            --cache-dir ../.cache/aster-only-v30-ir-event \
            --output-dir ../.research-state/aster-only-v30-ir-event \
            2>&1 | tee ../.research-state/aster-only-v30-ir-event/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v30-ir-event/result.json
          test -s .research-state/aster-only-v30-ir-event/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v30-ir-event/result.json').read_text())
          assert p['version'] == 30
          assert p['candidateCount'] == 640
          assert p['period']['calendarDays'] == 365
          assert p['architecture'] == {
              'venue': 'ASTER_ONLY',
              'maximumConcurrentGross': 1.0,
              'maximumConcurrentPositions': 1,
              'sequentialEventThenV19Allowed': True,
              'hyperliquidUsed': False,
          }
          assert p['selectionDiscipline']['filingSessionRule'] == 'strictly next aligned session after frozen official IR earnings release date'
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['data']['sec']['sourceMode'] == 'FROZEN_OFFICIAL_IR_RELEASE_DATES'
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V30_NO_VALIDATED_SEC_EVENT_DRIFT',
              'ASTER_ONLY_V30_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V30_VALIDATED_SHADOW_LEAD',
          }
          if p['status'] == 'ASTER_ONLY_V30_VALIDATED_SHADOW_LEAD':
              assert p['winner']['accepted'] is True
              assert all(p['winner']['audit']['checks'].values())
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
              'topDiagnostics': p['topDiagnostics'][:5],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v30-ir-event-${{ github.run_id }}
          path: .research-state/aster-only-v30-ir-event
          retention-days: 90
          if-no-files-found: warn
