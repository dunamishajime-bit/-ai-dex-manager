name: DisDex V12 gate sensitivity (read-only research)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  research:
    if: >-
      github.event.issue.number == 132 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'DISDEX_V12_GATE_SENSITIVITY_20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout production-lineage research code
        uses: actions/checkout@v4
        with:
          ref: 62ef73ff1da1507231489a5a4d2a564cddce18d6
      - name: Set up Node.js 24 with cached dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify existing frozen win-rate and Q102 gate unit tests
        run: |
          set -Eeuo pipefail
          npx tsx --test tests/v12-winrate-entry-gate.test.ts
          npx tsx scripts/disdex-quality102-causal-v4-s34-selftest.ts
          npx tsx scripts/disdex-quality102-causal-v4-model-selftest.ts
      - name: Compare frozen V12 gate with isolated research variants using public Aster bars
        env:
          GATE_RESEARCH_OUT: v12-short-gate-sensitivity-20260926.json
        run: npx tsx scripts/research-v12-gate-sensitivity-20260926.ts
      - name: Archive source-backed short-sample results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-v12-gate-sensitivity-20260926
          path: v12-short-gate-sensitivity-20260926.json
          if-no-files-found: warn
          retention-days: 14
