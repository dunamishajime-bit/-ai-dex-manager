name: Pair Specific V107 Early Wave

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_v107.py"
      - ".github/workflows/pair-specific-v107.yml"
      - "research/pair-specific-v107-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-v107-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact-window genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Install dependencies
        run: npm ci
      - name: Refresh genuine public six-pair USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Normalize exact-window cache filename
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated')
          for sym in ['BTC','ETH','BNB','SOL','LINK','AVAX']:
              exact=root/f'{sym}USDT-1661990400000-1786287600000-v3.json'
              if exact.exists():
                  continue
              matches=sorted(root.glob(f'{sym}USDT-1661990400000-*-v3.json'))
              if not matches:
                  raise SystemExit(f'MISSING_GENUINE_CACHE:{sym}')
              src=matches[-1]
              exact.write_bytes(src.read_bytes())
          PY

  research:
    needs: data
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        style: [phase_slope, energy_release, leadership_wave]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v107.py
      - name: Run early-wave pair-specific family
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v107.py --style "${{ matrix.style }}"
      - name: Verify requested fixed window
        run: |
          python - <<'PY'
          import json, pathlib
          style='${{ matrix.style }}'
          p=pathlib.Path(f'.research-state/pair-specific-v107-{style}.json')
          d=json.loads(p.read_text())
          want_start=1754751600000
          want_end=1786287600000
          got_start=d['periods']['fixedWindowStart']
          got_end=d['periods']['fixedWindowEndExclusive']
          if (got_start,got_end)!=(want_start,want_end):
              raise SystemExit(f'EXACT_WINDOW_MISMATCH:{got_start}:{got_end}:wanted:{want_start}:{want_end}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v107-${{ matrix.style }}
          path: |
            .research-state/pair-specific-v107-${{ matrix.style }}.json
            .research-state/pair-specific-v107-${{ matrix.style }}.md
          if-no-files-found: warn
          retention-days: 30

# Research only. Exact requested one-year window. Public historical data only.
# No production/VPS/live-trading changes.
