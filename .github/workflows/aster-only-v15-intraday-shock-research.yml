name: Aster-only V15 Intraday Basis Shock Research

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v14_replacement_tournament.py'
      - 'scripts/run_aster_only_v14_with_frozen_v13d_benchmark.py'
      - 'scripts/research_lab_aster_only_v15_intraday_shock_tournament.py'
      - 'docs/research/ASTER_ONLY_V15_INTRADAY_SHOCK_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v15-intraday-shock-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v15-intraday-shock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster research source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D benchmark source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/v96-crypto-v11-v13d-one-year
            .cache/v96-stock-cash-yahoo-v10
            .cache/v96-stock-basis-mature-v9
            .cache/v96-stock-funding
          key: aster-only-v15-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v15_intraday_shock_tournament.py') }}
          restore-keys: |
            aster-only-v15-${{ runner.os }}-
            aster-only-v14-${{ runner.os }}-
            v96-crypto-v11eq-v13d-one-year-${{ runner.os }}-
            v96-crypto-v11-v13d-one-year-${{ runner.os }}-
            v96-stock-cash-perp-v10-${{ runner.os }}-
      - name: Compile and deterministic tests
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/run_aster_only_v14_with_frozen_v13d_benchmark.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py
          python - <<'PY'
          import math
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v15_intraday_shock_tournament as v15
          assert len(v15.CANDIDATES) == 336
          assert len(v15.FAMILY_THRESHOLDS) == 7
          assert v15.slot_indices('FIRST_ELIGIBLE') == (1, 2, 3)
          assert v15.slot_indices('SLOT_1130') == (1,)
          assert v15.receives_funding(-1, 0.5) is True
          assert v15.receives_funding(1, -0.5) is True
          assert v15.receives_funding(1, 0.5) is False
          sample = [{
              'holdingHours': 1.0,
              'grossReturn': 0.02,
              'edgeProxyBps': 100.0,
              'fundingReturn': 0.0,
              'side': -1,
              'symbol': 'TEST',
              'exitReason': 'TIME_1H',
          }]
          normal = v15.v14.metrics(sample, 40.0)
          assert normal['trades'] == 1
          assert math.isclose(normal['averageTradeBps'], 160.0, abs_tol=1e-9)
          severe = v15.v14.metrics(sample, 100.0)
          assert severe['trades'] == 0
          print('Aster-only V15 deterministic tests: PASS')
          PY
      - name: Run fixed V15 intraday tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v15-intraday
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v15_intraday_shock_tournament.py \
            --cache-dir ../.cache/v96-crypto-v11-v13d-one-year \
            --output-dir ../.research-state/aster-only-v15-intraday \
            2>&1 | tee ../.research-state/aster-only-v15-intraday/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v15-intraday/result.json
          test -s .research-state/aster-only-v15-intraday/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v15-intraday/result.json').read_text())
          assert p['version'] == 15
          assert p['candidateCount'] == 336
          assert p['familyCount'] == 7
          assert p['rules']['venue'] == 'ASTER_ONLY'
          assert p['rules']['hyperliquidUsed'] is False
          assert p['rules']['entrySlotsNy'] == ['11:30', '12:30', '13:30']
          assert p['rules']['maximumHoldingHours'] == [1, 2]
          assert p['rules']['severeCostAction'] == 'FAIL_CLOSED_NO_ENTRY'
          assert p['v13dBenchmark']['twoVenueCapitalHoursIncluded'] is True
          assert p['v13dBenchmark']['frozenSuccessfulArtifact']['workflowRun'] == 30117325883
          assert p['selectionDiscipline']['independentHoldoutClaim'] is False
          assert p['selectionDiscipline']['furtherThresholdRetuningOnSameHistoryAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'NO_VALIDATION_PASSING_ASTER_ONLY_V15_CANDIDATE',
              'ASTER_ONLY_V15_VALIDATION_LEAD_DOES_NOT_FULLY_REPLACE_V13D',
              'ASTER_ONLY_V15_PROFIT_TARGET_MET_REUSED_HISTORY_FORWARD_REQUIRED',
          }
          print(json.dumps({
              'status': p['status'],
              'period': p['period'],
              'v13d': p['v13dBenchmark']['results'],
              'winner': p.get('winner'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v15-intraday-${{ github.run_id }}
          path: .research-state/aster-only-v15-intraday
          retention-days: 90
          if-no-files-found: warn
