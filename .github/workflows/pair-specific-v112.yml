name: Pair Specific V112 Distinct Wave Lifecycles

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_v112.py"
      - ".github/workflows/pair-specific-v112.yml"
      - "research/pair-specific-v112-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-v112-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [pullback_reentry, compression_escape, leadership_transition]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact-window genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v112.py
      - name: Run pair-specific V112 architecture
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v112.py --kind "${{ matrix.kind }}"
      - name: Verify requested fixed window
        run: |
          python - <<'PY'
          import json,pathlib
          kind='${{ matrix.kind }}'
          d=json.loads(pathlib.Path(f'.research-state/pair-specific-v112-{kind}.json').read_text())
          want=(1754751600000,1786287600000)
          got=(d['periods']['fixedWindowStart'],d['periods']['fixedWindowEndExclusive'])
          if got!=want: raise SystemExit(f'EXACT_WINDOW_MISMATCH:{got}:wanted:{want}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v112-${{ matrix.kind }}
          path: |
            .research-state/pair-specific-v112-${{ matrix.kind }}.json
            .research-state/pair-specific-v112-${{ matrix.kind }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only. No production/VPS/live-trading changes.
