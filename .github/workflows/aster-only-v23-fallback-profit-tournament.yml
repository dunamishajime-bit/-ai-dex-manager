name: Aster-only V23 Fallback Profit Tournament

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v23_fallback_profit_tournament.py'
      - 'docs/research/ASTER_ONLY_V23_FALLBACK_PROFIT_TOURNAMENT_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v23-fallback-profit-tournament.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v23-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v23-fallback
          key: aster-only-v23-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v23_fallback_profit_tournament.py') }}
          restore-keys: |
            aster-only-v23-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v23_fallback_profit_tournament.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v23_fallback_profit_tournament as v23
          assert len(v23.v15.CANDIDATES) == 336
          assert v23.v19.CANDIDATE.candidate_id == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert v23.MIN_VALIDATION_ROUTER_TRADES == 8
          assert v23.MIN_VALIDATION_FALLBACK_TRADES == 4
          assert v23.v20.STRICT_HURDLES['minimumNormalReturnPct'] == 50.0
          assert v23.v20.STRICT_HURDLES['minimumP95ReturnPct'] == 30.0
          print('V23 fallback freeze assertions: PASS')
          PY
      - name: Run V23 fallback tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v23-fallback
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v23_fallback_profit_tournament.py \
            --cache-dir ../.cache/aster-only-v23-fallback \
            --output-dir ../.research-state/aster-only-v23-fallback \
            2>&1 | tee ../.research-state/aster-only-v23-fallback/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v23-fallback/result.json
          test -s .research-state/aster-only-v23-fallback/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v23-fallback/result.json').read_text())
          assert p['version'] == 23
          assert p['period']['calendarDays'] == 365
          assert p['candidateUniverse'] == 336
          assert p['selectionDiscipline']['candidateGridPredeclared'] is True
          assert p['selectionDiscipline']['validationSelectsAtMostOne'] is True
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          assert p['status'] in {
            'ASTER_ONLY_V23_NO_VALIDATED_FALLBACK_IMPROVEMENT',
            'ASTER_ONLY_V23_FALLBACK_STRICT_IMPROVEMENT_SHADOW_ONLY',
            'ASTER_ONLY_V23_VALIDATED_CANDIDATE_DID_NOT_STRICTLY_IMPROVE',
          }
          if p['status'] == 'ASTER_ONLY_V23_FALLBACK_STRICT_IMPROVEMENT_SHADOW_ONLY':
              assert p['allImprovementChecksPassed'] is True
              assert all(p['improvementChecks'].values())
          print(json.dumps({
            'status': p['status'],
            'developmentSurvivors': p['developmentSurvivors'],
            'validationSurvivors': p['validationSurvivors'],
            'selectedCandidate': p.get('selectedCandidate'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v23-fallback-${{ github.run_id }}
          path: .research-state/aster-only-v23-fallback
          retention-days: 90
          if-no-files-found: warn
