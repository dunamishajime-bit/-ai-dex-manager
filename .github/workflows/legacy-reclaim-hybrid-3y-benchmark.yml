name: Legacy Reclaim Hybrid 3Y Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_legacy_reclaim_hybrid_3y_benchmark.ts
      - .github/workflows/legacy-reclaim-hybrid-3y-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run diagnostic benchmark
        run: npx tsx scripts/research_legacy_reclaim_hybrid_3y_benchmark.ts
      - name: Assert diagnostic-only boundary
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/legacy-reclaim-hybrid-3y-benchmark.json','utf8'));
          if (!d.researchOnly || !d.diagnosticOnly) throw new Error('not diagnostic research');
          if (d.productionChanged || d.vpsChanged || d.liveChanged || d.realTradingEnabled || d.freshOosRead || d.freshOosConsumed || d.liveEligible) throw new Error('boundary violation');
          if (d.antiOverfitWarning.candidateEligible) throw new Error('legacy benchmark cannot be candidate eligible');
          if (d.declaredProfile.feeRatePerSide !== 0.003) throw new Error('legacy fee changed');
          if (d.declaredProfile.maxConcurrentPositions !== 1) throw new Error('legacy exposure changed');
          console.log('LEGACY_BENCHMARK_DIAGNOSTIC_BOUNDARY_PASS');
          NODE
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-reclaim-hybrid-3y-benchmark
          path: .research-state/legacy-reclaim-hybrid-3y-benchmark.json
          if-no-files-found: warn
          retention-days: 30
