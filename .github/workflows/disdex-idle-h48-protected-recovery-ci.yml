name: DisDex IDLE H48 Protected Recovery Policy CI

on:
  pull_request:
    paths:
      - "scripts/ops/deploy/disdex_idle_h48_protected_recovery.py"
      - "scripts/ops/deploy/disdex_h48_protected_hold.py"
      - "tests/test_disdex_idle_h48_protected_recovery.py"
      - "tests/test_disdex_h48_protected_hold.py"
      - ".github/workflows/disdex-idle-h48-protected-recovery.yml"
      - ".github/workflows/disdex-idle-h48-protected-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and run offline contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/deploy/disdex_idle_h48_protected_recovery.py \
            scripts/ops/deploy/disdex_h48_protected_hold.py
          python3 -m unittest \
            tests.test_disdex_idle_h48_protected_recovery \
            tests.test_disdex_h48_protected_hold -v
      - name: Enforce formal non-order boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          helper = Path("scripts/ops/deploy/disdex_idle_h48_protected_recovery.py").read_text()
          workflow = Path(".github/workflows/disdex-idle-h48-protected-recovery.yml").read_text()
          for item in (
              "allow_expired_observation=True",
              "ordersEnabled",
              "is False",
              "ordersSent\": 0",
              "cancelsSent\": 0",
              "positionChangesSent\": 0",
              "KILL_CHANGED_DURING_HEALTH_CHECK",
              "IDLE_STATE_CHANGED_BEFORE_REFRESH",
              "backup_state",
              "finish_task_step",
              "claim_task_step",
          ):
              assert item in helper or item in workflow, item
          for item in (
              "disdex-production",
              "IDLE_FLAT_STALE_REPAIR",
              "--orders-enabled false",
              "DISDEX_VPS_ROOT_PRIVATE_KEY",
          ):
              assert item in workflow, item
          for forbidden in ("cancelOrder", "createOrder", "test-order", "kill-switch clear"):
              assert forbidden not in helper
          print("IDLE_H48_PROTECTED_NON_ORDER_POLICY=PASS")
          PY
