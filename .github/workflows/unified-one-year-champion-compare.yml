name: Unified One Year Champion Compare

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_unified_1y_champion_compare.py"
      - ".github/workflows/unified-one-year-champion-compare.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: unified-one-year-champion-compare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || { echo FROZEN_V109_SOURCE_DRIFT >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_unified_1y_champion_compare.py
      - name: Run exact same-window comparison
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_unified_1y_champion_compare.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-one-year-champion-compare-v1
          path: .research-state/unified-one-year-champion-compare-v1.json
          if-no-files-found: warn
          retention-days: 30

# Research-only comparison. No Production/LIVE/VPS changes.
