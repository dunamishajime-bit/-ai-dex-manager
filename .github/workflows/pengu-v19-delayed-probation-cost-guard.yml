name: PENGU V19 Delayed Probation Cost Guard Development

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'docs/research/PENGU_V19_DELAYED_PROBATION_COST_GUARD_PREREG_20260824.md'
      - 'scripts/research_pengu_short_v19_delayed_probation_cost_guard.py'
      - '.github/workflows/pengu-v19-delayed-probation-cost-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run frozen V19 on known venues only
        run: python scripts/research_pengu_short_v19_delayed_probation_cost_guard.py
      - name: Validate preregistration and KuCoin holdout lock
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-short-v19/development-result.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate']=='COUNTERWIND_DELAYED_PROBATION_COST_GUARD'
          assert x['preRegistrationSha']=='21b82c72b0c14d23f16a907bc252e02c30b393ed'
          assert x['parentV18PreRegistrationSha']=='42bb6297d893125ad3b2de0a9e26dba342852223'
          assert x['candidateCount']==1 and x['thresholdSweep'] is False and x['ruleChangeCount']==1
          assert x['kucoinPerformanceObserved'] is False
          assert x['promotionPass'] is False
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          if x['developmentPass']:
              assert x['kucoinHoldoutStatus']=='ELIGIBLE_TO_OPEN'
          else:
              assert x['kucoinHoldoutStatus']=='RESERVED_UNOPENED'
          print(json.dumps({'developmentPass':x['developmentPass'],'venuePasses':x['venuePasses'],'kucoinHoldoutStatus':x['kucoinHoldoutStatus'],'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v19-development-${{ github.run_id }}
          path: .research-state/pengu-short-v19
          if-no-files-found: error
