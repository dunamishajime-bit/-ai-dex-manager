name: Idle Priority frozen baseline overlay accounting
on:
  push:
    branches: [design/idle-priority-bt-parity-20260929]
    paths:
      - ".github/workflows/idle-priority-frozen-baseline-overlay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download baseline release and run overlay accounting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bt-v12-score100-volume080-normalonly-20260928 --repo dunamishajime-bit/-ai-dex-manager --pattern 'bt-v12-score100-volume080-normalonly-20260928.tar.gz'
          echo '891c36d8a5957cafe3aae65656a98b7c02a3c437c4f520fe63756d550f08b4fb  bt-v12-score100-volume080-normalonly-20260928.tar.gz' | sha256sum -c -
          mkdir evidence
          tar -xzf bt-v12-score100-volume080-normalonly-20260928.tar.gz -C evidence
          LEDGER="$(find evidence -type f -path '*/selected-five-logic-all-cases-all-costs/BRK0P75_MR0P75_FET1_DUAL_GATE/PRICE_MODEL_10BPS/portfolio-trades.jsonl' | head -1)"
          test -n "$LEDGER"
          DIR="$(dirname "$LEDGER")"
          EVENTS="$DIR/portfolio-events.jsonl"
          METRICS="$DIR/metrics.json"
          test -f "$EVENTS"
          test -f "$METRICS"
          test "$(wc -l < "$LEDGER")" -eq 1284
          python research/idle_priority_frozen_baseline_wallet_overlay.py \
            --baseline-trades "$LEDGER" \
            --baseline-events "$EVENTS" \
            --baseline-metrics "$METRICS" \
            --idle-intents research/idle_priority_61_intents.json \
            --idle-target-net research/idle_priority_61_target_net.json \
            --output frozen-overlay.json | tee frozen-overlay.log
          python - <<'PY'
          import json
          x=json.load(open("frozen-overlay.json"))
          for k in ["BASE_WALLET_ONLY","BASE_PLUS_REALIZED_IDLE"]:
              y=x[k]
              print(k, "final_jpy", y["final_equity_jpy_at_baseline_final_fx"], "idle_pnl_jpy", y["idle_realized_pnl_final_fx_jpy"])
          print("combined_count",x["combined_trade_count_if_no_baseline_removal"])
          print("baseline_idle_entry_violations",x["baseline_idle_entry_violations"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: idle-priority-frozen-baseline-overlay
          path: |
            frozen-overlay.json
            frozen-overlay.log
          retention-days: 30
