name: Loss Only Firewall Collateral Eval

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_loss_only_firewall_collateral_eval.py
      - .github/workflows/loss-only-firewall-collateral-eval.yml

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811
      - name: Assert firewall frozen before winner evaluation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_loss_only_firewall_frozen_v1.py)" = "f60fa2d4876bb7e6334a530325d7547a6f805edd"
          test "$(git hash-object scripts/research_loss_only_firewall_discovery.py)" = "a7e4999f18e3bf6ad67c291a5dc43843feaf01b8"
          test "$(git hash-object scripts/research_loss_only_firewall_collateral_eval.py)" = "6760d7d922345a3c2a1c1c66a946fed5729de85a"
          echo LOSS_ONLY_FIREWALL_FREEZE_PASS
      - name: Download full recovered harvest after firewall freeze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import io,json,os,urllib.error,urllib.request,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN']
          hh={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'loss-only-collateral'}
          def js(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=hh),timeout=90) as r:return json.load(r)
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          def blob(url):
              op=urllib.request.build_opener(NR);q=urllib.request.Request(url,headers=hh)
              try:
                  with op.open(q,timeout=60) as r:return r.read()
              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308):raise
                  loc=e.headers.get('Location');
                  if not loc:raise RuntimeError('NO_REDIRECT_LOCATION')
                  with urllib.request.urlopen(urllib.request.Request(loc,headers={'User-Agent':'loss-only-collateral-blob'}),timeout=120) as r:return r.read()
          arts=[a for a in js(f'https://api.github.com/repos/{repo}/actions/artifacts?name=loss-only-trade-harvest-v2&per_page=100').get('artifacts',[]) if not a.get('expired')]
          if not arts:raise SystemExit('NO_HARVEST_V2')
          a=max(arts,key=lambda x:x['created_at']);z=zipfile.ZipFile(io.BytesIO(blob(a['archive_download_url'])))
          names={n.split('/')[-1]:n for n in z.namelist()};os.makedirs('.research-state',exist_ok=True)
          for base in ('loss-only-normalized-trades.jsonl','loss-only-trade-harvest-summary.json'):
              if base not in names:raise SystemExit('MISSING:'+base)
              open('.research-state/'+base,'wb').write(z.read(names[base]))
          s=json.load(open('.research-state/loss-only-trade-harvest-summary.json'))
          assert s['rawCandidateRecords']>0 and s['winningOrFlatRecords']>0 and s['losingRecords']>0 and s['downloadErrors']==0
          print('FULL_HARVEST_AFTER_FREEZE_PASS',s['rawCandidateRecords'])
      - name: Install prefetch dependencies
        run: npm ci
      - name: Prefetch frozen historical OHLCV only
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Verify exact six-symbol inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated');syms=('BTC','SOL','LINK','ETH','BNB','AVAX')
          missing=[s for s in syms if not (root/f'{s}USDT-1661990400000-1782864000000-v3.json').is_file()]
          if missing:raise SystemExit('MISSING_EXACT_INPUTS:'+','.join(missing))
          print('COLLATERAL_EXACT_INPUTS_PASS')
          PY
      - name: Compile
        run: python -m py_compile scripts/research_loss_only_firewall_discovery.py scripts/research_loss_only_firewall_frozen_v1.py scripts/research_loss_only_firewall_collateral_eval.py
      - name: Evaluate frozen firewall collateral
        env:
          LOSS_ONLY_ALL_TRADES_PATH: .research-state/loss-only-normalized-trades.jsonl
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_loss_only_firewall_collateral_eval.py
      - name: Assert no blocker rescue tuning
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/loss-only-firewall-collateral-eval.json').read_text())
          assert x['firewallFrozenBeforeWinnerEvaluation'] is True and x['winnerFeaturesNowInspected'] is True and x['blockersModifiedAfterWinnerInspection'] is False
          assert len(x['frozenBlockers'])==8
          assert x['productionChanged'] is False and x['vpsChanged'] is False and x['liveChanged'] is False and x['realTradingEnabled'] is False and x['freshOosRead'] is False
          print('COLLATERAL_NO_RETUNE_PASS')
          PY
      - name: Upload collateral evaluation
        uses: actions/upload-artifact@v4
        with:
          name: loss-only-firewall-collateral-eval
          path: |
            .research-state/loss-only-firewall-collateral-eval.json
            .research-state/loss-only-firewall-collateral-eval.md
            .research-state/loss-only-firewall-collateral-trades.jsonl
          retention-days: 30
