name: Perpetual microstructure event backtest

on:
  push:
    branches:
      - analysis/microstructure-events-20260715
    paths:
      - "research/microstructure_parts/**"
      - "research/aster_binance_live_collector.py"
      - ".github/workflows/microstructure-events.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tabulate websockets
      - name: Assemble script
        run: cat research/microstructure_parts/*.part > research/microstructure_event_backtest.py
      - name: Validate syntax
        run: python -m py_compile research/microstructure_event_backtest.py research/aster_binance_live_collector.py
      - name: Run backtest
        run: python research/microstructure_event_backtest.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microstructure-event-backtest-report
          path: backtest_output_microstructure/
          if-no-files-found: warn
