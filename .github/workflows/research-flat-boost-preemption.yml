name: Research flat boost preemption

on:
  workflow_dispatch:
    inputs:
      recovered_input_root:
        description: "Checked-in or pre-staged research-only directory containing the recovered 90-row inputs"
        required: false
        default: ".research-state/formal-inputs"
      canonical_runner:
        description: "Research-only reconstructed run_canonical_margin_compare.py path"
        required: false
        default: ".research-state/formal-inputs/run_canonical_margin_compare.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lineage-gate-and-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore stock cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/perp-research-usdm
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: flat-boost-preemption-${{ runner.os }}-${{ hashFiles('scripts/research_flat_boost_preemption_20260918.py') }}
          restore-keys: |
            aster-only-v52-v39cache-
            perp-research-usdm-

      - name: Establish explicit recovered input locations (fail closed)
        run: |
          INPUT_ROOT="${{ inputs.recovered_input_root || '.research-state/formal-inputs' }}"
          mkdir -p .research-state/formal-inputs
          test -f "$INPUT_ROOT/v12-q54-atr0p014.json"
          test -f "$INPUT_ROOT/pengu-hard-cd24.json"
          test -f "$INPUT_ROOT/candidate-1slot.csv"
          test -f "$INPUT_ROOT/evidence-1slot.csv"
          test -d "$INPUT_ROOT/stock-cache"
          CANONICAL_RUNNER="${{ inputs.canonical_runner || '.research-state/formal-inputs/run_canonical_margin_compare.py' }}"
          test -f "$CANONICAL_RUNNER"
          test -f .stock-research/scripts/research_lab_v96_v52_dual_slot_one_year_bt.py
          echo "INPUT_ROOT=$INPUT_ROOT" >> "$GITHUB_ENV"
          echo "CANONICAL_RUNNER=$CANONICAL_RUNNER" >> "$GITHUB_ENV"

      - name: Run research-only lineage gate and comparison
        run: |
          set -o pipefail
          python scripts/research_flat_boost_preemption_20260918.py \
            --formal-json docs/research-results/v52-final-validated-logic-20260917.json \
            --v12-ledger "$INPUT_ROOT/v12-q54-atr0p014.json" \
            --pengu-ledger "$INPUT_ROOT/pengu-hard-cd24.json" \
            --q102-csv "$INPUT_ROOT/candidate-1slot.csv" \
            --q102-evidence "$INPUT_ROOT/evidence-1slot.csv" \
            --stock-cache-dir "$INPUT_ROOT/stock-cache" \
            --stock-backbone .stock-research/scripts/research_lab_v96_v52_dual_slot_one_year_bt.py \
            --canonical-runner "$CANONICAL_RUNNER" \
            --output-root .research-state/flat-boost-preemption \
            2>&1 | tee .research-state/flat-boost-preemption.log

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-boost-preemption-${{ github.run_id }}
          path: |
            .research-state/flat-boost-preemption
            .research-state/flat-boost-preemption.log
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
