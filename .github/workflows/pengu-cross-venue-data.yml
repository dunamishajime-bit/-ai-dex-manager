name: PENGU Cross Venue Data

on:
  push:
    branches:
      - research/pengu-recovery-validation-20260827
    paths:
      - 'scripts/research_fetch_cross_venue_data.py'
      - '.github/workflows/pengu-cross-venue-data.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fetch-data:
    strategy:
      fail-fast: false
      matrix:
        venue: [OKX, BITGET]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and normalize venue data
        env:
          PENGU_CROSS_VENUE: ${{ matrix.venue }}
          PENGU_LOCAL_DATA_DIR: ${{ github.workspace }}/.research-state/cross-${{ matrix.venue }}
        run: python scripts/research_fetch_cross_venue_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-cross-data-${{ matrix.venue }}-${{ github.run_id }}
          path: .research-state/cross-${{ matrix.venue }}
          retention-days: 90
