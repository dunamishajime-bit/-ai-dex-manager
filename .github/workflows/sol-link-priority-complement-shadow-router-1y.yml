name: SOL LINK Priority Complement Shadow Router 1Y

on:
  workflow_dispatch:
  push:
    branches:
      - codex/priority-router-1y-bt-20260813
    paths:
      - "scripts/research_priority_router_one_year.py"
      - ".github/workflows/sol-link-priority-complement-shadow-router-1y.yml"
      - "research/sol-link-priority-complement-shadow-router-1y.md"

permissions:
  contents: read

concurrency:
  group: sol-link-priority-complement-shadow-router-1y-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen Champion sources
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef"
          test "$(git hash-object scripts/research_pairwise_profit_attribution_v4.py)" = "bd07487b115923443bdf55cc87ca18f66c786142"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore exact research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-

      - name: Install data-prefetch dependencies
        run: npm ci

      - name: Prefetch genuine public USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts

      - name: Verify exact consolidated inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.cache/perp-research-usdm/consolidated')
          required = [
              root / 'BTCUSDT-1661990400000-1786320000000-v3.json',
              root / 'ETHUSDT-1661990400000-1786320000000-v3.json',
              root / 'BNBUSDT-1661990400000-1786320000000-v3.json',
              root / 'SOLUSDT-1661990400000-1786320000000-v3.json',
              root / 'LINKUSDT-1661990400000-1786320000000-v3.json',
              root / 'AVAXUSDT-1661990400000-1786320000000-v3.json',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('MISSING_EXACT_CONSOLIDATED_INPUTS:' + ','.join(missing))
          print('EXACT_CONSOLIDATED_INPUTS_PASS')
          PY

      - name: Provide compatibility names for frozen Champion drivers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.cache/perp-research-usdm/consolidated')
          for symbol in ('BTC', 'ETH', 'BNB', 'SOL', 'LINK', 'AVAX'):
              source = root / f'{symbol}USDT-1661990400000-1786320000000-v3.json'
              target = root / f'{symbol}USDT-1661990400000-1782864000000-v2.json'
              target.write_bytes(source.read_bytes())
          print('FROZEN_CHAMPION_COMPAT_CACHE_PASS')
          PY

      - name: Compile
        run: python -m py_compile scripts/research_priority_router_one_year.py

      - name: Router self-test
        run: python scripts/research_priority_router_one_year.py --self-test

      - name: Run causal one-year backtest
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_priority_router_one_year.py

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-link-priority-complement-shadow-router-1y
          path: .research-state/sol-link-priority-complement-shadow-router-1y.json
          if-no-files-found: warn
          retention-days: 30

# Research-only. No production, LIVE, VPS, approval, state, account or order
# path is imported or mutated by this workflow.
