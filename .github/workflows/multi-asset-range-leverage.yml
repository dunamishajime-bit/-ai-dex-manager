name: Multi-asset leveraged range backtest

on:
  push:
    branches:
      - analysis/multi-asset-range-leverage-20260716
    paths:
      - "research/multi_asset_range_parts/**"
      - ".github/workflows/multi-asset-range-leverage.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/multi_asset_range_parts/**"
      - ".github/workflows/multi-asset-range-leverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Restore 15-minute and funding cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/range_15m
            .cache/range_funding
          key: multi-asset-range-202101-202606-v1

      - name: Assemble research script
        run: cat research/multi_asset_range_parts/*.part > research/multi_asset_range_leverage.py

      - name: Validate syntax
        run: python -m py_compile research/multi_asset_range_leverage.py

      - name: Run multi-asset range validation
        run: |
          set -o pipefail
          python -m research.multi_asset_range_leverage 2>&1 | tee multi_asset_range_leverage.log

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-asset-range-leverage-report
          path: |
            backtest_output_multi_asset_range/
            multi_asset_range_leverage.log
          if-no-files-found: warn
