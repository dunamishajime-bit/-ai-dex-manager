name: V96 Stock Walk-Forward Ridge Tournament V8

on:
  pull_request:
    paths:
      - 'research/v96_stock_walkforward_ridge_tournament_v8.py'
      - 'research/v96_stock_funding_carry_tournament_v4.py'
      - 'research/v96_stock_swing_tournament_v3.py'
      - 'research/v96_stock_intraday_theme_flow_backtest.py'
      - '.github/workflows/v96-stock-walkforward-ridge-tournament-v8.yml'
  workflow_dispatch:

concurrency:
  group: v96-stock-ridge-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore price and Funding cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/v96-stock-intraday-theme-flow
            .cache/v96-stock-funding
          key: v96-stock-ridge-v8-${{ runner.os }}-${{ hashFiles('research/v96_stock_walkforward_ridge_tournament_v8.py') }}
          restore-keys: |
            v96-stock-ridge-v8-${{ runner.os }}-
            v96-stock-funding-v4-${{ runner.os }}-
            v96-stock-intraday-15m-${{ runner.os }}-
      - name: Compile and self-test
        run: |
          python -m py_compile research/v96_stock_intraday_theme_flow_backtest.py
          python -m py_compile research/v96_stock_swing_tournament_v3.py
          python -m py_compile research/v96_stock_funding_carry_tournament_v4.py
          python -m py_compile research/v96_stock_walkforward_ridge_tournament_v8.py
          cd research
          python v96_stock_walkforward_ridge_tournament_v8.py --self-test
      - name: Run walk-forward tournament
        run: |
          cd research
          python v96_stock_walkforward_ridge_tournament_v8.py \
            --price-cache-dir ../.cache/v96-stock-intraday-theme-flow \
            --funding-cache-dir ../.cache/v96-stock-funding \
            --output-dir ../.research-state/v96-stock-walkforward-ridge-tournament-v8
      - name: Validate evidence
        run: |
          test -s .research-state/v96-stock-walkforward-ridge-tournament-v8/v96-stock-walkforward-ridge-tournament-v8.json
          test -s .research-state/v96-stock-walkforward-ridge-tournament-v8/v96-stock-walkforward-ridge-tournament-v8.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v96-stock-walkforward-ridge-tournament-v8/v96-stock-walkforward-ridge-tournament-v8.json').read_text())
          assert p['candidateCount'] == 12
          assert p['familyCount'] == 4
          assert p['selectionDiscipline']['holdoutRetuningAllowed'] is False
          assert p['selectionDiscipline']['modelFit'].startswith('expanding walk-forward')
          assert p['status'] in {
              'CRYPTO_LIKE_WALKFORWARD_EDGE_FOUND_REUSED_HISTORY_SHADOW_ONLY',
              'ROBUST_POSITIVE_WALKFORWARD_EDGE_FOUND_REUSED_HISTORY_SHADOW_ONLY',
              'WALKFORWARD_VALIDATION_LEAD_FAILED_REUSED_HOLDOUT',
              'NO_VALIDATION_PASSING_WALKFORWARD_FAMILY',
          }
          assert p['safety']['orderSubmissionAllowed'] is False
          assert p['safety']['productionChanged'] is False
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v96-stock-walkforward-ridge-tournament-v8
          path: .research-state/v96-stock-walkforward-ridge-tournament-v8
          retention-days: 90
