name: Research V26 Latency-Aware Structural Search
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/v26-latency-aware-search-20260816]
    paths:
      - scripts/research_v26_latency_aware_search.ts
      - .github/workflows/research-v26-latency-aware-search.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert frozen research source
        run: test "$(git hash-object scripts/research_v26_latency_aware_search.ts)" = "74ad62260d59ead74ff6b88cc5ae9472728b45c1"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - run: npm ci
      - name: Run latency-aware structural search
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_v26_latency_aware_search.ts
      - name: Assert research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/v26-latency-aware-search.json','utf8'));
          if(!d.researchOnly||d.productionChanged||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(!d.penguExcluded||d.universe.includes('PENGU')||d.universe.length!==14) throw new Error('UNIVERSE_FAIL');
          if(d.leverage!==1) throw new Error('LEVERAGE_FAIL');
          if(!d.selectionProtocol.validationEvaluationUntouchedUntilDevSurvivor) throw new Error('D_V_BOUNDARY_FAIL');
          console.log('V26_LATENCY_AWARE_BOUNDARY_PASS');
          NODE
      - name: Publish immutable research result on research branch
        run: |
          mkdir -p docs/research-results
          cp .research-state/v26-latency-aware-search.json docs/research-results/v26-latency-aware-search-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-results/v26-latency-aware-search-latest.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "research: record V26 latency-aware search result [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v26-latency-aware-search
          path: .research-state/v26-latency-aware-search.json
          include-hidden-files: true
          retention-days: 30
