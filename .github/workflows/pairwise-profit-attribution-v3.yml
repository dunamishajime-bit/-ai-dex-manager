name: Pairwise Profit Attribution V3

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_pairwise_profit_attribution_v3.py"
      - ".github/workflows/pairwise-profit-attribution-v3.yml"
      - "research/pairwise-profit-attribution-v3-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pairwise-profit-attribution-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pair: [BTC, ETH, BNB, SOL, LINK, AVAX]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || { echo FROZEN_V109_SOURCE_DRIFT >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_pairwise_profit_attribution_v3.py
      - name: Run D/V profit attribution V3
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_pairwise_profit_attribution_v3.py --pair "${{ matrix.pair }}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair }}-profit-attribution-v3
          path: .research-state/${{ matrix.pair == 'BTC' && 'btc' || matrix.pair == 'ETH' && 'eth' || matrix.pair == 'BNB' && 'bnb' || matrix.pair == 'SOL' && 'sol' || matrix.pair == 'LINK' && 'link' || 'avax' }}-profit-attribution-v3.json
          if-no-files-found: warn
          retention-days: 30

# Development selects among two predeclared structural component families per pair.
# Validation is fixed after selection. Confirmation/Holdout remain untouched.
# SOL/LINK preserve V109 entry; ETH/AVAX add only missing-winner secondary structures;
# BTC/BNB re-extract entry families. No production/live/VPS changes.
