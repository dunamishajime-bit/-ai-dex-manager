name: Task 9 dynamic research verification

on:
  push:
    paths:
      - ".github/workflows/task9-dynamic-integrated-bt.yml"
      - "docs/research/results/dd-reduction-dynamic-baseline-task6-20261021/**"
      - "docs/research/results/dd-reduction-initial-adverse-stop-audit-20261020/**"
      - "docs/research/results/dd-reduction-source-recovery-noncanonical-20261021/**"
      - "lib/backtest/dd-reduction/**"
      - "scripts/dd-reduction/**"
      - "config/research/task9-unified-v12-short-20261021.json"
      - "tests/dd-reduction-*.test.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/task9-dynamic-integrated-bt.yml"
      - "docs/research/results/dd-reduction-dynamic-baseline-task6-20261021/**"
      - "docs/research/results/dd-reduction-initial-adverse-stop-audit-20261020/**"
      - "docs/research/results/dd-reduction-source-recovery-noncanonical-20261021/**"
      - "lib/backtest/dd-reduction/**"
      - "scripts/dd-reduction/**"
      - "config/research/task9-unified-v12-short-20261021.json"
      - "tests/dd-reduction-*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: task9-dynamic-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-task9-dynamic-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete DD reduction test discovery
        run: npm run dd:reduction:test
      - name: Type-check without emitting files
        run: npx tsc --noEmit --incremental false --pretty false
      - name: Run self-contained Python research discovery
        run: python scripts/dd-reduction/run-task9-python-discovery.py
      - name: Verify historical model source provenance and fail-closed boundaries
        run: python scripts/dd-reduction/test_task9_existing_evidence.py
      - name: Lint Task 9 research runner, verifier, and tests
        run: npx eslint scripts/dd-reduction/run-task9-dynamic.ts tests/dd-reduction-task9-dynamic-cases.test.ts scripts/dd-reduction/verify-task9-dynamic-artifacts.ts tests/dd-reduction-dynamic-artifacts.test.ts
      - name: Verify compact research artifacts and fail-closed classifications
        run: npm run dd:reduction:artifacts
      - name: Verify independent 35-symbol modeled BT report metadata
        run: python scripts/dd-reduction/verify-task9-sourcebacked-5m-artifacts.py
      - name: Verify unified frozen-source and Task 9 policy bridge
        run: python scripts/dd-reduction/verify-task9-unified-bridge.py
      - name: Verify Task 9 first-divergence gate fixtures
        run: python scripts/dd-reduction/test_task9_first_divergence.py
      - name: Verify native causal-source STOP / cooldown instrumentation regression
        run: python scripts/dd-reduction/test_task9_native_full8.py
      - name: Verify independent native core economics and 20 ledger SHA research evidence
        run: python scripts/dd-reduction/verify-task9-native-compact-artifacts.py
      - name: Lint native core cross-language verifier
        run: npx eslint scripts/dd-reduction/run-task9-native-full8-unified.ts
      - name: Check patch whitespace
        run: git diff --check
