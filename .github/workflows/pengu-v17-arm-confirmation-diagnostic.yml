name: PENGU V17 Arm Confirmation Diagnostic

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'V17_ARM_CONFIRMATION_DIAGNOSTIC.md'
      - 'scripts/research_pengu_v17_arm_confirmation_diagnostic.py'
      - '.github/workflows/pengu-v17-arm-confirmation-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Diagnose frozen V17 arm confirmation
        run: python scripts/research_pengu_v17_arm_confirmation_diagnostic.py
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-v17-arm-confirmation-diagnostic/diagnostic.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['diagnosticOnly'] is True
          assert x['frozenCandidate']=='CONFIRMED_PROGRESS_FAIL_STRESS_COVER_PROBATION'
          assert x['frozenPreRegistrationSha']=='9197d2dbcf486a5be0ef5ad4c9275b4c912b90b9'
          assert x['candidateCount']==0 and x['thresholdSweep'] is False
          assert set(x['summary'])=={'OKX','Binance','Gate','Bitget'}
          assert x['kucoinPerformanceObserved'] is False
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'counts':{k:len(v) for k,v in x['summary'].items()},'wickOnlyArms':{k:sum(1 for e in v if e.get('closeConfirmedArm') is False) for k,v in x['summary'].items()},'safety':x['safety']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v17-arm-confirmation-diagnostic-${{ github.run_id }}
          path: .research-state/pengu-v17-arm-confirmation-diagnostic
          if-no-files-found: error
