name: PENGU V57 Extended Cross Venue BT

on:
  push:
    branches:
      - research/pengu-wave-sleeve-v47
    paths:
      - scripts/research_lab_pengu_wave_sleeve_v47.py
      - scripts/research_lab_pengu_wave_sleeve_v49.py
      - scripts/research_lab_pengu_wave_sleeve_v50.py
      - scripts/research_lab_pengu_wave_sleeve_v52.py
      - scripts/research_lab_pengu_wave_sleeve_v56.py
      - scripts/research_lab_pengu_wave_sleeve_v57.py
      - scripts/research_lab_pengu_v57_extended_bt.py
      - .github/workflows/pengu-v57-extended-bt.yml
  pull_request:
    branches:
      - master
    paths:
      - scripts/research_lab_pengu_wave_sleeve_v47.py
      - scripts/research_lab_pengu_wave_sleeve_v49.py
      - scripts/research_lab_pengu_wave_sleeve_v50.py
      - scripts/research_lab_pengu_wave_sleeve_v52.py
      - scripts/research_lab_pengu_wave_sleeve_v56.py
      - scripts/research_lab_pengu_wave_sleeve_v57.py
      - scripts/research_lab_pengu_v57_extended_bt.py
      - .github/workflows/pengu-v57-extended-bt.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research_lab_pengu_wave_sleeve_v47.py scripts/research_lab_pengu_wave_sleeve_v49.py scripts/research_lab_pengu_wave_sleeve_v50.py scripts/research_lab_pengu_wave_sleeve_v52.py scripts/research_lab_pengu_wave_sleeve_v56.py scripts/research_lab_pengu_wave_sleeve_v57.py scripts/research_lab_pengu_v57_extended_bt.py
      - name: Run fixed extended cross venue backtest
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_pengu_v57_extended_bt.py 2>&1 | tee .research-state/pengu-v57-extended-bt.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pengu-v57-extended-bt
          path: |
            .research-state/pengu-v57-extended-bt.json
            .research-state/pengu-v57-extended-bt.md
            .research-state/pengu-v57-extended-bt.log
          if-no-files-found: warn
          retention-days: 30
