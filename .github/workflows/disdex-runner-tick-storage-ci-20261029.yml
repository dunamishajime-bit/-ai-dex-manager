name: Runner Tick Heartbeat Writable Storage Contract
on:
  push:
    branches:
      - fix/runner-tick-storage-permissions-20261029
  pull_request:
    paths:
      - scripts/ops/root/disdex-current-runtime-wiring
      - tests/runner-tick-storage-contract.test.mjs
      - .github/workflows/disdex-runner-tick-storage-ci-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-linux-permission-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash -n scripts/ops/root/disdex-current-runtime-wiring
      - run: node --test tests/runner-tick-storage-contract.test.mjs
      - name: Ensure no trading credentials or real orders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/ops/root/disdex-current-runtime-wiring').read_text()
          assert 'ensure_runner_tick_storage' in source
          assert 'install -d -o deploy -g deploy -m 0700 "$RUNNER_TICK_HEARTBEAT_DIR"' in source
          assert 'ReadWritePaths=${RUNNER_TICK_HEARTBEAT_DIR}' in source
          print('READ_ONLY_SOURCE_GATE_PASS')
          PY
