name: V12 market-state loss-cluster research BT
on:
  push:
    branches:
      - research/v12-market-state-loss-cluster-20260923
    paths:
      - scripts/audit_v12_today_signal_rebuild_20260923.ts
      - .github/workflows/v12-market-state-loss-cluster-research.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Rebuild today's signals
        run: |
          npx tsx scripts/audit_v12_today_signal_rebuild_20260923.ts | tee /tmp/v12-today-signal-rebuild.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v12-today-signal-rebuild
          path: /tmp/v12-today-signal-rebuild.txt
