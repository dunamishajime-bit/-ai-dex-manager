name: V96 V52 PENGU Dual LS V1 Unified Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - research/v96-v52-pengu-dual-ls-v1-combined-bt
    paths:
      - 'research/evidence/trail6_3_36_dual_ledger.csv'
      - 'scripts/research_lab_pengu_dual_ls_v1_evidence_replay.py'
      - 'scripts/research_lab_v96_v52_pengu_dual_ls_v1_combined_bt.py'
      - 'scripts/research_lab_v96_v52_pengu_dual_ls_v1_routing_audit.py'
      - '.github/workflows/v96-v52-pengu-dual-ls-v1-combined-bt.yml'

permissions:
  contents: read

concurrency:
  group: v96-v52-pengu-dual-ls-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout unified research branch
        uses: actions/checkout@v4

      - name: Checkout frozen accepted PENGU evidence
        uses: actions/checkout@v4
        with:
          ref: 520b18285187573487d2dafa39d8d1e13f9d48cf
          path: .pengu-evidence
          fetch-depth: 1

      - name: Checkout frozen V96 V52 research source
        uses: actions/checkout@v4
        with:
          ref: research/v96-v52-dual-slot-one-year-bt
          path: .research-base
          fetch-depth: 1

      - name: Checkout frozen V11 source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .research-base/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 dependency source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .research-base/.v13
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .cache/perp-research-usdm
            .research-base/.cache/perp-research-usdm
          key: v96-v52-pengu-dual-ls-v1-frozen-${{ runner.os }}-${{ hashFiles('research/evidence/trail6_3_36_dual_ledger.csv', 'scripts/research_lab_v96_v52_pengu_dual_ls_v1_combined_bt.py', 'scripts/research_lab_pengu_dual_ls_v1_evidence_replay.py', 'scripts/research_lab_v96_v52_pengu_dual_ls_v1_routing_audit.py') }}
          restore-keys: |
            v96-v52-pengu-dual-ls-v1-frozen-${{ runner.os }}-
            v96-v52-dual-slot-one-year-${{ runner.os }}-
            aster-only-v52-v39cache-${{ runner.os }}-
            v96-volume50-turnover075-full-${{ runner.os }}-
            perp-research-usdm-

      - name: Static Python compile check
        run: |
          python -m py_compile scripts/research_lab_pengu_dual_ls_v1_evidence_replay.py
          python -m py_compile scripts/research_lab_v96_v52_pengu_dual_ls_v1_combined_bt.py
          python -m py_compile scripts/research_lab_v96_v52_pengu_dual_ls_v1_routing_audit.py

      - name: Replay frozen accepted PENGU Dual LS V1 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research-state/v96-v52-pengu-dual-ls-v1
          python scripts/research_lab_pengu_dual_ls_v1_evidence_replay.py \
            --evidence-root .pengu-evidence/reports/pengu-v46-repro/data \
            --ledger research/evidence/trail6_3_36_dual_ledger.csv \
            --output .research-state/v96-v52-pengu-dual-ls-v1/pengu-evidence-replay.json \
            2>&1 | tee .research-state/v96-v52-pengu-dual-ls-v1/pengu-evidence-replay.log

      - name: Require accepted PENGU standalone reproduction before portfolio merge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v96-v52-pengu-dual-ls-v1/pengu-evidence-replay.json').read_text())
          f = p['fullMetrics']
          h = p['holdoutMetrics']
          assert f['trades'] == 73, f
          assert f['longs'] == 26, f
          assert f['shorts'] == 47, f
          assert abs(f['compoundedReturnPct'] - 453.8728109085672) < 0.05, f
          assert abs(f['profitFactor'] - 3.4009110979235766) < 0.01, f
          assert abs(f['winRatePct'] - 72.6027397260274) < 0.01, f
          assert abs(f['maxDrawdownPct'] - (-6.643885312020137)) < 0.05, f
          assert h['trades'] == 30, h
          assert abs(h['compoundedReturnPct'] - 49.73) < 0.20, h
          assert abs(h['profitFactor'] - 2.290) < 0.03, h
          assert abs(h['winRatePct'] - 66.66666666666667) < 0.01, h
          assert abs(h['maxDrawdownPct'] - (-6.64)) < 0.10, h
          assert p['integrity']['noOverlap'] is True
          assert p['integrity']['maximumRequestedGross'] == 0.75
          print('ACCEPTED_PENGU_EVIDENCE_REPRODUCED')
          print(json.dumps({'full': f, 'holdout': h, 'diagnostics': p['diagnostics']}, indent=2))
          PY

      - name: Run unified V96 Core plus accepted PENGU Dual LS V1 plus V52 backtest
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_lab_v96_v52_pengu_dual_ls_v1_combined_bt.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --pengu-replay .research-state/v96-v52-pengu-dual-ls-v1/pengu-evidence-replay.json \
            --output-dir .research-state/v96-v52-pengu-dual-ls-v1 \
            2>&1 | tee .research-state/v96-v52-pengu-dual-ls-v1/backtest.log

      - name: Run routing-only with and without PENGU audit
        shell: bash
        run: |
          set -o pipefail
          python scripts/research_lab_v96_v52_pengu_dual_ls_v1_routing_audit.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --pengu-replay .research-state/v96-v52-pengu-dual-ls-v1/pengu-evidence-replay.json \
            --output .research-state/v96-v52-pengu-dual-ls-v1/routing-audit.json \
            2>&1 | tee .research-state/v96-v52-pengu-dual-ls-v1/routing-audit.log

      - name: Validate result and research safety
        run: |
          test -s .research-state/v96-v52-pengu-dual-ls-v1/result.json
          test -s .research-state/v96-v52-pengu-dual-ls-v1/report.md
          test -s .research-state/v96-v52-pengu-dual-ls-v1/routing-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v96-v52-pengu-dual-ls-v1/result.json').read_text())
          audit = json.loads(Path('.research-state/v96-v52-pengu-dual-ls-v1/routing-audit.json').read_text())
          assert p['period']['startInclusive'].startswith('2025-08-13')
          assert p['period']['holdoutFreshStartInclusive'].startswith('2026-03-11')
          assert p['architecture']['penguGrossCap'] == 0.75
          assert p['architecture']['totalGrossCap'] == 2.5
          assert p['checks']['legacyPenguRemovedFromV96'] is True
          assert p['checks']['penguReplayNoOverlap'] is True
          for scenario in ('NORMAL', 'SEVERE'):
              for order in ('CORE_FIRST', 'PENGU_FIRST'):
                  for window in ('full', 'holdoutFreshStart'):
                      row = p['results'][scenario][order][window]
                      assert row['observedMaximumTotalGross'] <= 2.5 + 1e-9
                      a = audit['comparison'][scenario][order][window]
                      assert a['observedMaximumTotalGross'] <= 2.5 + 1e-9
          assert audit['dailyLossLatchEnabled'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'ordersSent': False,
              'liveChanged': False,
              'vpsChanged': False,
              'productionChanged': False,
          }
          assert audit['safety'] == p['safety']
          print(json.dumps({
              'status': p['status'],
              'period': p['period'],
              'dailyLockApproxNormal': p['results']['NORMAL'],
              'routingOnlyComparison': audit['comparison']['NORMAL'],
              'routingOnlySevereComparison': audit['comparison']['SEVERE'],
              'checks': p['checks'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-v52-pengu-dual-ls-v1-${{ github.run_id }}
          path: .research-state/v96-v52-pengu-dual-ls-v1
          retention-days: 90
          if-no-files-found: warn
