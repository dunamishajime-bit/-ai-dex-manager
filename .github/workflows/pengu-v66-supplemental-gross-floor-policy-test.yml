name: PENGU V66 Supplemental Gross Floor Policy Test
on:
  push:
    branches: [research/pengu-v57-conditional-regime-20260826]
    paths:
      - 'scripts/test_research_v66_supplemental_gross_floor.py'
      - 'scripts/research_patch_v66_supplemental_gross_floor.py'
      - '.github/workflows/pengu-v66-supplemental-gross-floor-policy-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: V66 policy contract
        run: python scripts/test_research_v66_supplemental_gross_floor.py
