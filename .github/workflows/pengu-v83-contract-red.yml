name: PENGU V83 Contract RED
on:
  workflow_dispatch:
  push:
    branches: [research/pengu-v82-composite-regime-20260827]
    paths:
      - 'scripts/test_research_v83_composite_contract.py'
      - 'scripts/test_research_v83_replacement_escaping.py'
      - 'scripts/research_patch_v83_independent_long_sleeve.py'
      - '.github/workflows/pengu-v83-contract-red.yml'
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/test_research_v83_composite_contract.py
      - run: python scripts/test_research_v83_replacement_escaping.py
