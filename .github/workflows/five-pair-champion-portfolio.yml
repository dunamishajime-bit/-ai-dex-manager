name: Five Pair Champion Portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_five_pair_champion_portfolio.py"
      - ".github/workflows/five-pair-champion-portfolio.yml"

permissions:
  contents: read

concurrency:
  group: five-pair-champion-portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || { echo FROZEN_V109_SOURCE_DRIFT >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_five_pair_champion_portfolio.py
      - name: Run D/V portfolio backtest
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_five_pair_champion_portfolio.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-pair-champion-portfolio-v1
          path: .research-state/five-pair-champion-portfolio-v1.json
          if-no-files-found: warn
          retention-days: 30

# BTC: reference features only, zero portfolio weight, no BTC positions.
# Five sleeves are fixed 20% each; BNB sleeve remains cash and is not lent.
# Confirmation/Holdout untouched. Research only; no Production/LIVE/VPS changes.
