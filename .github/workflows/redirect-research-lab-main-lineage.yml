name: Redirect Research Lab to Win80 Ultra90 Lineage

on:
  pull_request:
    branches:
      - master
    paths:
      - "lib/research-lab/perp/main-strategy-research-policy.ts"
      - "scripts/research-lab-main-strategy-policy-selftest.ts"
      - "scripts/redirect-research-lab-to-main-lineage.py"
      - ".github/workflows/redirect-research-lab-main-lineage.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: redirect-research-lab-main-lineage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply research direction patch
        run: python scripts/redirect-research-lab-to-main-lineage.py

      - name: Install dependencies
        run: npm ci

      - name: Main-lineage policy self-test
        run: npm run research:main-lineage:selftest

      - name: Champion deep self-test
        run: npm run research:champion:selftest

      - name: Discussion self-test
        run: npm run research:discussion:selftest

      - name: TypeScript checks
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            app/api/research-lab/latest/route.ts \
            components/research-lab/ChampionDeepResearchPanel.tsx \
            docs/research-lab-autonomous.md \
            lib/research-lab/dashboard-types.ts \
            lib/research-lab/perp/deep-autonomous.ts \
            scripts/research-lab-autonomous-runner.ts
          if git diff --cached --quiet; then
            echo "No generated integration changes to commit."
            exit 0
          fi
          git commit -m "Research Lab: focus on Win80 Ultra90 main lineage [generated]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
