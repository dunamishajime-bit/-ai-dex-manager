name: V96 Crowding Guarded Boost Replay

on:
  pull_request:
    branches:
      - research/v71-dd-v35-growth-v82
    paths:
      - scripts/research_lab_v96_crowding_guarded_boost_replay.py
      - scripts/research_lab_v96_basis_alpha_screen.py
      - scripts/research_lab_v96_core_exact_boost_pyramid.py
      - scripts/research_lab_v35_weight_band_strong_v95.py
      - .github/workflows/v96-crowding-guarded-boost-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research_lab_v96_crowding_guarded_boost_replay.py
      - name: Run crowding-guarded exact replay
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_v96_crowding_guarded_boost_replay.py
      - name: Upload crowding-guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v96-crowding-guarded-boost-replay
          path: |
            .research-state/v96-crowding-guarded-boost-replay.json
            .research-state/v96-crowding-guarded-boost-replay.md
          if-no-files-found: warn
          retention-days: 90
