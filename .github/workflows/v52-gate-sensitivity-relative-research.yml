name: V52 Gate Sensitivity Relative Research

on:
  pull_request:
    paths:
      - 'scripts/research_lab_v52_gate_sensitivity.py'
      - 'scripts/research_lab_v52_gate_sensitivity_relative.py'
      - '.github/workflows/v52-gate-sensitivity-relative-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 dependency source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .cache/perp-research-usdm
            .cache/v96-crypto-v11-v13d-one-year
          key: v52-gate-sensitivity-relative-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v52_gate_sensitivity_relative.py') }}
          restore-keys: |
            v52-gate-sensitivity-${{ runner.os }}-
            v96-v52-dual-slot-one-year-${{ runner.os }}-
            aster-only-v52-v39cache-${{ runner.os }}-
            aster-only-v39-${{ runner.os }}-
      - name: Compile and self-test
        run: |
          python -m py_compile scripts/research_lab_v52_gate_sensitivity.py scripts/research_lab_v52_gate_sensitivity_relative.py
          python scripts/research_lab_v52_gate_sensitivity_relative.py --self-test
      - name: Run relative gate sensitivity sweep
        run: |
          mkdir -p .research-state/v52-gate-sensitivity-relative
          python scripts/research_lab_v52_gate_sensitivity_relative.py \
            --cache-root .cache/aster-only-v39-overnight-open \
            --output-dir .research-state/v52-gate-sensitivity-relative | tee .research-state/v52-gate-sensitivity-relative/backtest.log
      - name: Validate research-only result
        run: |
          test -s .research-state/v52-gate-sensitivity-relative/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/v52-gate-sensitivity-relative/result.json').read_text())
          assert p['strategyId']=='DISDEX_V52_GATE_SENSITIVITY_RELATIVE_RESEARCH_ONLY'
          assert p['selection']['usesHoldout'] is False
          assert p['recommendation']['productionChangeAllowed'] is False
          assert p['recommendation']['liveGateChanged'] is False
          assert p['safety']['orderSubmissionAllowed'] is False
          assert p['lockedWinner']['full']['NORMAL']['routing']['maximumObservedGross'] <= 1.5 + 1e-9
          print(json.dumps({'status':p['status'],'candidate':p['recommendation']['candidateId'],'checks':p['finalChecks']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-gate-sensitivity-relative-${{ github.run_id }}
          path: .research-state/v52-gate-sensitivity-relative
          retention-days: 90
          if-no-files-found: warn
