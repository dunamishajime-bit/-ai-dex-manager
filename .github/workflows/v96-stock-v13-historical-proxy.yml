name: V96 Stock V13 Historical Proxy Backtest

on:
  pull_request:
    paths:
      - "research/v96_stock_cross_venue_maker_v13_historical_proxy.py"
      - "docs/research/V96_STOCK_V13_HISTORICAL_PROXY_PROTOCOL_2026-07-24.md"
      - "docs/research/V96_STOCK_V13_HISTORICAL_PROXY_RESULT_2026-07-24.md"
      - ".github/workflows/v96-stock-v13-historical-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v96-stock-v13-historical-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and deterministic self-test
        run: |
          python -m py_compile research/v96_stock_cross_venue_maker_v13_historical_proxy.py
          python research/v96_stock_cross_venue_maker_v13_historical_proxy.py --self-test
      - name: Run fixed historical proxy backtest
        run: |
          python research/v96_stock_cross_venue_maker_v13_historical_proxy.py \
            --cache-dir .cache/v13-historical-proxy \
            --output-dir .research-state/v13-historical-proxy
      - name: Validate evidence and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.research-state/v13-historical-proxy/result.json')
          result = json.loads(path.read_text())
          assert result['status'] != 'PENDING', result
          assert result['safety']['orderSubmissionAllowed'] is False
          assert result['safety']['productionChanged'] is False
          assert result['safety']['liveChanged'] is False
          assert result['safety']['vpsChanged'] is False
          assert result['safety']['cryptoV96Changed'] is False
          assert result['safety']['v11Changed'] is False
          assert result['safety']['forwardCollectorChanged'] is False
          assert result['universe'] == ['AMZN', 'META', 'MSFT', 'NVDA', 'TSLA']
          for interval in ('1m', '15m'):
              for symbol in result['universe']:
                  diag = result['data']['diagnostics'][interval][symbol]
                  assert diag['asterBars'] > 0, (interval, symbol, diag)
                  assert diag['xyzBars'] > 0, (interval, symbol, diag)
                  assert diag['alignedBars'] > 0, (interval, symbol, diag)
          print(json.dumps({
              'strategyId': result['strategyId'],
              'status': result['status'],
              'oneMinute': {
                  maker: {
                      model: result['results']['1m'][maker][model]['forcedTakerCosts']['full']
                      for model in ('OPEN_CROSS_STRICT', 'INTRABAR_TOUCH_UPPER')
                  }
                  for maker in ('ASTER', 'XYZ')
              },
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-stock-v13-historical-proxy-${{ github.run_id }}
          path: |
            .research-state/v13-historical-proxy
            .cache/v13-historical-proxy
          retention-days: 90
          if-no-files-found: warn
