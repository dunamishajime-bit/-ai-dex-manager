name: STABLE4 production integration

on:
  workflow_dispatch:
  push:
    branches: ['codex/stable4-production-integration-20261115']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Causal opportunity, native provenance and final admission
        run: npx tsx --test tests/stable4-*.test.ts
      - name: H48 due exits and V4 preemption regression
        run: npx tsx --test tests/hype-h48-*.test.ts tests/hype-stable4-*.test.ts
      - name: Python signed final admission and entry provenance
        run: |
          python3 -B scripts/disdex_stable4_entry_gross_guard_selftest.py
          python3 -B scripts/disdex_stable4_entry_gross_integration_selftest.py
          python3 -B scripts/disdex_stable4_v52_entry_provenance_selftest.py
      - name: Native Stable4 strategy contracts
        run: |
          npx tsx scripts/stable4-q102-selftest.ts
          npx tsx scripts/stable4-pengu-livebase-selftest.ts
          npx tsx scripts/stable4-hype-livebase-selftest.ts
          npx tsx scripts/stable4-idle-livebase-selftest.ts
      - name: Immutable candidate source inventory (review-only)
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 -B scripts/ops/build_stable4_runtime_source_manifest.py --source-sha "$CANDIDATE_SHA" > stable4-runtime-source-review.json
          python3 -c "import json,os; d=json.load(open('stable4-runtime-source-review.json',encoding='utf-8')); assert d['sourceSha']==os.environ['CANDIDATE_SHA'] and d['scope']=='REVIEW_ONLY' and d['ordersEnabled'] is False"
      - name: Preserve source inventory for external-root review
        uses: actions/upload-artifact@v4
        with:
          name: stable4-source-review
          path: stable4-runtime-source-review.json
          if-no-files-found: error
          retention-days: 30
      - name: Root source-only cutover and rollback contracts
        run: |
          python3 -B -m unittest discover -s scripts/ops/root -p 'test_disdex_pending_composite_*.py' -v
          python3 -B -m unittest discover -s scripts/ops/root -p 'test_*stable4*.py' -v
          python3 -B -m unittest discover -s scripts/ops/root -p 'test_disdex_v4_nonflat_ownership.py' -v
          python3 -B -m unittest discover -s scripts/ops/root -p 'test_disdex_composite_owner_witness.py' -v
          python3 -B -m unittest discover -s scripts/ops -p 'test_build_stable4_runtime_source_manifest.py' -v
      - name: Independent research DD validation (synthetic, no private fills)
        run: python3 -B -m unittest discover -s scripts/ops -p 'test_stable4_research_dd_independent_audit.py' -v
      - name: Research Gross vs candidate pin parity (synthetic, private BT never uploaded)
        run: python3 -B -m unittest discover -s scripts/ops -p 'test_stable4_gross_policy_parity_gate.py' -v
      - name: Repository typecheck
        run: npm run typecheck
