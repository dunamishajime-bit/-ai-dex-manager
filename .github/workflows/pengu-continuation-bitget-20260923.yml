name: PENGU Continuation Bitget Cross Validation
on:
  push:
    branches:
      - research/pengu-continuation-reentry-20260923
    paths:
      - scripts/research_pengu_continuation_reentry_bitget_20260923.ts
      - .github/workflows/pengu-continuation-bitget-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Bitget cross validation
        env:
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_continuation_reentry_bitget_20260923.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-continuation-bitget
          path: .research-state/pengu-continuation-reentry-bitget
          retention-days: 90
