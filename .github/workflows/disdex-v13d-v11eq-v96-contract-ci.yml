name: Dis-Dex PENGU V52 Fail-Closed CI

on:
  pull_request:
    paths:
      - 'config/disdexV96Runtime.ts'
      - 'config/penguDualLsV1Runtime.ts'
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/aster-v3-client.ts'
      - 'lib/disdex-v96-live-risk-controls.ts'
      - 'lib/disdex-v96-portfolio-runner.ts'
      - 'lib/disdex-v96-runner-state.ts'
      - 'lib/pengu-dual-ls-v1*.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v96-live-runner.ts'
      - 'scripts/disdex-v96-legacy-reconcile.ts'
      - 'scripts/pengu-dual-ls-v1-selftest.ts'
      - 'scripts/pengu-dual-ls-v1-live-preflight.ts'
      - 'scripts/pengu-live-kill-switch-release.ts'
      - 'ops/systemd/disdex-v13d-v11eq-v96.service'
      - 'ops/env/disdex-v13d-v11eq-v96.env.example'
      - 'tsconfig.pengu-dual-ls-v1.json'
      - 'tsconfig.v96-runner.json'
      - 'tsconfig.v13d-v11eq-router.json'
      - 'package.json'
      - '.github/workflows/disdex-v13d-v11eq-v96-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dis-dex-pengu-v52-fail-closed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pengu-cross-platform:
    name: PENGU self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck isolated PENGU execution boundary
        run: npm run strategy:pengu-dual-ls-v1:typecheck
      - name: Run PENGU cross-platform self-test
        run: npm run strategy:pengu-dual-ls-v1:selftest
      - name: Assert supervisor never starts legacy V96
        run: npm run strategy:disdex-v13d-v11eq-v96:supervisor:selftest

  fail-closed-contract:
    name: Fail-closed execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck combined, PENGU, and legacy reconciliation code
        run: |
          npm run strategy:disdex-v13d-v11eq-v96:contract:typecheck
          npm run strategy:pengu-dual-ls-v1:typecheck
          npm run strategy:disdex-v96:typecheck
      - name: Preserve historical V96 algorithm tests without LIVE execution
        run: |
          npm run strategy:disdex-v96:selftest
          npm run strategy:disdex-v96:frequency:selftest
          npm run strategy:disdex-v96:execution:selftest
      - name: Verify production crypto isolation and no-order remediation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = {
            supervisor: fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-runner.ts', 'utf8'),
            preflight: fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-preflight.ts', 'utf8'),
            penguPreflight: fs.readFileSync('scripts/pengu-dual-ls-v1-live-preflight.ts', 'utf8'),
            penguSelftest: fs.readFileSync('scripts/pengu-dual-ls-v1-selftest.ts', 'utf8'),
            legacyRunner: fs.readFileSync('scripts/disdex-v96-live-runner.ts', 'utf8'),
            reconcile: fs.readFileSync('scripts/disdex-v96-legacy-reconcile.ts', 'utf8'),
            release: fs.readFileSync('scripts/pengu-live-kill-switch-release.ts', 'utf8'),
            service: fs.readFileSync('ops/systemd/disdex-v13d-v11eq-v96.service', 'utf8'),
            env: fs.readFileSync('ops/env/disdex-v13d-v11eq-v96.env.example', 'utf8'),
          };
          const requireText = (name, text, needle) => {
            if (!text.includes(needle)) throw new Error(`${name}: missing ${needle}`);
            console.log(`PASS ${name}: ${needle}`);
          };
          const forbidText = (name, text, needle) => {
            if (text.includes(needle)) throw new Error(`${name}: forbidden ${needle}`);
            console.log(`PASS ${name}: forbidden text absent`);
          };

          requireText('supervisor', files.supervisor, 'cryptoRunner: "PENGU_DUAL_LS_V1_ONLY"');
          requireText('supervisor', files.supervisor, 'DISDEX_ENABLE_LEGACY_V96_LIVE: "false"');
          forbidText('supervisor', files.supervisor, 'spawn(tsx, ["scripts/disdex-v96-live-runner.ts"');
          requireText('supervisor', files.supervisor, 'scripts/pengu-dual-ls-v1-live-preflight.ts');

          requireText('legacy runner', files.legacyRunner, 'assertLegacyV96LiveRetired(runnerMode)');
          requireText('legacy runner', files.legacyRunner, 'LEGACY_V96_LIVE_RETIRED');

          requireText('combined preflight', files.preflight, 'scripts/pengu-dual-ls-v1-live-preflight.ts');
          forbidText('combined preflight', files.preflight, 'scripts/disdex-v96-live-preflight.ts');
          forbidText('combined preflight', files.preflight, 'disdex-v96-combined-state-migrate');

          requireText('PENGU preflight', files.penguPreflight, 'PENGU_PREFLIGHT_KILL_SWITCH_ACTIVE');
          requireText('PENGU preflight', files.penguPreflight, 'PENGU_PREFLIGHT_OPEN_ORDER_COUNT');
          requireText('PENGU preflight', files.penguPreflight, 'PENGU_PREFLIGHT_INVALID_POSITION_OR_MARK_PRICE');
          forbidText('PENGU preflight', files.penguPreflight, '.executeMarket(');
          forbidText('PENGU preflight', files.penguPreflight, '.placeMarketOrder(');

          requireText('legacy reconciliation', files.reconcile, 'RECONCILE_LEGACY_V96_FLAT_STATE');
          requireText('legacy reconciliation', files.reconcile, 'LEGACY_RECONCILE_UNEXPECTED_PENDING');
          requireText('legacy reconciliation', files.reconcile, 'SOLUSDT');
          requireText('legacy reconciliation', files.reconcile, 'BNBUSDT');
          requireText('legacy reconciliation', files.reconcile, 'LEGACY_RECONCILE_BNB_EXECUTED_QUANTITY_MISMATCH');
          requireText('legacy reconciliation', files.reconcile, 'LEGACY_RECONCILE_OPEN_ORDERS_PRESENT');
          forbidText('legacy reconciliation', files.reconcile, '.executeMarket(');
          forbidText('legacy reconciliation', files.reconcile, '.placeMarketOrder(');

          requireText('kill-switch release', files.release, 'RELEASE_KILL_SWITCH_AFTER_RECONCILIATION');
          requireText('kill-switch release', files.release, 'LEGACY_V96_RECONCILE_APPLIED');
          requireText('kill-switch release', files.release, 'KILL_SWITCH_RELEASE_OPEN_ORDERS_PRESENT');
          forbidText('kill-switch release', files.release, '.executeMarket(');
          forbidText('kill-switch release', files.release, '.placeMarketOrder(');

          requireText('cross-platform selftest', files.penguSelftest, 'tmpdir()');
          requireText('cross-platform selftest', files.penguSelftest, 'normalize(');
          requireText('systemd', files.service, 'PENGU Dual LS V1');
          requireText('environment', files.env, 'DISDEX_ENABLE_LEGACY_V96_LIVE=false');
          requireText('environment', files.env, 'PENGU_LEGACY_CORE_ENABLED=false');
          forbidText('environment', files.env, 'DISDEX_V96_LIVE_EXECUTION_ENABLED=true');
          NODE
