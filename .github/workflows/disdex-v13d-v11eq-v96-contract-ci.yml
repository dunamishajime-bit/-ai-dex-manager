name: Dis-Dex V96 V52 LIVE Runner CI

on:
  pull_request:
    paths:
      - 'config/disdexV96Runtime.ts'
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/direct-trade-executor.ts'
      - 'lib/disdex-v13d-v11eq-stock-router-contract.ts'
      - 'lib/disdex-v96-combined-state-migration.ts'
      - 'lib/disdex-v96-execution-capacity.ts'
      - 'lib/disdex-v96-portfolio-runner.ts'
      - 'lib/disdex-v96-runner-state.ts'
      - 'scripts/disdex-v13d-v11eq-v96-contract-selftest.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v96-gross-2p5-selftest.ts'
      - 'scripts/disdex-v96-live-preflight.ts'
      - 'scripts/disdex-v96-v52-readonly-preflight.ts'
      - 'scripts/disdex_v96_v52_margin_risk_policy.py'
      - 'scripts/disdex_v96_v52_margin_guard.py'
      - 'scripts/disdex_v96_v52_margin_guard_selftest.py'
      - 'scripts/disdex_v52_margin_aware_live_engine.py'
      - 'requirements-stock-aster-only.txt'
      - 'ops/systemd/disdex-v96-v52-live.service'
      - 'ops/systemd/disdex-v96-v52-preflight@.service'
      - 'ops/systemd/disdex-v96-v52-approval@.service'
      - 'ops/env/disdex-v13d-v11eq-v96.env.example'
      - 'tsconfig.v96-runner.json'
      - 'tsconfig.v13d-v11eq-router.json'
      - 'package.json'
      - '.github/workflows/disdex-v13d-v11eq-v96-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dis-dex-v96-v52-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-stock-aster-only.txt
      - run: npm ci
      - run: python -m pip install -r requirements-stock-aster-only.txt

      - name: Validate V96 plus V52 contracts
        run: |
          set -Eeuo pipefail
          npm run strategy:disdex-v52:contract
          npx tsx scripts/disdex-v96-gross-2p5-selftest.ts
          npm run strategy:disdex-v13d-v11eq-v96:supervisor:selftest
          npm run strategy:disdex-v96-v52:preflight:readonly:selftest
          python3 scripts/disdex_v96_v52_margin_risk_policy.py
          python3 scripts/disdex_v96_v52_margin_guard.py --self-test
          python3 scripts/disdex_v96_v52_margin_guard_selftest.py
          python3 scripts/disdex_v52_margin_aware_live_engine.py --self-test
          python -c "import websocket; print('V52 reference dependencies: PASS')"

      - name: Protect existing Crypto V96 behavior
        run: |
          set -Eeuo pipefail
          npm run strategy:disdex-v96:typecheck
          npm run strategy:disdex-v96:selftest
          npm run strategy:disdex-v96:frequency:selftest
          npm run strategy:disdex-v96:execution:selftest

      - name: Assert separated sleeves and fail-closed LIVE boundaries
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const v96Config = fs.readFileSync('config/disdexV96Runtime.ts', 'utf8');
          const combinedConfig = fs.readFileSync('config/disdexStockRouterV13DV11EqRuntime.ts', 'utf8');
          const supervisor = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-runner.ts', 'utf8');
          const integratedPreflight = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-preflight.ts', 'utf8');
          const readonlyPreflight = fs.readFileSync('scripts/disdex-v96-v52-readonly-preflight.ts', 'utf8');
          const capacity = fs.readFileSync('lib/disdex-v96-execution-capacity.ts', 'utf8');
          const executor = fs.readFileSync('lib/direct-trade-executor.ts', 'utf8');
          const marginPolicy = fs.readFileSync('scripts/disdex_v96_v52_margin_risk_policy.py', 'utf8');
          const marginGuard = fs.readFileSync('scripts/disdex_v96_v52_margin_guard.py', 'utf8');
          const v52 = fs.readFileSync('scripts/disdex_v52_margin_aware_live_engine.py', 'utf8');
          const liveUnit = fs.readFileSync('ops/systemd/disdex-v96-v52-live.service', 'utf8');
          const approvalUnit = fs.readFileSync('ops/systemd/disdex-v96-v52-approval@.service', 'utf8');

          if (!v96Config.includes('penguTargetGross: 1.15')) throw new Error('PENGU target 1.15 missing');
          if (!v96Config.includes('totalGrossCap: 1.5')) throw new Error('V96 Crypto sleeve Gross 1.5 missing');
          if (!v96Config.includes('maximumPortfolioGross: 1.5')) throw new Error('Operator Override V96 Gross 1.5 missing');
          if (!v96Config.includes('requiredInitialLeverage: 5')) throw new Error('fixed 5x leverage missing');
          if (!combinedConfig.includes('cryptoSleeveGrossCap: 1.5')) throw new Error('Crypto sleeve 1.5 missing');
          if (!combinedConfig.includes('stockSleeveGrossCap: 1.5')) throw new Error('Stock sleeve 1.5 missing');
          if (!combinedConfig.includes('portfolioGrossCap: 2.5')) throw new Error('Combined Gross 2.5 missing');
          if (!combinedConfig.includes('reservedFirstStockGross: 1.0')) throw new Error('first Stock slot reservation missing');
          if (!combinedConfig.includes('minimumSecondStockGross: 0.25')) throw new Error('second Stock minimum missing');
          if (!combinedConfig.includes('maximumConcurrentStockPositions: 2')) throw new Error('two Stock slots missing');
          if (!combinedConfig.includes('requiredMarginType: "cross"')) throw new Error('cross margin requirement missing');
          if (!supervisor.includes('scripts/disdex_v52_margin_aware_live_engine.py')) throw new Error('margin-aware V52 supervisor path missing');
          if (!integratedPreflight.includes('scripts/disdex_v52_margin_aware_live_engine.py')) throw new Error('margin-aware V52 preflight path missing');
          if (!readonlyPreflight.includes('READ_ONLY_PREFLIGHT_LEVERAGE_BELOW_')) throw new Error('authenticated leverage gate missing');
          if (!capacity.includes('managedGrossCap') || !capacity.includes('portfolioGrossCap')) throw new Error('separated Gross capacity gates missing');
          if (!capacity.includes('maximumInitialMarginFraction')) throw new Error('initial-margin capacity gate missing');
          if (!executor.includes('--preorder-check') || !executor.includes('command.reduceOnly !== true')) throw new Error('fresh exposure-order Margin Guard missing');
          if (!marginPolicy.includes('HEALTHY_POLL_INTERVAL_MS = 5 * 60_000')) throw new Error('healthy 5-minute polling missing');
          if (!marginPolicy.includes('WARNING_POLL_INTERVAL_MS = 60_000')) throw new Error('warning 1-minute polling missing');
          if (!marginPolicy.includes('REDUCE_MARGIN_RATIO_PCT = 65.0')) throw new Error('pre-liquidation stop-loss threshold missing');
          if (!marginGuard.includes('reduceOnly": "true"')) throw new Error('emergency reduce-only orders missing');
          if (!marginGuard.includes('remainingManagedPositions')) throw new Error('emergency position reconciliation missing');
          if (!v52.includes('V52 adaptive margin-aware concurrent Stock runner self-test: PASS')) throw new Error('adaptive V52 runner missing');
          if (!liveUnit.includes('DISDEX_V96_V52_PREORDER_MARGIN_GUARD_ENABLED=true')) throw new Error('LIVE unit Margin Guard missing');
          if (!approvalUnit.includes('DISDEX_V96_MAX_GROSS=1.5')) throw new Error('approval unit V96 Gross 1.5 missing');
          NODE
