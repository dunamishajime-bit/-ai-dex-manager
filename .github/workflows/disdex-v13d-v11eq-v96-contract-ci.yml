name: Dis-Dex PENGU V52 Fail-Closed CI

on:
  pull_request:
    paths:
      - 'config/disdexV96Runtime.ts'
      - 'config/penguDualLsV1Runtime.ts'
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/aster-v3-client.ts'
      - 'lib/disdex-v96-live-risk-controls.ts'
      - 'lib/disdex-v96-portfolio-runner.ts'
      - 'lib/disdex-v96-runner-state.ts'
      - 'lib/pengu-dual-ls-v1*.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v96-live-runner.ts'
      - 'scripts/disdex-v96-legacy-reconcile.ts'
      - 'scripts/pengu-dual-ls-v1-selftest.ts'
      - 'scripts/pengu-dual-ls-v1-live-preflight.ts'
      - 'scripts/pengu-live-kill-switch-release.ts'
      - 'ops/systemd/disdex-v13d-v11eq-v96.service'
      - 'ops/env/disdex-v13d-v11eq-v96.env.example'
      - 'tsconfig.pengu-dual-ls-v1.json'
      - 'tsconfig.v96-runner.json'
      - 'tsconfig.v13d-v11eq-router.json'
      - 'package.json'
      - '.github/workflows/disdex-v13d-v11eq-v96-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dis-dex-pengu-v52-fail-closed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pengu-cross-platform:
    name: PENGU self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck isolated PENGU execution boundary
        run: npm run strategy:pengu-dual-ls-v1:typecheck
      - name: Run PENGU cross-platform self-test
        run: npm run strategy:pengu-dual-ls-v1:selftest
      - name: Assert supervisor never starts legacy V96
        run: npm run strategy:disdex-v13d-v11eq-v96:supervisor:selftest

  fail-closed-contract:
    name: Fail-closed execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck combined, PENGU, and legacy reconciliation code
        run: |
          npm run strategy:disdex-v13d-v11eq-v96:contract:typecheck
          npm run strategy:pengu-dual-ls-v1:typecheck
          npm run strategy:disdex-v96:typecheck
      - name: Preserve historical V96 algorithm tests without LIVE execution
        run: |
          npm run strategy:disdex-v96:selftest
          npm run strategy:disdex-v96:frequency:selftest
          npm run strategy:disdex-v96:execution:selftest
      - name: Verify production crypto isolation and no-order reconciliation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const supervisor = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-runner.ts', 'utf8');
          const preflight = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-preflight.ts', 'utf8');
          const penguPreflight = fs.readFileSync('scripts/pengu-dual-ls-v1-live-preflight.ts', 'utf8');
          const penguSelftest = fs.readFileSync('scripts/pengu-dual-ls-v1-selftest.ts', 'utf8');
          const legacyRunner = fs.readFileSync('scripts/disdex-v96-live-runner.ts', 'utf8');
          const reconcile = fs.readFileSync('scripts/disdex-v96-legacy-reconcile.ts', 'utf8');
          const release = fs.readFileSync('scripts/pengu-live-kill-switch-release.ts', 'utf8');
          const service = fs.readFileSync('ops/systemd/disdex-v13d-v11eq-v96.service', 'utf8');
          const env = fs.readFileSync('ops/env/disdex-v13d-v11eq-v96.env.example', 'utf8');

          if (!supervisor.includes('cryptoRunner: "PENGU_DUAL_LS_V1_ONLY"')) throw new Error('PENGU-only supervisor marker missing');
          if (!supervisor.includes('DISDEX_ENABLE_LEGACY_V96_LIVE: "false"')) throw new Error('legacy V96 environment block missing');
          if (supervisor.includes('spawn(tsx, ["scripts/disdex-v96-live-runner.ts"')) throw new Error('legacy V96 spawn still present');
          if (!supervisor.includes('scripts/pengu-dual-ls-v1-live-preflight.ts')) throw new Error('isolated PENGU preflight missing from supervisor');
          if (!preflight.includes('scripts/pengu-dual-ls-v1-live-preflight.ts')) throw new Error('system preflight does not call isolated PENGU preflight');
          if (preflight.includes('scripts/disdex-v96-live-preflight.ts') || preflight.includes('disdex-v96-combined-state-migrate')) throw new Error('legacy V96 startup preflight still wired');

          if (!legacyRunner.includes('LEGACY_V96_LIVE_RETIRED')) throw new Error('legacy V96 hard-retirement marker missing');
          if (!legacyRunner.includes('if (runnerMode === "live")')) throw new Error('legacy V96 unconditional LIVE block missing');

          if (!penguPreflight.includes('PENGU_PREFLIGHT_KILL_SWITCH_ACTIVE')) throw new Error('PENGU kill-switch gate missing');
          if (!penguPreflight.includes('PENGU_PREFLIGHT_OPEN_ORDER_COUNT')) throw new Error('PENGU open-order gate missing');
          if (!penguPreflight.includes('PENGU_PREFLIGHT_INVALID_POSITION_OR_MARK_PRICE')) throw new Error('PENGU mark/position validation missing');
          if (penguPreflight.includes('.executeMarket(') || penguPreflight.includes('.placeMarketOrder(')) throw new Error('PENGU preflight must not submit orders');

          if (!reconcile.includes('RECONCILE_LEGACY_V96_FLAT_STATE')) throw new Error('reconciliation acknowledgement missing');
          if (!reconcile.includes('manual_review')) throw new Error('manual-review state gate missing');
          if (!reconcile.includes('BNBUSDT') || !reconcile.includes('reduceOnly')) throw new Error('BNB reduce-only fill evidence gate missing');
          if (!reconcile.includes('LEGACY_V96_RECONCILE_OPEN_ORDERS_PRESENT')) throw new Error('zero-open-orders reconciliation gate missing');
          if (reconcile.includes('.executeMarket(') || reconcile.includes('.placeMarketOrder(')) throw new Error('reconciliation must not submit orders');

          if (!release.includes('RELEASE_KILL_SWITCH_AFTER_RECONCILIATION')) throw new Error('kill-switch release acknowledgement missing');
          if (!release.includes('LEGACY_V96_RECONCILE_APPLIED')) throw new Error('kill-switch release lacks reconciliation evidence gate');
          if (!release.includes('KILL_SWITCH_RELEASE_OPEN_ORDERS_PRESENT')) throw new Error('kill-switch release lacks zero-open-orders gate');
          if (release.includes('.executeMarket(') || release.includes('.placeMarketOrder(')) throw new Error('kill-switch release must not submit orders');

          if (!penguSelftest.includes('tmpdir()') || !penguSelftest.includes('normalize(')) throw new Error('cross-platform temp path regression test missing');
          if (!service.includes('PENGU Dual LS V1')) throw new Error('systemd service description still advertises legacy V96');
          if (!env.includes('DISDEX_ENABLE_LEGACY_V96_LIVE=false')) throw new Error('safe legacy V96 env default missing');
          if (!env.includes('PENGU_LEGACY_CORE_ENABLED=false')) throw new Error('legacy PENGU core env block missing');
          if (env.includes('DISDEX_V96_LIVE_EXECUTION_ENABLED=true')) throw new Error('legacy V96 live authorization remains in env');
          NODE
