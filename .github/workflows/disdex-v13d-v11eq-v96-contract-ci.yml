name: Dis-Dex V96 V52 LIVE Runner CI

on:
  pull_request:
    paths:
      - 'config/disdexV96Runtime.ts'
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/disdex-v13d-v11eq-stock-router-contract.ts'
      - 'lib/disdex-v96-combined-state-migration.ts'
      - 'lib/disdex-v96-execution-capacity.ts'
      - 'lib/disdex-v96-portfolio-runner.ts'
      - 'lib/disdex-v96-runner-state.ts'
      - 'scripts/disdex-v13d-v11eq-v96-contract-selftest.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v13d-v11eq-v96-kill-switch.ts'
      - 'scripts/disdex-v96-combined-state-migrate.ts'
      - 'scripts/disdex-v96-position-reconcile.ts'
      - 'scripts/disdex-v96-execution-safety-selftest.ts'
      - 'scripts/disdex-v96-gross-2p5-selftest.ts'
      - 'scripts/disdex-v96-live-preflight.ts'
      - 'scripts/disdex-v96-v52-readonly-preflight.ts'
      - 'scripts/disdex_v13d_v11eq_stock_live_engine.py'
      - 'scripts/disdex_v11eq_aster_only_live_engine.py'
      - 'scripts/disdex_v52_aster_only_live_engine.py'
      - 'scripts/disdex_stock_reference_pyth_iex_proxy.py'
      - 'requirements-stock-aster-only.txt'
      - 'ops/systemd/disdex-v13d-v11eq-v96.service'
      - 'ops/systemd/disdex-v13d-v11eq-v96-preflight.service'
      - 'ops/systemd/disdex-v96-combined-migration.service'
      - 'ops/systemd/disdex-v96-position-reconciliation.service'
      - 'ops/systemd/disdex-v96-v52-approval@.service'
      - 'ops/systemd/disdex-stock-reference-free.service'
      - 'ops/env/disdex-v13d-v11eq-v96.env.example'
      - 'docs/implementation/V96_V52_VPS_LIVE_HANDOFF.md'
      - 'docs/implementation/V96_V52_GROSS_2P5_PENGU_1P15_HANDOFF.md'
      - 'tsconfig.v96-runner.json'
      - 'tsconfig.v13d-v11eq-router.json'
      - 'package.json'
      - '.github/workflows/disdex-v13d-v11eq-v96-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dis-dex-v96-v52-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-stock-aster-only.txt
      - run: npm ci
      - run: python -m pip install -r requirements-stock-aster-only.txt
      - name: Validate V96 plus V52 contract and state migration
        run: |
          npm run strategy:disdex-v52:contract
          npx tsx scripts/disdex-v96-gross-2p5-selftest.ts
          python -c "import websocket; print('V52 reference dependencies: PASS')"
      - name: Protect existing Crypto V96 behavior
        run: |
          npm run strategy:disdex-v96:typecheck
          npm run strategy:disdex-v96:selftest
          npm run strategy:disdex-v96:frequency:selftest
          npm run strategy:disdex-v96:execution:selftest
      - name: Assert V96 2.5 and V52 LIVE remain fail-closed
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const v96Config = fs.readFileSync('config/disdexV96Runtime.ts', 'utf8');
          const config = fs.readFileSync('config/disdexStockRouterV13DV11EqRuntime.ts', 'utf8');
          const supervisor = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-runner.ts', 'utf8');
          const preflight = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-preflight.ts', 'utf8');
          const readonlyPreflight = fs.readFileSync('scripts/disdex-v96-v52-readonly-preflight.ts', 'utf8');
          const migration = fs.readFileSync('scripts/disdex-v96-combined-state-migrate.ts', 'utf8');
          const reconciliation = fs.readFileSync('scripts/disdex-v96-position-reconcile.ts', 'utf8');
          const v96Runner = fs.readFileSync('lib/disdex-v96-portfolio-runner.ts', 'utf8');
          const v96State = fs.readFileSync('lib/disdex-v96-runner-state.ts', 'utf8');
          const capacity = fs.readFileSync('lib/disdex-v96-execution-capacity.ts', 'utf8');
          const reference = fs.readFileSync('scripts/disdex_stock_reference_pyth_iex_proxy.py', 'utf8');
          const v52 = fs.readFileSync('scripts/disdex_v52_aster_only_live_engine.py', 'utf8');
          const env = fs.readFileSync('ops/env/disdex-v13d-v11eq-v96.env.example', 'utf8');
          const approval = fs.readFileSync('ops/systemd/disdex-v96-v52-approval@.service', 'utf8');
          if (!v96Config.includes('penguTargetGross: 1.15')) throw new Error('PENGU target 1.15 missing');
          if (!v96Config.includes('totalGrossCap: 2.5')) throw new Error('V96 total Gross 2.5 missing');
          if (!v96Config.includes('maximumOverridePenguGross: 1.15')) throw new Error('Override PENGU 1.15 missing');
          if (!v96Config.includes('maximumPortfolioGross: 2.5')) throw new Error('Override portfolio Gross 2.5 missing');
          if (!v96Config.includes('minimumExecutionLeverage: 3')) throw new Error('minimum leverage 3 missing');
          if (!config.includes('mode: "LIVE_READY"')) throw new Error('runtime must be LIVE_READY');
          if (!config.includes('cryptoSleeveGrossCap: 2.5')) throw new Error('Crypto Gross 2.5 missing');
          if (!config.includes('stockSleeveGrossCap: 1.5')) throw new Error('Stock Gross 1.5 missing');
          if (!config.includes('portfolioGrossCap: 2.5')) throw new Error('Portfolio Gross 2.5 missing');
          if (!config.includes('sameSymbolConcurrentStockPositionAllowed: false')) throw new Error('same-symbol block missing');
          if (!supervisor.includes('markCombinedV96MigrationActivated')) throw new Error('V96 migration gate missing');
          if (!supervisor.includes('DISDEX_V52_ASTER_ONLY_LIVE_EXECUTION_ENABLED')) throw new Error('V52 environment gate missing');
          if (!supervisor.includes('DISDEX_V96_MAX_GROSS, "2.5"')) throw new Error('Supervisor Gross 2.5 self-test missing');
          if (!preflight.includes('disdex_v52_aster_only_live_engine.py')) throw new Error('V52 preflight missing');
          if (!readonlyPreflight.includes('READ_ONLY_PREFLIGHT_LEVERAGE_BELOW_')) throw new Error('authenticated leverage gate missing');
          if (!migration.includes('systemctl') || !migration.includes('reconcileOrder')) throw new Error('verified V96 migration checks missing');
          if (!reconciliation.includes('ASTER_API_PRIVATE_KEY') || !reconciliation.includes('systemctl')) throw new Error('authenticated V96 position reconciliation missing');
          if (!reconciliation.includes('ordersSent: false') || !reconciliation.includes('closeUnmanagedPositions: false')) throw new Error('reconciliation no-order invariant missing');
          if (reconciliation.includes('executeMarket(')) throw new Error('reconciliation must not submit orders');
          if (!v96Runner.includes('skippedSignalReferenceTs') || !v96State.includes('skippedSignalReferenceTs')) throw new Error('formal one-time signal skip missing');
          if (!v96Runner.includes('1785024000000')) throw new Error('stale ETH referenceTs skip missing');
          if (!v96Runner.includes('planDisDexV96ExecutionCapacity') || !capacity.includes('projectedPortfolioGross')) throw new Error('shared portfolio Gross sizing missing');
          if (!capacity.includes('availableMarginUsd * maxGross')) throw new Error('Gross above 1.0 leverage capacity missing');
          if (!v96Runner.includes('closeUnmanagedPositions') || !v96Runner.includes('direction changes must close reduce-only')) throw new Error('V96 safety invariants missing');
          if (!reference.includes('hermes.pyth.network') || !reference.includes('stream.data.alpaca.markets/v2/iex')) throw new Error('Pyth/IEX reference missing');
          if (!v52.includes('POST_EARLY3__B75__H3__BOTH__NONE') && !config.includes('POST_EARLY3__B75__H3__BOTH__NONE')) throw new Error('frozen V50 candidate missing');
          if (!v52.includes('I_ACKNOWLEDGE_V11_TO_V52_STATE_MIGRATION')) throw new Error('legacy V11 state migration gate missing');
          if (!v52.includes('pendingOrder')) throw new Error('pending order persistence missing');
          if (!v52.includes('MISSED_CHECKPOINT_FAIL_CLOSED')) throw new Error('V50 checkpoint recovery missing');
          if (v52.includes('HyperliquidXYZClient') || v52.includes('self.xyz')) throw new Error('Hyperliquid must remain excluded');
          if (!env.includes('DISDEX_V52_ASTER_ONLY_LIVE_EXECUTION_ENABLED=false')) throw new Error('safe disabled default missing');
          if (!env.includes('DISDEX_V52_CRYPTO_GROSS_CAP=2.5')) throw new Error('V52 Crypto cap env missing');
          if (!env.includes('DISDEX_V96_INITIAL_PENGU_GROSS=1.15')) throw new Error('PENGU approval env missing');
          if (!env.includes('DISDEX_V96_MAX_GROSS=2.5')) throw new Error('V96 Gross env missing');
          if (!approval.includes('DISDEX_V96_INITIAL_PENGU_GROSS=1.15')) throw new Error('approval PENGU 1.15 missing');
          if (!approval.includes('DISDEX_V96_MAX_GROSS=2.5')) throw new Error('approval Gross 2.5 missing');
          NODE
