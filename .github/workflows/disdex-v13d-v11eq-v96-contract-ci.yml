name: Dis-Dex V96 V52 LIVE Runner CI

on:
  pull_request:
    paths:
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/disdex-v13d-v11eq-stock-router-contract.ts'
      - 'lib/disdex-v96-combined-state-migration.ts'
      - 'scripts/disdex-v13d-v11eq-v96-contract-selftest.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v13d-v11eq-v96-kill-switch.ts'
      - 'scripts/disdex-v96-combined-state-migrate.ts'
      - 'scripts/disdex-v96-live-preflight.ts'
      - 'scripts/disdex_v13d_v11eq_stock_live_engine.py'
      - 'scripts/disdex_v11eq_aster_only_live_engine.py'
      - 'scripts/disdex_v52_aster_only_live_engine.py'
      - 'scripts/disdex_stock_reference_pyth_iex_proxy.py'
      - 'requirements-stock-aster-only.txt'
      - 'ops/systemd/disdex-v13d-v11eq-v96.service'
      - 'ops/systemd/disdex-v13d-v11eq-v96-preflight.service'
      - 'ops/systemd/disdex-v96-combined-migration.service'
      - 'ops/systemd/disdex-stock-reference-free.service'
      - 'ops/env/disdex-v13d-v11eq-v96.env.example'
      - 'docs/implementation/V96_V52_VPS_LIVE_HANDOFF.md'
      - 'tsconfig.v13d-v11eq-router.json'
      - 'package.json'
      - '.github/workflows/disdex-v13d-v11eq-v96-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dis-dex-v96-v52-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-stock-aster-only.txt
      - run: npm ci
      - run: python -m pip install -r requirements-stock-aster-only.txt
      - name: Validate V96 plus V52 contract and state migration
        run: |
          npm run strategy:disdex-v52:contract
          python -c "import websocket; print('V52 reference dependencies: PASS')"
      - name: Protect existing Crypto V96 behavior
        run: |
          npm run strategy:disdex-v96:typecheck
          npm run strategy:disdex-v96:selftest
          npm run strategy:disdex-v96:frequency:selftest
      - name: Assert V52 LIVE remains fail-closed
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = fs.readFileSync('config/disdexStockRouterV13DV11EqRuntime.ts', 'utf8');
          const supervisor = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-runner.ts', 'utf8');
          const preflight = fs.readFileSync('scripts/disdex-v13d-v11eq-v96-live-preflight.ts', 'utf8');
          const migration = fs.readFileSync('scripts/disdex-v96-combined-state-migrate.ts', 'utf8');
          const reference = fs.readFileSync('scripts/disdex_stock_reference_pyth_iex_proxy.py', 'utf8');
          const v52 = fs.readFileSync('scripts/disdex_v52_aster_only_live_engine.py', 'utf8');
          const env = fs.readFileSync('ops/env/disdex-v13d-v11eq-v96.env.example', 'utf8');
          if (!config.includes('mode: "LIVE_READY"')) throw new Error('runtime must be LIVE_READY');
          if (!config.includes('stockSleeveGrossCap: 1.5')) throw new Error('Stock Gross 1.5 missing');
          if (!config.includes('portfolioGrossCap: 2.5')) throw new Error('Portfolio Gross 2.5 missing');
          if (!config.includes('sameSymbolConcurrentStockPositionAllowed: false')) throw new Error('same-symbol block missing');
          if (!supervisor.includes('markCombinedV96MigrationActivated')) throw new Error('V96 migration gate missing');
          if (!supervisor.includes('DISDEX_V52_ASTER_ONLY_LIVE_EXECUTION_ENABLED')) throw new Error('V52 environment gate missing');
          if (!preflight.includes('disdex_v52_aster_only_live_engine.py')) throw new Error('V52 preflight missing');
          if (!migration.includes('systemctl') || !migration.includes('reconcileOrder')) throw new Error('verified V96 migration checks missing');
          if (!reference.includes('hermes.pyth.network') || !reference.includes('stream.data.alpaca.markets/v2/iex')) throw new Error('Pyth/IEX reference missing');
          if (!v52.includes('POST_EARLY3__B75__H3__BOTH__NONE') && !config.includes('POST_EARLY3__B75__H3__BOTH__NONE')) throw new Error('frozen V50 candidate missing');
          if (!v52.includes('I_ACKNOWLEDGE_V11_TO_V52_STATE_MIGRATION')) throw new Error('legacy V11 state migration gate missing');
          if (!v52.includes('pendingOrder')) throw new Error('pending order persistence missing');
          if (!v52.includes('MISSED_CHECKPOINT_FAIL_CLOSED')) throw new Error('V50 checkpoint recovery missing');
          if (v52.includes('HyperliquidXYZClient') || v52.includes('self.xyz')) throw new Error('Hyperliquid must remain excluded');
          if (!env.includes('DISDEX_V52_ASTER_ONLY_LIVE_EXECUTION_ENABLED=false')) throw new Error('safe disabled default missing');
          if (!env.includes('DISDEX_V52_PORTFOLIO_GROSS_CAP=2.5')) throw new Error('V52 total cap env missing');
          NODE
