name: PENGU Bull Trap Frozen Cross-Venue Validation

on:
  pull_request:
    branches:
      - research/pengu-bulltrap-overlay-v3-20260824
    paths:
      - '.github/workflows/pengu-bulltrap-crossvenue-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pengu-bulltrap-crossvenue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build frozen Binance copies without changing candidate logic
        run: |
          mkdir -p .research-state/pengu-bulltrap-crossvenue
          cp scripts/research_pengu_bulltrap_overlay_v3.ts scripts/.pengu_bulltrap_binance_prior.ts
          cp scripts/research_pengu_bulltrap_overlay_v3.ts scripts/.pengu_bulltrap_binance_overlap.ts
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, warm, start, end):
              p=Path(path); s=p.read_text()
              s=s.replace('const WARM_START=Date.parse("2025-08-01T00:00:00Z");', f'const WARM_START=Date.parse("{warm}");')
              s=s.replace('const EVAL_START=Date.parse("2025-08-23T15:00:00Z");', f'const EVAL_START=Date.parse("{start}");')
              s=s.replace('const EVAL_END=Date.parse("2026-08-23T15:00:00Z");', f'const EVAL_END=Date.parse("{end}");')
              s=s.replace('const BASE_URL="https://fapi.asterdex.com";', 'const BASE_URL="https://fapi.binance.com";')
              s=s.replace('"/fapi/v3/klines"', '"/fapi/v1/klines"')
              s=s.replace('"/fapi/v3/fundingRate"', '"/fapi/v1/fundingRate"')
              s=re.sub(r'const expected=Math\.floor\(\(EVAL_END-EVAL_START\)/HOUR\);assert\.equal\(pengu\.filter\(x=>x\.openTime>=EVAL_START&&x\.openTime<EVAL_END\)\.length,expected\);assert\.equal\(btc\.filter\(x=>x\.openTime>=EVAL_START&&x\.openTime<EVAL_END\)\.length,expected\);', 'assert.ok(pengu.length>500);assert.ok(btc.length>500);', s)
              s=s.replace('assert.equal(base.length,32);if(mode==="normal")assert.equal(base.filter(t=>t.side==="S").length,25);', 'assert.ok(base.length>0);')
              p.write_text(s)

          patch('scripts/.pengu_bulltrap_binance_prior.ts','2024-12-17T00:00:00Z','2024-12-24T00:00:00Z','2025-08-23T15:00:00Z')
          patch('scripts/.pengu_bulltrap_binance_overlap.ts','2025-08-01T00:00:00Z','2025-08-23T15:00:00Z','2026-08-23T15:00:00Z')
          PY
      - name: Run untouched-period and venue-overlap validation
        run: |
          set -o pipefail
          PENGU_BULLTRAP_OVERLAY_OUT=.research-state/pengu-bulltrap-crossvenue/prior.json npx tsx scripts/.pengu_bulltrap_binance_prior.ts 2>&1 | tee .research-state/pengu-bulltrap-crossvenue/prior.log
          PENGU_BULLTRAP_OVERLAY_OUT=.research-state/pengu-bulltrap-crossvenue/overlap.json npx tsx scripts/.pengu_bulltrap_binance_overlap.ts 2>&1 | tee .research-state/pengu-bulltrap-crossvenue/overlap.log
          rm -f scripts/.pengu_bulltrap_binance_prior.ts scripts/.pengu_bulltrap_binance_overlap.ts
      - name: Apply frozen cross-venue gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.research-state/pengu-bulltrap-crossvenue')
          prior=json.loads((root/'prior.json').read_text())
          overlap=json.loads((root/'overlap.json').read_text())
          def extract(p):
              n=p['results']['RETEST_REJECT']['NORMAL']; s=p['results']['RETEST_REJECT']['STRESS']
              return {
                'normal': {'baseline':n['BASELINE'],'overlay':n['OVERLAY'],'combined':n['COMBINED']},
                'stress': {'baseline':s['BASELINE'],'overlay':s['OVERLAY'],'combined':s['COMBINED']},
              }
          def passes(x):
              n=x['normal']; s=x['stress']; o=n['overlay']; b=n['baseline']; c=n['combined']
              return (b['trades']>=10 and o['trades']>=5 and (o['winRatePct'] or 0)>=65 and (o['profitFactor'] or 0)>=1.5
                      and (c['winRatePct'] or 0)>(b['winRatePct'] or 0) and c['returnPct']>=b['returnPct']
                      and (c['profitFactor'] or 0)>=(b['profitFactor'] or 0)
                      and s['combined']['returnPct']>=s['baseline']['returnPct'])
          a=extract(prior); b=extract(overlap)
          out={'status':'PASS_RESEARCH_ONLY','schema':'pengu-bulltrap-frozen-crossvenue/v1',
               'candidate':'RETEST_REJECT frozen at eaab138cb8ddc97ce6e61f03839d2a172c46f2a5',
               'priorPeriod':{'period':['2024-12-24T00:00:00Z','2025-08-23T15:00:00Z'],'venue':'Binance USD-M Futures','metrics':a,'pass':passes(a)},
               'overlapPeriod':{'period':['2025-08-23T15:00:00Z','2026-08-23T15:00:00Z'],'venue':'Binance USD-M Futures','metrics':b,'pass':passes(b)},
               'promotion':{'pass':passes(a) and passes(b)},
               'safety':{'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}}
          (root/'crossvenue.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          assert out['status']=='PASS_RESEARCH_ONLY'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-bulltrap-crossvenue-${{ github.run_id }}
          path: .research-state/pengu-bulltrap-crossvenue
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
