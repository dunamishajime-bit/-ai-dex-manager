name: DisDex V52 peer-pin preview
on:
  pull_request:
    paths:
      - scripts/v52_q102_independent_pin.py
      - scripts/ops/root/disdex-fet-preemption-readiness-guard.py
      - tests/test_v52_fet_independent_approvals.py
      - scripts/ops/deploy/build_v52_q102_preview.py
      - tests/test_v52_q102_independent_pin.py
      - tests/test_v52_q102_preview.py
      - tests/test_v52_release_candidate_source.py
      - tests/test_q102_resident_state.py
      - tests/test_fet_v52_ownership.py
      - tests/test_disdex_v52_idle_owned_position.py
      - tests/test_final_dynamic_gross_strict_caps.py
      - scripts/disdex_strict_portfolio_planner.py
      - scripts/disdex_v52_aster_only_live_engine.py
      - scripts/disdex_runner_tick_heartbeat.py
      - tests/test_v52_real_tick.py
      - scripts/disdex_v13d_v11eq_stock_live_engine.py
      - tests/test_v52_http_error_redaction.py
      - .github/workflows/disdex-v52-peer-pin-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact existing V52 source
        run: git fetch --no-tags --depth=1 origin 4d33d8244c0b50a7e461ffd8aaf493c32bfdfd81
      - name: Test independent runner pins and existing planner
        run: python -m unittest tests.test_v52_q102_independent_pin tests.test_v52_q102_preview tests.test_v52_release_candidate_source tests.test_q102_resident_state tests.test_fet_v52_ownership tests.test_disdex_v52_idle_owned_position tests.test_final_dynamic_gross_strict_caps tests.test_v52_monitor_only tests.test_v52_monitor_transport tests.test_v52_fet_independent_approvals tests.test_v52_real_tick tests.test_v52_http_error_redaction -v
