name: PENGU V18 Remaining Loss Diagnostic

on:
  pull_request:
    branches:
      - research/pengu-short-v11-okx-binance-20260824
    paths:
      - 'scripts/research_pengu_v18_remaining_loss_diagnostic.py'
      - '.github/workflows/pengu-v18-remaining-loss-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run frozen V18 remaining-loss diagnostic
        run: python scripts/research_pengu_v18_remaining_loss_diagnostic.py
      - name: Validate diagnostic-only safety contract
        run: |
          python - <<'PY'
          import json
          p='.research-state/pengu-v18-remaining-loss-diagnostic/diagnostic.json'
          x=json.load(open(p))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['diagnosticOnly'] is True
          assert x['frozenCandidate']=='COUNTERWIND_REVERSIBLE_PROBATION_TO_DEADLINE'
          assert x['frozenPreRegistrationSha']=='42bb6297d893125ad3b2de0a9e26dba342852223'
          assert x['candidateCount']==0
          assert x['thresholdSweep'] is False
          assert x['kucoinPerformanceObserved'] is False
          assert set(x['events'])=={'OKX','Binance','Bitget'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({
            'modifiedCounts':{k:len(v) for k,v in x['events'].items()},
            'sharedLossClusters':len(x['sharedThreeVenueCandidateLossClusters']),
            'sharedDeadlineBarResumeClusters':len(x['sharedThreeVenueDeadlineBarResumeClusters']),
            'kucoinPerformanceObserved':x['kucoinPerformanceObserved'],
            'safety':x['safety']
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-v18-remaining-loss-diagnostic-${{ github.run_id }}
          path: .research-state/pengu-v18-remaining-loss-diagnostic
          if-no-files-found: error
