name: Active4 V131 Persistent Lifecycle V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/active4-v131-trigger.txt"

permissions:
  contents: read

concurrency:
  group: active4-v131-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_lifecycle_core_handoff, btc_lifecycle_breadth_owner, eth_lifecycle_selective_owner, bnb_lifecycle_cash_release, avax_lifecycle_burst_handoff]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile persistent lifecycle engine
        run: python -m py_compile scripts/research_active4_v131_lifecycle_v2.py
      - name: Run V131 lifecycle candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v131_lifecycle_v2.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v131-${{ matrix.candidate }}
          path: |
            .research-state/active4-v131-${{ matrix.candidate }}.json
            .research-state/active4-v131-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only persistent lifecycle V2. Development/Validation only.
# Confirmation/Holdout untouched. LINK/SOL frozen and untouched.
# No production/VPS/live/credentials/orders/accounts/positions/realTradingEnabled changes.
