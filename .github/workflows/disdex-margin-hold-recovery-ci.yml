name: DisDex Margin HOLD Recovery Safety CI

on:
  pull_request:
    paths:
      - "scripts/ops/deploy/disdex_margin_hold_secure_state_and_ghost_guard.py"
      - "scripts/ops/deploy/disdex_v52_exact_instance_margin_dependency.py"
      - "tests/ops/test_margin_hold_secure_state.py"
      - ".github/workflows/disdex-idle-v52-owner-hold-formal-recovery.yml"
      - ".github/workflows/disdex-margin-hold-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and run static contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/deploy/disdex_margin_hold_secure_state_and_ghost_guard.py
          python3 -m py_compile scripts/ops/deploy/disdex_v52_exact_instance_margin_dependency.py
          python3 -m unittest discover -s tests/ops -p test_margin_hold_secure_state.py -v
      - name: Verify approved task and no order mutation policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          helper=Path("scripts/ops/deploy/disdex_margin_hold_secure_state_and_ghost_guard.py").read_text()
          workflow=Path(".github/workflows/disdex-idle-v52-owner-hold-formal-recovery.yml").read_text()
          v52=Path("scripts/ops/deploy/disdex_v52_exact_instance_margin_dependency.py").read_text()
          for value in [
              "MARGIN_SECURE_SHARED_OWNER_ONLY_V1",
              "MARGIN_HOLD_CONTRACT_PATCH=SUCCESS",
              "BROKEN_DUPLICATE_MARGIN_GUARD=STOPPED",
              "KILL_SWITCH=HOLD_PROTECTED_UNCHANGED",
              "ORDERS_SENT=0 CANCELS_SENT=0 POSITION_CHANGES=0 STOP_CHANGES=0",
          ]:
              assert value in helper, value
          for value in [
              "V52_INSTANCE_DEPENDENCY_REPAIR=SUCCESS",
              "V52_CANONICAL_MARGIN_REQUIRES=TRUE",
              "V52_BROKEN_MARGIN_REQUIRES=FALSE",
              "V52_STABLE_35_SECONDS=TRUE",
              "HOLD_PROTECTED_UNCHANGED=TRUE",
              "1e8a2707e5835b77be8374f8b8b3d615dc1de754543cd36efca85ff1cdc5a45a",
              "5bf45aabafc6ed290cada5d1d380412e75a71952fd362a90255401d7ab729938",
          ]:
              assert value in v52, value
          assert "systemctl\",\"stop\",V52_UNIT" in v52
          assert 'BAD_GUARD not in deps' in v52
          assert 'GOOD_GUARD in deps' in v52
          assert 'disdex_v52_exact_instance_margin_dependency.py' in workflow
          for value in [
              "SHARED_HOLD_RECOVERY",
              "claim_task_step",
              "finish_task_step",
              "disdex-production",
              "disdex_margin_hold_secure_state_and_ghost_guard.py",
          ]:
              assert value in workflow, value
          for forbidden in [
              "cancelOrder",
              "createOrder",
              "test-order",
              "kill-switch clear",
          ]:
              assert forbidden not in helper
          print("MARGIN_HOLD_RECOVERY_POLICY=PASS")
          PY
