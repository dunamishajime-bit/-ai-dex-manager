name: Dis-Dex PENGU Dual Engine V46 CI

on:
  push:
    branches:
      - master
      - feature/pengu-dual-engine-v46
      - fix/disdex-v46-v3-funding-time-audit
    paths:
      - config/disdexV46Runtime.ts
      - config/mainStrategy.ts
      - lib/pengu-dual-engine-v46.ts
      - lib/disdex-v46-*.ts
      - scripts/disdex-v46-*.ts
      - scripts/install-disdex-v46-systemd.sh
      - research/PENGU_V46_FINAL.md
      - research/DISDEX_V46_VPS_HANDOFF.md
      - tsconfig.v46-runner.json
      - package.json
      - .github/workflows/disdex-pengu-v46-ci.yml
  pull_request:
    branches:
      - master
    paths:
      - config/disdexV46Runtime.ts
      - config/mainStrategy.ts
      - lib/pengu-dual-engine-v46.ts
      - lib/disdex-v46-*.ts
      - scripts/disdex-v46-*.ts
      - scripts/install-disdex-v46-systemd.sh
      - research/PENGU_V46_FINAL.md
      - research/DISDEX_V46_VPS_HANDOFF.md
      - tsconfig.v46-runner.json
      - package.json
      - .github/workflows/disdex-pengu-v46-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PENGU V46 self-test
        run: npm run strategy:disdex-v46:selftest
      - name: V46 runner typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run strategy:disdex-v46:typecheck 2>&1 | tee /tmp/disdex-v46-typecheck.log
      - name: Installer syntax check
        run: bash -n scripts/install-disdex-v46-systemd.sh
      - name: Verify Paper and funding locks
        run: |
          grep -q 'mode: "PAPER"' config/disdexV46Runtime.ts
          grep -q 'liveTradingEnabled: false' config/disdexV46Runtime.ts
          grep -q 'ACTIVE_MAIN_STRATEGY_REAL_TRADING_ENABLED = false' config/mainStrategy.ts
          grep -q 'V46 installation is PAPER-only' scripts/install-disdex-v46-systemd.sh
          grep -q '/fapi/v3/fundingRate' lib/disdex-v46-market-data-provider.ts
          ! grep -q '/fapi/v1/fundingRate' lib/disdex-v46-market-data-provider.ts
      - name: Aster V3 PENGU funding smoke
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            -H 'user-agent: DisDex-PENGU-V46-CI/1.0' \
            'https://fapi.asterdex.com/fapi/v3/fundingRate?symbol=PENGUUSDT&limit=5')"
          FUNDING_JSON="$response" node <<'NODE'
          const payload = JSON.parse(process.env.FUNDING_JSON || "null");
          if (!Array.isArray(payload) || payload.length === 0) {
            throw new Error("Aster V3 funding payload must be a non-empty array.");
          }
          let previousTime = 0;
          for (const row of payload) {
            const fundingTime = Number(row?.fundingTime);
            const fundingRate = Number(row?.fundingRate);
            if (row?.symbol !== "PENGUUSDT") throw new Error(`Unexpected funding symbol: ${row?.symbol}`);
            if (!Number.isFinite(fundingTime) || fundingTime <= 0) throw new Error("Invalid fundingTime.");
            if (!Number.isFinite(fundingRate)) throw new Error("Invalid fundingRate.");
            if (fundingTime < previousTime) throw new Error("Funding history is not ascending.");
            if (fundingTime > Date.now() + 300_000) throw new Error("Funding history contains a future timestamp.");
            previousTime = fundingTime;
          }
          console.log(JSON.stringify({ endpoint: "/fapi/v3/fundingRate", rows: payload.length, latestFundingTime: previousTime }));
          NODE
      - name: Existing V35 runner typecheck
        run: npm run strategy:disdex-v35:runner:typecheck
      - name: Existing live runner typecheck
        run: npm run strategy:live:typecheck
      - name: Production build
        run: npm run build
      - name: Upload V46 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-v46-ci-diagnostics
          path: /tmp/disdex-v46-typecheck.log
          if-no-files-found: warn
          retention-days: 7
