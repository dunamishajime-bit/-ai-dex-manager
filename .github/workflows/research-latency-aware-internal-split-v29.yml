name: Research Latency-Aware Internal-Split V29
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/3y-entry-edge-diagnosis-20260815]
    paths:
      - scripts/research_latency_aware_internal_split_v29.ts
      - .github/workflows/research-latency-aware-internal-split-v29.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert frozen V29 source
        run: test "$(git hash-object scripts/research_latency_aware_internal_split_v29.ts)" = "c5fafdd78b510bbbd542c85b05215fc0f468397d"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - run: npm ci
      - name: Run V29 latency-aware evolution
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_latency_aware_internal_split_v29.ts
      - name: Assert research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/latency-aware-internal-split-v29.json','utf8'));
          if(!d.researchOnly||d.productionChanged||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(d.freshOosRead||d.freshOosConsumed) throw new Error('FRESH_OOS_FAIL');
          if(d.target.leverageMultiplier!==1) throw new Error('LEVERAGE_FAIL');
          for(const f of d.finalists){if(f.combined3Y.maximumEffectiveLeverage>1.000001) throw new Error('EFFECTIVE_LEVERAGE_FAIL')}
          console.log('V29_BOUNDARY_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: latency-aware-internal-split-v29
          path: .research-state/latency-aware-internal-split-v29.json
          include-hidden-files: true
          retention-days: 30
