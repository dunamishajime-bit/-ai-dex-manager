name: PENGU V60 Pullback Policy Test

on:
  push:
    branches:
      - research/pengu-v57-conditional-regime-20260826
    paths:
      - 'scripts/test_research_v60_pullback_policy.py'
      - 'scripts/research_v60_pullback_policy.py'
      - '.github/workflows/pengu-v60-pullback-policy-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run V60 pullback policy test
        run: python scripts/test_research_v60_pullback_policy.py
