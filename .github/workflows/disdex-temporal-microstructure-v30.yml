name: Dis-Dex Temporal Microstructure V30

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_disdex_one_day_microstructure_v29.py"
      - "scripts/research_lab_disdex_temporal_microstructure_v30.py"
      - "research/disdex-temporal-microstructure-v30-trigger.txt"
      - ".github/workflows/disdex-temporal-microstructure-v30.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_disdex_temporal_microstructure_v30.py"
      - ".github/workflows/disdex-temporal-microstructure-v30.yml"

permissions:
  contents: read

concurrency:
  group: disdex-temporal-microstructure-v30-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cumulative V19 history
        uses: actions/cache/restore@v4
        with:
          path: .research-state/aster-market-intelligence-v19/history
          key: aster-market-intelligence-v19-${{ github.ref_name }}-v30-${{ github.run_id }}
          restore-keys: |
            aster-market-intelligence-v19-${{ github.ref_name }}-
      - name: Python syntax check
        run: python -m py_compile scripts/research_lab_disdex_one_day_microstructure_v29.py scripts/research_lab_disdex_temporal_microstructure_v30.py
      - name: Run temporal split microstructure audit
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_disdex_temporal_microstructure_v30.py
      - name: Upload V30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-temporal-microstructure-v30
          path: |
            .research-state/disdex-temporal-microstructure-v30.json
            .research-state/disdex-temporal-microstructure-v30.md
          if-no-files-found: warn
          retention-days: 30
