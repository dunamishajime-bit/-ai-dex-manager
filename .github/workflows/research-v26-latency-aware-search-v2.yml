name: Research V26 Latency-Aware Structural Search V2
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/v26-latency-aware-search-20260816]
    paths:
      - scripts/research_v26_latency_aware_search_v2.ts
      - .github/workflows/research-v26-latency-aware-search-v2.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert frozen V2 source
        run: test "$(git hash-object scripts/research_v26_latency_aware_search_v2.ts)" = "a9d0b965d382c7d0c9506f227cecab5ba103ab4e"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: v26-latency-aware-3y-usdm-v1-20260816
          fail-on-cache-miss: true
      - run: npm ci
      - name: Run corrected latency-aware search V2
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_v26_latency_aware_search_v2.ts
      - name: Assert research boundary and corrected replay
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/v26-latency-aware-search-v2.json','utf8'));
          if(!d.researchOnly||d.productionChanged||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(!d.penguExcluded||d.universe.includes('PENGU')||d.universe.length!==14) throw new Error('UNIVERSE_FAIL');
          if(d.leverage!==1) throw new Error('LEVERAGE_FAIL');
          if(d.correction.architectureSetChangedFromV1) throw new Error('ARCHITECTURE_DRIFT_FAIL');
          if(!d.selectionProtocol.stressModes.includes('stressedNoDelay')) throw new Error('REPLAY_CONTROL_FAIL');
          console.log('V26_LATENCY_AWARE_V2_BOUNDARY_PASS');
          NODE
      - name: Publish V2 research result
        run: |
          mkdir -p docs/research-results
          cp .research-state/v26-latency-aware-search-v2.json docs/research-results/v26-latency-aware-search-v2-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-results/v26-latency-aware-search-v2-latest.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "research: record V26 latency-aware V2 result [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v26-latency-aware-search-v2
          path: .research-state/v26-latency-aware-search-v2.json
          include-hidden-files: true
          retention-days: 30
