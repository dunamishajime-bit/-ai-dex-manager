name: Research Lab Phase 2 Pilot

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Discovery rounds
        required: true
        default: "10"
      population:
        description: Strategies per round
        required: true
        default: "5"
      finalists:
        description: Strategies sent to Validation and OOS
        required: true
        default: "5"
      start_date:
        description: Research start date
        required: true
        default: "2023-01-01"
      end_date:
        description: Research end date
        required: true
        default: "2026-07-01"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BINANCE_PUBLIC_ARCHIVE_ONLY: "true"
      RESEARCH_PROFILE: production
      RESEARCH_ROUNDS: ${{ inputs.rounds }}
      RESEARCH_POPULATION: ${{ inputs.population }}
      RESEARCH_ELITES: "2"
      RESEARCH_FINALISTS: ${{ inputs.finalists }}
      RESEARCH_CONCURRENCY: "1"
      RESEARCH_WALK_FORWARD_FOLDS: "3"
      RESEARCH_STRESS_COST_BPS: "20,50,100"
      RESEARCH_TARGET_MONTHLY_PCT: "30"
      RESEARCH_FINAL_OOS_MONTHLY_PCT: "30"
      RESEARCH_FINAL_STRESS_MONTHLY_PCT: "20"
      RESEARCH_START_DATE: ${{ inputs.start_date }}
      RESEARCH_END_DATE: ${{ inputs.end_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/hybrid-retq22
            .cache/hybrid-universe
          key: research-market-data-v4-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: |
            research-market-data-v4-
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Run real-data research pilot
        run: npm run research:lab
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-phase2-pilot
          path: reports/research-lab
          if-no-files-found: warn
          retention-days: 30
