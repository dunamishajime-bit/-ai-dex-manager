name: DisDex observed Runner phase and real tick
on:
  push:
    paths:
      - 'lib/disdex-observed-runner-phase.mjs'
      - 'lib/disdex-q102-health-gate.mjs'
      - 'scripts/ops/root/disdex-runner-health-snapshot-current.mjs'
      - 'tests/observed-runner-phase.test.mjs'
      - '.github/workflows/disdex-observed-runner-phase-ci.yml'
  pull_request:
    paths:
      - 'lib/disdex-observed-runner-phase.mjs'
      - 'lib/disdex-q102-health-gate.mjs'
      - 'scripts/ops/root/disdex-runner-health-snapshot-current.mjs'
      - 'tests/observed-runner-phase.test.mjs'
      - '.github/workflows/disdex-observed-runner-phase-ci.yml'
permissions:
  contents: read
jobs:
  no-order-observability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/observed-runner-phase.test.mjs tests/runner-health-tick-contract.test.mjs
      - run: node scripts/ops/root/disdex-runner-health-snapshot-current.mjs --self-test
      - run: git diff --check
