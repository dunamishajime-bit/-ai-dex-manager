name: DisDex All-Runner Task V4 IDLE LIVE Resume

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Approved ALL_RUNNERS_LIVE_RESTORE task ID
        required: true
        type: string
      runner:
        description: Exact runner to resume
        required: true
        type: choice
        options: [V4, IDLE, HYPE]

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  resume:
    if: >-
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact task stage
        id: bind
        shell: bash
        env:
          RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER" == "V4" ]]; then
            echo "step=V4_LIVE_RECOVER" >> "$GITHUB_OUTPUT"
            echo "sha=53a0be396719f0284af4e11b35c66a4ac7d58f79" >> "$GITHUB_OUTPUT"
            echo "scope=V12_V4" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER" == "IDLE" ]]; then
            echo "step=IDLE_LIVE_RESUME" >> "$GITHUB_OUTPUT"
            echo "sha=7688ed7c93a1918d8b44837339b7da5584a868f5" >> "$GITHUB_OUTPUT"
            echo "scope=IDLE_PRIORITY_SHORT" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER" == "HYPE" ]]; then
            echo "step=HYPE_LIVE_RECOVER" >> "$GITHUB_OUTPUT"
            echo "sha=7688ed7c93a1918d8b44837339b7da5584a868f5" >> "$GITHUB_OUTPUT"
            echo "scope=HYPE_TREND_LONG" >> "$GITHUB_OUTPUT"
          else
            exit 2
          fi

      - name: Claim scoped child authorization from one approved task
        id: task_claim
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          STEP: ${{ steps.bind.outputs.step }}
          SHA: ${{ steps.bind.outputs.sha }}
          SCOPE: ${{ steps.bind.outputs.scope }}
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          PUBLIC_KEY: ${{ secrets.DISDEX_HP_APPROVER_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[0-9a-fA-F-]{36}$ && "$RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ -n "$BRIDGE" && -n "$PUBLIC_KEY" ]]
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          body=json.dumps({
            "action":"claim_task_step",
            "task_id":os.environ["TASK_ID"],
            "step":os.environ["STEP"],
            "target_sha":os.environ["SHA"],
            "run_id":os.environ["RUN_ID"],
          }).encode()
          req=urllib.request.Request(
            "https://professional-dismanager.net/api/system/deploy-approval",
            data=body,method="POST",
            headers={"Authorization":"Bearer "+os.environ["BRIDGE"],
                     "Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req,timeout=15) as response:
            data=json.load(response)
          assert data.get("ok")
          assert data.get("step")==os.environ["STEP"]
          assert data.get("scope")==os.environ["SCOPE"]
          assert data.get("ordersEnabled") is False
          token=str(data.get("token") or "")
          plan=str(data.get("planSha256") or "")
          assert token and len(plan)==64
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          (root/"allrunner-live-token").write_text(token,encoding="ascii")
          (root/"allrunner-live-plan").write_text(plan,encoding="ascii")
          print("::add-mask::"+token)
          print("ALLRUNNER_TASK_CHILD_CLAIMED=TRUE")
          PY
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/allrunner-owner.pub"
          cat "$RUNNER_TEMP/allrunner-live-token" |
            python3 scripts/ops/deploy/disdex_owner_approval.py verify \
              --public-key "$RUNNER_TEMP/allrunner-owner.pub" \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$SHA" --scope "$SCOPE" \
              --operator dunamishajime-bit \
              --plan-sha256 "$(cat "$RUNNER_TEMP/allrunner-live-plan")" \
              --deployment-target professional-dismanager.net \
              --operator-target DD1296_FINAL_ALLIN_10BPS \
              --route GITHUB_ACTIONS --orders-enabled false

      - name: Configure reviewed root maintenance SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/allrunner-live-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/allrunner-live-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/allrunner-live-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/allrunner-live-ssh/"*
          ssh-keygen -y -f "$RUNNER_TEMP/allrunner-live-ssh/key" >/dev/null

      - name: Upload exact guarded resume helper
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          python3 -m py_compile scripts/ops/deploy/disdex_allrunner_v4_idle_live_resume.py
          scp -i "$RUNNER_TEMP/allrunner-live-ssh/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/allrunner-live-ssh/known_hosts" \
            -P "$PORT" scripts/ops/deploy/disdex_allrunner_v4_idle_live_resume.py \
            "root@$HOST:/tmp/disdex-allrunner-live-$GITHUB_RUN_ID.py"

      - name: Resume exact existing certified service
        id: execute
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          TARGET_RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          ssh -T -i "$RUNNER_TEMP/allrunner-live-ssh/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/allrunner-live-ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=8 \
            -p "$PORT" "root@$HOST" \
            "python3 /tmp/disdex-allrunner-live-$GITHUB_RUN_ID.py --runner $TARGET_RUNNER --run-id $GITHUB_RUN_ID"

      - name: Finish task stage for success or safe retry
        if: ${{ always() && steps.task_claim.outcome == 'success' }}
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          STEP: ${{ steps.bind.outputs.step }}
          EXECUTION: ${{ steps.execute.outcome }}
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          passed=os.environ["EXECUTION"]=="success"
          body=json.dumps({
            "action":"finish_task_step",
            "task_id":os.environ["TASK_ID"],
            "step":os.environ["STEP"],
            "run_id":os.environ["RUN_ID"],
            "outcome":"success" if passed else "failure",
          }).encode()
          req=urllib.request.Request(
            "https://professional-dismanager.net/api/system/deploy-approval",
            data=body,method="POST",
            headers={"Authorization":"Bearer "+os.environ["BRIDGE"],
                     "Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req,timeout=15) as response:
            result=json.load(response)
          assert result.get("ok") and result.get("status")=="APPROVED"
          print("ALLRUNNER_TASK_STAGE="+("SUCCESS" if passed else "RETRYABLE"))
          PY

      - name: Cleanup ephemeral material
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set +e
          if [[ -z "$PORT" ]]; then PORT=22; fi
          if [[ -s "$RUNNER_TEMP/allrunner-live-ssh/key" && -n "$HOST" ]]; then
            ssh -T -i "$RUNNER_TEMP/allrunner-live-ssh/key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/allrunner-live-ssh/known_hosts" \
              -o ConnectTimeout=5 -p "$PORT" "root@$HOST" \
              "rm -f -- /tmp/disdex-allrunner-live-$GITHUB_RUN_ID.py" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/allrunner-live-ssh" "$RUNNER_TEMP/allrunner-live-token" \
            "$RUNNER_TEMP/allrunner-live-plan" "$RUNNER_TEMP/allrunner-owner.pub"
