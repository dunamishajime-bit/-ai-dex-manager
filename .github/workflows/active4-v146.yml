name: Active4 V146 Diagnosis Rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_active4_v146_diagnosis_rebuild.py"
      - ".github/workflows/active4-v146.yml"

permissions:
  contents: read

concurrency:
  group: active4-v146-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate:
          - btc_expansion_decay_owner_cs_v16
          - btc_pullback_probation_owner_cs_v16
          - eth_relative_velocity_handoff_cs_v16
          - bnb_impulse_probation_extension_cs_v16
          - avax_event_direction_handoff_cs_v16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile V146
        run: python -m py_compile scripts/research_active4_v146_diagnosis_rebuild.py
      - name: Run V146 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v146_diagnosis_rebuild.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v146-${{ matrix.candidate }}
          path: |
            .research-state/active4-v146-${{ matrix.candidate }}.json
            .research-state/active4-v146-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only BTC/ETH/BNB/AVAX. D/V diagnosis driven. Confirmation/Holdout untouched.
# No production/live/VPS/.env/credentials/orders/accounts/positions changes.
