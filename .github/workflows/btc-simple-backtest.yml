name: BTC simple-strategy backtest

on:
  push:
    branches:
      - analysis/btc-simple-backtest-20260715
    paths:
      - "research/btc_simple_backtest.py"
      - ".github/workflows/btc-simple-backtest.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/btc_simple_backtest.py"
      - ".github/workflows/btc-simple-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run BTC backtest
        run: python research/btc_simple_backtest.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-simple-backtest-report
          path: backtest_output/
          if-no-files-found: warn
