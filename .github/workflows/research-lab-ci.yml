name: Research Lab CI

on:
  pull_request:
    paths:
      - "app/api/research-lab/**"
      - "app/research-lab/**"
      - "components/research-lab/**"
      - "lib/research-lab/**"
      - "scripts/research-lab-*.ts"
      - "components/layout/Sidebar.tsx"
      - "components/layout/BottomNav.tsx"
      - "package.json"
      - "tsconfig.research.json"
      - ".github/workflows/research-lab-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Spot Research Lab self-test
        run: npm run research:lab:selftest
      - name: Perpetual Research Lab self-test
        run: npm run research:perp:selftest
      - name: Research discussion self-test
        run: npm run research:discussion:selftest
