name: V52 Gate Sensitivity Research

on:
  pull_request:
    paths:
      - 'scripts/research_lab_v52_gate_sensitivity.py'
      - '.github/workflows/v52-gate-sensitivity-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v52-gate-sensitivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1

      - name: Checkout frozen V13 dependency source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .cache/perp-research-usdm
            .cache/v96-crypto-v11-v13d-one-year
          key: v52-gate-sensitivity-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v52_gate_sensitivity.py') }}
          restore-keys: |
            v96-v52-dual-slot-one-year-${{ runner.os }}-
            aster-only-v52-v39cache-${{ runner.os }}-
            aster-only-v39-${{ runner.os }}-
            v96-crypto-v11eq-v13d-one-year-${{ runner.os }}-
            v96-volume50-turnover075-full-${{ runner.os }}-
            perp-research-usdm-

      - name: Compile and self-test
        run: |
          python -m py_compile \
            scripts/research_lab_v96_crypto_v11eq_v13d_one_year_bt.py \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v50_post_open_basis_engine.py \
            scripts/research_lab_aster_only_v52_dual_slot_basis_engine.py \
            scripts/research_lab_v52_gate_sensitivity.py
          python scripts/research_lab_v52_gate_sensitivity.py --self-test

      - name: Run one-year gate sensitivity sweep
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .research-state/v52-gate-sensitivity
          python scripts/research_lab_v52_gate_sensitivity.py \
            --cache-root .cache/aster-only-v39-overnight-open \
            --output-dir .research-state/v52-gate-sensitivity \
            2>&1 | tee .research-state/v52-gate-sensitivity/backtest.log

      - name: Validate research-only contract
        run: |
          test -s .research-state/v52-gate-sensitivity/result.json
          test -s .research-state/v52-gate-sensitivity/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v52-gate-sensitivity/result.json').read_text())
          assert p['strategyId'] == 'DISDEX_V52_GATE_SENSITIVITY_RESEARCH_ONLY'
          assert p['period']['calendarDays'] == 365
          assert p['fixed']['maximumRoundTripCostBps'] == 60.0
          assert p['fixed']['grossCap'] == 1.5
          assert p['sweep']['selectionUsesHoldout'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'realPositionsChanged': False,
          }
          assert p['recommendation']['productionChangeAllowed'] is False
          assert p['recommendation']['liveGateChanged'] is False
          for row in (p['baseline'], p['lockedWinner']):
              assert row['full']['NORMAL']['routing']['maximumObservedGross'] <= 1.5 + 1e-9
          print(json.dumps({
              'status': p['status'],
              'baseline': p['baseline']['full']['NORMAL'],
              'winner': p['lockedWinner']['full']['NORMAL'],
              'winnerHoldout': p['lockedWinner']['holdout']['NORMAL'],
              'candidate': p['recommendation']['candidateId'],
              'checks': p['finalChecks'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v52-gate-sensitivity-${{ github.run_id }}
          path: .research-state/v52-gate-sensitivity
          retention-days: 90
          if-no-files-found: warn
