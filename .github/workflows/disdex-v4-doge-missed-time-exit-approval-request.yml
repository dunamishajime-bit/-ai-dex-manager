name: DisDex V4 DOGE Missed TIME Exit Approval Request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: disdex-v4-doge-missed-time-exit-approval
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.repository.full_name == 'dunamishajime-bit/-ai-dex-manager' &&
      github.event.issue.number == 317 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'DISDEX_PROTECTED_REQUEST V4_DOGE_MISSED_TIME_EXIT ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact DOGE incident and plan hash
        id: request
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os, pathlib, re
          body=os.environ["BODY"].strip()
          match=re.fullmatch(
            r"DISDEX_PROTECTED_REQUEST V4_DOGE_MISSED_TIME_EXIT SHA=([0-9a-f]{40})",
            body,
          )
          if not match:
            raise SystemExit("request does not match exact DOGE operator grammar")
          target=match.group(1)
          expected="53a0be396719f0284af4e11b35c66a4ac7d58f79"
          if target != expected:
            raise SystemExit("DOGE operator request must target exact V4 runtime SHA")
          path=pathlib.Path("docs/ops/V4_DOGE_MISSED_TIME_EXIT_OPERATOR_PLAN_20261101.json")
          plan=hashlib.sha256(path.read_bytes()).hexdigest()
          print("target_sha="+target)
          print("plan_sha256="+plan)
          print("comment_id="+os.environ["COMMENT_ID"])
          PY

      - name: Configure pinned root SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" == "professional-dismanager.net" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/doge-approval-ssh"
          printf '%s\n' "$ROOT_KEY" > "$RUNNER_TEMP/doge-approval-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/doge-approval-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/doge-approval-ssh/"*
          ssh-keygen -y -f "$RUNNER_TEMP/doge-approval-ssh/key" >/dev/null

      - name: Publish exact pending request through serialized approval store helper
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          PLAN_SHA256: ${{ steps.request.outputs.plan_sha256 }}
          COMMENT_ID: ${{ steps.request.outputs.comment_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$TARGET_SHA" == "53a0be396719f0284af4e11b35c66a4ac7d58f79" ]]
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          REMOTE_HELPER="/tmp/disdex_deployment_approval_store.$GITHUB_RUN_ID.py"
          scp -i "$RUNNER_TEMP/doge-approval-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/doge-approval-ssh/known_hosts" -P "$PORT" \
            scripts/ops/deploy/disdex_deployment_approval_store.py \
            "root@$SSH_HOST:$REMOTE_HELPER"
          ssh -T -i "$RUNNER_TEMP/doge-approval-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/doge-approval-ssh/known_hosts" \
            -o ConnectTimeout=10 -p "$PORT" "root@$SSH_HOST" \
            "set -euo pipefail; trap 'rm -f -- $REMOTE_HELPER' EXIT; python3 '$REMOTE_HELPER' create-pending --operation 'V4_DOGE_MISSED_TIME_EXIT' --scope 'V12_V4' --orders-enabled 'true' --target-sha '$TARGET_SHA' --plan-sha256 '$PLAN_SHA256' --actor '$ACTOR' --comment-id '$COMMENT_ID'"
      - name: Destroy SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/doge-approval-ssh"
