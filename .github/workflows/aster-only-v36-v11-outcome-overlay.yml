name: Aster-only V36 V11 Outcome Overlay

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v36_v11_outcome_overlay.py'
      - 'docs/research/ASTER_ONLY_V36_V11_OUTCOME_OVERLAY_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v36-v11-outcome-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v36-v11-outcome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore router caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v36-v11-outcome
          key: aster-only-v36-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v36_v11_outcome_overlay.py') }}
          restore-keys: |
            aster-only-v36-${{ runner.os }}-
            aster-only-v35-${{ runner.os }}-
            aster-only-v29-${{ runner.os }}-
            aster-only-v27-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v26_nonbasis_fallback_tournament.py \
            scripts/research_lab_aster_only_v27_beta_squeeze_orb_tournament.py \
            scripts/research_lab_aster_only_v29_frozen_multi_signal_router.py \
            scripts/research_lab_aster_only_v36_v11_outcome_overlay.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v36_v11_outcome_overlay as v36
          assert (v36.v29.v19.BT_END_EXCLUSIVE - v36.v29.v19.BT_START).days == 365
          assert len(v36.POLICIES) == 56
          assert v36.v29.BASELINE_NORMAL == 72.276908
          assert v36.v29.BASELINE_P95 == 68.080022
          assert v36.v29.BASELINE_FALLBACK_NORMAL == 7.813259
          assert v36.v29.BASELINE_FALLBACK_P95 == 7.400908
          print('V36 freeze assertions: PASS')
          PY
      - name: Run V36 outcome overlay
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v36-v11-outcome
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v36_v11_outcome_overlay.py \
            --cache-dir ../.cache/aster-only-v36-v11-outcome \
            --output-dir ../.research-state/aster-only-v36-v11-outcome \
            2>&1 | tee ../.research-state/aster-only-v36-v11-outcome/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v36-v11-outcome/result.json
          test -s .research-state/aster-only-v36-v11-outcome/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v36-v11-outcome/result.json').read_text())
          assert p['version'] == 36
          assert p['policyCount'] == 56
          assert p['period']['calendarDays'] == 365
          assert p['architecture'] == {
              'venue': 'ASTER_ONLY',
              'baselineRoutingPreserved': True,
              'maximumConcurrentGross': 1.0,
              'maximumConcurrentPositions': 1,
              'maximumOnePostV11Overlay': True,
              'v11EqPriority': True,
              'hyperliquidUsed': False,
          }
          assert p['selectionDiscipline']['signalComponentsRetuned'] is False
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V36_NO_VALIDATED_V11_OUTCOME_OVERLAY',
              'ASTER_ONLY_V36_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V36_VALIDATED_SHADOW_LEAD',
          }
          if p['status'] == 'ASTER_ONLY_V36_VALIDATED_SHADOW_LEAD':
              assert p['winner']['accepted'] is True
              assert all(p['winner']['audit']['checks'].values())
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
              'topPolicies': p['topPolicies'][:5],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v36-v11-outcome-${{ github.run_id }}
          path: .research-state/aster-only-v36-v11-outcome
          retention-days: 90
          if-no-files-found: warn
