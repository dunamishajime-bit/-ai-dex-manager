name: Active4 V148 Causal Role Reset

on:
  workflow_dispatch:
  push:
    branches: [research/win80-profit-optimization-v1]
    paths:
      - "scripts/research_active4_v148_causal_role_reset.py"
      - ".github/workflows/active4-v148.yml"

permissions:
  contents: read

concurrency:
  group: active4-v148-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_breadth_diffusion_owner_ecs_v18, btc_panic_recovery_owner_ecs_v18, eth_residual_rotation_owner_ecs_v18, bnb_compression_release_tactical_ecs_v18, avax_shock_outcome_router_ecs_v18]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile V148
        run: python -m py_compile scripts/research_active4_v148_causal_role_reset.py
      - name: Run V148 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v148_causal_role_reset.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v148-${{ matrix.candidate }}
          path: |
            .research-state/active4-v148-${{ matrix.candidate }}.json
            .research-state/active4-v148-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only BTC/ETH/BNB/AVAX. Development/Validation only.
# Confirmation/Holdout, SOL/LINK, production/live/VPS/.env/credentials/orders/accounts/positions untouched.
