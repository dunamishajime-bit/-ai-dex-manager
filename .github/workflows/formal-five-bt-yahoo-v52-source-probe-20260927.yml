name: Formal BT Yahoo historical 60m source availability probe
on:
  push:
    branches: [research/formal-five-bt-yahoo-v52-20260927]
    paths: [.github/workflows/formal-five-bt-yahoo-v52-source-probe-20260927.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect Yahoo Finance hourly source, metadata only (no market data artifact)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json,datetime,time
          start=int(datetime.datetime(2025,8,1,tzinfo=datetime.timezone.utc).timestamp())
          end=int(datetime.datetime(2026,8,11,tzinfo=datetime.timezone.utc).timestamp())
          ok=0
          for ticker in ('AMZN','META','MSFT','NVDA','TSLA'):
            report={'symbol':ticker,'source':'YAHOO_FINANCE_V8_CHART','interval_requested':'60m'}
            for host in ('query1.finance.yahoo.com','query2.finance.yahoo.com'):
              url=f'https://{host}/v8/finance/chart/{ticker}?'+urllib.parse.urlencode({
                  'period1':start,'period2':end,'interval':'60m','events':'history',
                  'includePrePost':'false'})
              req=urllib.request.Request(url,headers={
                'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36',
                'Accept':'application/json','Accept-Language':'en-US,en;q=0.9'})
              try:
                with urllib.request.urlopen(req,timeout=19) as f:
                  if f.status!=200: raise RuntimeError('Yahoo HTTP '+str(f.status))
                  body=f.read(12_000_000)
                data=json.loads(body)
                err=data.get('chart',{}).get('error')
                r=(data.get('chart',{}).get('result') or [None])[0]
                if err or not r:raise ValueError(str(err))
                stamps=r.get('timestamp') or []
                q=((r.get('indicators') or {}).get('quote') or [None])[0] or {}
                counts={k:len(q.get(k) or []) for k in ('open','high','low','close','volume')}
                assert stamps and all(v==len(stamps) for v in counts.values())
                valid=sum(all(q[k][i] is not None for k in ('open','high','low','close')) for i in range(len(stamps)))
                report.update({'http':200,'host':host,'rows':len(stamps),'completeOHLC':valid,
                  'first':datetime.datetime.fromtimestamp(stamps[0],datetime.timezone.utc).isoformat(),
                  'last':datetime.datetime.fromtimestamp(stamps[-1],datetime.timezone.utc).isoformat(),
                  'timezone':r.get('meta',{}).get('exchangeTimezoneName'),
                  'granularity':r.get('meta',{}).get('dataGranularity'),
                  'currency':r.get('meta',{}).get('currency'),'status':'AVAILABLE'})
                ok+=1
                break
              except Exception as e:
                report.update({'status':'UNAVAILABLE','host':host,'error':str(e)[:180]})
            print('YAHOO_V52_HOURLY_PROBE',json.dumps(report,sort_keys=True))
            time.sleep(1.2)
          print('YAHOO_V52_AVAILABLE_SYMBOLS',ok)
          assert ok>=3,'NOT_ENOUGH_YAHOO_HOURLY_STOCK_HISTORY'
          PY
