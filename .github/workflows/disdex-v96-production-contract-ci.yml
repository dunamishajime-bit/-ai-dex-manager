name: Dis-Dex V96 Production Contract

on:
  pull_request:
    branches:
      - master
    paths:
      - config/disdexV96Runtime.ts
      - lib/disdex-v95-*.ts
      - lib/disdex-v96-*.ts
      - scripts/disdex-v95-*.ts
      - scripts/disdex_v95_*.py
      - scripts/disdex_v96_*.py
      - scripts/disdex-v96-*.ts
      - scripts/install-disdex-v96-systemd.sh
      - docs/DISDEX_V96_PRODUCTION_HANDOFF.md
      - docs/DISDEX_V96_VOLUME50_TURNOVER075_LIVE_HANDOFF.md
      - tsconfig.v96-runner.json
      - package.json
      - .github/workflows/disdex-v96-production-contract-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: V96 Python to TypeScript golden-vector parity and safeguards
        run: npm run strategy:disdex-v96:parity
      - name: Write execution-parity approval manifest
        env:
          DISDEX_V96_PRODUCTION_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISDEX_V96_PARITY_REVIEWER: github-actions-v96-parity-suite
        run: |
          npx tsx scripts/disdex-v96-write-execution-parity-approval.ts \
            .runtime-state/disdex-v95-golden.json \
            .runtime-state/disdex-v96-execution-parity-approved.json
      - name: V96 TypeScript boundary
        shell: bash
        run: |
          set -o pipefail
          npm run strategy:disdex-v96:typecheck 2>&1 | tee .runtime-state/disdex-v96-typecheck.log
      - name: Existing V46 validation
        run: |
          npm run strategy:disdex-v46:selftest
          npm run strategy:disdex-v46:typecheck
      - name: Existing V35 runner typecheck
        run: npm run strategy:disdex-v35:runner:typecheck
      - name: LIVE promotion policy audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'strategyId: DISDEX_V96_STRATEGY_ID' config/disdexV96Runtime.ts
          grep -q 'productionRevision: "CORE_VOLUME50_TURNOVER075_LIVE_R1"' config/disdexV96Runtime.ts
          grep -q 'componentVolumeFloor: 0.50' config/disdexV96Runtime.ts
          grep -q 'portfolioRebalanceThresholdPct: 7.5' config/disdexV96Runtime.ts
          grep -q 'weightBandTolerancePct: 5' config/disdexV96Runtime.ts
          grep -q 'forcedRefreshBars: 12' config/disdexV96Runtime.ts
          grep -q 'mode: "LIVE_READY"' config/disdexV96Runtime.ts
          grep -q 'liveTradingEnabled: true' config/disdexV96Runtime.ts
          grep -q 'forwardEvidenceStatus: "NOT_APPROVED"' config/disdexV96Runtime.ts
          grep -q 'operatorOverrideEnabled: true' config/disdexV96Runtime.ts
          grep -q 'maximumOverridePenguGross: 0.15' config/disdexV96Runtime.ts
          grep -q 'maximumDailyLossPct: 2' config/disdexV96Runtime.ts
          grep -q 'killSwitchAction: "FLATTEN_MANAGED"' config/disdexV96Runtime.ts
          grep -q 'status: "APPROVED"' config/disdexV96Runtime.ts
          grep -q 'V95_WEIGHT_BAND_STRONG_BOOST_TYPESCRIPT_GOLDEN_VECTOR_PASS' config/disdexV96Runtime.ts
          grep -q 'buildDisDexV96CoreTargetSeries' lib/disdex-v95-core-signal.ts
          grep -q 'componentVolumeFloor' lib/disdex-v96-core-signal.ts
          grep -q 'DISDEX_V96_CONFIG_MIGRATION_ACKNOWLEDGEMENT' scripts/disdex-v96-migrate-config-state.ts
          grep -q 'CONFIG_MIGRATION_WITH_EXISTING_MANAGED_POSITIONS' scripts/disdex-v96-live-preflight.ts
          grep -q 'DISDEX_V96_RUNTIME_COMMIT_SHA' lib/disdex-v96-live-gates.ts
          grep -q 'DISDEX_V96_OPERATOR_OVERRIDE_FILE' scripts/install-disdex-v96-systemd.sh
          grep -q 'DISDEX_V96_KILL_SWITCH_FILE' scripts/install-disdex-v96-systemd.sh
          grep -q 'strategy:disdex-v96:preflight' scripts/install-disdex-v96-systemd.sh
          grep -q 'before any existing V46 service is stopped' scripts/install-disdex-v96-systemd.sh
          grep -q 'DISDEX_V96_LIVE_PREFLIGHT_PASS_NO_ORDERS_SENT' scripts/disdex-v96-live-preflight.ts
          test -s .runtime-state/disdex-v96-execution-parity-approved.json
      - name: Shell syntax
        run: bash -n scripts/install-disdex-v96-systemd.sh
      - name: Upload V95/V96 parity evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dis-dex-v95-v96-execution-parity
          path: |
            .runtime-state/disdex-v95-golden.json
            .runtime-state/disdex-v96-execution-parity-approved.json
            .runtime-state/disdex-v96-typecheck.log
          if-no-files-found: warn
          retention-days: 90
