name: Dis-Dex V96 Production Contract

on:
  pull_request:
    branches:
      - master
    paths:
      - config/disdexV96Runtime.ts
      - lib/disdex-v95-*.ts
      - lib/disdex-v96-*.ts
      - scripts/disdex-v95-*.ts
      - scripts/disdex_v95_*.py
      - scripts/disdex-v96-*.ts
      - scripts/install-disdex-v96-systemd.sh
      - docs/DISDEX_V96_PRODUCTION_HANDOFF.md
      - tsconfig.v96-runner.json
      - package.json
      - .github/workflows/disdex-v96-production-contract-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: V95 Python to TypeScript golden-vector parity
        run: npm run strategy:disdex-v96:parity
      - name: Write execution-parity approval manifest
        env:
          DISDEX_V96_PRODUCTION_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISDEX_V96_PARITY_REVIEWER: github-actions-v96-parity-suite
        run: |
          npx tsx scripts/disdex-v96-write-execution-parity-approval.ts \
            .runtime-state/disdex-v95-golden.json \
            .runtime-state/disdex-v96-execution-parity-approved.json
      - name: V96 TypeScript boundary
        run: npm run strategy:disdex-v96:typecheck
      - name: Existing V46 validation
        run: |
          npm run strategy:disdex-v46:selftest
          npm run strategy:disdex-v46:typecheck
      - name: Existing V35 runner typecheck
        run: npm run strategy:disdex-v35:runner:typecheck
      - name: Execution parity policy audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'strategyId: DISDEX_V96_STRATEGY_ID' config/disdexV96Runtime.ts
          grep -q 'mode: "PAPER"' config/disdexV96Runtime.ts
          grep -q 'liveTradingEnabled: false' config/disdexV96Runtime.ts
          grep -q 'forwardEvidenceStatus: "NOT_APPROVED"' config/disdexV96Runtime.ts
          grep -q 'status: "APPROVED"' config/disdexV96Runtime.ts
          grep -q 'V95_WEIGHT_BAND_STRONG_BOOST_TYPESCRIPT_GOLDEN_VECTOR_PASS' config/disdexV96Runtime.ts
          grep -q 'buildDisDexV95CoreSignal' lib/disdex-v96-combined-signal.ts
          grep -q 'V96 repository liveTradingEnabled is false' scripts/install-disdex-v96-systemd.sh
          test -s .runtime-state/disdex-v96-execution-parity-approved.json
      - name: Shell syntax
        run: bash -n scripts/install-disdex-v96-systemd.sh
      - name: Upload V95/V96 parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dis-dex-v95-v96-execution-parity
          path: |
            .runtime-state/disdex-v95-golden.json
            .runtime-state/disdex-v96-execution-parity-approved.json
          if-no-files-found: warn
          retention-days: 90
