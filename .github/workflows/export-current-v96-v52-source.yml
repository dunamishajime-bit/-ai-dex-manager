name: Export Current V96 V52 Source

on:
  pull_request:
    branches:
      - codex/current-logic-bt-20260731

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact active source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/ai-dex-manager-ac421acb05e771afc99ed916d11948ca95370d32.zip ac421acb05e771afc99ed916d11948ca95370d32
      - uses: actions/upload-artifact@v4
        with:
          name: current-v96-v52-source-${{ github.run_id }}
          path: dist/ai-dex-manager-ac421acb05e771afc99ed916d11948ca95370d32.zip
          if-no-files-found: error
          retention-days: 7
