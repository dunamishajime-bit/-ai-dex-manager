name: Integrated profit portfolio backtest

on:
  push:
    branches:
      - analysis/integrated-profit-portfolio-20260716
    paths:
      - "research/integrated_profit_parts/**"
      - "research/multiperp_cross_section.py"
      - ".github/workflows/integrated-profit-portfolio.yml"
  pull_request:
    branches:
      - master
    paths:
      - "research/integrated_profit_parts/**"
      - "research/multiperp_cross_section.py"
      - ".github/workflows/integrated-profit-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Restore price and funding cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/multiperp_4h
            .cache/integrated_funding
          key: integrated-profit-202101-202606-v1

      - name: Assemble integrated research script
        run: cat research/integrated_profit_parts/*.part > research/integrated_profit_portfolio.py

      - name: Validate syntax
        run: python -m py_compile research/integrated_profit_portfolio.py

      - name: Run integrated holdout validation
        run: |
          set -o pipefail
          python -m research.integrated_profit_portfolio 2>&1 | tee integrated_profit_portfolio.log

      - name: Upload integrated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-profit-portfolio-report
          path: |
            backtest_output_integrated_profit/
            integrated_profit_portfolio.log
          if-no-files-found: warn
