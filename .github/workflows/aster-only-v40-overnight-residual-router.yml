name: Aster-only V40 Overnight Residual Router

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v40_overnight_residual_router.py'
      - 'docs/research/ASTER_ONLY_V40_OVERNIGHT_RESIDUAL_ROUTER_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v40-overnight-residual-router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v40-overnight-residual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore overnight caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v40-overnight-residual
          key: aster-only-v40-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v40_overnight_residual_router.py') }}
          restore-keys: |
            aster-only-v40-${{ runner.os }}-
            aster-only-v39-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v39_overnight_open_router.py \
            scripts/research_lab_aster_only_v40_overnight_residual_router.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v40_overnight_residual_router as v40
          assert (v40.v39.v19.BT_END_EXCLUSIVE - v40.v39.v19.BT_START).days == 365
          assert len(v40.CANDIDATES) == 72
          assert v40.v39.LOOKBACK == 20
          assert v40.v39.TP_PCT == 1.0
          assert v40.v39.SL_PCT == 1.0
          assert v40.v39.BASELINE_NORMAL == 72.276908
          assert v40.v39.BASELINE_P95 == 68.080022
          print('V40 freeze assertions: PASS')
          PY
      - name: Run V40 overnight residual router
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v40-overnight-residual
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v40_overnight_residual_router.py \
            --cache-dir ../.cache/aster-only-v40-overnight-residual \
            --output-dir ../.research-state/aster-only-v40-overnight-residual \
            2>&1 | tee ../.research-state/aster-only-v40-overnight-residual/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v40-overnight-residual/result.json
          test -s .research-state/aster-only-v40-overnight-residual/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v40-overnight-residual/result.json').read_text())
          assert p['version'] == 40
          assert p['candidateCount'] == 72
          assert p['period']['calendarDays'] == 365
          assert p['architecture'] == {
              'venue': 'ASTER_ONLY',
              'signalSource': 'CROSS_SECTIONAL_OVERNIGHT_AND_FIRST_HOUR_RESIDUAL',
              'entryNy': '10:30',
              'maximumConcurrentGross': 1.0,
              'maximumConcurrentPositions': 1,
              'v11EqPriority': True,
              'v19SequentialWhenNonOverlapping': True,
              'hyperliquidUsed': False,
          }
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V40_NO_VALIDATED_OVERNIGHT_RESIDUAL_ROUTER',
              'ASTER_ONLY_V40_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V40_VALIDATED_SHADOW_LEAD',
          }
          if p['status'] == 'ASTER_ONLY_V40_VALIDATED_SHADOW_LEAD':
              assert p['winner']['accepted'] is True
              assert all(p['winner']['audit']['checks'].values())
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
              'topDevelopmentDiagnostics': p['topDevelopmentDiagnostics'][:5],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v40-overnight-residual-${{ github.run_id }}
          path: .research-state/aster-only-v40-overnight-residual
          retention-days: 90
          if-no-files-found: warn
