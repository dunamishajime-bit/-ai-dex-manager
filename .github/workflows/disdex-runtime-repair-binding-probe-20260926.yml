name: DisDex root recovery binding probe (read-only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event.issue.number == 132 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'DISDEX_ROOT_REPAIR_BINDING_PROBE_20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - name: Configure approved VPS read-only transport
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
      - name: Identify current root repair executable and unit references
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' <<'PY'
          import os,pathlib,subprocess,json,stat
          def run(cmd,timeout=10):
           try:
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=timeout)
            return (p.returncode,p.stdout[:4500],p.stderr[:200])
           except Exception as e:return (-1,"",type(e).__name__)
          sha=(pathlib.Path("/home/deploy/disdex-trading/current").resolve()/".disdex-release-sha").read_text().strip()
          print("CURRENT_SHA="+sha)
          r=run(["systemctl","list-unit-files","--type=service","--no-legend","--no-pager"])
          print("RELEVANT_UNITS="+json.dumps([line.split()[0] for line in r[1].splitlines() if any(t in line.lower() for t in ["repair","watchdog","retention","deploy"])]))
          for name in ["disdex-v12-kill-switch-auto-repair.service","disdex-v12-auto-repair.service","disdex-v12-kill-switch-auto-repair.timer","disdex-runner-watchdog.service","disdex-runner-watchdog.timer"]:
           p=run(["systemctl","cat",name,"--no-pager"],timeout=6)
           lines=[l for l in p[1].splitlines() if l.lstrip().startswith(("Description=","ExecStart=","ExecStartPre=","EnvironmentFile=","WorkingDirectory=","User=","Group=","OnCalendar="))]
           print("UNIT_BINDING="+json.dumps({"name":name,"rc":p[0],"lines":lines[:16]}))
          for root in ["/etc/systemd/system","/etc/disdex","/usr/local/sbin"]:
           base=pathlib.Path(root)
           if not base.is_dir():continue
           hit=[]
           for x in base.rglob("*"):
            if x.is_file() and any(k in x.name.lower() for k in ["auto-repair","watchdog","retention"]):
             hit.append({"path":str(x),"symlink":x.is_symlink(),"size":x.stat().st_size})
           print("ROOT_HELPER_CANDIDATES="+json.dumps({"root":root,"matches":hit[:30]}))
          p=run(["systemctl","list-timers","--all","--no-pager","--no-legend"],timeout=6)
          print("RELEVANT_TIMERS="+json.dumps([line[:230] for line in p[1].splitlines() if "disdex" in line.lower() and any(x in line.lower() for x in ["repair","retention","watchdog"])]))
          for s in ["/var/lib/disdex/shared/kill-switch.json","/var/lib/disdex/shared/aster-rate-budget.json","/var/lib/disdex/shared","/home/deploy/disdex-trading/current"]:
           p=pathlib.Path(s)
           if not p.exists():continue
           st=p.lstat()
           print("SHARED_PATH_META="+json.dumps({"path":s,"mode":oct(stat.S_IMODE(st.st_mode)),"uid":st.st_uid,"gid":st.st_gid,"symlink":p.is_symlink()}))
          print("BINDING_PROBE_TRADING_MUTATION=0")
          PY
