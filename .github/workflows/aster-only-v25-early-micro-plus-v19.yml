name: Aster-only V25 Early Micro Plus V19

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v25_early_micro_plus_v19.py'
      - 'docs/research/ASTER_ONLY_V25_EARLY_MICRO_PLUS_V19_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v25-early-micro-plus-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v25-micro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v25-micro
          key: aster-only-v25-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v25_early_micro_plus_v19.py') }}
          restore-keys: |
            aster-only-v25-${{ runner.os }}-
            aster-only-v24-${{ runner.os }}-
            aster-only-v23-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v25_early_micro_plus_v19.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v25_early_micro_plus_v19 as v25
          assert len(v25.MICRO_CANDIDATES) == 42
          assert all(c.entry_policy == 'SLOT_1130' for c in v25.MICRO_CANDIDATES)
          assert all(c.maximum_holding_hours == 1 for c in v25.MICRO_CANDIDATES)
          assert v25.v19.CANDIDATE.candidate_id == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert v25.MIN_VALIDATION_ROUTER_TRADES == 8
          assert v25.MIN_VALIDATION_MICRO_TRADES == 4
          assert v25.DAILY_LOSS_LOCK == -0.02
          print('V25 micro freeze assertions: PASS')
          PY
      - name: Run V25 early micro tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v25-micro
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v25_early_micro_plus_v19.py \
            --cache-dir ../.cache/aster-only-v25-micro \
            --output-dir ../.research-state/aster-only-v25-micro \
            2>&1 | tee ../.research-state/aster-only-v25-micro/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v25-micro/result.json
          test -s .research-state/aster-only-v25-micro/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v25-micro/result.json').read_text())
          assert p['version'] == 25
          assert p['period']['calendarDays'] == 365
          assert p['candidateUniverse'] == 42
          assert p['selectionDiscipline']['microCandidateGridPredeclared'] is True
          assert p['selectionDiscipline']['v19RemainsEnabledAfterMicroExit'] is True
          assert p['selectionDiscipline']['validationSelectsAtMostOne'] is True
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['architecture']['maximumConcurrentStockPositions'] == 1
          assert p['architecture']['maximumSequentialFallbackTradesPerDay'] == 2
          assert p['architecture']['maximumGross'] == 1.0
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          assert p['status'] in {
            'ASTER_ONLY_V25_NO_VALIDATED_EARLY_MICRO',
            'ASTER_ONLY_V25_EARLY_MICRO_STRICT_IMPROVEMENT_SHADOW_ONLY',
            'ASTER_ONLY_V25_VALIDATED_EARLY_MICRO_NOT_STRICT_IMPROVEMENT',
          }
          if p['status'] == 'ASTER_ONLY_V25_EARLY_MICRO_STRICT_IMPROVEMENT_SHADOW_ONLY':
              assert p['allImprovementChecksPassed'] is True
              assert all(p['improvementChecks'].values())
          print(json.dumps({
            'status': p['status'],
            'developmentSurvivors': p['developmentSurvivors'],
            'validationSurvivors': p['validationSurvivors'],
            'selectedCandidate': p.get('selectedCandidate'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v25-micro-${{ github.run_id }}
          path: .research-state/aster-only-v25-micro
          retention-days: 90
          if-no-files-found: warn
