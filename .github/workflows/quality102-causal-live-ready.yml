name: Quality102 Causal Live Ready

on:
  push:
    branches:
      - 'codex/quality102-causal-live-ready-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Causal selector self-test
        run: npm run strategy:strict-bt33404708902:causal-selector:selftest

      - name: Causal pipeline self-test
        run: npm run strategy:strict-bt33404708902:pipeline:selftest

      - name: Legacy LIVE selector fail-closed self-test
        run: npm run strategy:strict-bt33404708902:selector:selftest

      - name: Strict gross self-test
        run: npm run strategy:strict-bt33404708902:gross:selftest

      - name: Strict contract test
        run: npm run strategy:strict-bt33404708902:contract

      - name: Typecheck
        run: npm run typecheck
