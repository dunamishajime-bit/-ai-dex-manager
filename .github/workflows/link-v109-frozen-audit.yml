name: LINK V109 Frozen Robustness Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_link_v109_frozen_audit.py"
      - ".github/workflows/link-v109-frozen-audit.yml"

permissions:
  contents: read

concurrency:
  group: link-v109-frozen-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [stress, prior, okx]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Restore OKX external cache
        if: matrix.mode == 'okx'
        uses: actions/cache@v4
        with:
          path: .cache/link-v109-external
          key: link-v109-okx-20260811-v1
          restore-keys: |
            link-v109-external-20260811-
      - name: Compile
        run: python -m py_compile scripts/research_link_v109_frozen_audit.py
      - name: Run frozen audit shard
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_link_v109_frozen_audit.py --mode "${{ matrix.mode }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-v109-frozen-${{ matrix.mode }}
          path: |
            .research-state/link-v109-frozen-${{ matrix.mode }}.json
            .research-state/link-v109-frozen-${{ matrix.mode }}.md
          if-no-files-found: warn
          retention-days: 30

# Frozen robustness validation only. No tuning and no production/VPS/live-trading changes.
