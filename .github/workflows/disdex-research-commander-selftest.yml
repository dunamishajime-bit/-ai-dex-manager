name: DisDex Research Commander Selftest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "apps/disdex-research-commander/**"
      - ".github/workflows/disdex-research-commander-selftest.yml"
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "apps/disdex-research-commander/**"
      - ".github/workflows/disdex-research-commander-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/disdex-research-commander/package-lock.json
      - name: Install
        run: npm --prefix apps/disdex-research-commander ci --ignore-scripts
      - name: Selftest
        run: npm --prefix apps/disdex-research-commander run selftest
      - name: Syntax check
        run: node --check apps/disdex-research-commander/server.mjs && node --check apps/disdex-research-commander/selftest.mjs && node --check apps/disdex-research-commander/lib/github.mjs && node --check apps/disdex-research-commander/lib/diagnostics.mjs && node --check apps/disdex-research-commander/lib/policy.mjs

# Research-only app validation. No production/VPS/live/credential/order/account/position access.

