name: PENGU Reversal Short V2 Research

on:
  pull_request:
    branches:
      - chatgpt/v12-live-adapter-final-20260817
    paths:
      - 'scripts/research_pengu_reversal_short_v2.ts'
      - '.github/workflows/pengu-reversal-short-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pengu-reversal-short-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run lifecycle-matched reversal short study
        env:
          PENGU_REVERSAL_SHORT_OUT: .research-state/pengu-reversal-short-v2/result.json
        run: |
          set -o pipefail
          mkdir -p .research-state/pengu-reversal-short-v2
          npx tsx scripts/research_pengu_reversal_short_v2.ts 2>&1 | tee .research-state/pengu-reversal-short-v2/run.log
      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/pengu-reversal-short-v2/result.json').read_text())
          assert p['status']=='PASS_RESEARCH_ONLY'
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          assert p['results']['BASELINE']['NORMAL']['SHORT']['trades']==25
          assert p['results']['BASELINE']['NORMAL']['ALL']['trades']==32
          print('PENGU_REVERSAL_SHORT_V2_RESEARCH_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-reversal-short-v2-${{ github.run_id }}
          path: .research-state/pengu-reversal-short-v2
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
