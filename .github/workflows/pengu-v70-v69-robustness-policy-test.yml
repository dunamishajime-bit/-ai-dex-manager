name: PENGU V70 V69 Robustness Policy Test
on:
  workflow_dispatch:
  push:
    branches: [research/pengu-v57-conditional-regime-20260826]
    paths:
      - 'scripts/test_research_v70_v69_robustness.py'
      - 'scripts/research_validate_v70_v69_robustness.py'
      - '.github/workflows/pengu-v70-v69-robustness-policy-test.yml'
      - '.github/workflows/pengu-v70-v69-robustness.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify frozen V69 robustness-only contract
        run: python scripts/test_research_v70_v69_robustness.py
