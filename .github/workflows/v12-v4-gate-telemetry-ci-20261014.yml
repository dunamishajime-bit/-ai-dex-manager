name: V12 V4 Read-Only Gate Telemetry Certification
on:
  push:
    branches:
      - codex/v12-v4-readonly-gate-telemetry-20261014
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-gate-observer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify native Gate telemetry and nontrading integration
        run: npx tsx --test tests/v12-v4-gate-telemetry.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit --pretty false --incremental false
      - name: Verify no trading deployment is executed here
        run: echo 'READ_ONLY_OBSERVER_CANDIDATE_CI=PASS; VPS/production deployment is intentionally excluded'
