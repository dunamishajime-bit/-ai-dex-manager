name: Loss Only Firewall Discovery Core

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - .github/workflows/loss-only-firewall-discovery-core.yml

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811
      - name: Assert frozen discovery source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_loss_only_firewall_discovery.py)" = "a7e4999f18e3bf6ad67c291a5dc43843feaf01b8"
          echo LOSS_ONLY_CORE_DISCOVERY_SOURCE_PASS
      - name: Download latest redirect-safe core LOSERS ONLY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import io,json,os,urllib.request,urllib.error,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'loss-only-core-discovery'}
          def api(url):
              q=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(q,timeout=60) as r:return r.read()
          data=json.loads(api(f'https://api.github.com/repos/{repo}/actions/artifacts?name=loss-only-trade-harvest-core-redirect-safe&per_page=100'))
          arts=[a for a in data.get('artifacts',[]) if not a.get('expired')]
          if not arts:raise SystemExit('NO_CORE_HARVEST_ARTIFACT')
          a=max(arts,key=lambda x:x['created_at'])
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          q=urllib.request.Request(a['archive_download_url'],headers=h);op=urllib.request.build_opener(NR)
          try:raw=op.open(q,timeout=60).read()
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308):raise
              raw=urllib.request.urlopen(urllib.request.Request(e.headers['Location'],headers={'User-Agent':'loss-only-core-discovery'}),timeout=120).read()
          z=zipfile.ZipFile(io.BytesIO(raw));os.makedirs('.research-state',exist_ok=True)
          names={n.split('/')[-1]:n for n in z.namelist()}
          src='loss-only-core-losing-trades.jsonl'
          if src not in names:raise SystemExit('MISSING_CORE_LOSERS')
          open('.research-state/loss-only-losing-trades.jsonl','wb').write(z.read(names[src]))
          assert not os.path.exists('.research-state/loss-only-core-normalized-trades.jsonl')
          print('CORE_LOSER_ONLY_INPUT_PASS',a['id'])
      - name: Install prefetch dependencies
        run: npm ci
      - name: Prefetch frozen historical OHLCV only
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile discovery
        run: python -m py_compile scripts/research_loss_only_firewall_discovery.py
      - name: Derive blockers from core LOSERS ONLY
        env:
          LOSS_ONLY_LOSERS_PATH: .research-state/loss-only-losing-trades.jsonl
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_loss_only_firewall_discovery.py
      - name: Assert one-way boundary
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('.research-state/loss-only-firewall-discovery.json').read_text())
          assert x['losersOnly'] is True and x['winnerFileRead'] is False and x['winnerFeaturesInspected'] is False
          assert not os.path.exists('.research-state/loss-only-core-normalized-trades.jsonl')
          print('LOSS_ONLY_CORE_DISCOVERY_BOUNDARY_PASS')
          PY
      - name: Upload core loser-only discovery
        uses: actions/upload-artifact@v4
        with:
          name: loss-only-firewall-discovery-core
          path: |
            .research-state/loss-only-firewall-discovery.json
            .research-state/loss-only-firewall-discovery.md
            .research-state/loss-only-enriched-losers.jsonl
          retention-days: 30
