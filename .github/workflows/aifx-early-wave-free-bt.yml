name: AIFX Early Wave Free BT

on:
  push:
    branches:
      - research/aifx-early-wave-free-bt-20260811
    paths:
      - research/aifx_early_wave_bt.py
      - .github/workflows/aifx-early-wave-free-bt.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run causal early-wave proxy
        run: python research/aifx_early_wave_bt.py
      - name: Commit deterministic result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/aifx_early_wave_results.json research/aifx_early_wave_summary.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: record AIFX early-wave proxy result [skip ci]"
            git push
          fi
