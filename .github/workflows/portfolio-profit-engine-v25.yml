name: Portfolio Profit Engine V25
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/3y-entry-edge-diagnosis-20260815]
    paths:
      - scripts/research_portfolio_profit_engine_v25.ts
      - .github/workflows/portfolio-profit-engine-v25.yml
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert frozen V25 source
        run: test "$(git hash-object scripts/research_portfolio_profit_engine_v25.ts)" = "a78782951831d98b01aa116e40c9be4beb44ff16"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - run: npm ci
      - name: Run V25 research
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_portfolio_profit_engine_v25.ts
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-profit-engine-v25
          path: .research-state/portfolio-profit-engine-v25*
          include-hidden-files: true
          retention-days: 30
