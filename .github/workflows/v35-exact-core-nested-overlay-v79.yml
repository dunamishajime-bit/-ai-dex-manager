name: V35 Exact Core Nested Overlay V79

on:
  push:
    branches:
      - research/major-core-pengu-balanced-v73
    paths:
      - scripts/research_lab_v35_exact_core_nested_overlay_v79.py
      - scripts/research_lab_aster_v35_exact_core_v79_runner.py
      - scripts/research_lab_aster_v35_core_only_v37_runner.py
      - scripts/research_lab_major_core_nested_v73.py
      - scripts/research_lab_parameter_bagged_rotation_v4.py
      - scripts/research_lab_precomputed_multi_regime_v6.py
      - scripts/research_lab_pengu_main_currency_v20.py
      - scripts/research_lab_feature_combo_v28.py
      - scripts/research_lab_asymmetric_return_stack_v32.py
      - scripts/research_lab_resilient_profit_stack_v34.py
      - .github/workflows/v35-exact-core-nested-overlay-v79.yml
  pull_request:
    branches:
      - research/pengu-wave-sleeve-v47
    paths:
      - scripts/research_lab_v35_exact_core_nested_overlay_v79.py
      - scripts/research_lab_aster_v35_exact_core_v79_runner.py
      - .github/workflows/v35-exact-core-nested-overlay-v79.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/research_lab_v35_exact_core_nested_overlay_v79.py \
            scripts/research_lab_aster_v35_exact_core_v79_runner.py \
            scripts/research_lab_aster_v35_core_only_v37_runner.py \
            scripts/research_lab_major_core_nested_v73.py \
            scripts/research_lab_parameter_bagged_rotation_v4.py \
            scripts/research_lab_precomputed_multi_regime_v6.py \
            scripts/research_lab_pengu_main_currency_v20.py \
            scripts/research_lab_feature_combo_v28.py \
            scripts/research_lab_asymmetric_return_stack_v32.py \
            scripts/research_lab_resilient_profit_stack_v34.py
      - name: Run exact V35 Core nested overlay validation
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_aster_v35_exact_core_v79_runner.py 2>&1 | tee .research-state/v35-exact-core-nested-overlay-v79.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-exact-core-nested-overlay-v79
          path: |
            .research-state/v35-exact-core-nested-overlay-v79.json
            .research-state/v35-exact-core-nested-overlay-v79.md
            .research-state/v35-exact-core-v79-forward-freeze.json
            .research-state/v35-exact-core-nested-overlay-v79.log
          if-no-files-found: warn
          retention-days: 30
