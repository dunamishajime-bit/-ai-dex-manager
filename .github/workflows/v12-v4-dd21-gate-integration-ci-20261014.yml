name: V12 V4 DD21 Removal and Gate Telemetry Integration CI
on:
  push:
    branches:
      - codex/v12-v4-dd21-gates-integrated-20261014
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v12-v4-dd21-gates-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify exact DD21 removal and Gate telemetry source blobs
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            actual="$(git hash-object -- "$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error file=$1::Unexpected merged source blob"
              exit 1
            fi
            echo "PASS $1 $actual"
          }
          verify_blob lib/v12-v4-production-lifecycle.ts 4de62ebe769c124db03f9cdc335b7f0ace9bda19
          verify_blob lib/v12-v4-shared-reservations.ts c240523a0d3b368bd526c0cc9d057450f35d9413
          verify_blob tests/v12-v4-production-lifecycle.test.ts 27d23c4d19e3cf4174ee058a33ef0155bf08c759
          verify_blob tests/v12-v4-shared-reservations.test.ts fb6e5f9dc938541f4e3a71dce8599f9cf788616b
          verify_blob lib/v12-v4-gate-telemetry.ts a8ac554787c8864a386a8155ee6c69bd48999e21
          verify_blob lib/v12-x1-all.ts 4e0902d3a5fbfd4f3c8dbc0c789efc37aa6c75db
          verify_blob scripts/v12-v4-production-runner.ts 34a6e7a55ea152968435950c6ef39fae10c3df43
          verify_blob tests/v12-v4-gate-telemetry.test.ts f9d0ecfd1237ea70d7c9d5531733d6f0295ed965
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify DD21 no-halt and live Gate telemetry
        run: npx tsx --test tests/v12-v4-production-lifecycle.test.ts tests/v12-v4-shared-reservations.test.ts tests/v12-v4-gate-telemetry.test.ts
      - name: Verify TypeScript
        run: npx tsc --noEmit --pretty false --incremental false
      - name: Explicit no-deployment assertion
        run: echo 'INTEGRATED_CODE_CERTIFICATION_ONLY=PASS; NO_VPS_CHANGE=TRUE; NO_TRADING_RESTART=TRUE'
