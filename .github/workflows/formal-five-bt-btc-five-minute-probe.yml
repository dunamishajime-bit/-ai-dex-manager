name: Formal BT Aster malformed BTC H1 primary-source recovery probe
on:
  workflow_dispatch:
  push:
    branches: [codex/formal-five-logic-bt-20260926]
    paths:
      - ".github/workflows/formal-five-bt-btc-five-minute-probe.yml"
permissions:
  contents: read
jobs:
  independent-source-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct single corrupt BTC H1 solely from official Aster 5m
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, math
          from research.formal_five_bt.sources import fetch_historical_klines
          hour=1757768400000
          any_valid=False
          for name, interval in (("5m",300000),("1m",60000)):
            try:
              bars=fetch_historical_klines("aster","BTCUSDT",hour,hour+3600000-1,interval=name,max_pages=3)
              ordered=sorted(bars.rows,key=lambda x:int(x[0]))
              times=[int(x[0]) for x in ordered]
              exact=(len(ordered)==3600000//interval and times==[hour+i*interval for i in range(3600000//interval)])
              bad=[int(x[0])-hour for x in ordered if not (
                len(x)>=7 and all(math.isfinite(float(x[k])) and float(x[k])>0 for k in (1,2,3,4))
                and float(x[2])>=max(float(x[1]),float(x[4]))
                and float(x[3])<=min(float(x[1]),float(x[4]))
                and float(x[2])>=float(x[3]))]
              valid=exact and not bad
              print(name.upper()+"_TIMES_CONTIGUOUS:",exact)
              print(name.upper()+"_INVALID_BAR_OFFSETS_MS:",bad)
              print(name.upper()+"_PAGE_SHA256:",bars.page_hashes)
              if valid:
                combined={"ts":hour,"open":float(ordered[0][1]),
                          "high":max(float(x[2]) for x in ordered),
                          "low":min(float(x[3]) for x in ordered),
                          "close":float(ordered[-1][4]),
                          "volume":sum(float(x[5]) for x in ordered)}
                print(name.upper()+"_RECONSTRUCTED_H1_SHA256:",
                      hashlib.sha256(json.dumps(combined,sort_keys=True).encode()).hexdigest())
                any_valid=True
            except Exception as error:
              print(name.upper()+"_PROBE_UNAVAILABLE:",type(error).__name__,str(error).split("\\n")[0][:140])
          if any_valid:
            raw_h1=fetch_historical_klines("aster","BTCUSDT",hour,hour+3600000-1,interval="1h",max_pages=2)
            native=next((x for x in raw_h1.rows if int(x[0])==hour),None)
            if native is None:
              print("NATIVE_1H_MISSING: True")
            else:
              print("NATIVE_H1_TO_1M_OPEN_DIVERGENCE_BPS:",round(abs(float(native[1])/combined["open"]-1)*10000,8))
              print("NATIVE_H1_TO_1M_CLOSE_DIVERGENCE_BPS:",round(abs(float(native[4])/combined["close"]-1)*10000,8))
          print("OFFICIAL_ASTER_MINUTE_REPAIR_AVAILABLE:",any_valid)
          print("REPLAY_STATUS: PRIMARY_VENUE_DERIVED_RESEARCH_ONLY" if any_valid
                else "REPLAY_STATUS: PRIMARY_VENUE_SOURCE_CORRUPT_NO_REPAIR")
          PY
