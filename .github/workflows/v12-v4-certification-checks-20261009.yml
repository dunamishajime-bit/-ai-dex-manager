name: V12 V4 certification checks only
on:
  push:
    branches: ["codex/v12-v4-v2-m150-implementation-20261009", "codex/v12-v4-production-cert-20261009"]
    paths:
      - ".github/workflows/v12-v4-certification-checks-20261009.yml"
      - "components/**"
      - "lib/**"
      - "config/**"
      - "tests/**"
      - "apps/production-ui/**"
      - "scripts/v12-v4-production-*.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Root type checks
        run: npm run typecheck
      - name: V4 lifecycle and fail-closed status checks
        run: node --import tsx --test tests/v12-v4-native-source.test.ts tests/v12-v4-native-core.test.ts tests/v12-v4-production-lifecycle.test.ts tests/v12-v4-production-certification.test.ts tests/v12-runtime-status.test.ts tests/v12-v4-hp-failclosed.test.ts tests/v12-v4-shadow-observability.test.ts
      - name: Full root regression on Linux
        run: |
          sudo useradd --no-create-home deploy
          sudo env NODE_BINARY="$(command -v node)" python3 - <<'PY'
          import os, pathlib, subprocess
          files = sorted([*pathlib.Path("tests").glob("*.test.ts"), *pathlib.Path("tests").glob("*.test.mjs")])
          for path in files:
              subprocess.run([os.environ["NODE_BINARY"], "--import", "tsx", "--test", str(path)], check=True, timeout=90)
          subprocess.run(["python3", "tests/v52-worst-case-capacity.test.py"], check=True, timeout=90)
          print(f"PASS {len(files)} root Node test files and V52 Python capacity test")
          PY
      - name: Install UI dependencies
        working-directory: apps/production-ui
        run: npm ci --ignore-scripts
      - name: UI contract checks
        working-directory: apps/production-ui
        run: node --import tsx --test tests/*.test.ts
      - name: Linux UI production build
        working-directory: apps/production-ui
        run: npm run build
      - name: Adoption remains blocked
        run: echo "Code checks do not certify strategy adoption. V4 order authority stays disabled; this workflow performs no deployment or venue calls."
