name: Formal V12 Top2 Long V2 Short V20 V52 DCA BT

on:
  pull_request:
    branches:
      - codex/pengu-short-v20-production

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore research caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/perp-research-usdm
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: formal-v20-unified-dca-${{ runner.os }}-${{ hashFiles('scripts/research_v12_top2_gross15_one_year.ts','scripts/research_current_v12_top2_ledger.ts','scripts/research_current_top2_pengu_v52_dca.py','lib/pengu-short-v20.ts') }}
          restore-keys: |
            current-v12-top2-pengu-v52-dca-
            v12-top2-gross15-
            v12-v52-pengu-v2-combined-
            v26-latency-aware-3y-usdm-v1-20260816
            aster-only-v52-v39cache-
            perp-research-usdm-

      - run: npm ci
      - run: python -m py_compile scripts/research_current_top2_pengu_v52_dca.py scripts/build_pengu_long_v2_short_v20_aster_ledger.py

      - name: Build V12 Top2 ledger
        env:
          V12_TOP2_LEDGER_OUT: .research-state/formal-v20-dca/v12-top2-ledger.json
        run: |
          mkdir -p .research-state/formal-v20-dca
          npx tsx scripts/research_current_v12_top2_ledger.ts 2>&1 | tee .research-state/formal-v20-dca/v12-top2.log

      - name: Build PENGU Long V2 Short V20 ledger
        env:
          PENGU_LEDGER_OUT: .research-state/formal-v20-dca/pengu-v20-ledger.json
          PRODUCTION_SOURCE_SHA: 8ca3f52b0da705c20aa4033769da1af869202f70
        run: python scripts/build_pengu_long_v2_short_v20_aster_ledger.py 2>&1 | tee .research-state/formal-v20-dca/pengu-v20.log

      - name: Validate PENGU lineage
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.research-state/formal-v20-dca/pengu-v20-ledger.json'))
          assert p['strategyId']=='PENGU_DUAL_LS_V2_FINAL'
          assert p['longVariant']=='PENGU_DUAL_LS_V2_FINAL'
          assert p['shortVariant']=='COUNTERWIND_VOL_TARGET_FAILURE_EXIT'
          assert p['shortPreRegistrationSha']=='ad7cedb3cafaf9f9680e390112f72375d84b50ac'
          assert p['period']['startInclusive'].startswith('2025-08-01')
          assert p['period']['endExclusive'].startswith('2026-08-01')
          assert p['integrity']['noOverlap'] is True
          assert p['integrity']['maximumRequestedGross'] <= 0.75 + 1e-12
          print(json.dumps({'normal':p['modes']['normal']['metrics'],'stress':p['modes']['stress']['metrics'],'long':p['longVariant'],'short':p['shortVariant']},indent=2))
          PY

      - name: Run unified DCA backtest
        run: |
          python scripts/research_current_top2_pengu_v52_dca.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --v12-ledger .research-state/formal-v20-dca/v12-top2-ledger.json \
            --pengu-ledger .research-state/formal-v20-dca/pengu-v20-ledger.json \
            --output-dir .research-state/formal-v20-dca \
            2>&1 | tee .research-state/formal-v20-dca/combined-dca.log

      - name: Validate formal contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.research-state/formal-v20-dca/result.json'))
          assert p['status']=='PASS_RESEARCH_ONLY', p['checks']
          assert p['period']['startInclusive'].startswith('2025-08-01')
          assert p['period']['endExclusive'].startswith('2026-08-01')
          assert p['capital']['totalContributedJpy']==120000
          assert p['architecture']['v12Slots']==2
          assert p['architecture']['v12GrossCap']==1.5
          assert p['architecture']['sharedCryptoGrossCap']==2.0
          assert p['architecture']['stockGrossCap']==1.5
          assert p['architecture']['totalGrossCap']==2.5
          assert p['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'status':p['status'],'normal':p['results']['NORMAL'],'severe':p['results']['SEVERE'],'checks':p['checks']},ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-v12-top2-pengu-v20-v52-dca-${{ github.run_id }}
          path: .research-state/formal-v20-dca
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
