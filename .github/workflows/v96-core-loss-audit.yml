name: V96 Non-PENGU Core Loss Audit

on:
  pull_request:
    branches:
      - research/v71-dd-v35-growth-v82
    paths:
      - scripts/research_lab_v96_core_loss_audit.py
      - .github/workflows/v96-core-loss-audit.yml
      - scripts/research_lab_v35_weight_band_strong_v95.py
      - scripts/research_lab_v35_weight_band_v90.py
      - scripts/research_lab_v35_strong_growth_v86.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research_lab_v96_core_loss_audit.py
      - name: Run fixed V96 Core loss audit
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_v96_core_loss_audit.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v96-non-pengu-core-loss-audit
          path: |
            .research-state/v96-core-loss-audit.json
            .research-state/v96-core-loss-audit.md
          if-no-files-found: warn
          retention-days: 90
