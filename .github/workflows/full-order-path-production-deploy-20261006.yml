name: V12 V4 Controlled Production Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disdex-v12-v4-production-canary
  cancel-in-progress: false

jobs:
  deploy-canary:
    if: github.ref == 'refs/heads/research/v4-independent-venue-lifecycle-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.sha }}
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Exact SHA predeployment checks
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx tsx --test 'tests/v12-v4-*.test.ts' tests/aster-v3-client-testnet-chain-id.test.ts
          test -f deploy/systemd/disdex-v12-v4-canary@.service
          grep -q 'V12_V4_OPERATION_MODE=CANARY' deploy/systemd/disdex-v12-v4-canary@.service
          grep -q 'v12-v4-canary.json' deploy/systemd/disdex-v12-v4-canary@.service

      - name: Initialize restricted root SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null

      - name: Capture current release and immutable compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          SSH=(ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "root@$SSH_HOST")
          OLD_SHA="$("${SSH[@]}" "tr -d '[:space:]' </home/deploy/disdex-trading/current/.disdex-release-sha")"
          [[ "$OLD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$OLD_SHA" "$TARGET_SHA"
          git diff --quiet "$OLD_SHA" "$TARGET_SHA" -- package.json package-lock.json
          echo "OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          echo "CURRENT_PRODUCTION_SHA=$OLD_SHA"
          echo "TARGET_CANARY_SHA=$TARGET_SHA"

      - name: Fresh read-only production preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -p "$PORT" "root@$SSH_HOST" "OLD_SHA='$OLD_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current=/home/deploy/disdex-trading/current
          [[ "$(tr -d '[:space:]' < "$current/.disdex-release-sha")" == "$OLD_SHA" ]]
          old_unit="disdex-v12-x1-all@$OLD_SHA.service"
          [[ "$(systemctl is-active "$old_unit" 2>/dev/null || true)" == active ]]
          [[ ! -e /var/lib/disdex/shared/account-order.lock ]]
          python3 - <<'PY'
          import json,time
          now=int(time.time()*1000)
          kill=json.load(open("/var/lib/disdex/shared/kill-switch.json"))
          risk=json.load(open("/var/lib/disdex/shared/crypto-daily-risk.json"))
          margin=json.load(open("/var/lib/disdex/shared/margin-risk/guard-live.json"))
          pending=json.load(open("/var/lib/disdex/shared/pending-exposure.json"))
          v12=json.load(open("/var/lib/disdex/v12-x1-all/runner.json"))
          assert kill.get("active") is False, kill
          assert risk.get("tripped") is False and risk.get("sourceComplete") is True
          assert now-int(risk["updatedAt"])<120000, ("risk-stale",now-int(risk["updatedAt"]))
          mt=int(margin.get("checkedAt",margin.get("updatedAt",0)))
          assert margin.get("stage")=="HEALTHY" and margin.get("ordersAllowed") is True
          assert 0<=now-mt<360000, ("margin-stale",now-mt)
          active=[x for x in pending.get("entries",[]) if str(x.get("status","")).upper() in {"PENDING","SUBMITTED","UNKNOWN"}]
          assert not active, active
          assert not v12.get("activePositions",[]) and not v12.get("active") and not v12.get("pending")
          assert not v12.get("manualReview") and not v12.get("dd1296UnaccountedExits",[])
          print("V4_CANARY_STATE_PREFLIGHT=PASS")
          PY
          set -a
          for f in /etc/disdex/disdex-v13d-v11eq-v96.env /etc/disdex/disdex-v12-pengu-v2-v52.env /etc/disdex/disdex-v12-x1-all.env; do
            [[ -f "$f" ]] && . "$f"
          done
          set +a
          cd "$current"
          snapshot="$(./node_modules/.bin/tsx scripts/disdex-aster-readonly-account-diagnostic.ts)"
          echo "$snapshot"
          python3 - "$snapshot" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d["status"]=="ASTER_READONLY_ACCOUNT_DIAGNOSTIC_PASS"
          assert d.get("positions")==[], d.get("positions")
          assert d.get("openOrders")==[], d.get("openOrders")
          assert d.get("ordersSent")==0 and d.get("cancelsSent")==0 and d.get("positionChangesSent")==0
          print("V4_CANARY_SIGNED_FLAT_PREFLIGHT=PASS")
          PY
          REMOTE

      - name: Transfer exact immutable source
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output="/tmp/v12-v4-$TARGET_SHA.tgz" "$TARGET_SHA"
          PORT="${SSH_PORT:-22}"
          scp -i "$HOME/.ssh/id_root" -P "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             "/tmp/v12-v4-$TARGET_SHA.tgz" "root@$SSH_HOST:/tmp/v12-v4-$TARGET_SHA.tgz"

      - name: Stage canary release and root approvals
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -p "$PORT" "root@$SSH_HOST" "OLD_SHA='$OLD_SHA' TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/home/deploy/disdex-trading/releases/$TARGET_SHA"
          old="/home/deploy/disdex-trading/releases/$OLD_SHA"
          install -d -m 0755 "$release"
          tar -xzf "/tmp/v12-v4-$TARGET_SHA.tgz" -C "$release"
          printf '%s\n' "$TARGET_SHA" > "$release/.disdex-release-sha"
          [[ -d "$old/node_modules" ]]
          rm -rf "$release/node_modules"
          ln -s "$old/node_modules" "$release/node_modules"
          install -o root -g root -m 0644 "$release/deploy/systemd/disdex-v12-v4-canary@.service" /etc/systemd/system/disdex-v12-v4-canary@.service
          install -d -o root -g root -m 0755 /etc/disdex /var/lib/disdex/shared/operator-activation "/var/lib/disdex/v12-v4/$TARGET_SHA"
          cat > /etc/disdex/disdex-v12-v4-canary.env <<EOF
          V12_V4_EXECUTION_STORE_PATH=/var/lib/disdex/v12-v4/$TARGET_SHA/orders.json
          DISDEX_ACCOUNT_LOCK_PATH=/var/lib/disdex/shared/account-order.lock
          DISDEX_PENDING_EXPOSURE_REGISTRY_PATH=/var/lib/disdex/shared/pending-exposure.json
          DISDEX_SHARED_KILL_SWITCH_FILE=/var/lib/disdex/shared/kill-switch.json
          V12_V4_TICK_INTERVAL_MS=60000
          V12_V4_PEER_STATE_PATHS_JSON='{"V12":"/var/lib/disdex/v12-x1-all/runner.json","PENGU":"/var/lib/disdex/pengu-dual-ls-v2/runner-live.json","Q102":"/var/lib/disdex/quality102-causal-v1/state.json","V52":"/var/lib/disdex/v52-aster-only/runner-live.json","FET":"/var/lib/disdex/fet-brk48-residual/state.json","HYPE_LONG":"/var/lib/disdex/hype-zec-long/runner.json","IDLE":"/var/lib/disdex/idle-priority/state.json","RESIDUAL":"/var/lib/disdex/idle-priority/residual-long-state.json"}'
          EOF
          chown root:deploy /etc/disdex/disdex-v12-v4-canary.env
          chmod 0640 /etc/disdex/disdex-v12-v4-canary.env
          TARGET_SHA="$TARGET_SHA" RELEASE="$release" python3 - <<'PY'
          import json,os,datetime,pathlib
          sha=os.environ["TARGET_SHA"]; release=pathlib.Path(os.environ["RELEASE"])
          now=datetime.datetime.now(datetime.timezone.utc)
          iso=lambda x:x.isoformat().replace("+00:00","Z")
          time_approval={
            "schema":"disdex-v12-v4-time-stop-approval/v1","approvedSha":sha,
            "approvedAt":iso(now),"routeCount":37,
            "policyId":"V12_V4_TIME37_FIXED_8PCT_H1_RESEARCH_20261010",
            "operatorAcknowledgement":"I_APPROVE_V12_V4_TIME37_FIXED8_EMERGENCY_STOP"}
          canary={
            "schema":"disdex-v12-v4-production-canary-permit/v1","approvedSha":sha,
            "policyId":"V2_M150_D05_CORE_NATIVE","approvedAt":iso(now),
            "validUntil":iso(now+datetime.timedelta(hours=23,minutes=55)),
            "maxEntries":1,"sizing":"VENUE_MINIMUM_ONLY","absoluteNotionalCapUsd":25,
            "operatorAcknowledgement":"I_AUTHORIZE_ONE_V12_V4_PRODUCTION_CANARY_AT_VENUE_MINIMUM"}
          readiness=json.load(open(release/"docs/production/current-implementation-readiness.json",encoding="utf-8"))
          assert readiness["implementationStatus"]=="READY"
          assert [b for b in readiness.get("blockers",[]) if b!="OPERATOR_LIVE_ACTIVATION_REQUIRED"]==[]
          activation={
            "schema":"disdex-live-operator-activation/v1","target":readiness["target"],
            "approvedSha":sha,"approvedRunners":["V12_V4"],"ordersEnabled":True,
            "operatorAcknowledgement":"I_ACK_REAL_MONEY_LIVE_ACTIVATION","approvedAt":iso(now)}
          for path,obj in [
            ("/etc/disdex/v12-v4-time-stop-approval.json",time_approval),
            ("/etc/disdex/v12-v4-production-canary-permit.json",canary),
            ("/var/lib/disdex/shared/operator-activation/v12-v4-canary.json",activation)]:
            pathlib.Path(path).write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY
          chown root:deploy /etc/disdex/v12-v4-time-stop-approval.json /etc/disdex/v12-v4-production-canary-permit.json
          chmod 0640 /etc/disdex/v12-v4-time-stop-approval.json /etc/disdex/v12-v4-production-canary-permit.json
          chown root:root /var/lib/disdex/shared/operator-activation/v12-v4-canary.json
          chmod 0600 /var/lib/disdex/shared/operator-activation/v12-v4-canary.json
          systemctl daemon-reload
          echo "V4_CANARY_STAGING=PASS"
          REMOTE

      - name: Atomic V12 to V4 canary handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -p "$PORT" "root@$SSH_HOST" "OLD_SHA='$OLD_SHA' TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          old_unit="disdex-v12-x1-all@$OLD_SHA.service"
          canary_unit="disdex-v12-v4-canary@$TARGET_SHA.service"
          [[ "$(systemctl is-active "$old_unit" 2>/dev/null || true)" == active ]]
          [[ ! -e /var/lib/disdex/shared/account-order.lock ]]
          systemctl stop "$old_unit"
          systemctl mask "$old_unit"
          sleep 2
          if systemctl list-units --no-pager --plain --type=service --state=running 'disdex-v12-x1-all@*.service' | grep -q 'disdex-v12-x1-all@'; then
            echo "OLD_V12_STILL_RUNNING" >&2; exit 1
          fi
          [[ ! -e /var/lib/disdex/shared/account-order.lock ]]
          set -a
          for f in /etc/disdex/disdex-v13d-v11eq-v96.env /etc/disdex/disdex-v12-pengu-v2-v52.env /etc/disdex/disdex-v12-v4-canary.env; do . "$f"; done
          export DISDEX_RELEASE_SHA="$TARGET_SHA" V12_V4_LIVE_ACK="$TARGET_SHA" V12_V4_OPERATION_MODE=CANARY
          set +a
          cd "/home/deploy/disdex-trading/releases/$TARGET_SHA"
          snapshot="$(./node_modules/.bin/tsx scripts/disdex-aster-readonly-account-diagnostic.ts)"
          python3 - "$snapshot" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d["status"]=="ASTER_READONLY_ACCOUNT_DIAGNOSTIC_PASS"
          assert d["positions"]==[] and d["openOrders"]==[]
          PY
          runuser -u deploy -- env             DISDEX_RELEASE_SHA="$TARGET_SHA" V12_V4_LIVE_ACK="$TARGET_SHA" V12_V4_OPERATION_MODE=CANARY             bash -lc 'set -a; . /etc/disdex/disdex-v13d-v11eq-v96.env; . /etc/disdex/disdex-v12-pengu-v2-v52.env; . /etc/disdex/disdex-v12-v4-canary.env; set +a; cd "/home/deploy/disdex-trading/releases/'"$TARGET_SHA"'"; ./node_modules/.bin/tsx scripts/v12-v4-production-runner.ts --init-signed-flat'
          systemctl enable --now "$canary_unit"
          sleep 8
          [[ "$(systemctl is-active "$canary_unit" 2>/dev/null || true)" == active ]]
          echo "V4_CANARY_SERVICE_ACTIVE=PASS"
          REMOTE

      - name: Observe first canary ticks and signed account
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -p "$PORT" "root@$SSH_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          unit="disdex-v12-v4-canary@$TARGET_SHA.service"
          submitted=0
          for i in $(seq 1 18); do
            [[ "$(systemctl is-active "$unit" 2>/dev/null || true)" == active ]]
            logs="$(journalctl -u "$unit" --since '10 minutes ago' --no-pager -o cat)"
            if grep -q 'DURABLE_PRODUCTION_CANARY_WITH_RESIDENT_STOP' <<<"$logs"; then submitted=1; break; fi
            if grep -q 'V4_RUNNER_FAILED_CLOSED' <<<"$logs"; then echo "$logs" | tail -50; exit 1; fi
            sleep 10
          done
          store="/var/lib/disdex/v12-v4/$TARGET_SHA/orders.json"
          python3 - "$store" "$submitted" <<'PY'
          import json,sys,os
          p=sys.argv[1]; submitted=int(sys.argv[2])
          d=json.load(open(p,encoding="utf-8"))
          entries=[x for x in d.get("intents",{}).values() if x.get("action")=="ENTRY"]
          stops=[x for x in d.get("intents",{}).values() if x.get("action")=="STOP"]
          assert len(entries)<=1, entries
          if submitted:
            assert len(entries)==1 and len(stops)==1, (entries,stops)
          print("V4_CANARY_ENTRY_INTENT_COUNT="+str(len(entries)))
          print("V4_CANARY_STOP_INTENT_COUNT="+str(len(stops)))
          PY
          set -a
          for f in /etc/disdex/disdex-v13d-v11eq-v96.env /etc/disdex/disdex-v12-pengu-v2-v52.env /etc/disdex/disdex-v12-v4-canary.env; do . "$f"; done
          set +a
          cd "/home/deploy/disdex-trading/releases/$TARGET_SHA"
          ./node_modules/.bin/tsx scripts/disdex-aster-readonly-account-diagnostic.ts
          if [[ "$submitted" == 1 ]]; then
            echo "V4_PRODUCTION_CANARY=ENTRY_SUBMITTED_AND_RESIDENT_STOP_CONFIRMED"
          else
            echo "V4_PRODUCTION_CANARY=ARMED_WAITING_FOR_NATURAL_SIGNAL"
          fi
          echo "OLD_V12_RUNNING_COUNT=$(systemctl list-units --no-pager --plain --type=service --state=running 'disdex-v12-x1-all@*.service' | grep -c 'disdex-v12-x1-all@' || true)"
          REMOTE

      - name: Roll back safely on deployment failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${OLD_SHA:-}" ]] || exit 0
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -p "$PORT" "root@$SSH_HOST" "OLD_SHA='$OLD_SHA' TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          canary="disdex-v12-v4-canary@$TARGET_SHA.service"
          old="disdex-v12-x1-all@$OLD_SHA.service"
          store="/var/lib/disdex/v12-v4/$TARGET_SHA/orders.json"
          entries=0
          if [[ -f "$store" ]]; then
            entries="$(python3 - "$store" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(sum(1 for x in d.get("intents",{}).values() if x.get("action")=="ENTRY"))
          PY
          )"
          fi
          if [[ "$entries" == 0 ]]; then
            systemctl disable --now "$canary" 2>/dev/null || true
            systemctl unmask "$old" 2>/dev/null || true
            systemctl enable --now "$old"
            echo "V4_CANARY_ROLLBACK=OLD_V12_RESTORED_NO_CANARY_ENTRY"
          else
            systemctl restart "$canary" 2>/dev/null || true
            echo "V4_CANARY_ROLLBACK=CANARY_ENTRY_EXISTS_OLD_V12_REMAINS_MASKED"
          fi
          REMOTE
