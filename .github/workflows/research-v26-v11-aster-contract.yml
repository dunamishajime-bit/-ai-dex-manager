name: Research V26 V11 Aster Protective Contract
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/v26-latency-aware-search-20260816]
    paths:
      - lib/research-lab/perp/v11-aster-protective-client.ts
      - scripts/research_v26_v11_aster_contract_selftest.ts
      - .github/workflows/research-v26-v11-aster-contract.yml
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck V11 Aster protective client
        run: npx tsc --noEmit -p tsconfig.research.json
      - name: Run V11 Aster HTTP contract self-test
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_v26_v11_aster_contract_selftest.ts
      - name: Assert contract
        run: |
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('.research-state/v26-v11-aster-contract.json','utf8'));
          if(!d.researchOnly||d.productionDeployed||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(!d.pass) throw new Error('CONTRACT_FAIL');
          for(const [k,v] of Object.entries(d.verified)) if(v!==true) throw new Error(`VERIFY_FAIL:${k}`);
          console.log('V26_V11_ASTER_PROTECTIVE_CONTRACT_PASS');
          NODE
      - name: Publish contract result
        run: |
          mkdir -p docs/research-results
          cp .research-state/v26-v11-aster-contract.json docs/research-results/v26-v11-aster-contract-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-results/v26-v11-aster-contract-latest.json
          if ! git diff --cached --quiet; then git commit -m "research: record V26 V11 Aster contract result [skip ci]" && git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: v26-v11-aster-contract
          path: .research-state/v26-v11-aster-contract.json
          include-hidden-files: true
          retention-days: 30
