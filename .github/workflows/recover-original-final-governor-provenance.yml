name: Recover original Final Dynamic Gross BT provenance - read only
on:
  push:
    branches: [research/recover-final-governor-bt-20260926]
    paths:
      - scripts/research/recover_original_final_governor_provenance.py
      - scripts/research/locate_original_final_governor_20260926.py
      - scripts/research/locate_orphan_final_governor_git_20260926.py
      - .github/workflows/recover-original-final-governor-provenance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH without disclosing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          d=Path.home()/".ssh"
          for file,key in (("id_root","ROOT_KEY"),("known_hosts","SSH_KNOWN_HOSTS")):
              value=os.environ[key].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
              (d/file).write_text(value)
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
      - name: Inventory archived BT sources ONLY, no trading mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' \
            < scripts/research/recover_original_final_governor_provenance.py > original-bt-provenance.json
          python3 - <<'PY'
          import json
          d=json.load(open("original-bt-provenance.json"))
          assert d["readOnly"] is True and d["tradingMutation"] == 0
          print("ORIGINAL_FINAL_GOVERNOR_PROVENANCE_SCAN",json.dumps({
              "roots":len(d["roots"]),
              "rootsExisting":sum(x["exists"] for x in d["roots"]),
              "visited":d["visitedFiles"],
              "matched":len(d["matchedFiles"]),
              "resultMarkers":d["originalResultMarkers"][:20],
              "truncated":d["truncated"],
          },ensure_ascii=False))
          PY
      - name: Locate historical BT generator across all VPS worktrees, read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' \
            < scripts/research/locate_original_final_governor_20260926.py > original-bt-source-locator.json
          python3 - <<'PY'
          import json
          d=json.load(open("original-bt-source-locator.json"))
          assert d["readOnly"] is True and d["tradingMutation"] == 0
          print("ORIGINAL_BT_SOURCE_LOCATOR",json.dumps({"roots":len(d["roots"]),"visited":d["visited"],
           "exact":d["exactFileMatches"],"references":d["referenceHits"][:50],
           "researchCandidates":len(d["researchCandidates"]),"cacheDirs":d["cacheDirs"][:25],
           "gitHistory":d["gitHistory"],"truncated":d["stoppedByCap"]},ensure_ascii=False))
          PY
      - name: Inspect unreachable Git objects for archived original code, read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' \
            < scripts/research/locate_orphan_final_governor_git_20260926.py > original-bt-git-orphans.json
          python3 - <<'PY'
          import json
          d=json.load(open("original-bt-git-orphans.json"))
          assert d["readOnly"] and d["tradingMutation"]==0
          print("ORIGINAL_BT_ORPHAN_GIT_SCAN",json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-14p49b-governor-bt-vps-provenance-20260926
          path: |
            original-bt-provenance.json
            original-bt-source-locator.json
            original-bt-git-orphans.json
          retention-days: 90
