name: Event Volatility Gap V54

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_event_vol_gap_v54.py"
      - ".github/workflows/event-vol-gap-v54.yml"
      - "research/event-vol-gap-v54-trigger.txt"

permissions:
  contents: read

concurrency:
  group: event-vol-gap-v54-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore public USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: event-vol-gap-v54-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            event-regime-v53-usdm-
            parallel-trend-vol-v53-usdm-
            funding-shock-v50-usdm-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch genuine public USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile research source
        run: python -m py_compile scripts/research_lab_event_vol_gap_v54.py
      - name: Run independent volatility-gap regime research
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_event_vol_gap_v54.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-vol-gap-v54
          path: |
            .research-state/event-vol-gap-v54.json
            .research-state/event-vol-gap-v54.md
          if-no-files-found: warn
          retention-days: 30

# Research-only. No production, VPS, credentials, orders, accounts, positions, approvals, or LIVE modifications.
