name: Apply Split Atomic VPS Bootstrap

on:
  push:
    branches:
      - codex/research-trade-history-sync-pr98
    paths:
      - ops/bootstrap/**
      - .github/workflows/apply-split-atomic-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: split-atomic-vps-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dunamishajime-bit/-ai-dex-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply verified bundle and remove bootstrap
        run: python3 ops/bootstrap/apply_split_atomic_bundle.py
