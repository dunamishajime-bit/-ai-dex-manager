name: Residual Episode Onset Lock V16

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_residual_episode_onset_lock_v16.py
      - .github/workflows/residual-episode-onset-lock-v16.yml

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen V16 research source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_residual_episode_onset_lock_v16.py)" = "d733a896490a9b21d2957bd9dd02e02a836b140f"
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef"
          test "$(git hash-object scripts/research_priority_router_v6_historical_robustness.py)" = "74cc5c732da7567dfb465e0558b872c8c8dcc435"
          test -f docs/research/OVERFIT_FREEZE_20260816.md
          echo V16_FROZEN_SOURCE_PASS

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811

      - name: Install prefetch dependencies
        run: npm ci

      - name: Prefetch inspected historical boundary only
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts

      - name: Verify exact six-symbol inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated');syms=('BTC','SOL','LINK','ETH','BNB','AVAX')
          missing=[str(root/f'{s}USDT-1661990400000-1782864000000-v3.json') for s in syms if not (root/f'{s}USDT-1661990400000-1782864000000-v3.json').is_file()]
          if missing: raise SystemExit('MISSING_EXACT_INPUTS:'+','.join(missing))
          print('V16_EXACT_INPUTS_PASS')
          PY

      - name: Compile V16
        run: python -m py_compile scripts/research_residual_episode_onset_lock_v16.py

      - name: Run one-shot V16 historical sanity
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_residual_episode_onset_lock_v16.py

      - name: Assert research-only overfit freeze boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/residual-episode-onset-lock-v16.json').read_text())
          assert x['researchOnly'] is True and x['productionChanged'] is False and x['vpsChanged'] is False and x['liveChanged'] is False and x['realTradingEnabled'] is False
          assert x['freshOosRead'] is False and x['post20260701DataUsed'] is False
          assert x['historicalEvidenceStatus']=='SANITY_ONLY_INSPECTED_DESIGN_DATA'
          assert x['same3YFurtherRedesignAllowedAfterThisRun'] is False
          a=x['architecture']
          assert a['pairSpecificParameters'] is False and a['parameterGrid'] is False
          assert a['episodeOnsetOnlyEntry'] is True and a['sameEpisodeReentryBlockedUntilReset'] is True
          assert a['rankCanReplaceActiveOwner'] is False and a['periodicResize'] is False
          assert a['totalGrossResearchOnly']==1.25 and a['leverageRaisedFromV13V14V15'] is False
          r=x['returnStandard']
          assert r['minimumEveryYearPct']==80.0 and r['primaryMedianAnnualPct']==100.0 and r['primary3YCagrPct']==100.0 and r['eightyPctIsTarget'] is False
          print('V16_OVERFIT_FREEZE_BOUNDARY_PASS')
          PY

      - name: Upload V16 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-episode-onset-lock-v16
          path: .research-state/residual-episode-onset-lock-v16.json
          if-no-files-found: warn
          retention-days: 30
