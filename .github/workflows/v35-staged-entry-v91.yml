name: V35 Staged Entry V91

on:
  push:
    branches:
      - research/v71-dd-v35-growth-v82
    paths:
      - scripts/research_lab_v35_staged_entry_v91.py
      - scripts/research_lab_v35_weight_band_v90.py
      - scripts/research_lab_v35_turnover_stabilizer_v89.py
      - scripts/research_lab_v35_strong_growth_v86.py
      - scripts/research_lab_v35_core_pengu_v67_combined_v2.py
      - .github/workflows/v35-staged-entry-v91.yml
  pull_request:
    branches:
      - research/major-core-pengu-balanced-v73
    paths:
      - scripts/research_lab_v35_staged_entry_v91.py
      - .github/workflows/v35-staged-entry-v91.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/research_lab_v35_staged_entry_v91.py \
            scripts/research_lab_v35_weight_band_v90.py \
            scripts/research_lab_v35_turnover_stabilizer_v89.py \
            scripts/research_lab_v35_strong_growth_v86.py \
            scripts/research_lab_v35_core_pengu_v67_combined_v2.py
      - name: Run V35 staged-entry research
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_v35_staged_entry_v91.py 2>&1 | tee .research-state/v35-staged-entry-v91.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-staged-entry-v91
          path: |
            .research-state/v35-staged-entry-v91.json
            .research-state/v35-staged-entry-v91.md
            .research-state/v35-staged-entry-v91.log
          if-no-files-found: warn
          retention-days: 30
