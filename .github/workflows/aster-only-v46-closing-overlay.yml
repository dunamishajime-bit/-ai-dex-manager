name: Aster-only V46 Closing Overlay

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v46_closing_overlay.py'
      - 'docs/research/ASTER_ONLY_V46_CLOSING_OVERLAY_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v46-closing-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v46-closing-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore successful V39 market caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v39-overnight-open
          key: aster-only-v46-v39cache-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v46_closing_overlay.py') }}
          restore-keys: |
            aster-only-v39-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v46_closing_overlay.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v46_closing_overlay as v46
          assert (v46.v19.BT_END_EXCLUSIVE - v46.v19.BT_START).days == 365
          assert len(v46.CANDIDATES) == 288
          assert sorted({c.entry_minute for c in v46.CANDIDATES}) == [870, 900]
          assert v46.TP_PCT == 0.75
          assert v46.SL_PCT == 1.0
          assert v46.BASELINE_NORMAL == 72.276908
          assert v46.BASELINE_P95 == 68.080022
          assert v46.BASELINE_FALLBACK_NORMAL == 7.813259
          assert v46.BASELINE_FALLBACK_P95 == 7.400908
          print('V46 freeze assertions: PASS')
          PY
      - name: Run V46 closing overlay tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v46-closing-overlay
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v46_closing_overlay.py \
            --cache-dir ../.cache/aster-only-v39-overnight-open \
            --output-dir ../.research-state/aster-only-v46-closing-overlay \
            2>&1 | tee ../.research-state/aster-only-v46-closing-overlay/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v46-closing-overlay/result.json
          test -s .research-state/aster-only-v46-closing-overlay/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v46-closing-overlay/result.json').read_text())
          assert p['version'] == 46
          assert p['candidateCount'] == 288
          assert p['period']['calendarDays'] == 365
          assert p['architecture'] == {
              'venue': 'ASTER_ONLY',
              'signalSource': 'ASTER_INTRADAY_CLOSING_MOMENTUM_AND_REVERSAL',
              'entryNy': ['14:30', '15:00'],
              'maximumConcurrentGross': 1.0,
              'maximumConcurrentPositions': 1,
              'baselineV11AndV19Preserved': True,
              'overlayOnlyAfterBaselineExit': True,
              'closesByNy1600': True,
              'hyperliquidUsed': False,
          }
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V46_NO_VALIDATED_CLOSING_OVERLAY',
              'ASTER_ONLY_V46_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V46_VALIDATED_SHADOW_LEAD',
          }
          if p['status'] == 'ASTER_ONLY_V46_VALIDATED_SHADOW_LEAD':
              assert p['winner']['accepted'] is True
              assert all(p['winner']['audit']['checks'].values())
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
              'topDevelopmentDiagnostics': p['topDevelopmentDiagnostics'][:5],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v46-closing-overlay-${{ github.run_id }}
          path: .research-state/aster-only-v46-closing-overlay
          retention-days: 90
          if-no-files-found: warn
