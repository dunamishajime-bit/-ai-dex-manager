name: STABLE4 HYPE live-base CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/stable4-hype-livebase-20261114'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: STABLE4 HYPE contract
        run: npx tsx scripts/stable4-hype-livebase-selftest.ts
      - name: Existing HYPE regression
        run: npm run strategy:hype-zec-long:selftest
      - name: Repository typecheck
        run: npm run typecheck