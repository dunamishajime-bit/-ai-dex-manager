name: DisDex V4 DOGE Operator Postflight Read-Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  postflight:
    if: github.ref == 'refs/heads/master' && github.actor == 'dunamishajime-bit'
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile exact postflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/deploy/disdex_v4_doge_operator_postflight.py

      - name: Configure pinned root SSH
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/doge-postflight-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/doge-postflight-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/doge-postflight-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/doge-postflight-ssh/"*

      - name: Upload and run exact read-only settlement postflight
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          scp -i "$RUNNER_TEMP/doge-postflight-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/doge-postflight-ssh/known_hosts"             -P "$PORT" scripts/ops/deploy/disdex_v4_doge_operator_postflight.py             "root@$HOST:/tmp/disdex_v4_doge_operator_postflight.py.$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/doge-postflight-ssh/key"             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/doge-postflight-ssh/known_hosts"             -o ConnectTimeout=12 -p "$PORT" "root@$HOST"             "python3 /tmp/disdex_v4_doge_operator_postflight.py.$GITHUB_RUN_ID"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set +e
          PORT="${PORT:-22}"
          if [[ -s "$RUNNER_TEMP/doge-postflight-ssh/key" && -n "$HOST" ]]; then
            ssh -T -i "$RUNNER_TEMP/doge-postflight-ssh/key"               -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes               -o UserKnownHostsFile="$RUNNER_TEMP/doge-postflight-ssh/known_hosts"               -p "$PORT" "root@$HOST"               "rm -f /tmp/disdex_v4_doge_operator_postflight.py.$GITHUB_RUN_ID" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/doge-postflight-ssh"
