name: Active4 V144 State Routing

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_active4_v144_state_routing.py"
      - ".github/workflows/active4-v144.yml"

permissions:
  contents: read

concurrency:
  group: active4-v144-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_dual_route_wave_owner_v14, btc_expansion_checkpoint_cycle_v14, eth_relative_rotation_state_v14, bnb_consensus_scout_reactivation_v14, avax_shock_cluster_handoff_v14]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_active4_v144_state_routing.py
      - name: Run V144 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v144_state_routing.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v144-${{ matrix.candidate }}
          path: |
            .research-state/active4-v140-${{ matrix.candidate }}.json
            .research-state/active4-v140-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only BTC/ETH/BNB/AVAX. Development/Validation only.
# Confirmation/Holdout, SOL/LINK, production/live/VPS/.env/credentials/orders/accounts/positions untouched.
