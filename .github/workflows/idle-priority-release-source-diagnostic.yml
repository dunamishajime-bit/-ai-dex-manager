name: Idle Priority Release source diagnostic
on:
  push:
    branches: [design/idle-priority-bt-parity-20260929]
    paths:
      - ".github/workflows/idle-priority-release-source-diagnostic.yml"
      - "research/idle_priority_generic_lifecycle_diagnostic.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download bt-v12-score100-volume080-normalonly-20260928 --repo dunamishajime-bit/-ai-dex-manager --pattern 'bt-v12-score100-volume080-normalonly-20260928.tar.gz'
          echo '891c36d8a5957cafe3aae65656a98b7c02a3c437c4f520fe63756d550f08b4fb  bt-v12-score100-volume080-normalonly-20260928.tar.gz' | sha256sum -c -
          mkdir evidence
          tar -xzf bt-v12-score100-volume080-normalonly-20260928.tar.gz -C evidence
      - name: Search exact causal 393-event generic lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          BTC="$(find "$ROOT" -type f -path '*/market-Aster-H1-funding-and-manifests/normalized/aster/klines/BTCUSDT.jsonl' | head -1)"
          test -n "$ROOT"
          test -n "$BTC"
          DATA="$(python -c "from pathlib import Path; print(Path('$BTC').resolve().parents[3])")"
          python research/idle_priority_generic_lifecycle_diagnostic.py --release-root "$ROOT" --data-root "$DATA"
      - name: Locate original Idle candidate generator
        shell: bash
        run: |
          set -euo pipefail
          echo '=== candidate source files ==='
          : > /tmp/hits.txt
          find evidence -type f \( -name '*.py' -o -name '*.ts' -o -name '*.js' -o -name '*.md' -o -name '*.json' \) -print0 |
            xargs -0 -r grep -IlE 'idle_candidate_events|gross12|net12|candidate_events' 2>/dev/null |
            head -80 | tee /tmp/hits.txt || true
          echo '=== source snippets ==='
          while IFS= read -r f; do
            echo "##### FILE: $f"
            grep -n -E -C 12 'idle_candidate_events|gross12|net12|candidate_events|archetype|cooldown' "$f" | head -220 || true
          done < /tmp/hits.txt
          echo '=== baseline trade ledgers ==='
          find evidence -type f -name 'portfolio-trades.jsonl' | grep -E 'baseline-five-logic-all-cases-all-costs/.*/PRICE_MODEL_10BPS' | head -40 | tee /tmp/baselines.txt
          while IFS= read -r f; do
            echo "##### BASELINE: $f"
            wc -l "$f"
            d="$(dirname "$f")"
            if test -f "$d/metrics.json"; then
              python -c 'import json,sys; x=json.load(open(sys.argv[1])); print(json.dumps({"closed_trades":x.get("closed_trades"),"final_equity_jpy":x.get("final_equity_jpy"),"profit_factor":x.get("profit_factor"),"max_drawdown_pct":x.get("max_drawdown_pct") or x.get("max_mtm_drawdown_pct")},sort_keys=True))' "$d/metrics.json"
            fi
          done < /tmp/baselines.txt
