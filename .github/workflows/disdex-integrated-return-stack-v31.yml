name: Dis-Dex Integrated Return Stack V31

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - ".github/workflows/disdex-integrated-return-stack-v31.yml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/disdex-integrated-return-stack-v31.yml"

permissions:
  contents: read

concurrency:
  group: disdex-integrated-return-stack-v31-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore frozen USD-M source cache
