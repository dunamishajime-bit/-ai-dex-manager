name: Pair Specific V105 Accelerated

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/pair-specific-v105-trigger.txt"
      - "scripts/research_lab_pair_specific_v105.py"
      - ".github/workflows/pair-specific-v105.yml"

permissions:
  contents: read

concurrency:
  group: pair-specific-v105-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact-window genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v104-exact-usdm-v3-20260810
      - name: Install dependencies
        run: npm ci
      - name: Ensure genuine six-pair USD-M history
        run: |
          npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated')
          for sym in ['BTC','ETH','BNB','SOL','LINK','AVAX']:
              matches=sorted(root.glob(f'{sym}USDT-1661990400000-*-v3.json'))
              if not matches: raise SystemExit(f'MISSING_FRESH_CACHE:{sym}')
              src=matches[-1]; dst=root/f'{sym}USDT-1661990400000-1782864000000-v3.json'
              if src != dst: dst.write_bytes(src.read_bytes())
          PY

  research:
    needs: data
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        style: [trend_quality, exhaustion, relative_phase]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact-window genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v104-exact-usdm-v3-20260810
          fail-on-cache-miss: true
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v105.py
      - name: Run accelerated pair-specific family
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v105.py --style "${{ matrix.style }}" | tee "v105-${{ matrix.style }}.log"
      - name: Verify exact window and upload
        run: |
          python - <<'PY'
          import json, pathlib
          style='${{ matrix.style }}'; p=pathlib.Path(f'.research-state/pair-specific-v105-{style}.json'); d=json.loads(p.read_text())
          if (d['periods']['fixedWindowStart'],d['periods']['fixedWindowEndExclusive']) != (1754751600000,1786287600000):
              raise SystemExit('EXACT_WINDOW_MISMATCH')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v105-${{ matrix.style }}
          path: |
            .research-state/pair-specific-v105-${{ matrix.style }}.json
            .research-state/pair-specific-v105-${{ matrix.style }}.md
            v105-${{ matrix.style }}.log
          if-no-files-found: warn
          retention-days: 30

# Research only. Exact fixed window ending 2026-08-09 JST. No production/VPS/live changes.
