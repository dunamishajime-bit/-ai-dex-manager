name: Cross-Sectional Factor Regime V12

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_cross_sectional_factor_regime_v12.py"
      - "scripts/research_lab_cross_sectional_market_neutral_v10.py"
      - ".github/workflows/cross-sectional-factor-regime-v12.yml"
      - "lib/research-lab/perp/**"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_cross_sectional_factor_regime_v12.py"
      - ".github/workflows/cross-sectional-factor-regime-v12.yml"

permissions:
  contents: read

concurrency:
  group: cross-sectional-factor-regime-v12-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: factor-regime-v12-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            funding-carry-v11-usdm-
            cross-sectional-v10-usdm-
            multi-horizon-v3-usdm-
            win80-profit-v1-usdm-
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run typecheck
      - name: Run cross-sectional factor regime V12
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_cross_sectional_factor_regime_v12.py
      - name: Upload V12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-factor-regime-v12
          path: |
            .research-state/cross-sectional-factor-regime-v12.json
            .research-state/cross-sectional-factor-regime-v12.md
          if-no-files-found: warn
          retention-days: 30
