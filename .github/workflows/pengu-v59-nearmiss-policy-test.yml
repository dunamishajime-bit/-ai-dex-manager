name: PENGU V59 Nearmiss Policy Test

on:
  workflow_dispatch:
  push:
    branches:
      - research/pengu-v57-conditional-regime-20260826
    paths:
      - 'scripts/test_research_v59_nearmiss_policy.py'
      - 'scripts/research_v59_nearmiss_policy.py'
      - '.github/workflows/pengu-v59-nearmiss-policy-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run V59 near-miss policy test
        run: python scripts/test_research_v59_nearmiss_policy.py
