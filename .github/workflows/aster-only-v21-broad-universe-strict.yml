name: Aster-only V21 Broad Universe Strict Tournament

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v21_broad_universe_strict.py'
      - 'docs/research/ASTER_ONLY_V21_BROAD_UNIVERSE_STRICT_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v21-broad-universe-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v21-broad-universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore broad-universe caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v21-broad-universe
          key: aster-only-v21-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v21_broad_universe_strict.py') }}
          restore-keys: |
            aster-only-v21-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v21_broad_universe_strict.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v21_broad_universe_strict as v21
          assert len(v21.UNIVERSE_MAP) == 20
          assert len(v21.CANDIDATES) == 3
          assert v21.LOOKBACK_SESSIONS == 20
          assert v21.MIN_SYMBOL_ALIGNED_SESSIONS == 120
          assert v21.MIN_AVAILABLE_SYMBOLS_PER_DAY == 8
          assert v21.MAX_GROSS == 1.0
          assert v21.MAX_HOLDING_HOURS == 2
          assert v21.v20.STRICT_HURDLES['minimumNormalReturnPct'] == 50.0
          assert v21.v20.STRICT_HURDLES['minimumP95ReturnPct'] == 30.0
          print('V21 broad-universe freeze assertions: PASS')
          PY
      - name: Run broad-universe strict tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v21-broad-universe
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v21_broad_universe_strict.py \
            --cache-dir ../.cache/aster-only-v21-broad-universe \
            --output-dir ../.research-state/aster-only-v21-broad-universe \
            2>&1 | tee ../.research-state/aster-only-v21-broad-universe/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v21-broad-universe/result.json
          test -s .research-state/aster-only-v21-broad-universe/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v21-broad-universe/result.json').read_text())
          assert p['version'] == 21
          assert p['candidateCount'] == 3
          assert p['status'] in {
            'ASTER_ONLY_V21_BROAD_UNIVERSE_STRICT_PASS_SHADOW_ONLY',
            'ASTER_ONLY_V21_NO_BROAD_UNIVERSE_STRICT_CANDIDATE',
            'ASTER_ONLY_V21_INSUFFICIENT_BROAD_UNIVERSE_DATA',
          }
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          if p['status'] != 'ASTER_ONLY_V21_INSUFFICIENT_BROAD_UNIVERSE_DATA':
              assert p['period']['calendarDays'] == 365
              assert p['rules']['venue'] == 'ASTER_ONLY'
              assert p['rules']['hyperliquidUsed'] is False
              assert p['rules']['fixedZscoreThreshold'] == 2.0
              assert p['rules']['fixedMinimumResidualBps'] == 35.0
              assert p['rules']['maximumGross'] == 1.0
              assert p['selectionDiscipline']['fiveSymbolThresholdsRetuned'] is False
              assert p['selectionDiscipline']['julyHoldoutExcludedFromSelection'] is True
              assert p['selectionDiscipline']['holdoutRetuningAllowed'] is False
          if p['status'] == 'ASTER_ONLY_V21_BROAD_UNIVERSE_STRICT_PASS_SHADOW_ONLY':
              assert p['winner'] is not None
              assert p['winner']['allStrictHurdlesPassed'] is True
              assert all(p['winner']['checks'].values())
          print(json.dumps({
            'status': p['status'],
            'eligibleUniverse': p.get('eligibleUniverse'),
            'winner': p.get('winner'),
            'diagnosticLead': p.get('diagnosticLead'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v21-broad-universe-${{ github.run_id }}
          path: .research-state/aster-only-v21-broad-universe
          retention-days: 90
          if-no-files-found: warn
