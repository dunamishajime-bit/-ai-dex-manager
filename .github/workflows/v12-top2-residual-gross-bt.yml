name: V12 Top2 Residual Gross offline BT

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/v12-top2-residual-gross-*'
    paths:
      - 'scripts/research_v12_combined_bt_ledger.ts'
      - 'scripts/research_pengu_v2_aster_ledger.ts'
      - 'scripts/research_v12_top2_residual_bt.py'
      - '.github/workflows/v12-top2-residual-gross-bt.yml'

permissions:
  contents: read

concurrency:
  group: v12-top2-residual-gross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4

      - name: Checkout frozen V12 research source
        uses: actions/checkout@v4
        with:
          ref: 27f023a37d08b71c6e59b797fdc03c20d6032da2
          path: .v12-research
          fetch-depth: 1

      - name: Checkout frozen V52 stock research source
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen stock dependencies
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable historical-data caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/perp-research-usdm
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
          key: v12-top2-residual-gross-${{ runner.os }}-${{ hashFiles('scripts/research_v12_combined_bt_ledger.ts', 'scripts/research_pengu_v2_aster_ledger.ts', 'scripts/research_v12_top2_residual_bt.py') }}
          restore-keys: |
            v12-v52-pengu-v2-combined-${{ runner.os }}-
            v26-latency-aware-3y-usdm-v1-20260816
            aster-only-v52-v39cache-${{ runner.os }}-
            perp-research-usdm-

      - run: npm ci

      - name: Compile research runner
        run: python -m py_compile scripts/research_v12_top2_residual_bt.py

      - name: Rebuild frozen ledgers
        env:
          PRODUCTION_SOURCE_SHA: 6f4d06fd990e5e847895b59c4890bb80335ff03e
          PENGU_LEDGER_OUT: .research-state/v12-top2-residual-gross/pengu-v2-ledgers.json
          V12_SOURCE_ROOT: .v12-research
          V12_SOURCE_SHA: 27f023a37d08b71c6e59b797fdc03c20d6032da2
          V12_LEDGER_OUT: .research-state/v12-top2-residual-gross/v12-ledgers.json
        run: |
          set -o pipefail
          mkdir -p .research-state/v12-top2-residual-gross
          npx tsx scripts/research_pengu_v2_aster_ledger.ts 2>&1 | tee .research-state/v12-top2-residual-gross/pengu-ledger.log
          npx tsx scripts/research_v12_combined_bt_ledger.ts 2>&1 | tee .research-state/v12-top2-residual-gross/v12-ledger.log

      - name: Run frozen V12 Top2 residual ablation
        run: |
          set -o pipefail
          python scripts/research_v12_top2_residual_bt.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --v12-ledger .research-state/v12-top2-residual-gross/v12-ledgers.json \
            --pengu-ledger .research-state/v12-top2-residual-gross/pengu-v2-ledgers.json \
            --output-dir .research-state/v12-top2-residual-gross \
            2>&1 | tee .research-state/v12-top2-residual-gross/top2-backtest.log

      - name: Validate research-only boundary and caps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v12-top2-residual-gross/result.json').read_text())
          assert p['status'] == 'PASS_RESEARCH_ONLY', p['checks']
          assert len(p['variantSummary']) == 4
          assert p['architecture']['v12MaximumPositions'] == 2
          assert p['architecture']['v12PerPositionGrossCap'] == 1.0
          assert p['architecture']['cryptoGrossCap'] == 1.5
          assert p['architecture']['stockGrossCap'] == 1.5
          assert p['architecture']['totalGrossCap'] == 2.5
          assert all(p['checks'].values()), p['checks']
          assert p['safety'] == {'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False,'liveEligible':False}
          print(json.dumps({'status': p['status'], 'variants': p['variantSummary'], 'checks': p['checks']}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-top2-residual-gross-${{ github.run_id }}
          path: .research-state/v12-top2-residual-gross
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
