name: Formal five BT fresh market data and integrated replay (research only)
on:
  push:
    branches: [research/formal-five-bt-handoff-completion-20260927]
    paths: [.github/workflows/formal-five-bt-fresh-replay-20260927.yml]
permissions:
  contents: read
concurrency:
  group: formal-five-bt-fresh-replay
  cancel-in-progress: false
jobs:
  acquire_and_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PYTHONUNBUFFERED: '1'
      EXPECTED_SHA: a09ea45ca3cbd72100f9eb0eaae499039c40b6a0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/formal_five_bt/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reconstruct exactly pinned 90-source production snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/codex/legacy-runtime-safety-audit-20260926
          git cat-file -e "$EXPECTED_SHA^{commit}"
          python - <<'PY'
          import json
          from pathlib import Path
          from research.formal_five_bt.runtime_source import capture_runtime_sources
          p=Path("research/formal_five_bt/runtime_source_manifest.json")
          prior=json.loads(p.read_text())
          assert prior["runtime_sha"]==prior["verified_repository_commit"]==prior["active_release_id"]=="a09ea45ca3cbd72100f9eb0eaae499039c40b6a0"
          expected={f["path"]:f["sha256"] for f in prior["files"]}
          actual=capture_runtime_sources(".",p.parent/"runtime_source_snapshot",p)
          new={f["path"]:f["sha256"] for f in actual}
          assert new==expected,(len(new),len(expected),list(set(new)^set(expected))[:10])
          print("FIVE_BT_SOURCE=90_FILES_SHA256_VERIFIED")
          PY
      - name: Install isolated research-only Python and Node dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r research/formal_five_bt/requirements.txt
          npm ci --no-audit --no-fund
          node --test tests/formal_five_bt/q102_window.test.mjs
          python -m unittest discover -s tests/formal_five_bt -v 2>&1 | tail -n 12
      - name: Public Aster market-data endpoint and FRED source sanity (no secrets)
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from datetime import datetime,timezone
          from research.formal_five_bt import sources
          import json
          checks={}
          for venue in ("aster",):
            try:
              c=sources.fetch_instrument_catalog(venue)
              checks[venue]={"symbols":len(c.rows),"BTCUSDT":any(x.get("symbol")=="BTCUSDT" for x in c.rows)}
            except Exception as e:
              checks[venue]={"error":type(e).__name__+":"+str(e)[:120]}
          try:
            start=int(datetime(2026,8,9,tzinfo=timezone.utc).timestamp()*1000)
            end=int(datetime(2026,8,10,tzinfo=timezone.utc).timestamp()*1000)-1
            k=sources.fetch_historical_klines("aster","BTCUSDT",start,end)
            checks["btc_20260809"]={"rows":len(k.rows),"first":k.actual_start_ms,"last":k.actual_end_ms}
          except Exception as e:
            checks["btc_20260809"]={"error":type(e).__name__+":"+str(e)[:120]}
          try:
            fx=sources.fetch_ecb_usdjpy(__import__("datetime").date(2026,8,1),__import__("datetime").date(2026,8,11))
            checks["ecb"]={"observations":len(fx.observations)}
          except Exception as e:
            checks["ecb"]={"error":type(e).__name__+":"+str(e)[:120]}
          print("PUBLIC_DATA_PREFLIGHT",json.dumps(checks,sort_keys=True))
          assert checks.get("aster",{}).get("BTCUSDT") and checks.get("btc_20260809",{}).get("rows",0)>0
          PY
      - name: Acquire full new Aster-native 2025-01 through 2026-08 OHLC and funding plus as-of FX
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/formal-five-bt"
          python -m research.formal_five_bt.acquire --data-root "$RUNNER_TEMP/formal-five-bt/input" --venues aster --fx-source ecb
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"formal-five-bt/input/acquisition-manifest.json"
          m=json.loads(p.read_text())
          assert m["runtime_sha"]=="a09ea45ca3cbd72100f9eb0eaae499039c40b6a0"
          r=m["venues"]["aster"]; rows=r["klines"];fund=r["funding"]
          report={"symbol_count":len(rows),"ohlc_acquired":sum(x.get("status")=="ACQUIRED" for x in rows.values()),
            "funding_acquired":sum(x.get("status")=="ACQUIRED" for x in fund.values()),
            "ohlc_missing":{k:x.get("status") for k,x in rows.items() if x.get("status")!="ACQUIRED"},
            "funding_missing":{k:x.get("status") for k,x in fund.items() if x.get("status")!="ACQUIRED"},
            "bars":sum(x.get("row_count",0) for x in rows.values()),
            "fx_observations":m.get("fx",{}).get("observations"),"fx_provider":m.get("fx",{}).get("provider")}
          print("FIVE_BT_ACQUIRED",json.dumps(report,sort_keys=True))
          PY
      - name: Preserve complete new Aster dataset in root-owned private VPS research archive
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          source="$RUNNER_TEMP/formal-five-bt/input"
          test -f "$source/acquisition-manifest.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"formal-five-bt/input/acquisition-manifest.json"
          j=json.loads(p.read_text())
          rows=j["venues"]["aster"]["klines"]
          assert j["runtime_sha"]=="a09ea45ca3cbd72100f9eb0eaae499039c40b6a0"
          assert sum(x.get("status")=="ACQUIRED" for x in rows.values())>=25
          print("FIVE_BT_MINIMUM_SOURCE_COVERAGE="+str(len(rows)))
          PY
          tar --use-compress-program='gzip -3' -cf "$RUNNER_TEMP/five-bt-a09-input.tgz" -C "$RUNNER_TEMP/formal-five-bt" input
          bytes="$(stat -c %s "$RUNNER_TEMP/five-bt-a09-input.tgz")"
          [[ "$bytes" -le 800000000 ]] || { echo "PRIVATE_ARCHIVE_EXCEEDS_DISK_GUARD_BYTES=$bytes"; exit 11; }
          checksum="$(sha256sum "$RUNNER_TEMP/five-bt-a09-input.tgz" | awk '{print $1}')"
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k):return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
          port="${SSH_PORT:-22}"
          remote_dir="/var/lib/disdex/research-bt-formal"
          remote_file="$remote_dir/a09-new-data-$GITHUB_RUN_ID.tgz"
          ssh -T -i "$HOME/.ssh/id_root" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$port" "root@$SSH_HOST" \
            "set -Eeuo pipefail; [[ \"\$(tr -d '[:space:]' < /home/deploy/disdex-trading/current/.disdex-release-sha)\" == 'a09ea45ca3cbd72100f9eb0eaae499039c40b6a0' ]]; install -d -o root -g root -m 0700 '$remote_dir'; free=\$(df -Pk '$remote_dir' | awk 'NR==2 {print \$4}'); [[ \$free -gt 1700000 ]]; test ! -e '$remote_file'; echo PRIVATE_BT_STORAGE_PREFLIGHT_OK"
          scp -i "$HOME/.ssh/id_root" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$port" "$RUNNER_TEMP/five-bt-a09-input.tgz" "root@$SSH_HOST:$remote_file"
          ssh -T -i "$HOME/.ssh/id_root" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$port" "root@$SSH_HOST" \
            "set -Eeuo pipefail; chmod 0600 '$remote_file'; [[ \"\$(sha256sum '$remote_file' | awk '{print \$1}')\" == '$checksum' ]]; echo PRIVATE_NEW_ASTER_ARCHIVE_VERIFIED_SHA256='$checksum'; echo ARCHIVE_BYTES='$bytes'; echo TRADING_MUTATION=0"
          echo "PRIVATE_RESEARCH_DATA_SAVED=YES"
          # The dataset remains private on the user's VPS; this public repo and
          # all public Actions artifacts expose only integrity/coverage counts.
      - name: Generate exact frozen production V12 PENGU FET signal decisions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m research.formal_five_bt.signal_scan --data-root "$RUNNER_TEMP/formal-five-bt/input" \
            --output-root "$RUNNER_TEMP/formal-five-bt/scans/baseline-signal-scan" --strategies V12 PENGU FET
      - name: Generate point-in-time Q102 Causal V4 decisions independently
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 2700s python -m research.formal_five_bt.signal_scan --data-root "$RUNNER_TEMP/formal-five-bt/input" \
            --output-root "$RUNNER_TEMP/formal-five-bt/scans/baseline-signal-scan-q102" --strategies Q102
      - name: Execute four integrated coverage and cost scenarios, never assert unverified PnL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/formal-five-bt/l2"
          python -m research.formal_five_bt.engine \
            --data-root "$RUNNER_TEMP/formal-five-bt/input" \
            --scan-root "$RUNNER_TEMP/formal-five-bt/scans" \
            --l2-root "$RUNNER_TEMP/formal-five-bt/l2" \
            --output-root "$RUNNER_TEMP/formal-five-bt/results"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"formal-five-bt/results/run-manifest.json"
          m=json.loads(p.read_text())
          report={"run_id":m["run_id"],"source_sha":m["runtime_sha"],"status":m["status"],
            "scenarios":[{"id":s["scenario_id"],"status":s["status"],
              "candidates":s.get("candidate_signals"),"verified_fills":s.get("verified_fills"),
              "actual_equity":s.get("final_equity_usdt"),"unverified":s.get("metric_semantics")}
              for s in m["scenarios"]],"limitations":m.get("limitations")}
          print("FIVE_BT_REPLAY_RESULT",json.dumps(report,sort_keys=True,ensure_ascii=False))
          assert m["runtime_sha"]=="a09ea45ca3cbd72100f9eb0eaae499039c40b6a0"
          assert all((s.get("verified_fills") or 0)>0 or s.get("final_equity_usdt") is None for s in m["scenarios"])
          PY
      - name: Post-run rights-safe source coverage only, no raw prices or private trade data
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"formal-five-bt"
          for rel in ("input/acquisition-progress.json","input/acquisition-manifest.json",
            "scans/baseline-signal-scan/signal-scan-manifest.json",
            "scans/baseline-signal-scan-q102/signal-scan-manifest.json","results/run-manifest.json"):
            p=root/rel
            if not p.is_file():
              print("FIVE_BT_STAGE",json.dumps({"stage":rel,"available":False}));continue
            j=json.loads(p.read_text())
            if rel.startswith("input/"):
              v=j.get("venues",{}).get("aster",{})
              row={"stage":rel,"sha":j.get("runtime_sha"),"rows":len(v.get("klines",{})),
                "ok":sum(x.get("status")=="ACQUIRED" for x in v.get("klines",{}).values()),
                "failures":{k:x.get("status") for k,x in v.get("klines",{}).items() if x.get("status")!="ACQUIRED"},
                "fx_provider":(j.get("fx") or {}).get("provider"),"fx_status":(j.get("fx") or {}).get("status")}
            elif "scan" in rel:
              row={"stage":rel,"sha":j.get("runtime_sha"),"status":j.get("status"),"stats":j.get("stats")}
            else:
              row={"stage":rel,"sha":j.get("runtime_sha"),"status":j.get("status"),
                "scenario_metrics":[{"id":x.get("scenario_id"),"status":x.get("status"),
                  "verified_fills":x.get("verified_fills")} for x in j.get("scenarios",[])]}
            print("FIVE_BT_STAGE",json.dumps(row,sort_keys=True))
          PY
          echo NO_LIVE_TRADING_CHANGES=TRUE
