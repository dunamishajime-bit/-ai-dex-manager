name: Final integrated V52 UI CI

on:
  push:
    branches:
      - codex/final-integrated-live-v52-ui-20260917-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: UI runtime observability tests
        run: npx tsx --test tests/quality102-runtime-observability.test.ts tests/current-runtime-link.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
