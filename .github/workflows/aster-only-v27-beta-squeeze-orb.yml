name: Aster-only V27 Beta Squeeze ORB Tournament

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v27_beta_squeeze_orb_tournament.py'
      - 'scripts/run_aster_only_v27_beta_squeeze_orb_tournament.py'
      - 'docs/research/ASTER_ONLY_V27_BETA_SQUEEZE_ORB_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v27-beta-squeeze-orb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v27-beta-squeeze-orb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v27-beta-squeeze-orb
          key: aster-only-v27-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v27_beta_squeeze_orb_tournament.py', 'scripts/run_aster_only_v27_beta_squeeze_orb_tournament.py') }}
          restore-keys: |
            aster-only-v27-${{ runner.os }}-
            aster-only-v26-${{ runner.os }}-
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v26_nonbasis_fallback_tournament.py \
            scripts/research_lab_aster_only_v27_beta_squeeze_orb_tournament.py \
            scripts/run_aster_only_v27_beta_squeeze_orb_tournament.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v27_beta_squeeze_orb_tournament as v27
          import run_aster_only_v27_beta_squeeze_orb_tournament as runner
          assert (v27.v19.BT_END_EXCLUSIVE - v27.v19.BT_START).days == 365
          assert len(v27.CANDIDATES) == 420
          assert v27.BASELINE_NORMAL == 72.276908
          assert v27.BASELINE_P95 == 68.080022
          assert v27.BASELINE_FALLBACK_NORMAL == 7.813259
          assert v27.BASELINE_FALLBACK_P95 == 7.400908
          assert v27.TP_PCT == 0.85
          assert v27.SL_PCT == 0.75
          assert v27.build_trade is runner.build_trade_with_attribution
          assert all(candidate.maximum_holding_hours in {1, 2} for candidate in v27.CANDIDATES)
          assert all(candidate.slot in {1, 2, 3} for candidate in v27.CANDIDATES)
          print('V27 freeze assertions: PASS')
          PY
      - name: Run V27 beta squeeze ORB tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v27-beta-squeeze-orb
          set -o pipefail
          cd scripts
          python run_aster_only_v27_beta_squeeze_orb_tournament.py \
            --cache-dir ../.cache/aster-only-v27-beta-squeeze-orb \
            --output-dir ../.research-state/aster-only-v27-beta-squeeze-orb \
            2>&1 | tee ../.research-state/aster-only-v27-beta-squeeze-orb/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v27-beta-squeeze-orb/result.json
          test -s .research-state/aster-only-v27-beta-squeeze-orb/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v27-beta-squeeze-orb/result.json').read_text())
          assert p['version'] == 27
          assert p['candidateCount'] == 420
          assert p['period']['calendarDays'] == 365
          assert p['selectionDiscipline']['finalAndHoldoutUsedForSelection'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v19Changed': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'ASTER_ONLY_V27_NO_VALIDATED_BETA_SQUEEZE_ORB_FALLBACK',
              'ASTER_ONLY_V27_WINNER_DID_NOT_CLEAR_FINAL_AUDIT',
              'ASTER_ONLY_V27_VALIDATED_SHADOW_LEAD',
          }
          print(json.dumps({
              'status': p['status'],
              'developmentSurvivors': p['developmentSurvivors'],
              'validationSurvivors': p['validationSurvivors'],
              'winner': p['winner'],
              'topValidationDiagnostics': p['topValidationDiagnostics'][:5],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v27-beta-squeeze-orb-${{ github.run_id }}
          path: .research-state/aster-only-v27-beta-squeeze-orb
          retention-days: 90
          if-no-files-found: warn
