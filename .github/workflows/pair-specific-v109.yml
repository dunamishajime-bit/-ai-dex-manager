name: Pair Specific V109 Development-Trained Wave Models

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_v109.py"
      - ".github/workflows/pair-specific-v109.yml"
      - "research/pair-specific-v109-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-v109-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [price_wave, relative_wave, regime_wave]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact-window genuine USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v109.py
      - name: Run pair-specific development-trained wave model
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v109.py --kind "${{ matrix.kind }}"
      - name: Verify requested fixed window
        run: |
          python - <<'PY'
          import json, pathlib
          kind='${{ matrix.kind }}'
          p=pathlib.Path(f'.research-state/pair-specific-v109-{kind}.json')
          d=json.loads(p.read_text())
          want_start=1754751600000
          want_end=1786287600000
          got_start=d['periods']['fixedWindowStart']; got_end=d['periods']['fixedWindowEndExclusive']
          if (got_start,got_end)!=(want_start,want_end):
              raise SystemExit(f'EXACT_WINDOW_MISMATCH:{got_start}:{got_end}:wanted:{want_start}:{want_end}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v109-${{ matrix.kind }}
          path: |
            .research-state/pair-specific-v109-${{ matrix.kind }}.json
            .research-state/pair-specific-v109-${{ matrix.kind }}.md
          if-no-files-found: warn
          retention-days: 30

# Research only. Pair models train/calibrate inside Development only and freeze before Validation.
# Exact requested one-year window. No production/VPS/live-trading changes.
