name: PENGU V53 Trade Regime Audit

on:
  push:
    branches:
      - research/pengu-wave-sleeve-v47
    paths:
      - scripts/research_lab_pengu_wave_sleeve_v47.py
      - scripts/research_lab_pengu_wave_sleeve_v50.py
      - scripts/research_lab_pengu_wave_sleeve_v52.py
      - scripts/research_lab_pengu_v53_trade_regime_audit.py
      - .github/workflows/pengu-wave-sleeve-v51.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RESEARCH_AUTONOMOUS_STATE_DIR: .research-state

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/research_lab_pengu_wave_sleeve_v47.py scripts/research_lab_pengu_wave_sleeve_v50.py scripts/research_lab_pengu_wave_sleeve_v52.py scripts/research_lab_pengu_v53_trade_regime_audit.py
      - name: Run V53 trade regime audit
        shell: bash
        run: |
          mkdir -p .research-state
          set -o pipefail
          python scripts/research_lab_pengu_v53_trade_regime_audit.py 2>&1 | tee .research-state/pengu-v53-trade-regime-audit.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pengu-v53-trade-regime-audit
          path: |
            .research-state/pengu-v53-trade-regime-audit.json
            .research-state/pengu-v53-trade-regime-audit.csv
            .research-state/pengu-v53-trade-regime-audit.md
            .research-state/pengu-v53-trade-regime-audit.log
          if-no-files-found: warn
          retention-days: 30
