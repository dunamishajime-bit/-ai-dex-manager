name: DisDex STABLE4 Order-Disable Quiesce

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Exact HP Owner approval UUID for ALL_RUNNERS_MONITOR_REFRESH
        required: true
        type: string
      target_sha:
        description: Exact STABLE4 safety-repair target SHA
        required: true
        type: string
      plan_sha256:
        description: Exact STABLE4 safety-repair plan SHA-256
        required: true
        type: string
      mode:
        description: Run read-only preflight or perform the metadata-only quiesce
        required: true
        type: choice
        options:
          - preflight
          - execute

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  quiesce:
    if: >-
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: disdex-production
    steps:
      - name: Checkout the reviewed quiesce source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact monitor-only contract
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" == 'b8d681f048b087f07e0dcfb743cc14ec3a796b27' ]]
          [[ "$PLAN_SHA256" == '542b30ea87fa0e6ea9d27dd63fecc00181e95d4040a544aa9004fed579f4d68f' ]]
          [[ "$MODE" == 'preflight' || "$MODE" == 'execute' ]]
          python3 -m py_compile scripts/ops/deploy/disdex_order_disable_quiesce.py
          actual_helper="$(sha256sum scripts/ops/deploy/disdex_order_disable_quiesce.py | awk '{print $1}')"
          [[ "$actual_helper" == 'bfe811fe68d29193840fa32e91d7796c58d8188a23a7be7a572a7e3a3391c1c6' ]]
          python3 -m unittest tests/test_disdex_order_disable_quiesce.py -v
          echo ORDER_DISABLE_QUIESCE_CONTRACT=PASS
          echo ORDERS_SENT=0
          echo CANCELS_SENT=0
          echo POSITION_CHANGES_SENT=0

      - name: Redeem exact HP Owner monitor approval
        id: redeem
        env:
          APPROVAL_ID: ${{ inputs.approval_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          RUN_ID: ${{ github.run_id }}
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          PUBLIC_KEY: ${{ secrets.DISDEX_HP_APPROVER_PUBLIC_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ -n "$BRIDGE" && -n "$PUBLIC_KEY" ]]
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          body = json.dumps({
              'action': 'redeem',
              'approval_id': os.environ['APPROVAL_ID'],
              'target_sha': os.environ['TARGET_SHA'],
              'plan_sha256': os.environ['PLAN_SHA256'],
              'run_id': os.environ['RUN_ID'],
              'operation': 'ALL_RUNNERS_MONITOR_REFRESH',
              'scope': 'FULL_PROJECT',
          }).encode()
          req = urllib.request.Request(
              'https://professional-dismanager.net/api/system/deploy-approval',
              data=body, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['BRIDGE'],
                       'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              result = json.load(response)
          approval = result.get('approval') or {}
          assert result.get('ok') is True
          assert approval.get('id') == os.environ['APPROVAL_ID']
          assert approval.get('operation') == 'ALL_RUNNERS_MONITOR_REFRESH'
          assert approval.get('scope') == 'FULL_PROJECT'
          assert approval.get('targetSha') == os.environ['TARGET_SHA']
          assert approval.get('planSha256') == os.environ['PLAN_SHA256']
          assert approval.get('ordersEnabled') is False
          token = str(result.get('token') or '')
          assert token
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          (out / 'order-disable-token').write_text(token, encoding='ascii')
          print('::add-mask::' + token)
          print('HP_OWNER_APPROVAL_REDEEMED=TRUE')
          PY
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/order-disable-owner.pub"
          cat "$RUNNER_TEMP/order-disable-token" |
            python3 scripts/ops/deploy/disdex_owner_approval.py verify \
              --public-key "$RUNNER_TEMP/order-disable-owner.pub" \
              --repository "$GITHUB_REPOSITORY" --sha "$TARGET_SHA" \
              --scope FULL_PROJECT --operator dunamishajime-bit \
              --plan-sha256 "$PLAN_SHA256" \
              --deployment-target professional-dismanager.net \
              --operator-target DD1296_FINAL_ALLIN_10BPS \
              --route GITHUB_ACTIONS --orders-enabled false

      - name: Configure reviewed Production root SSH
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" == 'professional-dismanager.net' && -n "$ROOT_KEY" && -n "$KNOWN_HOSTS" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/order-disable-ssh"
          printf '%s\n' "$ROOT_KEY" > "$RUNNER_TEMP/order-disable-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/order-disable-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/order-disable-ssh/key" "$RUNNER_TEMP/order-disable-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/order-disable-ssh/key" >/dev/null

      - name: Upload exact quiesce helper to Root staging
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          remote="/tmp/disdex-order-disable-quiesce-$RUN_ID"
          ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" -p "$PORT" \
            "root@$HOST" "install -d -o root -g root -m 0700 '$remote'"
          scp -q -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" -P "$PORT" \
            scripts/ops/deploy/disdex_order_disable_quiesce.py \
            scripts/ops/deploy/disdex_owner_approval.py \
            scripts/ops/deploy/disdex_deployment_contract.py \
            "$RUNNER_TEMP/order-disable-owner.pub" "root@$HOST:$remote/"
          ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" -p "$PORT" \
            "root@$HOST" "chown -R root:root '$remote'; chmod 0700 '$remote'; chmod 0600 '$remote'/*"

      - name: Ensure Root-owned nonce directory for replay protection
        if: ${{ inputs.mode == 'execute' }}
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" \
            -o ConnectTimeout=12 -p "$PORT" "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          parent=/var/lib/disdex/unified-deploy
          nonce_dir="$parent/nonces"
          test -d "$parent"
          test ! -L "$parent"
          test "$(stat -c '%u:%g' "$parent")" = '0:0'
          if [[ -e "$nonce_dir" || -L "$nonce_dir" ]]; then
            test -d "$nonce_dir"
            test ! -L "$nonce_dir"
          else
            install -d -o root -g root -m 0700 "$nonce_dir"
          fi
          test "$(stat -c '%u:%g:%a' "$nonce_dir")" = '0:0:700'
          echo NONCE_DIR_METADATA_PASS
          REMOTE

      - name: Root read-only quiesce preflight
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          remote="/tmp/disdex-order-disable-quiesce-$RUN_ID"
          cat "$RUNNER_TEMP/order-disable-token" |
            ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" \
              -o ConnectTimeout=12 -p "$PORT" "root@$HOST" \
              "python3 '$remote/disdex_order_disable_quiesce.py' --preflight-readonly \
                --target-sha '${{ inputs.target_sha }}' --plan-sha256 '${{ inputs.plan_sha256 }}' \
                --approval-id '$APPROVAL_ID' --run-id '$RUN_ID' \
                --public-key '$remote/order-disable-owner.pub'"

      - name: Execute approved metadata-only quiesce
        if: ${{ inputs.mode == 'execute' }}
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          remote="/tmp/disdex-order-disable-quiesce-$RUN_ID"
          cat "$RUNNER_TEMP/order-disable-token" |
            ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" \
              -o ConnectTimeout=12 -p "$PORT" "root@$HOST" \
              "python3 '$remote/disdex_order_disable_quiesce.py' --execute-approved \
                --target-sha '${{ inputs.target_sha }}' --plan-sha256 '${{ inputs.plan_sha256 }}' \
                --approval-id '$APPROVAL_ID' --run-id '$RUN_ID' \
                --public-key '$remote/order-disable-owner.pub'"

      - name: Cleanup ephemeral approval and Root staging material
        if: always()
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          PORT="${PORT:-22}"
          if [[ -s "$RUNNER_TEMP/order-disable-ssh/key" && -n "$HOST" ]]; then
            remote="/tmp/disdex-order-disable-quiesce-$RUN_ID"
            ssh -T -i "$RUNNER_TEMP/order-disable-ssh/key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/order-disable-ssh/known_hosts" -p "$PORT" \
              "root@$HOST" "rm -rf -- '$remote'" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/order-disable-ssh" "$RUNNER_TEMP/order-disable-token" \
            "$RUNNER_TEMP/order-disable-owner.pub"
          echo ORDERS_SENT=0
          echo CANCELS_SENT=0
          echo POSITION_CHANGES_SENT=0
