name: PENGU A5 Basket and Regime Expression

on:
  pull_request:
    branches:
      - chatgpt/v12-live-adapter-final-20260817
    paths:
      - 'scripts/research_pengu_cross_asset_basket_a5.py'
      - '.github/workflows/pengu-a5-basket-regime.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pengu-a5-basket-regime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse immutable current PENGU ledger
        uses: actions/download-artifact@v4
        with:
          name: pengu-a-recent-365d-32648802579
          path: .research-state/a5/current
          github-token: ${{ github.token }}
          run-id: 32648802579
      - name: Run basket and regime structural study
        run: |
          set -o pipefail
          PYTHONPATH=scripts python scripts/research_pengu_cross_asset_basket_a5.py \
            --current .research-state/a5/current/baseline.json \
            --out .research-state/a5/out | tee .research-state/a5/a5.log
      - name: Validate no opportunity filtering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.research-state/a5/out/result.json').read_text())
          assert p['status']=='PASS_RESEARCH_ONLY'
          base=p['baseline']['NORMAL']['events']
          for k,v in p['variants']['NORMAL'].items():
              assert v['events']==base,(k,v['events'],base)
          assert p['safety']['productionChanged'] is False
          print('PENGU_A5_BASKET_REGIME_RESEARCH_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-a5-basket-regime-${{ github.run_id }}
          path: .research-state/a5
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
