name: DisDex V52 IDLE Owner HOLD Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preflight, execute]
      task_id:
        description: Approved whole-runner LIVE restoration task ID (required for execute)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: disdex-unified-production
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'dunamishajime-bit/-ai-dex-manager' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'dunamishajime-bit'
    environment:
      name: disdex-production
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require a whole-task owner approval for HOLD recovery
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[0-9a-fA-F-]{36}$ ]]

      - name: Configure pinned maintenance read-only SSH
        env:
          KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          KNOWN: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/hold-ui"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/hold-ui/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/hold-ui/known_hosts"
          chmod 600 "$RUNNER_TEMP/hold-ui/"*
          ssh-keygen -y -f "$RUNNER_TEMP/hold-ui/key" >/dev/null

      - name: Read-only IDLE and Kill Switch health proof
        if: ${{ inputs.mode == 'preflight' }}
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          ssh -T -i "$RUNNER_TEMP/hold-ui/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -o ConnectTimeout=12 -p "$PORT" "root@$HOST" \
            "/usr/bin/python3 /usr/local/sbin/disdex-idle-residual-kill-recovery"

      - name: Claim and verify exact whole-task HOLD recovery grant
        id: task_claim
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          PUBLIC_KEY: ${{ secrets.DISDEX_HP_APPROVER_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[0-9a-fA-F-]{36}$ && -n "$BRIDGE" && -n "$PUBLIC_KEY" ]]
          umask 077
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          data=json.dumps({
            "action":"claim_task_step",
            "task_id":os.environ["TASK_ID"],
            "step":"SHARED_HOLD_RECOVERY",
            "target_sha":"7688ed7c93a1918d8b44837339b7da5584a868f5",
            "run_id":os.environ["RUN_ID"],
          }).encode()
          request=urllib.request.Request(
            "https://professional-dismanager.net/api/system/deploy-approval",
            data=data,method="POST",headers={
              "Authorization":"Bearer "+os.environ["BRIDGE"],
              "Content-Type":"application/json",
            },
          )
          with urllib.request.urlopen(request,timeout=15) as response:
            result=json.load(response)
          assert result.get("ok") and result.get("scope")=="SHARED_CRYPTO_RISK_ONLY"
          assert result.get("ordersEnabled") is False
          assert result.get("step")=="SHARED_HOLD_RECOVERY"
          token=str(result.get("token") or "")
          plan=str(result.get("planSha256") or "")
          assert len(plan)==64 and token
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          (base/"hold-task-token").write_text(token,encoding="ascii")
          (base/"hold-task-plan").write_text(plan,encoding="ascii")
          print("::add-mask::"+token)
          print("WHOLE_TASK_HOLD_STAGE_CLAIMED=TRUE")
          PY
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/hold-owner.pub"
          cat "$RUNNER_TEMP/hold-task-token" |
            python3 scripts/ops/deploy/disdex_owner_approval.py verify \
              --public-key "$RUNNER_TEMP/hold-owner.pub" \
              --repository "$GITHUB_REPOSITORY" \
              --sha 7688ed7c93a1918d8b44837339b7da5584a868f5 \
              --scope SHARED_CRYPTO_RISK_ONLY \
              --operator dunamishajime-bit \
              --plan-sha256 "$(cat "$RUNNER_TEMP/hold-task-plan")" \
              --deployment-target professional-dismanager.net \
              --operator-target DD1296_FINAL_ALLIN_10BPS \
              --route GITHUB_ACTIONS --orders-enabled false

      - name: Repair exact V52 systemd dependency to canonical Margin Guard
        id: v52_dependency
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          python3 -m py_compile scripts/ops/deploy/disdex_v52_exact_instance_margin_dependency.py
          scp -i "$RUNNER_TEMP/hold-ui/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -P "$PORT" scripts/ops/deploy/disdex_v52_exact_instance_margin_dependency.py \
            "root@$HOST:/tmp/disdex-v52-instance-margin-$GITHUB_RUN_ID.py"
          ssh -T -i "$RUNNER_TEMP/hold-ui/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=8 \
            -p "$PORT" "root@$HOST" \
            "python3 /tmp/disdex-v52-instance-margin-$GITHUB_RUN_ID.py --run-id $GITHUB_RUN_ID"

      - name: Verify and apply owner-only Margin Guard source-contract parity
        id: margin_fix
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          python3 -m py_compile scripts/ops/deploy/disdex_margin_hold_secure_state_and_ghost_guard.py
          scp -i "$RUNNER_TEMP/hold-ui/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -P "$PORT" scripts/ops/deploy/disdex_margin_hold_secure_state_and_ghost_guard.py \
            "root@$HOST:/tmp/disdex-margin-hold-parity-$GITHUB_RUN_ID.py"
          ssh -T -i "$RUNNER_TEMP/hold-ui/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -p "$PORT" "root@$HOST" \
            "python3 /tmp/disdex-margin-hold-parity-$GITHUB_RUN_ID.py --run-id $GITHUB_RUN_ID"

      - name: Exact HOLD readiness proof after secure margin state repair
        id: hold_preflight
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          ssh -T -i "$RUNNER_TEMP/hold-ui/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -o ConnectTimeout=12 -p "$PORT" "root@$HOST" \
            "/usr/bin/python3 /usr/local/sbin/disdex-idle-residual-kill-recovery"

      - name: Configure forced-command root SSH
        if: ${{ inputs.mode == 'execute' }}
        env:
          KEY: ${{ secrets.DISDEX_PRODUCTION_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          KNOWN: ${{ secrets.DISDEX_PRODUCTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" == "professional-dismanager.net" && -n "$KEY" && -n "$KNOWN" ]]
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/hold-forced"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/hold-forced/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/hold-forced/known_hosts"
          chmod 600 "$RUNNER_TEMP/hold-forced/"*
          ssh-keygen -y -f "$RUNNER_TEMP/hold-forced/key" >/dev/null

      - name: Exact owner-reviewed allowlisted HOLD recovery
        id: execute_recovery
        if: ${{ inputs.mode == 'execute' }}
        env:
          HOST: ${{ secrets.DISDEX_PRODUCTION_SSH_HOST }}
          PORT: ${{ vars.DISDEX_PRODUCTION_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          ssh -T -i "$RUNNER_TEMP/hold-forced/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-forced/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -p "$PORT" "root@$HOST" \
            "/usr/local/sbin/disdex-idle-residual-kill-recovery --execute-after-three-signed-gets"

      - name: Verify V52 and released HOLD in read-only mode
        id: postproof
        if: ${{ inputs.mode == 'execute' }}
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PORT" ]]; then PORT=22; fi
          ssh -T -i "$RUNNER_TEMP/hold-ui/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
            -o ConnectTimeout=12 -p "$PORT" "root@$HOST" "python3 -" <<'PY'
          import json,subprocess
          from pathlib import Path
          new="4d33d8244c0b50a7e461ffd8aaf493c32bfdfd81"
          old="97830672e2f139b39f7194166d7dc8c36e8c8933"
          pin=Path("/etc/disdex/current-runtime/v52-current.env").read_text()
          assert "DISDEX_V52_RUNTIME_SHA="+new in pin,"NEW_V52_NOT_PINNED"
          def active(sha):
              return subprocess.run(["systemctl","is-active","disdex-v52-aster-only@"+sha+".service"],capture_output=True,text=True).stdout.strip()=="active"
          assert active(new) and not active(old),"DUAL_OR_OLD_V52_ACTIVE"
          kill=json.loads(Path("/var/lib/disdex/shared/kill-switch.json").read_text())
          assert kill.get("active") is False,"SHARED_HOLD_NOT_RELEASED"
          assert kill.get("operator")=="V52_IDLE_RESIDUAL_OWNER_RECOVERY_V1","OTHER_KILL_SWITCH_CHANGE"
          print("V52_IDLE_OWNER_HOLD_RECOVERY=VERIFIED")
          print("NEW_V52_ONLY=TRUE ORDERS_FROM_POSTCHECK=0")
          PY

      - name: Close exact whole-task HOLD stage for success or retry
        if: ${{ always() && inputs.mode == 'execute' && steps.task_claim.outcome == 'success' }}
        shell: bash
        env:
          BRIDGE: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          EXECUTION: ${{ steps.execute_recovery.outcome }}
          POSTPROOF: ${{ steps.postproof.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          passed=os.environ["EXECUTION"]=="success" and os.environ["POSTPROOF"]=="success"
          body=json.dumps({
            "action":"finish_task_step",
            "task_id":os.environ["TASK_ID"],
            "step":"SHARED_HOLD_RECOVERY",
            "run_id":os.environ["RUN_ID"],
            "outcome":"success" if passed else "failure",
          }).encode()
          request=urllib.request.Request(
            "https://professional-dismanager.net/api/system/deploy-approval",
            data=body,method="POST",headers={
              "Authorization":"Bearer "+os.environ["BRIDGE"],
              "Content-Type":"application/json",
            },
          )
          with urllib.request.urlopen(request,timeout=15) as response:
            result=json.load(response)
          assert result.get("ok") and result.get("status")=="APPROVED"
          print("WHOLE_TASK_HOLD_STAGE="+("SUCCESS" if passed else "RETRYABLE"))
          PY

      - name: Destroy ephemeral SSH material
        if: always()
        env:
          HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
        shell: bash
        run: |
          set +e
          if [[ -z "$PORT" ]]; then PORT=22; fi
          if [[ -s "$RUNNER_TEMP/hold-ui/key" && -n "$HOST" ]]; then
            ssh -T -i "$RUNNER_TEMP/hold-ui/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/hold-ui/known_hosts" \
              -o ConnectTimeout=6 -p "$PORT" "root@$HOST" \
              "rm -f -- /tmp/disdex-margin-hold-parity-$GITHUB_RUN_ID.py /tmp/disdex-v52-instance-margin-$GITHUB_RUN_ID.py" >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/hold-ui" "$RUNNER_TEMP/hold-forced" \
            "$RUNNER_TEMP/hold-task-token" "$RUNNER_TEMP/hold-task-plan" "$RUNNER_TEMP/hold-owner.pub"
