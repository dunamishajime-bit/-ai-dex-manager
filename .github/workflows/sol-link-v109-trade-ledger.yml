name: SOL LINK V109 Frozen Trade Ledger Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_sol_link_v109_trade_ledger.py"
      - ".github/workflows/sol-link-v109-trade-ledger.yml"

permissions:
  contents: read

concurrency:
  group: sol-link-v109-trade-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [SOL, LINK]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile diagnostic only
        run: python -m py_compile scripts/research_sol_link_v109_trade_ledger.py
      - name: Run frozen V109 trade ledger diagnostic
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_sol_link_v109_trade_ledger.py --pair "${{ matrix.pair }}"
      - name: Upload diagnostic ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair }}-v109-frozen-trade-ledger
          path: |
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-v109-frozen-trade-ledger.json
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-v109-frozen-trade-ledger.md
          if-no-files-found: warn
          retention-days: 30

# Diagnostic only. Frozen V109 strategy, thresholds, risk, trail, execution, production/VPS/live remain unchanged.
