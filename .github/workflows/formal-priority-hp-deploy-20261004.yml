name: Formal Priority HP one-shot deploy 20261004

on:
  push:
    branches:
      - research/formal-priority-cooldown-20261003
    paths:
      - ".github/workflows/formal-priority-hp-deploy-20261004.yml"

permissions:
  contents: read

concurrency:
  group: formal-priority-hp-deploy-20261004
  cancel-in-progress: false

jobs:
  deploy-hp-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: a23edd7628100faf314f2b341b03215f178d5cdc
      SOURCE_REF: research/formal-priority-cooldown-20261003
      EXPECTED_TRADING_SHA: 53eeff5417636369d4709fddfd47d7916ddcf3b1
      EXPECTED_UI_SHA: 207e0448d1c4243f7dc48a30c6479bac5e09fb77
      EXPECTED_UI_WORKDIR: /home/deploy/disdex-trading/ui-releases/ui-idle-207e0448d1c4
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact target and published CI source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse "$TARGET_SHA^{commit}")" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          test -f app/api/system/formal-priority-status/route.ts
          test -f app/decision-status/formal-priority/page.tsx
          git diff --quiet "$TARGET_SHA" --             app/api/system/formal-priority-status/route.ts             app/decision-status/formal-priority/page.tsx             app/positions/page.tsx             app/history/page.tsx

      - name: Initialize restricted root SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"))
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"))
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null

      - name: Deploy immutable HP release only
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=15 -p "$PORT" "root@$SSH_HOST"             "TARGET_SHA='$TARGET_SHA' SOURCE_REF='$SOURCE_REF' EXPECTED_TRADING_SHA='$EXPECTED_TRADING_SHA' EXPECTED_UI_SHA='$EXPECTED_UI_SHA' EXPECTED_UI_WORKDIR='$EXPECTED_UI_WORKDIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(id -un)" == root ]]
          ui_service=ai-dex-manager-ui.service
          ui_root=/home/deploy/disdex-trading/ui-releases
          ui_release="$ui_root/ui-formal-${TARGET_SHA:0:12}"
          ui_stage="$ui_root/.ui-formal-${TARGET_SHA:0:12}.tmp-$$"
          override=/etc/systemd/system/ai-dex-manager-ui.service.d/99-formal-priority-20261004.conf
          current=/home/deploy/disdex-trading/current
          source_cfg=/etc/disdex/github-actions-control.env
          switched=0

          trading_before="$(tr -d '[:space:]' < "$current/.disdex-release-sha")"
          trading_path_before="$(readlink -f "$current")"
          ui_before="$(systemctl show "$ui_service" -p WorkingDirectory --value)"
          ui_env_before="$(systemctl show "$ui_service" -p Environment --value)"
          ui_sha_before="$(printf '%s' "$ui_env_before" | tr ' ' '\n' | sed -n 's/^DISDEX_UI_RELEASE_SHA=//p' | tail -1)"
          ui_pid_before="$(systemctl show "$ui_service" -p MainPID --value)"
          [[ "$trading_before" == "$EXPECTED_TRADING_SHA" ]]
          [[ "$trading_path_before" == "/home/deploy/disdex-trading/releases/$EXPECTED_TRADING_SHA" ]]
          [[ "$ui_before" == "$EXPECTED_UI_WORKDIR" ]]
          [[ "$ui_sha_before" == "$EXPECTED_UI_SHA" ]]
          [[ "$(systemctl is-active "$ui_service")" == active ]]
          [[ "$ui_pid_before" =~ ^[0-9]+$ && "$ui_pid_before" -gt 0 ]]
          [[ ! -e "$override" && ! -L "$override" ]]
          [[ ! -e "$ui_release" && ! -L "$ui_release" ]]

          runners=(disdex-v12-x1-all disdex-pengu-dual-ls-v2 disdex-quality102-causal-v1
                   disdex-v52-aster-only disdex-fet-brk48 disdex-hype-long disdex-idle-priority-short
                   disdex-shared-crypto-risk disdex-v12-v52-margin-guard)
          declare -A runner_state_before runner_pid_before runner_restart_before
          for name in "${runners[@]}"; do
            unit="$name@$EXPECTED_TRADING_SHA.service"
            runner_state_before["$name"]="$(systemctl is-active "$unit" 2>/dev/null || true)"
            runner_pid_before["$name"]="$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)"
            runner_restart_before["$name"]="$(systemctl show "$unit" -p NRestarts --value 2>/dev/null || true)"
            printf 'RUNNER_BEFORE name=%s state=%s pid=%s restarts=%s\n' "$name" "${runner_state_before[$name]}" "${runner_pid_before[$name]}" "${runner_restart_before[$name]}"
          done

          rollback() {
            rc=$?
            trap - ERR
            set +e
            echo "HP_DEPLOY_ROLLBACK_BEGIN rc=$rc"
            if [[ "$switched" == 1 ]]; then
              rm -f -- "$override"
              systemctl daemon-reload
              systemctl restart "$ui_service"
              for _ in $(seq 1 30); do
                cwd="$(systemctl show "$ui_service" -p WorkingDirectory --value 2>/dev/null || true)"
                code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3001/ || true)"
                [[ "$cwd" == "$EXPECTED_UI_WORKDIR" && "$code" == 200 ]] && break
                sleep 1
              done
              echo "HP_DEPLOY_ROLLBACK_UI_WORKDIR=$(systemctl show "$ui_service" -p WorkingDirectory --value 2>/dev/null || true)"
            fi
            rm -rf -- "$ui_stage"
            echo "HP_DEPLOY_ROLLBACK_TRADING_CURRENT=$(readlink -f "$current" 2>/dev/null || true)"
            exit "$rc"
          }
          trap rollback ERR

          [[ -f "$source_cfg" && ! -L "$source_cfg" ]]
          source "$source_cfg"
          : "${SOURCE_REPO:?SOURCE_REPO missing}"
          : "${EXPECTED_ORIGIN_URL:?EXPECTED_ORIGIN_URL missing}"
          [[ "$SOURCE_REPO" == /* && -d "$SOURCE_REPO" && ! -L "$SOURCE_REPO" ]]
          [[ "$(stat -c '%U' "$SOURCE_REPO")" == deploy ]]
          actual_origin="$(runuser -u deploy -- git -C "$SOURCE_REPO" remote get-url origin)"
          [[ "$actual_origin" == "$EXPECTED_ORIGIN_URL" ]]
          runuser -u deploy -- git -C "$SOURCE_REPO" fetch --no-tags origin             "refs/heads/$SOURCE_REF:refs/remotes/origin/$SOURCE_REF"
          remote_head="$(runuser -u deploy -- git -C "$SOURCE_REPO" rev-parse "refs/remotes/origin/$SOURCE_REF^{commit}")"
          runuser -u deploy -- git -C "$SOURCE_REPO" merge-base --is-ancestor "$TARGET_SHA" "$remote_head"
          [[ "$(runuser -u deploy -- git -C "$SOURCE_REPO" rev-parse "$TARGET_SHA^{commit}")" == "$TARGET_SHA" ]]

          install -d -o deploy -g deploy -m 0750 "$ui_stage"
          runuser -u deploy -- git -C "$SOURCE_REPO" archive "$TARGET_SHA" | runuser -u deploy -- tar -x -C "$ui_stage"
          printf '%s\n' "$TARGET_SHA" > "$ui_stage/.disdex-release-sha"
          chown deploy:deploy "$ui_stage/.disdex-release-sha"
          runuser -u deploy -- npm --prefix "$ui_stage" ci --no-audit --no-fund
          runuser -u deploy -- env NODE_OPTIONS=--max-old-space-size=1536 npm --prefix "$ui_stage" run build
          [[ -d "$ui_stage/.next" ]]
          [[ "$(tr -d '[:space:]' < "$ui_stage/.disdex-release-sha")" == "$TARGET_SHA" ]]
          mv -- "$ui_stage" "$ui_release"
          chown -R deploy:deploy "$ui_release"

          install -d -o root -g root -m 0755 /etc/systemd/system/ai-dex-manager-ui.service.d
          tmp_override="/etc/systemd/system/ai-dex-manager-ui.service.d/.99-formal-priority-20261004.tmp-$$"
          cat > "$tmp_override" <<EOF
          [Service]
          WorkingDirectory=$ui_release
          Environment=DISDEX_UI_RELEASE_SHA=$TARGET_SHA
          EOF
          sed -i 's/^[[:space:]]*//' "$tmp_override"
          chown root:root "$tmp_override"
          chmod 0644 "$tmp_override"
          mv -f -- "$tmp_override" "$override"
          switched=1
          systemctl daemon-reload
          systemctl restart "$ui_service"

          ui_pid_after=""
          for _ in $(seq 1 30); do
            ui_active="$(systemctl is-active "$ui_service" 2>/dev/null || true)"
            ui_cwd="$(systemctl show "$ui_service" -p WorkingDirectory --value 2>/dev/null || true)"
            ui_pid_after="$(systemctl show "$ui_service" -p MainPID --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Cookie: disdex_auth=1' -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3001/decision-status/formal-priority || true)"
            [[ "$ui_active" == active && "$ui_cwd" == "$ui_release" && "$ui_pid_after" =~ ^[0-9]+$ && "$ui_pid_after" -gt 0 && "$code" == 200 ]] && break
            sleep 1
          done
          [[ "$ui_pid_after" =~ ^[0-9]+$ && "$ui_pid_after" -gt 0 ]]
          [[ "$(systemctl is-active "$ui_service")" == active ]]
          [[ "$(systemctl show "$ui_service" -p WorkingDirectory --value)" == "$ui_release" ]]
          ui_env_after="$(systemctl show "$ui_service" -p Environment --value)"
          ui_sha_after="$(printf '%s' "$ui_env_after" | tr ' ' '\n' | sed -n 's/^DISDEX_UI_RELEASE_SHA=//p' | tail -1)"
          [[ "$ui_sha_after" == "$TARGET_SHA" ]]
          sleep 5
          [[ "$(systemctl show "$ui_service" -p MainPID --value)" == "$ui_pid_after" ]]
          [[ "$(curl -sS -H 'Cookie: disdex_auth=1' -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3001/decision-status/formal-priority)" == 200 ]]

          curl -sS -H 'Cookie: disdex_auth=1' --max-time 15 http://127.0.0.1:3001/api/system/formal-priority-status > /tmp/formal-priority-status.json
          python3 - "$EXPECTED_TRADING_SHA" "$TARGET_SHA" <<'PY'
          import json,sys
          trading_sha,target_sha=sys.argv[1:]
          d=json.load(open("/tmp/formal-priority-status.json",encoding="utf-8"))
          if d.get("ok") is not True: raise SystemExit("HP_FORMAL_API_NOT_OK")
          if d.get("releaseSha") != trading_sha: raise SystemExit("HP_FORMAL_API_TRADING_SHA_MISMATCH")
          c=d.get("formalContract") or {}
          v=c.get("v12") or {}; q=c.get("q102") or {}; bt=c.get("formalBt") or {}
          assert v.get("rank12Gross")==1.0 and v.get("dogeLtcRank12Gross")==0.5 and v.get("rank3Gross")==0.5
          assert q.get("handoffFamilies")==["PB","REV","HIGH_VOL"]
          assert q.get("noHandoffFamilies")==["MR","BRK"]
          assert q.get("victimOrder")==["Rank3","Rank2","Rank1"]
          assert bt.get("trades")==1275 and bt.get("accounting")=="PASS"
          print("HP_FORMAL_API_CONTRACT=PASS")
          print("HP_FORMAL_API_TRADING_SHA="+str(d.get("releaseSha")))
          print("HP_DEPLOYED_UI_SHA="+target_sha)
          PY

          [[ "$(tr -d '[:space:]' < "$current/.disdex-release-sha")" == "$EXPECTED_TRADING_SHA" ]]
          [[ "$(readlink -f "$current")" == "$trading_path_before" ]]
          for name in "${runners[@]}"; do
            unit="$name@$EXPECTED_TRADING_SHA.service"
            state_after="$(systemctl is-active "$unit" 2>/dev/null || true)"
            pid_after="$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)"
            restarts_after="$(systemctl show "$unit" -p NRestarts --value 2>/dev/null || true)"
            [[ "$state_after" == "${runner_state_before[$name]}" ]]
            [[ "$pid_after" == "${runner_pid_before[$name]}" ]]
            [[ "$restarts_after" == "${runner_restart_before[$name]}" ]]
            printf 'RUNNER_AFTER name=%s state=%s pid=%s restarts=%s\n' "$name" "$state_after" "$pid_after" "$restarts_after"
          done

          python3 - <<'PY'
          import json
          kill=json.load(open("/var/lib/disdex/shared/kill-switch.json",encoding="utf-8"))
          risk=json.load(open("/var/lib/disdex/shared/crypto-daily-risk.json",encoding="utf-8"))
          guard=json.load(open("/var/lib/disdex/shared/margin-risk/guard-live.json",encoding="utf-8"))
          if kill.get("active") is not False: raise SystemExit("POST_HP_KILL_SWITCH_ACTIVE")
          if risk.get("tripped") is not False: raise SystemExit("POST_HP_SHARED_RISK_TRIPPED")
          if guard.get("stage")!="HEALTHY": raise SystemExit("POST_HP_MARGIN_NOT_HEALTHY")
          print("POST_HP_TRADING_SAFETY=PASS")
          PY

          trap - ERR
          echo "STATUS=HP_FORMAL_PRIORITY_DEPLOYED_VERIFIED"
          echo "UI_RELEASE=$ui_release"
          echo "UI_SHA=$TARGET_SHA"
          echo "UI_PID=$ui_pid_after"
          echo "TRADING_CURRENT_UNCHANGED=$EXPECTED_TRADING_SHA"
          echo "TRADING_RUNNER_PIDS_UNCHANGED=PASS"
          echo "TRADING_RESTART_ATTEMPTED=FALSE"
          echo "ORDER_MUTATION_ATTEMPTED=FALSE"
          REMOTE

      - name: Public HP smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Cookie: disdex_auth=1' https://professional-dismanager.net/decision-status/formal-priority)"
          echo "PUBLIC_FORMAL_PRIORITY_HTTP=$code"
          [[ "$code" == 200 ]]
