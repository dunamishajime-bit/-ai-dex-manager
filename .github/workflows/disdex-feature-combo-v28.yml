name: Dis-Dex Feature Combo V28

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_feature_combo_v28.py"
      - "scripts/research_lab_feature_overlay_v27.py"
      - ".github/workflows/disdex-feature-combo-v28.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_feature_combo_v28.py"
      - ".github/workflows/disdex-feature-combo-v28.yml"

permissions:
  contents: read

concurrency:
  group: disdex-feature-combo-v28-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore frozen USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: multi-horizon-v3-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            win80-profit-v1-usdm-
            usdm-snapshot-v2-
            autonomous-usdm-v2-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile scripts/research_lab_feature_overlay_v27.py scripts/research_lab_feature_combo_v28.py
      - name: Run complementary feature combination validation
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_feature_combo_v28.py
      - name: Upload V28 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disdex-feature-combo-v28
          path: |
            .research-state/disdex-feature-combo-v28.json
            .research-state/disdex-feature-combo-v28.md
          if-no-files-found: warn
          retention-days: 30
