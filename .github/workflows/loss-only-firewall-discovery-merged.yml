name: Loss Only Firewall Discovery Merged

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811
      - name: Assert frozen discovery source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_loss_only_firewall_discovery.py)" = "a7e4999f18e3bf6ad67c291a5dc43843feaf01b8"
          echo LOSS_ONLY_MERGED_DISCOVERY_SOURCE_PASS
      - name: Download and merge BROAD+CORE LOSERS ONLY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import io,json,os,time,urllib.request,urllib.error,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'loss-only-merged-discovery'}
          def api(url):
              q=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(q,timeout=60) as r:return r.read()
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,heads,newurl):return None
          def dl_artifact(a):
              q=urllib.request.Request(a['archive_download_url'],headers=headers);op=urllib.request.build_opener(NR)
              try:return op.open(q,timeout=60).read()
              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308):raise
                  return urllib.request.urlopen(urllib.request.Request(e.headers['Location'],headers={'User-Agent':'loss-only-merged-discovery'}),timeout=120).read()
          def latest(name):
              for _ in range(90):
                  data=json.loads(api(f'https://api.github.com/repos/{repo}/actions/artifacts?name={name}&per_page=100'))
                  xs=[a for a in data.get('artifacts',[]) if not a.get('expired')]
                  if xs:return max(xs,key=lambda x:x['created_at'])
                  time.sleep(5)
              raise SystemExit('ARTIFACT_NOT_READY:'+name)
          specs=[('loss-only-trade-harvest-redirect-safe','loss-only-losing-trades.jsonl'),('loss-only-trade-harvest-core-redirect-safe','loss-only-core-losing-trades.jsonl')]
          rows=[];sources=[]
          for aname,fname in specs:
              a=latest(aname);z=zipfile.ZipFile(io.BytesIO(dl_artifact(a)));names={n.split('/')[-1]:n for n in z.namelist()}
              if fname not in names:raise SystemExit('MISSING_LOSER_FILE:'+aname+':'+fname)
              part=[json.loads(x) for x in z.read(names[fname]).decode().splitlines() if x.strip()]
              rows.extend(part);sources.append({'artifactName':aname,'artifactId':a['id'],'digest':a.get('digest'),'rows':len(part)})
          uniq={};dropped_pre96=0
          for r in rows:
              v=r.get('version');br=str(r.get('branch') or '').lower()
              if isinstance(v,(int,float)) and int(v)<96:
                  dropped_pre96+=1;continue
              if 'research/v71' in br and (v is None or int(v)<96):
                  dropped_pre96+=1;continue
              key=(r.get('sourceFamily'),r.get('symbol'),r.get('side'),r.get('entryTs'),r.get('exitTs'),round(float(r.get('returnPct') or 0),8),r.get('mode'))
              uniq[key]=r
          merged=sorted(uniq.values(),key=lambda r:(int(r.get('entryTs') or 0),str(r.get('sourceFamily')),str(r.get('symbol'))))
          os.makedirs('.research-state',exist_ok=True)
          with open('.research-state/loss-only-losing-trades.jsonl','w') as f:
              for r in merged:f.write(json.dumps(r,sort_keys=True)+'\n')
          summary={'researchLine':'LOSS_ONLY_MERGED_LOSER_INPUT','researchOnly':True,'winnerFilesRead':False,'sources':sources,'inputRows':len(rows),'droppedPreV96Records':dropped_pre96,'deduplicatedLosers':len(merged),'sourceFamilies':len({r.get('sourceFamily') for r in merged}),'partitions':{p:sum(r.get('partition')==p for r in merged) for p in ('LOSS_DISCOVERY','LOSS_VALIDATION')},'symbols':{s:sum(r.get('symbol')==s for r in merged) for s in ('BTC','ETH','BNB','SOL','LINK','AVAX')}}
          open('.research-state/loss-only-merged-input-summary.json','w').write(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
      - name: Install prefetch dependencies
        run: npm ci
      - name: Prefetch frozen historical OHLCV only
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile frozen discovery
        run: python -m py_compile scripts/research_loss_only_firewall_discovery.py
      - name: Discover recurring blockers from MERGED LOSERS ONLY
        env:
          LOSS_ONLY_LOSERS_PATH: .research-state/loss-only-losing-trades.jsonl
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_loss_only_firewall_discovery.py
      - name: Assert one-way boundary
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('.research-state/loss-only-firewall-discovery.json').read_text())
          m=json.loads(Path('.research-state/loss-only-merged-input-summary.json').read_text())
          assert x['losersOnly'] is True and x['winnerFileRead'] is False and x['winnerFeaturesInspected'] is False
          assert m['winnerFilesRead'] is False
          assert not os.path.exists('.research-state/loss-only-normalized-trades.jsonl')
          assert not os.path.exists('.research-state/loss-only-core-normalized-trades.jsonl')
          print('LOSS_ONLY_MERGED_DISCOVERY_BOUNDARY_PASS')
          PY
      - name: Upload merged loser-only discovery
        uses: actions/upload-artifact@v4
        with:
          name: loss-only-firewall-discovery-merged
          path: |
            .research-state/loss-only-merged-input-summary.json
            .research-state/loss-only-firewall-discovery.json
            .research-state/loss-only-firewall-discovery.md
            .research-state/loss-only-enriched-losers.jsonl
          retention-days: 30
