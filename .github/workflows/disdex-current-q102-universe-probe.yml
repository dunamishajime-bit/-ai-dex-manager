name: Current Q102 effective universe research probe (read only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  q102-config:
    if: >-
      github.event.issue.number == 132 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'DISDEX_CURRENT_Q102_UNIVERSE_RESEARCH_20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - name: Configure root SSH without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path.home()/".ssh"
          def norm(k): return os.environ[k].lstrip("\ufeff").replace("\r\n","\n").replace("\r","\n").strip()+"\n"
          (p/"id_root").write_text(norm("ROOT_KEY"),encoding="utf8")
          (p/"known_hosts").write_text(norm("SSH_KNOWN_HOSTS"),encoding="utf8")
          PY
          chmod 0600 "$HOME/.ssh/id_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_root" >/dev/null
      - name: Read only current release SHA and non-secret Q102 trading universe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T -i "$HOME/.ssh/id_root" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "root@$SSH_HOST" 'python3 -' <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root=Path("/home/deploy/disdex-trading/current").resolve(strict=True)
          sha=(root/".disdex-release-sha").read_text().strip()
          assert re.fullmatch("[0-9a-f]{40}",sha)
          assert root==Path("/home/deploy/disdex-trading/releases")/sha
          print("CURRENT_RESEARCH_VPS_RELEASE_SHA",sha)
          # Never print whole systemd env or file contents; inspect only this
          # non-secret symbol-universe field that is necessary for exact Q102.
          candidates=[
            Path("/etc/disdex/disdex-quality102-causal-v1.env"),
            Path("/etc/disdex/current-runtime")/(sha+".env"),
            Path("/etc/disdex/disdex-v12-pengu-v2-v52.env"),
          ]
          observed=[]
          for path in candidates:
            if not path.is_file():continue
            for line in path.read_text(encoding="utf8").splitlines():
              match=re.fullmatch(r"\s*(?:export\s+)?QUALITY102_CAUSAL_V1_SYMBOLS\s*=\s*(.*?)\s*",line)
              if not match:continue
              value=match.group(1).strip().strip('"').strip("'")
              symbols=sorted(set(piece.strip().upper() for piece in value.split(",") if piece.strip()))
              if not symbols or any(not re.fullmatch("[A-Z0-9]+USDT",x) or x=="BTCUSDT" for x in symbols):
                raise SystemExit("Q102_EFFECTIVE_HIGH_VOL_UNIVERSE_MISSING_OR_INVALID")
              observed.append((str(path),symbols))
          if not observed:raise SystemExit("Q102_EFFECTIVE_HIGH_VOL_UNIVERSE_NOT_FOUND")
          unique={tuple(row[1]) for row in observed}
          if len(unique)!=1:raise SystemExit("Q102_EFFECTIVE_UNIVERSE_CONFLICT_ACROSS_FILES")
          symbols=observed[-1][1]
          print("Q102_HIGH_VOL_SYMBOLS",",".join(symbols))
          print("Q102_HIGH_VOL_SYMBOL_COUNT",len(symbols))
          print("Q102_HIGH_VOL_UNIVERSE_SHA256",hashlib.sha256(",".join(symbols).encode()).hexdigest())
          print("READ_ONLY_Q102_EFFECTIVE_UNIVERSE_PROBE_PASS")
          print("TRADING_MUTATION=0")
          PY
