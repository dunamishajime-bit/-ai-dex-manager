name: PENGU Flat1 DD Stage3 Hard-Stop Grid
on:
  push:
    branches:
      - research/pengu-flat1-dd-deep-search-20260924
    paths:
      - scripts/research_pengu_flat1_dd_stage3_grid_20260924.ts
      - .github/workflows/pengu-flat1-dd-stage3-grid-20260924.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run PENGU route-specific hard-stop grid
        env:
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_flat1_dd_stage3_grid_20260924.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-flat1-dd-stage3-grid
          path: .research-state/pengu-flat1-dd-deep-search/
          retention-days: 90
