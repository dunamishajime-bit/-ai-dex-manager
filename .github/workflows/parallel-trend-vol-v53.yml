name: Parallel Trend Vol V53

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/parallel-trend-vol-v53-trigger.txt"
      - "scripts/research-lab-prefetch-trend-vol-v53.ts"
      - "scripts/research_lab_parallel_trend_vol_v53.py"
      - "lib/research-lab/perp/**"
      - ".github/workflows/parallel-trend-vol-v53.yml"

permissions:
  contents: read

concurrency:
  group: parallel-trend-vol-v53-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore USD-M source cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: parallel-trend-vol-v53-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            parallel-trend-vol-v51-usdm-
            volatility-breakout-v49-usdm-
            multi-horizon-v3-usdm-
            win80-profit-v1-usdm-
            usdm-snapshot-v2-
            autonomous-usdm-v2-
      - name: Install dependencies
        run: npm ci
      - name: Prefetch public USD-M history
        run: npx tsx scripts/research-lab-prefetch-trend-vol-v53.ts
      - name: Validate research source
        run: python -m py_compile scripts/research_lab_parallel_trend_vol_v53.py
      - name: Run parallel Trend Vol research
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_parallel_trend_vol_v53.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-trend-vol-v53
          path: |
            .research-state/parallel-trend-vol-v53.json
            .research-state/parallel-trend-vol-v53.md
          if-no-files-found: warn
          retention-days: 30

# Research only. Public historical market data only. No production, VPS, credentials, order, position, approval, or LIVE changes.
