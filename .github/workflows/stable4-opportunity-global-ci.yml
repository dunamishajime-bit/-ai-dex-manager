name: STABLE4 Opportunity Global CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/stable4-opportunity-global-*'
    paths:
      - 'config/disdexStable4Opportunity.ts'
      - 'config/hypeZecLongRuntime.ts'
      - 'config/idlePriorityShortRuntime.ts'
      - 'config/penguDualLsV2Runtime.ts'
      - 'lib/disdex-stable4-idle.ts'
      - 'lib/hype-stable4-opportunity-signal.ts'
      - 'lib/hype-zec-long-*.ts'
      - 'lib/idle-priority-short-*.ts'
      - 'lib/pengu-dual-ls-v2*.ts'
      - 'lib/pengu-stable4-opportunity.ts'
      - 'scripts/disdex-pengu-dual-ls-v2-live-runner.ts'
      - 'scripts/stable4-global-selftest.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stable4-opportunity-global-ci.yml'

permissions:
  contents: read

concurrency:
  group: stable4-opportunity-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository typecheck
        run: npm run typecheck

      - name: STABLE4 global contract
        run: npm run strategy:stable4-global:selftest

      - name: HYPE regression
        run: npm run strategy:hype-zec-long:selftest

      - name: IDLE regression
        run: npm run strategy:idle-priority-short:selftest

      - name: PENGU regression and typecheck
        run: |
          npm run strategy:pengu-dual-ls-v2:selftest
          npm run strategy:pengu-dual-ls-v2:typecheck

      - name: Assert STABLE4 tests never enable LIVE
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'DISDEX_STABLE4_MODE=(LIVE|true|1)' -- ops .github ':!*.md'
          test -f scripts/stable4-global-selftest.ts
