name: Profit Tier Pattern Discovery V1

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_profit_tier_pattern_discovery.py
      - .github/workflows/profit-tier-pattern-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          restore-keys: |
            pair-specific-v107-exact-usdm-v3-20260811

      - name: Assert frozen profit protocol and sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_profit_tier_pattern_discovery.py)" = "0581e1bc5898c7e3c9954d63a03f2482d1dd4c25"
          test "$(git hash-object scripts/research_loss_only_firewall_frozen_v1.py)" = "f60fa2d4876bb7e6334a530325d7547a6f805edd"
          test "$(git hash-object scripts/research_loss_only_firewall_discovery.py)" = "a7e4999f18e3bf6ad67c291a5dc43843feaf01b8"
          test -f docs/research/PROFIT_TIER_ENTRY_PATTERN_PROTOCOL_20260816.md
          echo PROFIT_TIER_SOURCE_PASS

      - name: Download recovered full V96+ trade harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import io,json,os,urllib.error,urllib.request,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'profit-tier-discovery'}
          def api_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers2,newurl):return None
          def artifact_bytes(url):
              op=urllib.request.build_opener(NoRedirect)
              try:
                  with op.open(urllib.request.Request(url,headers=headers),timeout=60) as r:return r.read()
              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308):raise
                  loc=e.headers.get('Location')
                  if not loc:raise SystemExit('ARTIFACT_REDIRECT_MISSING')
                  with urllib.request.urlopen(urllib.request.Request(loc,headers={'User-Agent':'profit-tier-blob'}),timeout=120) as r:return r.read()
          data=api_json(f'https://api.github.com/repos/{repo}/actions/artifacts?name=loss-only-trade-harvest-v2&per_page=100')
          arts=[a for a in data.get('artifacts',[]) if not a.get('expired')]
          if not arts:raise SystemExit('NO_RECOVERED_HARVEST')
          a=max(arts,key=lambda x:x['created_at']);raw=artifact_bytes(a['archive_download_url']);z=zipfile.ZipFile(io.BytesIO(raw))
          names={n.split('/')[-1]:n for n in z.namelist()}
          need='loss-only-normalized-trades.jsonl'
          if need not in names:raise SystemExit('MISSING_FULL_TRADE_CORPUS')
          os.makedirs('.research-state',exist_ok=True);open('.research-state/'+need,'wb').write(z.read(names[need]))
          print('PROFIT_TIER_FULL_HARVEST_PASS',a['id'])

      - name: Install prefetch dependencies
        run: npm ci

      - name: Prefetch frozen historical OHLCV only
        env:
          PERP_RESEARCH_START_DATE: 2022-09-01T00:00:00Z
          PERP_RESEARCH_END_DATE: 2026-07-01T00:00:00Z
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts

      - name: Verify exact six-symbol inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/perp-research-usdm/consolidated');syms=('BTC','SOL','LINK','ETH','BNB','AVAX')
          missing=[str(root/f'{s}USDT-1661990400000-1782864000000-v3.json') for s in syms if not (root/f'{s}USDT-1661990400000-1782864000000-v3.json').is_file()]
          if missing:raise SystemExit('MISSING_EXACT_INPUTS:'+','.join(missing))
          print('PROFIT_TIER_EXACT_INPUTS_PASS')
          PY

      - name: Compile discovery
        run: python -m py_compile scripts/research_profit_tier_pattern_discovery.py

      - name: Discover profit tiers and recurring patterns
        env:
          PROFIT_ALL_TRADES_PATH: .research-state/loss-only-normalized-trades.jsonl
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_profit_tier_pattern_discovery.py

      - name: Assert information boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.research-state/profit-tier-pattern-discovery.json').read_text())
          assert x['researchOnly'] is True and x['lossFirewallAppliedBeforeProfitDiscovery'] is True
          assert x['freshOosRead'] is False and x['productionChanged'] is False and x['vpsChanged'] is False and x['liveChanged'] is False and x['realTradingEnabled'] is False
          assert x['firewallCleanPositiveTrades']>0 and x['discoveryPositiveTrades']>0 and x['validationPositiveTrades']>0
          assert set(x['acceptedPatterns'])=={'BIG','MEDIUM','SMALL'}
          print('PROFIT_TIER_BOUNDARY_PASS')
          PY

      - name: Upload profit-tier discovery
        uses: actions/upload-artifact@v4
        with:
          name: profit-tier-pattern-discovery-v1
          path: |
            .research-state/profit-tier-pattern-discovery.json
            .research-state/profit-tier-pattern-discovery.md
            .research-state/profit-tier-firewall-clean-winners.jsonl
          retention-days: 30
