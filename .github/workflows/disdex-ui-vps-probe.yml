name: DisDex UI VPS Probe

on:
  push:
    branches:
      - ops/ui-vps-probe-20260911

permissions:
  contents: read

concurrency:
  group: disdex-ui-vps-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read-only VPS capability probe
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PROBE_STATUS=START"
          echo "USER=$(id -un)"
          id
          echo "MEMORY"
          free -h
          echo "SWAP"
          swapon --show || true
          echo "DISK"
          df -h /home/deploy/disdex-trading || true
          echo "UI_SERVICE"
          systemctl show ai-dex-manager-ui.service -p WorkingDirectory -p MainPID -p ActiveState -p SubState
          echo "TRADING_RUNTIME"
          readlink -f /home/deploy/disdex-trading/current || true
          echo "PERMISSIONS"
          if test -w /home/deploy/disdex-trading/ui-releases; then echo "UI_RELEASES_WRITABLE=TRUE"; else echo "UI_RELEASES_WRITABLE=FALSE"; fi
          if test -w /etc/systemd/system; then echo "SYSTEMD_WRITABLE=TRUE"; else echo "SYSTEMD_WRITABLE=FALSE"; fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then echo "SUDO_NONINTERACTIVE=TRUE"; else echo "SUDO_NONINTERACTIVE=FALSE"; fi
          echo "PROBE_STATUS=PASS"
      - name: Read-only privilege and wrapper inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SUDO_LIST"
          sudo -n -l 2>&1 || true
          echo "DISDEX_WRAPPERS"
          ls -la /usr/local/sbin /usr/local/bin 2>/dev/null | grep -i disdex || true
          echo "UI_UNITS"
          systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'disdex.*ui|ai-dex-manager-ui' || true
          echo "UI_DROPINS"
          systemctl show ai-dex-manager-ui.service -p DropInPaths 2>/dev/null || true
      - name: Read-only VPS control capability inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "VPS_CONTROL_USAGE"
          /usr/local/sbin/disdex-vps-control --help 2>&1 || true
          echo "VPS_CONTROL_UI_MATCHES"
          grep -nEi 'usage|case|ui|release|deploy|restart|systemctl|build|npm' /usr/local/sbin/disdex-vps-control | head -220 || true
      - name: Read-only VPS control action block
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -n '320,430p' /usr/local/sbin/disdex-vps-control
      - name: Read-only root control state
        shell: bash
        run: |
          set -Eeuo pipefail
          for action in ui-state ui-pid ui-cwd trading-state trading-pid trading-cwd trading-current; do
            echo "===${action}==="
            sudo -n /usr/local/sbin/disdex-vps-control "$action" 2>&1 || true
          done

  ssh_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.DISDEX_VPS_DEPLOY_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
    steps:
      - name: Probe constrained deploy SSH without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/disdex_probe"
          printf '%s %s\n' "$SSH_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJm3mbqSLvxNe2Y4Gc0tXEWP/b0QK8kzwIbZMnPvYxRT' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/disdex_probe" "$HOME/.ssh/known_hosts"
          set +e
          output="$(ssh -i "$HOME/.ssh/disdex_probe" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -p "$SSH_PORT" "deploy@$SSH_HOST" 'printf DISDEX_DEPLOY_SHELL_PROBE' 2>&1)"
          rc=$?
          set -e
          echo "SSH_PROBE_RC=$rc"
          printf '%s\n' "$output"
