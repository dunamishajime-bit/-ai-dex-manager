name: V96 frequency uplift backtest

on:
  pull_request:
    paths:
      - 'scripts/research_lab_v96_frequency_uplift.py'
      - '.github/workflows/v96-frequency-uplift.yml'
  workflow_dispatch:

concurrency:
  group: v96-frequency-uplift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: v96-frequency-uplift-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v96_frequency_uplift.py') }}
          restore-keys: |
            v96-frequency-uplift-${{ runner.os }}-
            v96-small-order-${{ runner.os }}-
            perp-research-usdm-
      - name: Compile research script
        run: python -m py_compile scripts/research_lab_v96_frequency_uplift.py
      - name: Run frequency uplift backtest
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: ../.research-state
        run: |
          cd scripts
          python research_lab_v96_frequency_uplift.py
      - name: Validate outputs
        run: |
          test -s .research-state/v96-frequency-uplift.json
          test -s .research-state/v96-frequency-uplift.md
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.research-state/v96-frequency-uplift.json').read_text())
          assert payload['status'] in {'ROBUST_FREQUENCY_UPLIFT_FOUND', 'NO_ROBUST_FREQUENCY_UPLIFT'}
          assert len(payload['core']) == 11
          assert len(payload['pengu']) == 8
          assert payload['safety'] == {
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'ordersSent': False,
          }
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v96-frequency-uplift
          path: |
            .research-state/v96-frequency-uplift.json
            .research-state/v96-frequency-uplift.md
          retention-days: 30
