name: PENGU Short V13 Bitget Holdout

on:
  pull_request:
    branches:
      - research/pengu-short-v11-bybit-holdout-20260824
    paths:
      - 'PRE_REGISTER_V13.md'
      - 'scripts/research_pengu_short_v13_okx_binance_gate_bitget.py'
      - '.github/workflows/pengu-short-v11-okx-binance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run pre-registered V13 on development venues and untouched Bitget
        run: python scripts/research_pengu_short_v13_okx_binance_gate_bitget.py
      - name: Validate V13 anti-overfit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-v13/result.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate']=='COUNTERWIND_SOFT_DERISK_RAPID_RELOAD'
          assert x['preRegistrationSha']=='a08da0e618e74ce0ed89163509ba4428abf69997'
          assert x['candidateCount']==1
          assert x['thresholdSweep'] is False
          assert x['bitgetPerformanceObservedBeforePreRegistration'] is False
          assert set(x['venues'])=={'OKX','Binance','Gate','Bitget'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'promotionPass':x['promotionPass'],'venuePasses':x['venuePasses'],'bitgetData':x['bitgetData']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-short-v13-${{ github.run_id }}
          path: .research-state/pengu-short-v13
          if-no-files-found: error
