name: PENGU Short V12 Final Robustness

on:
  pull_request:
    branches:
      - research/pengu-short-v11-bybit-holdout-20260824
    paths:
      - 'PRE_REGISTER_V12.md'
      - 'PRE_REGISTER_V12_GATE_ADDENDUM.md'
      - 'PRE_REGISTER_V12_GATE_FUNDING_ADDENDUM.md'
      - 'scripts/research_pengu_short_v12_okx_binance_gate.py'
      - 'scripts/research_pengu_short_v12_gate_final.py'
      - 'scripts/research_pengu_short_v12_gate_reentry_diagnostic.py'
      - '.github/workflows/pengu-short-v11-okx-binance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run pre-registered V12 robustness protocol
        run: python scripts/research_pengu_short_v12_gate_final.py
      - name: Validate V12 anti-overfit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-v12-gate-final/result.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['preRegistrationSha']=='2cfe0d7bb829e6cd928cef4871e1f0168c098506'
          assert x['gateRangeAddendumSha']=='5cb48d6aa311a1d0574cd30b7ca0eca73b5ec1cf'
          assert x['gateFundingAddendumSha']=='974cd393203a1311399f402fc0927eb53aaf0d30'
          assert x['candidate']=='RAPID_RISKON_RELATIVE_WEAKNESS_REENTRY'
          assert x['candidateCount']==1
          assert x['thresholdSweep'] is False
          assert x['gatePerformanceObservedBeforeProtocol'] is False
          assert set(x['venues'])=={'OKX','Binance','GatePrice1Y','GateFunded5M'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'promotionPass':x['promotionPass'],'venuePasses':x['venuePasses'],'gateData':x['gateData']},indent=2))
          PY
      - name: Diagnose Gate V12 reentry
        run: python scripts/research_pengu_short_v12_gate_reentry_diagnostic.py
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-v12-gate-reentry-diagnostic/diagnostic.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['diagnosticOnly'] is True
          assert x['candidate']=='RAPID_RISKON_RELATIVE_WEAKNESS_REENTRY'
          assert x['v12PreRegistrationSha']=='2cfe0d7bb829e6cd928cef4871e1f0168c098506'
          assert x['venue']=='Gate'
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'count':x['count'],'wins':x['wins'],'reentries':x['reentries']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-short-v12-gate-diagnostic-${{ github.run_id }}
          path: |
            .research-state/pengu-short-v12-gate-final
            .research-state/pengu-short-v12-gate-reentry-diagnostic
          if-no-files-found: error
