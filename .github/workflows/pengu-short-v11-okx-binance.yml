name: PENGU Short V12 OKX Binance Gate

on:
  pull_request:
    branches:
      - research/pengu-short-v11-bybit-holdout-20260824
    paths:
      - 'PRE_REGISTER_V12.md'
      - 'scripts/research_pengu_short_v12_okx_binance_gate.py'
      - 'scripts/research_pengu_short_v12_gate_retry.py'
      - '.github/workflows/pengu-short-v11-okx-binance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run pre-registered V12 on OKX Binance and untouched Gate
        run: python scripts/research_pengu_short_v12_gate_retry.py
      - name: Validate V12 anti-overfit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-v12-okx-binance-gate/result.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['preRegistrationSha']=='2cfe0d7bb829e6cd928cef4871e1f0168c098506'
          assert x['candidate']=='RAPID_RISKON_RELATIVE_WEAKNESS_REENTRY'
          assert x['candidateCount']==1
          assert x['thresholdSweep'] is False
          assert x['gateUntouchedBeforePreRegistration'] is True
          assert set(x['venues'])=={'OKX','Binance','Gate'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'promotionPass':x['promotionPass'],'venuePasses':x['venuePasses']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-short-v12-okx-binance-gate-${{ github.run_id }}
          path: .research-state/pengu-short-v12-okx-binance-gate
          if-no-files-found: error
