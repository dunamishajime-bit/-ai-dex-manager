name: Portfolio Profit Engine V17

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_portfolio_profit_engine_v17.py
      - .github/workflows/portfolio-profit-engine-v17.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen V15 stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_portfolio_profit_engine_v15.py)" = "1ac36230c636df11649892256ad7bbba0c6693a1"
          test "$(git hash-object scripts/research_portfolio_profit_engine_v14.py)" = "f297505cabf45488a507a90b3a730720ac94c203"
          test "$(git hash-object scripts/research_portfolio_profit_engine_v11.py)" = "97a76e525e9805dcbb3eaf8bec563869e15129ef"
          test "$(git hash-object scripts/research_portfolio_profit_engine_v8.py)" = "963153ecf2483d382b00439ea8d74572943379be"
          echo FROZEN_V15_STACK_PASS
      - name: Restore exact 3Y research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - name: Compile V17
        run: python -m py_compile scripts/research_pairwise_clean_sheet_3y.py scripts/research_portfolio_profit_engine_v8.py scripts/research_portfolio_profit_engine_v11.py scripts/research_portfolio_profit_engine_v14.py scripts/research_portfolio_profit_engine_v15.py scripts/research_portfolio_profit_engine_v17.py
      - name: Run V17
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_portfolio_profit_engine_v17.py
      - name: Assert research boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.research-state/portfolio-profit-engine-v17.json').read_text())
          assert d['researchOnly'] is True and d['productionChanged'] is False and d['vpsChanged'] is False and d['liveChanged'] is False
          assert d['realTradingEnabled'] is False and d['liveEligible'] is False and d['freshOosRead'] is False and d['freshOosConsumed'] is False
          assert d['target']['main3YCagrPct']==100.0 and d['target']['grossExposureCapPct']==100.0 and d['target']['leverageMultiplier']==1.0
          assert d['selectionPeriod']=='development_only_2023_07_to_2024_07'
          assert d['diagnosisBasis']['v15TrendRulesChanged'] is False
          assert d['diagnosisBasis']['oldHybridTunedThresholdsImported'] is False
          assert d['antiOverfit']['parameterGrid'] is False and d['antiOverfit']['perSymbolParameters'] is False
          assert d['antiOverfit']['validationUsedForSelection'] is False and d['antiOverfit']['evaluationUsedForSelection'] is False
          assert d['antiOverfit']['overlappingExposure'] is False
          print('V17_RESEARCH_ONLY_FAIL_CLOSED_PASS')
          PY
      - name: Upload V17 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-profit-engine-v17
          path: |
            .research-state/portfolio-profit-engine-v17.json
            .research-state/portfolio-profit-engine-v17-trades.jsonl
          if-no-files-found: warn
          retention-days: 30
