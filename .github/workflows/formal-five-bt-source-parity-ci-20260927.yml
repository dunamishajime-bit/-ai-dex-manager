name: Formal five BT source parity and audited runtime tests
on:
  push:
    branches: [research/formal-five-bt-handoff-completion-20260927]
permissions:
  contents: read
concurrency:
  group: formal-five-bt-source-tests
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/formal_five_bt/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fetch exact immutable audited production release, not today's branch HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/codex/legacy-runtime-safety-audit-20260926
          git cat-file -e a09ea45ca3cbd72100f9eb0eaae499039c40b6a0^{commit}
          python - <<'PY'
          from pathlib import Path
          from research.formal_five_bt.manifest import load_manifest
          m=load_manifest(Path("research/formal_five_bt/runtime_source_manifest.json"))
          assert m["runtime_sha"]==m["verified_repository_commit"]==m["active_release_id"]=="a09ea45ca3cbd72100f9eb0eaae499039c40b6a0"
          print("AUDITED_SOURCE_PIN=PASS")
          PY
      - name: Reconstruct pinned immutable source snapshot and verify checked-in SHA256 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from research.formal_five_bt.runtime_source import capture_runtime_sources
          path=Path("research/formal_five_bt/runtime_source_manifest.json")
          before=json.loads(path.read_text())
          snapshot=path.parent/"runtime_source_snapshot"
          original={row["path"]:row["sha256"] for row in before["files"]}
          actual=capture_runtime_sources(".",snapshot,path)
          after=json.loads(path.read_text())
          computed={row["path"]:row["sha256"] for row in actual}
          missing=sorted(set(original)-set(computed))
          changed=sorted(key for key in original.keys() & computed.keys() if original[key]!=computed[key])
          added=sorted(set(computed)-set(original))
          print("SOURCE_HASH_REPORT",json.dumps({"expected_count":len(original),"actual_count":len(computed),
              "missing":missing[:15],"changed":changed[:15],"added":added[:15],
              "runtime_sha":after["runtime_sha"]}))
          if missing or changed:raise SystemExit("AUDITED_SOURCE_HASH_PARITY_FAILED")
          print("AUDITED_SOURCE_HASH_PARITY=PASS")
          PY
      - name: Run all engine and live-bridge parity tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r research/formal_five_bt/requirements.txt
          npm ci --no-audit --no-fund
          python -m unittest discover -s tests/formal_five_bt -v
          echo FORMAL_FIVE_BT_TESTS_PASS
      - name: Confirm no raw market data or trading changes were introduced
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short --untracked-files=no
          if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|config/|scripts/disdex-|app/)' ; then
            echo TRADING_SOURCE_CHANGED_IN_RESEARCH_BRANCH; exit 2
          fi
          echo PROD_MUTATIONS=0
