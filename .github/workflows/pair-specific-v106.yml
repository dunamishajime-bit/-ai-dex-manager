name: Pair Specific V106 Accelerated

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_pair_specific_v106.py"
      - ".github/workflows/pair-specific-v106.yml"
      - "research/pair-specific-v106-trigger.txt"

permissions:
  contents: read

concurrency:
  group: pair-specific-v106-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        style: [serial_state, asymmetry_state, relative_state]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore public USD-M cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v106-usdm-${{ hashFiles('lib/research-lab/perp/futures-data-source.ts') }}
          restore-keys: |
            pair-specific-v105-usdm-
            six-pair-v98-usdm-
            event-regime-v53-usdm-
      - run: npm ci
      - name: Prefetch genuine public six-pair USD-M history
        run: npx tsx scripts/research-lab-prefetch-event-regime-v53.ts
      - name: Compile
        run: python -m py_compile scripts/research_lab_pair_specific_v106.py
      - name: Run accelerated pair-specific family
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_lab_pair_specific_v106.py --style "${{ matrix.style }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-specific-v106-${{ matrix.style }}
          path: |
            .research-state/pair-specific-v106-${{ matrix.style }}.json
            .research-state/pair-specific-v106-${{ matrix.style }}.md
          if-no-files-found: warn
          retention-days: 30

# Research only. Fixed six-pair exact one-year window. No production/live changes.
