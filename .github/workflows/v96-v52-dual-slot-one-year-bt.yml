# Exact common-period replay: 2025-07-01 through 2026-07-01 UTC.
name: V96 plus V52 Dual-Slot One-Year Compounded Backtest

on:
  pull_request:
    paths:
      - 'scripts/research_lab_v96_v52_dual_slot_one_year_bt.py'
      - 'docs/research/V96_V52_DUAL_SLOT_ONE_YEAR_PROTOCOL_2026-07-26.md'
      - '.github/workflows/v96-v52-dual-slot-one-year-bt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v96-v52-dual-slot-one-year-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash and Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13 dependency source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/aster-only-v39-overnight-open
            .cache/perp-research-usdm
            .cache/v96-crypto-v11-v13d-one-year
          key: v96-v52-dual-slot-one-year-${{ runner.os }}-${{ hashFiles('scripts/research_lab_v96_v52_dual_slot_one_year_bt.py') }}
          restore-keys: |
            aster-only-v52-v39cache-${{ runner.os }}-
            aster-only-v39-${{ runner.os }}-
            v96-crypto-v11eq-v13d-one-year-${{ runner.os }}-
            v96-volume50-turnover075-full-${{ runner.os }}-
            perp-research-usdm-
      - name: Compile and deterministic self-test
        run: |
          python -m py_compile \
            scripts/research_lab_v96_crypto_v11_v13d_one_year_bt.py \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            scripts/research_lab_aster_only_v50_post_open_basis_engine.py \
            scripts/research_lab_aster_only_v52_dual_slot_basis_engine.py \
            scripts/research_lab_v96_v52_dual_slot_one_year_bt.py
          python scripts/research_lab_v96_v52_dual_slot_one_year_bt.py --self-test
      - name: Run fixed one-year compounded portfolio backtest
        shell: bash
        run: |
          mkdir -p .research-state/v96-v52-dual-slot-one-year
          set -o pipefail
          python scripts/research_lab_v96_v52_dual_slot_one_year_bt.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --output-dir .research-state/v96-v52-dual-slot-one-year \
            2>&1 | tee .research-state/v96-v52-dual-slot-one-year/backtest.log
      - name: Validate architecture, result and safety
        run: |
          test -s .research-state/v96-v52-dual-slot-one-year/result.json
          test -s .research-state/v96-v52-dual-slot-one-year/report.md
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('.research-state/v96-v52-dual-slot-one-year/result.json').read_text())
          assert p['version'] == 53
          assert p['period']['calendarDays'] == 365
          assert p['period']['startInclusive'].startswith('2025-07-01')
          assert p['period']['endExclusive'].startswith('2026-07-01')
          assert p['architecture']['cryptoGrossCap'] == 1.0
          assert p['architecture']['stockGrossCap'] == 1.5
          assert p['architecture']['totalGrossCap'] == 2.5
          assert p['architecture']['v11MaximumGross'] == 1.0
          assert p['architecture']['v50MaximumGross'] == 1.0
          assert p['architecture']['compounding'].startswith('single account')
          for scenario in p['results'].values():
              row = scenario['unifiedCompoundedPortfolio']
              assert row['observedMaximumCryptoGross'] <= 1.0 + 1e-9
              assert row['observedMaximumStockGross'] <= 1.5 + 1e-9
              assert row['observedMaximumTotalGross'] <= 2.5 + 1e-9
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'realPositionsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v50Changed': False,
          }
          print(json.dumps({
              'status': p['status'],
              'normal': p['results']['NORMAL']['unifiedCompoundedPortfolio'],
              'severe': p['results']['SEVERE']['unifiedCompoundedPortfolio'],
              'checks': p['checks'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-v52-dual-slot-one-year-${{ github.run_id }}
          path: .research-state/v96-v52-dual-slot-one-year
          retention-days: 90
          if-no-files-found: warn
