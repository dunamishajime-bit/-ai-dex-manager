name: PENGU Fixed Gross 1 All-Order BT
on:
  push:
    branches:
      - research/pengu-gross1-all-orders-20260924
    paths:
      - scripts/research_pengu_gross1_all_orders_20260924.ts
      - .github/workflows/pengu-gross1-all-orders-20260924.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: PENGU Gross1 fixed, six sizing modes, formal and rolling Aster BT
        env:
          PRODUCTION_SOURCE_SHA: c6add8d39676584ad9db094d1ad04deb4050ed06
        run: npx tsx scripts/research_pengu_gross1_all_orders_20260924.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pengu-gross1-all-orders-results
          path: .research-state/pengu-gross1-all-orders/
          retention-days: 90
