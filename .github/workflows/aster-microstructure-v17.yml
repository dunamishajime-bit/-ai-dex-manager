name: Aster Microstructure Execution V17

# Public market-data evidence only. No API key or order placement.
on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_lab_aster_microstructure_v17.py"
      - "scripts/research_lab_aster_market_intelligence_v19.py"
      - "scripts/run_aster_market_intelligence_v19.py"
      - "research/aster-microstructure-v17-trigger.txt"
      - "research/aster-market-intelligence-v19-trigger.txt"
      - ".github/workflows/aster-microstructure-v17.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/research_lab_aster_microstructure_v17.py"
      - "scripts/research_lab_aster_market_intelligence_v19.py"
      - "scripts/run_aster_market_intelligence_v19.py"
      - "research/aster-microstructure-v17-trigger.txt"
      - "research/aster-market-intelligence-v19-trigger.txt"
      - ".github/workflows/aster-microstructure-v17.yml"

permissions:
  contents: read

concurrency:
  group: aster-microstructure-v17-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-market-data dependency
        run: python -m pip install --disable-pip-version-check "websockets==15.0.1"
      - name: Restore cumulative V19 history
        uses: actions/cache/restore@v4
        with:
          path: .research-state/aster-market-intelligence-v19/history
          key: aster-market-intelligence-v19-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aster-market-intelligence-v19-${{ github.ref_name }}-
      - name: Python syntax check
        run: python -m py_compile scripts/research_lab_aster_microstructure_v17.py scripts/research_lab_aster_market_intelligence_v19.py scripts/run_aster_market_intelligence_v19.py
      - name: Capture Aster public order-book evidence
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
          ASTER_MICROSTRUCTURE_SAMPLES: "20"
          ASTER_MICROSTRUCTURE_INTERVAL_SECONDS: "3"
        run: python scripts/research_lab_aster_microstructure_v17.py
      - name: Collect Aster market intelligence V19
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
          ASTER_V19_DURATION_SECONDS: "120"
          ASTER_V19_BUCKET_SECONDS: "5"
          ASTER_V19_DEPTH_LEVELS: "20"
        run: python scripts/run_aster_market_intelligence_v19.py
      - name: Save cumulative V19 history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .research-state/aster-market-intelligence-v19/history
          key: aster-market-intelligence-v19-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload V17 and V19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-microstructure-v17-market-intelligence-v19
          path: |
            .research-state/aster-microstructure-execution-v17.json
            .research-state/aster-microstructure-execution-v17.md
            .research-state/aster-market-intelligence-v19/aster-market-intelligence-v19.json
            .research-state/aster-market-intelligence-v19/aster-market-intelligence-v19.md
            .research-state/aster-market-intelligence-v19/history/*.ndjson
          if-no-files-found: warn
          retention-days: 30
