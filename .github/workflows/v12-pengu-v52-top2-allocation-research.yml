name: V12 PENGU V2 V52 Top2 Allocation Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/v12-pengu-v52-top2-allocation-20260825
    paths:
      - 'scripts/research_v12_pengu_v52_top2_allocation_bt.py'
      - '.github/workflows/v12-pengu-v52-top2-allocation-research.yml'

permissions:
  contents: write

concurrency:
  group: v12-pengu-v52-top2-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout live-base research branch
        uses: actions/checkout@v4

      - name: Checkout frozen V12 source
        uses: actions/checkout@v4
        with:
          ref: 27f023a37d08b71c6e59b797fdc03c20d6032da2
          path: .v12-research
          fetch-depth: 1

      - name: Checkout frozen V52 stock source for legacy combined helper
        uses: actions/checkout@v4
        with:
          ref: 04c1a369223bd27e9e42bc93604b3777b9230d92
          path: .stock-research
          fetch-depth: 1

      - name: Checkout frozen V11 stock dependency
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .stock-research/.v11
          fetch-depth: 1

      - name: Checkout frozen V13 stock dependency
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .stock-research/.v13
          fetch-depth: 1

      - name: Checkout precommitted V52 Top2 research source
        uses: actions/checkout@v4
        with:
          ref: 2ca2faf08653e0a7e1f230af0e9d57bc12710065
          path: .v52-top2-research
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable historical-data caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/perp-research-usdm
            .cache/aster-only-v39-overnight-open
            .stock-research/.cache/perp-research-usdm
            .v52-top2-research/.cache/perp-research-usdm
          key: v12-pengu-v52-top2-allocation-${{ runner.os }}-${{ hashFiles('scripts/research_v12_pengu_v52_top2_allocation_bt.py', 'scripts/research_v12_combined_bt_ledger.ts', 'scripts/research_pengu_v2_aster_ledger.ts') }}
          restore-keys: |
            v12-v52-pengu-v2-combined-
            v26-latency-aware-3y-usdm-v1-20260816
            v96-v52-dual-slot-one-year-${{ runner.os }}-
            aster-only-v52-v39cache-${{ runner.os }}-
            perp-research-usdm-

      - name: Install dependencies
        run: npm ci

      - name: Compile and self-test allocation simulator
        env:
          PYTHONPATH: scripts:.v52-top2-research/scripts:.stock-research/scripts
        run: |
          python -m py_compile scripts/research_v12_pengu_v52_top2_allocation_bt.py
          python scripts/research_v12_pengu_v52_top2_allocation_bt.py --self-test

      - name: Rebuild exact PENGU V2 Aster ledger
        env:
          PRODUCTION_SOURCE_SHA: 6f4d06fd990e5e847895b59c4890bb80335ff03e
          PENGU_LEDGER_OUT: .research-state/v12-pengu-v52-top2/pengu-v2-ledgers.json
        run: |
          mkdir -p .research-state/v12-pengu-v52-top2
          npx tsx scripts/research_pengu_v2_aster_ledger.ts 2>&1 | tee .research-state/v12-pengu-v52-top2/pengu-ledger.log

      - name: Rebuild frozen V12 ALL ledger
        env:
          V12_SOURCE_ROOT: .v12-research
          V12_SOURCE_SHA: 27f023a37d08b71c6e59b797fdc03c20d6032da2
          V12_LEDGER_OUT: .research-state/v12-pengu-v52-top2/v12-ledgers.json
        run: |
          npx tsx scripts/research_v12_combined_bt_ledger.ts 2>&1 | tee .research-state/v12-pengu-v52-top2/v12-ledger.log

      - name: Run Top2 allocation search and locked holdout
        env:
          PYTHONPATH: scripts:.v52-top2-research/scripts:.stock-research/scripts
        run: |
          python scripts/research_v12_pengu_v52_top2_allocation_bt.py \
            --stock-cache-dir .cache/aster-only-v39-overnight-open \
            --v12-ledger .research-state/v12-pengu-v52-top2/v12-ledgers.json \
            --pengu-ledger .research-state/v12-pengu-v52-top2/pengu-v2-ledgers.json \
            --output-dir .research-state/v12-pengu-v52-top2 \
            2>&1 | tee .research-state/v12-pengu-v52-top2/backtest.log

      - name: Validate research contract and safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/v12-pengu-v52-top2/result.json').read_text())
          assert p['status'] in {'V52_TOP2_ALLOCATION_PASS_RESEARCH_ONLY', 'V52_TOP2_ALLOCATION_NO_PROMOTION'}
          assert p['sourceLineage']['liveBaseSha'] == 'ef91f81e86f819ba1e37ff9325e8972489e1544f'
          assert p['sourceLineage']['v52Thresholds'] == {'basisBps': 65.0, 'netEdgeBps': 5.0, 'topK': 2, 'maxV50Slots': 2, 'maxDailyV50Trades': 3}
          assert p['architecture']['totalGrossCap'] == 2.5
          assert p['architecture']['stockGrossCap'] == 1.5
          assert p['architecture']['penguPortfolioGrossCap'] == 2.0
          assert p['architecture']['cryptoDailyLossPct'] == 7.5
          assert p['safety'] == {'mode': 'RESEARCH_ONLY', 'ordersSent': False, 'liveChanged': False, 'vpsChanged': False, 'productionChanged': False}
          for block in ('full', 'holdout'):
              for scenario in ('NORMAL', 'SEVERE'):
                  for name in ('BASELINE', 'WINNER'):
                      for order in ('CRYPTO_FIRST', 'STOCK_FIRST'):
                          row = p[block][scenario][name][order]
                          assert row['observedMaximumTotalGross'] <= 2.5 + 1e-9
                          assert row['observedMaximumStockGross'] <= 1.5 + 1e-9
                          assert row['observedMaximumV50Concurrent'] <= 2
          print(json.dumps({'status': p['status'], 'winner': p['recommendation'], 'checks': p['finalChecks']}, indent=2))
          PY

      - name: Publish latest research result on branch
        run: |
          mkdir -p docs/research-results
          cp .research-state/v12-pengu-v52-top2/result.json docs/research-results/v12-pengu-v52-top2-allocation-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-results/v12-pengu-v52-top2-allocation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "research: record V52 Top2 allocation result [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-pengu-v52-top2-allocation-${{ github.run_id }}
          path: .research-state/v12-pengu-v52-top2
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
