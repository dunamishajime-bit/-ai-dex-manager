name: Aster-only V22 V11-EQ Primary V19 Fallback

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py'
      - 'docs/research/ASTER_ONLY_V22_V11EQ_PRIMARY_V19_FALLBACK_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v22-v11eq-primary-v19-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v22-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact-window caches
        uses: actions/cache@v4
        with:
          path: .cache/aster-only-v22-router
          key: aster-only-v22-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py') }}
          restore-keys: |
            aster-only-v22-${{ runner.os }}-
            aster-only-v19-${{ runner.os }}-
      - name: Compile and freeze assertions
        run: |
          python -m py_compile \
            scripts/research_lab_aster_only_v14_replacement_tournament.py \
            scripts/research_lab_aster_only_v15_intraday_shock_tournament.py \
            scripts/research_lab_aster_only_v19_trailing_one_year_bt.py \
            scripts/research_lab_aster_only_v20_strict_hurdle_tournament.py \
            scripts/research_lab_aster_only_v22_v11eq_primary_v19_fallback.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import research_lab_aster_only_v22_v11eq_primary_v19_fallback as v22
          assert (v22.v19.BT_END_EXCLUSIVE - v22.v19.BT_START).days == 365
          assert v22.MAX_COST_BPS == 60.0
          assert v22.MIN_EDGE_BPS == 10.0
          assert v22.v19.CANDIDATE.candidate_id == 'TIME_SLOT_ZSCORE_FADE__T2__SLOT_1230__H2__NONE'
          assert v22.v20.STRICT_HURDLES['minimumNormalReturnPct'] == 50.0
          assert v22.v20.STRICT_HURDLES['minimumP95ReturnPct'] == 30.0
          print('V22 router freeze assertions: PASS')
          PY
      - name: Run V22 router audit
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v22-router
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v22_v11eq_primary_v19_fallback.py \
            --cache-dir ../.cache/aster-only-v22-router \
            --output-dir ../.research-state/aster-only-v22-router \
            2>&1 | tee ../.research-state/aster-only-v22-router/backtest.log
      - name: Validate result and safety
        run: |
          test -s .research-state/aster-only-v22-router/result.json
          test -s .research-state/aster-only-v22-router/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v22-router/result.json').read_text())
          assert p['version'] == 22
          assert p['period']['calendarDays'] == 365
          assert p['architecture']['venue'] == 'ASTER_ONLY'
          assert p['architecture']['hyperliquidUsed'] is False
          assert p['architecture']['maximumOneStockPositionPerDay'] is True
          assert p['architecture']['maximumGross'] == 1.0
          assert p['selectionDiscipline']['v11EqParametersChanged'] is False
          assert p['selectionDiscipline']['v19ParametersChanged'] is False
          assert p['selectionDiscipline']['holdoutRetuningAllowed'] is False
          assert p['selectionDiscipline']['productionPromotionAllowed'] is False
          assert p['status'] in {
            'ASTER_ONLY_V22_ROUTER_STRICT_PASS_SHADOW_ONLY',
            'ASTER_ONLY_V22_ROUTER_DID_NOT_PASS_STRICT_HURDLES',
          }
          assert p['safety'] == {
            'mode': 'RESEARCH_ONLY',
            'orderSubmissionAllowed': False,
            'productionChanged': False,
            'liveChanged': False,
            'vpsChanged': False,
            'cryptoV96Changed': False,
            'v11EqChanged': False,
            'v13dProductionChanged': False,
          }
          if p['status'] == 'ASTER_ONLY_V22_ROUTER_STRICT_PASS_SHADOW_ONLY':
              assert p['v11EqPlusV19Fallback']['allStrictHurdlesPassed'] is True
              assert all(p['v11EqPlusV19Fallback']['checks'].values())
          print(json.dumps({
            'status': p['status'],
            'v11EqOnly': p['v11EqOnly'],
            'router': p['v11EqPlusV19Fallback'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v22-router-${{ github.run_id }}
          path: .research-state/aster-only-v22-router
          retention-days: 90
          if-no-files-found: warn
