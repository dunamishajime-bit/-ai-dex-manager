name: Aster-only V14 V13D Replacement Research

on:
  pull_request:
    paths:
      - 'scripts/research_lab_aster_only_v14_replacement_tournament.py'
      - 'docs/research/ASTER_ONLY_V14_REPLACEMENT_PROTOCOL_2026-07-26.md'
      - '.github/workflows/aster-only-v14-replacement-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-only-v14-replacement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen V11 cash/Aster research source
        uses: actions/checkout@v4
        with:
          ref: 0fad24c105a7f0f61af6042ba04a8b1386ffec7c
          path: .v11
          fetch-depth: 1
      - name: Checkout frozen V13D benchmark source
        uses: actions/checkout@v4
        with:
          ref: dbfd7e026a81343a23ab97d202761f7f9bbe5755
          path: .v13
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/v96-crypto-v11-v13d-one-year
            .cache/v96-stock-cash-yahoo-v10
            .cache/v96-stock-basis-mature-v9
            .cache/v96-stock-funding
          key: aster-only-v14-${{ runner.os }}-${{ hashFiles('scripts/research_lab_aster_only_v14_replacement_tournament.py') }}
          restore-keys: |
            aster-only-v14-${{ runner.os }}-
            v96-crypto-v11eq-v13d-one-year-${{ runner.os }}-
            v96-crypto-v11-v13d-one-year-${{ runner.os }}-
            v96-stock-cash-perp-v10-${{ runner.os }}-
      - name: Compile and deterministic self-test
        run: |
          python -m py_compile scripts/research_lab_aster_only_v14_replacement_tournament.py
          cd scripts
          python research_lab_aster_only_v14_replacement_tournament.py --self-test
      - name: Run fixed Aster-only replacement tournament
        shell: bash
        run: |
          mkdir -p .research-state/aster-only-v14-replacement
          set -o pipefail
          cd scripts
          python research_lab_aster_only_v14_replacement_tournament.py \
            --cache-dir ../.cache/v96-crypto-v11-v13d-one-year \
            --output-dir ../.research-state/aster-only-v14-replacement \
            2>&1 | tee ../.research-state/aster-only-v14-replacement/backtest.log
      - name: Validate evidence and safety
        run: |
          test -s .research-state/aster-only-v14-replacement/result.json
          test -s .research-state/aster-only-v14-replacement/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-state/aster-only-v14-replacement/result.json').read_text())
          assert p['version'] == 14
          assert p['candidateCount'] == 90
          assert p['familyCount'] == 5
          assert p['rules']['venue'] == 'ASTER_ONLY'
          assert p['rules']['hyperliquidUsed'] is False
          assert p['rules']['maximumHoldingHours'] == [1, 2, 3]
          assert p['rules']['severeCostAction'] == 'FAIL_CLOSED_NO_ENTRY'
          assert p['v13dBenchmark']['twoVenueCapitalHoursIncluded'] is True
          assert p['selectionDiscipline']['independentHoldoutClaim'] is False
          assert p['selectionDiscipline']['furtherThresholdRetuningOnSameHistoryAllowed'] is False
          assert p['safety'] == {
              'mode': 'RESEARCH_ONLY',
              'orderSubmissionAllowed': False,
              'productionChanged': False,
              'liveChanged': False,
              'vpsChanged': False,
              'cryptoV96Changed': False,
              'v11EqChanged': False,
              'v13dProductionChanged': False,
          }
          assert p['status'] in {
              'NO_VALIDATION_PASSING_ASTER_ONLY_V14_CANDIDATE',
              'ASTER_ONLY_V14_VALIDATION_LEAD_DOES_NOT_FULLY_REPLACE_V13D',
              'ASTER_ONLY_V14_PROFIT_TARGET_MET_REUSED_HISTORY_FORWARD_REQUIRED',
          }
          print(json.dumps({
              'status': p['status'],
              'period': p['period'],
              'v13d': p['v13dBenchmark']['results'],
              'winner': p.get('winner'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aster-only-v14-replacement-${{ github.run_id }}
          path: .research-state/aster-only-v14-replacement
          retention-days: 90
          if-no-files-found: warn
