name: SOL V109 Profit Expansion V8

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_sol_v109_profit_expansion_v8.py"
      - ".github/workflows/sol-v109-profit-expansion-v8.yml"
      - "research/sol-v109-profit-expansion-trigger.txt"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source is unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || {
            echo "FROZEN_V109_SOURCE_DRIFT" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_sol_v109_profit_expansion_v8.py
      - name: Run SOL profit expansion D/V only
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_sol_v109_profit_expansion_v8.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOL-v109-profit-expansion-v8
          path: |
            .research-state/sol-v109-profit-expansion-v8.json
            .research-state/sol-v109-profit-expansion-v8.md
          if-no-files-found: warn
          retention-days: 30

# SOL only. Exact V109 entry/threshold/risk/trail/maxhold preserved.
# Only predictor-decay ownership is tested for profit extension.
# Development/Validation only. Confirmation/Holdout untouched.
# Production/live/VPS/.env/credentials/orders/accounts/positions untouched.
