name: DisDex VPS Host Secret Wrapper CI

on:
  pull_request:
    paths:
      - 'scripts/ops/windows/resume-disdex-v12-live-after-ssh-host-fix.ps1'
      - '.github/workflows/disdex-vps-host-secret-wrapper-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/ops/windows/resume-disdex-v12-live-after-ssh-host-fix.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          'WRAPPER_PARSE=PASS'

      - name: Verify host secret bypass boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          wrapper=scripts/ops/windows/resume-disdex-v12-live-after-ssh-host-fix.ps1
          grep -Fq "Set-GhSecretText -Name 'DISDEX_VPS_SSH_HOST' -Value" "$wrapper"
          grep -Fq "Invoke-GhText @('secret', 'set', 'DISDEX_VPS_SSH_HOST', '--repo'" "$wrapper"
          grep -Fq "Expected exactly one SSH host secret setter" "$wrapper"
          grep -Fq "Expected exactly two canonical request suffixes" "$wrapper"
          grep -Fq 'PATCHED_RESUME_PARSE=PASS' "$wrapper"
          grep -Fq 'PATCH_ONLY=PASS' "$wrapper"
          ! grep -Eq '(ssh-keyscan|StrictHostKeyChecking=no)' "$wrapper"

      - name: Execute patch-only against exact PR head
        shell: pwsh
        env:
          CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $out = & pwsh -NoProfile -File scripts/ops/windows/resume-disdex-v12-live-after-ssh-host-fix.ps1 `
            -ExpectedControlMasterSha $env:CONTROL_SHA `
            -ExpectedV12Sha 'f2db8bd87d33f154652be799220d352875866ebb' `
            -RequestSuffix 'final9' `
            -PatchOnly 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Patch-only wrapper failed rc=$LASTEXITCODE" }
          $text = $out -join "`n"
          foreach ($marker in @(
            'SSH_HOST_SECRET_STDIN_BOM_BYPASS=PASS',
            'REQUEST_SUFFIX_PATCH=PASS',
            'PATCHED_RESUME_PARSE=PASS',
            'PATCH_ONLY=PASS'
          )) {
            if (-not $text.Contains($marker)) { throw "Missing marker: $marker" }
          }

      - name: Diff check
        run: git diff --check
