name: PENGU Short Progression V7 ATR Robustness

on:
  pull_request:
    branches:
      - research/pengu-short-progression-v6-20260824
    paths:
      - 'scripts/research_pengu_short_progression_v7_atr.ts'
      - 'scripts/research_pengu_short_progression_v7_crossvenue.py'
      - 'scripts/research_pengu_short_partial_v9.ts'
      - 'scripts/research_pengu_short_partial_v9_crossvenue.py'
      - '.github/workflows/pengu-short-progression-v7-atr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Populate official data cache and retain fixed V7 reference
        run: python scripts/research_pengu_short_progression_v7_crossvenue.py
      - name: Run single-candidate V9 partial de-risk across three environments
        run: python scripts/research_pengu_short_partial_v9_crossvenue.py
      - name: Validate V9 anti-overfit contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('.research-state/pengu-short-partial-v9-crossvenue/result.json'))
          assert x['status']=='PASS_RESEARCH_ONLY'
          assert x['candidate'].startswith('ATR_PROGRESS_HALF_DERISK')
          assert set(x['checks'])=={'binancePrior','binanceOverlap','asterCurrent'}
          assert x['safety']=={'mode':'RESEARCH_ONLY','ordersSent':False,'liveChanged':False,'vpsChanged':False,'productionChanged':False}
          print(json.dumps({'v9Promotion':x['promotion'],'checks':{k:v['pass'] for k,v in x['checks'].items()}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pengu-short-v9-robustness-${{ github.run_id }}
          path: .research-state/pengu-short-partial-v9-crossvenue
          if-no-files-found: error
