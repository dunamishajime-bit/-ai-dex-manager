name: Dis-Dex Runner Health and Recovery CI

on:
  push:
    paths:
      - 'lib/disdex-runner-health.ts'
      - 'lib/disdex-runtime-status.ts'
      - 'scripts/disdex-runner-health-selftest.ts'
      - 'scripts/disdex-runner-watchdog.ts'
      - 'scripts/disdex-runner-watchdog-selftest.ts'
      - 'scripts/disdex-quality102-causal-v1-*.ts'
      - 'scripts/disdex-quality102-causal-v1-signal-selftest.ts'
      - 'scripts/disdex-quality102-causal-v1-state-selftest.ts'
      - 'scripts/disdex-runner-watchdog-safety-boundary.ts'
      - 'scripts/disdex-v12-x1-all-*.ts'
      - 'scripts/v12-x1-all-*.ts'
      - 'scripts/pengu-dual-ls-v2-*.ts'
      - 'scripts/disdex_v52_*.py'
      - 'scripts/disdex_v96_v52_*.py'
      - 'tests/disdex_runner_*.test.ts'
      - 'tests/disdex_runtime_status.test.ts'
      - 'tests/disdex_runner_watchdog_safety_boundary.test.ts'
      - 'package.json'
      - 'docs/implementation/disdex-four-strategy-auto-recovery.md'
      - '.github/workflows/disdex-runner-health-ci.yml'
  pull_request:
    paths:
      - 'lib/disdex-runner-health.ts'
      - 'lib/disdex-runtime-status.ts'
      - 'scripts/disdex-runner-*.ts'
      - 'scripts/disdex-quality102-causal-v1-*.ts'
      - 'scripts/disdex-quality102-causal-v1-signal-selftest.ts'
      - 'scripts/disdex-quality102-causal-v1-state-selftest.ts'
      - 'scripts/disdex-runner-watchdog-safety-boundary.ts'
      - 'scripts/disdex-v12-x1-all-*.ts'
      - 'scripts/v12-x1-all-*.ts'
      - 'scripts/pengu-dual-ls-v2-*.ts'
      - 'scripts/disdex_v52_*.py'
      - 'scripts/disdex_v96_v52_*.py'
      - 'tests/disdex_runner_*.test.ts'
      - 'tests/disdex_runtime_status.test.ts'
      - 'tests/disdex_runner_watchdog_safety_boundary.test.ts'
      - 'package.json'
      - 'docs/implementation/disdex-four-strategy-auto-recovery.md'
      - '.github/workflows/disdex-runner-health-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disdex-runner-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements-stock-aster-only.txt

      - name: Runner health and watchdog self-tests
        run: |
          set -Eeuo pipefail
          npm run strategy:runner-health:selftest
          npm run strategy:runner-watchdog:selftest
          npm run strategy:runtime-status:test

      - name: Q102 causal and four-runner regressions
        run: |
          set -Eeuo pipefail
          npm run strategy:quality102-causal-v1:runtime:selftest
          npm run strategy:quality102-causal-v1:signal:selftest
          npm run strategy:quality102-causal-v1:state:selftest
          npm run strategy:quality102-causal-v1:runner:selftest
          npm run strategy:v12-x1-all:selftest
          npm run strategy:pengu-dual-ls-v2:selftest
          npm run strategy:disdex-v13d-v11eq-v96:contract

      - name: Focused restart, status, and health tests
        run: |
          set -Eeuo pipefail
          npx tsx --test tests/disdex_runner_health.test.ts tests/disdex_runner_restart_reconciliation.test.ts tests/disdex_runtime_status.test.ts

      - name: Static no-order and watchdog safety assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run strategy:runner-watchdog:safety-boundary
          ! grep -R -n -E --exclude-dir='__pycache__' --exclude='*.tmp.*' 'QUALITY102_LIVE_SELECTOR_PARITY=(true|1)|QUALITY102_LIVE_ENABLED=(true|1)' config lib scripts ops
          ! grep -R -n -E --exclude-dir='__pycache__' --exclude='*.tmp.*' --exclude='disdex_runner_watchdog_safety_boundary.test.ts' '\.(placeMarket|place_limit|submitOrder|cancelOrder|closePosition|executeMarket)[[:space:]]*\(' \
            scripts/disdex-runner-health-selftest.ts scripts/disdex-runner-watchdog-selftest.ts \
            scripts/disdex-quality102-causal-v1-*-selftest.ts scripts/v12-*-selftest.ts \
            scripts/pengu-dual-ls-v2-selftest.ts tests/disdex_runner_*.test.ts tests/disdex_runtime_status.test.ts

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build
