name: HYPE AVAX research source-only
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/tsx --test tests/hype-trend-adopted-overlay-contract.test.ts
      - run: ./node_modules/.bin/tsx --test tests/hype-adopted-native-m5-readonly-evidence.test.ts
      - run: python3 tests/test_avax_legacy_native8_source_evidence_20261029.py
      - run: python3 tests/test_hype_adopted_m5_replay_completeness_20261029.py
      - run: ./node_modules/.bin/tsx --test tests/quality102_causal_v1_portfolio.test.ts
      - run: ./node_modules/.bin/tsx --test tests/fet-core-preemption.test.ts tests/fet_core_preemption_wiring.test.ts
      - run: python3 tests/test_v52_no_unnecessary_preemption_20261029.py
      - run: python3 tests/test_q102_native_annual_coverage_gate_20261029.py
      - run: ./node_modules/.bin/tsx --test tests/hype-zec-preemption.test.ts tests/hype-zec-priority-capacity.test.ts tests/idle-residual-long-preemption.test.ts tests/fet-core-preemption.test.ts
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json --pretty false --incremental false
