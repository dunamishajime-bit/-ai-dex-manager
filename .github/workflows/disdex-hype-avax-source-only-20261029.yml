name: HYPE AVAX research source-only
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/tsx --test tests/hype-trend-adopted-overlay-contract.test.ts
      - run: python3 tests/test_avax_legacy_native8_source_evidence_20261029.py
      - run: ./node_modules/.bin/tsx --test tests/hype-zec-priority-capacity.test.ts tests/idle-residual-long-preemption.test.ts tests/fet-core-preemption.test.ts
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json --pretty false --incremental false
