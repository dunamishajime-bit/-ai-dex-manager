name: Research V26 Latency-Aware V6 Stale Entry Guard
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/v26-latency-aware-search-20260816]
    paths:
      - scripts/research_v26_latency_aware_v6.ts
      - .github/workflows/research-v26-latency-aware-v6.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: v26-latency-aware-3y-usdm-v1-20260816
          fail-on-cache-miss: true
      - run: npm ci
      - name: Typecheck V6 research script
        run: npx tsc --noEmit -p tsconfig.research.json
      - name: Run V6 stale-entry guard search
        env:
          RESEARCH_STATE_DIR: .research-state
        run: npx tsx scripts/research_v26_latency_aware_v6.ts
      - name: Assert research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.research-state/v26-latency-aware-v6.json','utf8'));
          if(!d.researchOnly||d.productionChanged||d.vpsChanged||d.liveChanged||d.realTradingEnabled) throw new Error('BOUNDARY_FAIL');
          if(!d.penguExcluded||d.universe.includes('PENGU')||d.universe.length!==14) throw new Error('UNIVERSE_FAIL');
          if(d.leverage!==1) throw new Error('LEVERAGE_FAIL');
          console.log('V26_LATENCY_AWARE_V6_BOUNDARY_PASS');
          NODE
      - name: Publish V6 research result
        run: |
          mkdir -p docs/research-results
          cp .research-state/v26-latency-aware-v6.json docs/research-results/v26-latency-aware-v6-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-results/v26-latency-aware-v6-latest.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "research: record V26 latency-aware V6 result [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v26-latency-aware-v6
          path: .research-state/v26-latency-aware-v6.json
          include-hidden-files: true
          retention-days: 30
