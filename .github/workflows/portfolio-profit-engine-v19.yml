name: Portfolio Profit Engine V19

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/3y-entry-edge-diagnosis-20260815
    paths:
      - scripts/research_portfolio_profit_engine_v19.py
      - .github/workflows/portfolio-profit-engine-v19.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen V15 stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research_portfolio_profit_engine_v15.py)" = "1ac36230c636df11649892256ad7bbba0c6693a1"
          test "$(git hash-object scripts/research_portfolio_profit_engine_v14.py)" = "f297505cabf45488a507a90b3a730720ac94c203"
          echo FROZEN_V15_STACK_PASS
      - name: Restore exact 3Y cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pairwise-clean-sheet-3y-usdm-v1-20260815
          fail-on-cache-miss: true
      - name: Compile V19
        run: python -m py_compile scripts/research_portfolio_profit_engine_v17.py scripts/research_portfolio_profit_engine_v17_takeover_fix.py scripts/research_portfolio_profit_engine_v19.py
      - name: Run V19
        env:
          RESEARCH_STATE_DIR: .research-state
        run: python scripts/research_portfolio_profit_engine_v19.py
      - name: Assert research boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.research-state/portfolio-profit-engine-v19.json').read_text())
          assert d['researchLine']=='PORTFOLIO_PROFIT_ENGINE_V19_V15_PLUS_IDLE_BREAKOUT'
          assert d['researchOnly'] is True and d['productionChanged'] is False and d['vpsChanged'] is False and d['liveChanged'] is False
          assert d['realTradingEnabled'] is False and d['liveEligible'] is False and d['freshOosRead'] is False and d['freshOosConsumed'] is False
          assert d['target']['main3YCagrPct']==100.0 and d['target']['grossExposureCapPct']==100.0 and d['target']['leverageMultiplier']==1.0
          assert d['diagnosisBasis']['v17RangeImported'] is False
          assert d['antiOverfit']['parameterGrid'] is False and d['antiOverfit']['overlappingExposure'] is False
          print('V19_RESEARCH_ONLY_FAIL_CLOSED_PASS')
          PY
      - name: Upload V19 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-profit-engine-v19
          path: |
            .research-state/portfolio-profit-engine-v19.json
            .research-state/portfolio-profit-engine-v19-trades.jsonl
          if-no-files-found: warn
          retention-days: 30
