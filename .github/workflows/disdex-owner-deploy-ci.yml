permissions:
  contents: read

jobs:
  owner-authorization-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Ed25519 grant rejection cases
        run: python3 -m unittest discover -s tests -p test_disdex_owner_approval.py -v
      - name: Verify multi-SHA exact-scope plans
        run: python3 -m unittest discover -s tests -p test_disdex_deployment_plan.py -v
      - name: Root-side read-only preflight and forced-command tests
        run: python3 -m unittest discover -s tests -p test_disdex_unified_root_gate.py -v
      - name: Real Shared Risk refresh audit invariants
        run: python3 -m unittest discover -s tests -p test_shared_risk_real_audit.py -v
      - name: No-order maintenance exact scope and root rollback fixtures
        run: sudo /usr/bin/python3 -m unittest discover -s tests -p test_pending_maintenance_install.py -v
      - name: Independent V4 no-order phase and partial-cutover rollback
        run: sudo /usr/bin/python3 -m unittest discover -s tests -p test_v4_monitor_cutover.py -v
      - name: V52 independent authority and protected-hold rollback
        run: sudo /usr/bin/python3 -m unittest tests.test_v52_scoped_root_contract tests.test_v52_root_integration -v
      - name: Independent no-order health snapshot transaction
        run: sudo /usr/bin/python3 -m unittest tests.test_monitor_snapshot_cutover tests.test_monitor_live_preservation tests.test_watchdog_scoped_cutover tests.test_deployment_serialization -v
      - name: No-order Production signed reader boundary
        run: python3 -m unittest discover -s tests -p test_shared_risk_witness.py -v
      - name: Root-only Shared Risk no-order prestart
        run: python3 -m unittest discover -s tests -p test_shared_risk_prestart.py -v
      - name: Shared Risk monitor key CAS and rollback
        run: python3 -m unittest discover -s tests -p test_shared_risk_monitor_wiring.py -v
      - name: Strict flat IDLE residual venue witness tests
        run: python3 -m unittest discover -s tests -p test_disdex_idle_flat_stale_recovery.py -v
      - name: Read-only live-readiness inventory fail-closed test
        run: python3 -m unittest discover -s tests -p test_disdex_v4_live_readiness.py -v
      - name: V4 fresh venue witness contract tests
        run: python3 -m unittest discover -s tests -p test_disdex_v4_venue_witness.py -v
      - name: V4 immutable static evidence contract tests
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_disdex_v4_static_evidence.py -v
      - name: V4 priority root authority and canonical prestart
        run: |
          python3 -m unittest discover -s tests -p test_v4_priority_live.py -v
          python3 -m unittest discover -s tests -p test_v4_canonical_prestart.py -v
          python3 -m unittest discover -s tests -p test_v4_refresh_exec.py -v
          node --test tests/v4-priority-bootstrap.test.mjs
      - name: V4 exact-scope rollback and owner approval tests
        run: python3 -m unittest discover -s tests -p test_disdex_v4_root_cutover.py -v
      - name: Root helper installer contract tests
        run: python3 -m unittest discover -s tests -p test_disdex_unified_helper_installer.py -v
      - name: Audit legacy VPS SSH paths (read-only inventory)
        run: python3 scripts/ops/deploy/audit_legacy_deploy_paths.py
      - name: Source and workflow fail-closed contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ops/deploy/disdex_deployment_contract.py \
            scripts/ops/deploy/disdex_owner_approval.py \
            scripts/ops/deploy/disdex_deployment_plan.py \
            scripts/ops/deploy/disdex_codex_ssh.py \
            scripts/ops/deploy/disdex_unified_root_gate.py \
            scripts/ops/deploy/disdex_v4_root_cutover.py \
            scripts/ops/deploy/disdex_unified_forced_command.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/disdex-unified-production-deploy.yml').read_text()
          for pattern in ('workflow_dispatch:', 'name: disdex-production',
                          'OWNER_ENV_LOCKED_V1', 'DISDEX_PRODUCTION_SSH_PRIVATE_KEY',
                          'DISDEX_PRODUCTION_APPROVER_PUBLIC_KEY_PEM',
                          '--execute', '--read-approval-stdin', '--route GITHUB_ACTIONS',
                          '--deployment-target', '--operator-target',
                          '--orders-enabled', 'cancel-in-progress: false',
                          '[[ "$REF" == "refs/heads/master" ]]'):
              assert pattern in p, pattern
          legacy_secret = 'secrets.' + 'DISDEX_VPS_ROOT_' + 'PRIVATE_KEY'
          assert legacy_secret not in p
          assert 'password:' not in p
          adapter = Path('scripts/ops/deploy/disdex_codex_ssh.py').read_text()
          assert 'CODEX_SSH' in adapter
          assert '--codex-ssh' in adapter
          assert 'CODEX_SSH_OPERATOR' in adapter
          assert '/usr/local/sbin/disdex-unified-production-deploy' in adapter
          assert 'shell=True' not in adapter
          assert 'subprocess.run(command' in adapter
          root_gate = Path('scripts/ops/deploy/disdex_unified_root_gate.py').read_text()
          assert 'def assert_codex_ssh_session' in root_gate
          assert 'ROOT_SSH_SESSION' in root_gate
          assert 'def certify_live_executor' in root_gate
          assert 'LIVE_EXECUTOR_CONTRACT_CERTIFIED' in root_gate
          assert 'LIVE_EXECUTOR_NOT_CERTIFIED' not in root_gate
          assert 'READONLY_PREFLIGHT_PASS_NOT_LIVE' in root_gate
          assert 'SHARED_RISK_CUTOVER_VERIFIED' in root_gate
          assert 'three-cycle audit' in root_gate
          assert 'verify(token' in root_gate
          assert '--owner $OWNER' in p
          print('DISDEX_OWNER_DEPLOY_POLICY_SOURCE_PASS')
          PY

  expired-account-lock-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dead-owner PID, exact hash and atomic archival tests (no venue)
        run: npx --no-install tsx --test tests/disdex-expired-account-lock-recovery.test.ts
