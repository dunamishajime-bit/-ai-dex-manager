name: DisDex HP Production Approval Request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: disdex-hp-production-approval-request
  cancel-in-progress: false

jobs:
  publish-request:
    if: >-
      github.event.repository.full_name == 'dunamishajime-bit/-ai-dex-manager' &&
      github.event.issue.number == 317 &&
      github.actor == 'dunamishajime-bit' &&
      github.event.comment.author_association == 'OWNER' &&
      (
        startsWith(github.event.comment.body, 'DISDEX_DEPLOY_REQUEST V12_V4 ') ||
        startsWith(github.event.comment.body, 'DISDEX_PROTECTED_REQUEST IDLE_FLAT_STALE_REPAIR ')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact request command and bind operation
        id: request
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os, re

          body = os.environ["BODY"].strip()
          deploy = re.fullmatch(
              r"DISDEX_DEPLOY_REQUEST V12_V4 SHA=([0-9a-f]{40}) PLAN=([0-9a-f]{64})",
              body,
          )
          idle = re.fullmatch(
              r"DISDEX_PROTECTED_REQUEST IDLE_FLAT_STALE_REPAIR SHA=([0-9a-f]{40})",
              body,
          )

          if deploy:
              target, plan = deploy.groups()
              operation = "V12_V4_LIVE"
              scope = "V12_V4"
              orders_enabled = "true"
          elif idle:
              target = idle.group(1)
              operation = "IDLE_FLAT_STALE_REPAIR"
              scope = "IDLE_PRIORITY_SHORT"
              orders_enabled = "false"
              context = f"IDLE_FLAT_STALE_REPAIR_AFTER_THREE_SIGNED_GETS\n{target}\n"
              plan = hashlib.sha256(context.encode("ascii")).hexdigest()
          else:
              raise SystemExit("request comment does not match a protected production request grammar")

          print("operation=" + operation)
          print("scope=" + scope)
          print("orders_enabled=" + orders_enabled)
          print("target_sha=" + target)
          print("plan_sha256=" + plan)
          print("comment_id=" + os.environ["COMMENT_ID"])
          PY

      - name: Configure pinned root SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          ROOT_KEY: ${{ secrets.DISDEX_VPS_ROOT_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DISDEX_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$ROOT_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$ROOT_KEY" > "$HOME/.ssh/id_vps_root"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_vps_root" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_vps_root" >/dev/null

      - name: Publish pending request through serialized approval store helper
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DISDEX_VPS_SSH_HOST }}
          SSH_PORT: ${{ vars.DISDEX_VPS_SSH_PORT }}
          OPERATION: ${{ steps.request.outputs.operation }}
          SCOPE: ${{ steps.request.outputs.scope }}
          ORDERS_ENABLED: ${{ steps.request.outputs.orders_enabled }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          PLAN_SHA256: ${{ steps.request.outputs.plan_sha256 }}
          COMMENT_ID: ${{ steps.request.outputs.comment_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          REMOTE_HELPER="/tmp/disdex_deployment_approval_store.$GITHUB_RUN_ID.py"
          scp -i "$HOME/.ssh/id_vps_root" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$PORT" \
            scripts/ops/deploy/disdex_deployment_approval_store.py \
            "root@$SSH_HOST:$REMOTE_HELPER"
          ssh -T -i "$HOME/.ssh/id_vps_root" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 \
            -p "$PORT" "root@$SSH_HOST" \
            "set -euo pipefail; trap 'rm -f -- $REMOTE_HELPER' EXIT; python3 '$REMOTE_HELPER' create-pending --operation '$OPERATION' --scope '$SCOPE' --orders-enabled '$ORDERS_ENABLED' --target-sha '$TARGET_SHA' --plan-sha256 '$PLAN_SHA256' --actor '$ACTOR' --comment-id '$COMMENT_ID'"
      - name: Destroy SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh/id_vps_root" "$HOME/.ssh/known_hosts"
