name: DisDex V4 HP Approval Request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: disdex-v4-hp-approval-request
  cancel-in-progress: false

jobs:
  publish-request:
    if: github.event.repository.full_name == 'dunamishajime-bit/-ai-dex-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate actor and exact request command
        id: request
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: ${{ vars.DISDEX_DEPLOY_ALLOWED_ACTORS }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          [[ -n "$ALLOWED" ]]
          [[ ",$ALLOWED," == *",$ACTOR,"* ]]
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          body = os.environ["BODY"].strip()
          m = re.fullmatch(
              r"DISDEX_DEPLOY_REQUEST V12_V4 SHA=([0-9a-f]{40}) PLAN=([0-9a-f]{64})",
              body,
          )
          if not m:
              raise SystemExit("request comment does not match the exact deployment request grammar")
          print("target_sha=" + m.group(1))
          print("plan_sha256=" + m.group(2))
          print("comment_id=" + os.environ["COMMENT_ID"])
          PY

      - name: Publish pending request to DisDex HP
        shell: bash
        env:
          BRIDGE_SECRET: ${{ secrets.DISDEX_HP_APPROVAL_BRIDGE_SECRET }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          PLAN_SHA256: ${{ steps.request.outputs.plan_sha256 }}
          COMMENT_ID: ${{ steps.request.outputs.comment_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ -n "$BRIDGE_SECRET" ]]
          payload="$(
            python3 - <<'PY'
          import json, os
          print(json.dumps({
              "action": "publish",
              "scope": "V12_V4",
              "target_sha": os.environ["TARGET_SHA"],
              "plan_sha256": os.environ["PLAN_SHA256"],
              "actor": os.environ["ACTOR"],
              "comment_id": os.environ["COMMENT_ID"],
          }, separators=(",", ":")))
          PY
          )"
          curl --fail-with-body --silent --show-error             --connect-timeout 10 --max-time 20             -H "Authorization: Bearer $BRIDGE_SECRET"             -H "Content-Type: application/json"             --data "$payload"             https://professional-dismanager.net/api/system/deploy-approval
