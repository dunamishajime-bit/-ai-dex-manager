name: SOL LINK V109 Autonomous Structural Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/sol-link-v109-autonomous-trigger.txt"
      - "scripts/research_sol_link_v109_autonomous.py"
      - "scripts/research_sol_v109_wrongwave_latch.py"
      - "scripts/research_sol_link_v109_next_structures.py"
      - "scripts/research_sol_link_v109_next_structures_v2.py"
      - "scripts/research_sol_link_v109_next_structures_v3.py"
      - "scripts/research_sol_link_v109_next_structures_v4.py"
      - "scripts/research_sol_link_v109_next_structures_v5.py"
      - "scripts/research_sol_link_v109_next_structures_v6.py"
      - "scripts/research_link_v109_staged_forecast_handoff_v7.py"
      - ".github/workflows/sol-link-v109-autonomous.yml"

permissions:
  contents: read

concurrency:
  group: sol-link-v109-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        pair: [LINK]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source is unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || {
            echo "FROZEN_V109_SOURCE_DRIFT" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile research-only drivers
        run: |
          python -m py_compile scripts/research_sol_link_v109_autonomous.py
          python -m py_compile scripts/research_link_v109_staged_forecast_handoff_v7.py
      - name: Run LINK structural D/V successor
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        shell: bash
        run: python scripts/research_link_v109_staged_forecast_handoff_v7.py --pair LINK
      - name: Upload D/V research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LINK-v109-autonomous-structural
          path: |
            .research-state/link-v109-autonomous-structural.json
            .research-state/link-v109-autonomous-structural.md
            .research-state/link-v109-autonomous-structural-ledger.csv
          if-no-files-found: warn
          retention-days: 30

# Research-only independent line. Development/Validation only.
# Frozen V109 source/threshold/risk/trail are reference-only and never modified.
# SOL V6 is Frozen Survivor and is not rerun or modified here.
# LINK V7: exact Frozen-V109 broad entry -> 0-24h Forecast Owner -> evidence-based 24-48h Durable Owner handoff or Cash.
# Confirmation/Holdout are never read for design, ranking, tuning, or redesign.
# Production/live/VPS/.env/credentials/API keys/orders/accounts/positions/approvals/realTradingEnabled untouched.
