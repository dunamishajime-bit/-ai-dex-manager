name: SOL LINK V109 Autonomous Structural Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "research/sol-link-v109-autonomous-trigger.txt"
      - "scripts/research_sol_link_v109_autonomous.py"
      - ".github/workflows/sol-link-v109-autonomous.yml"

permissions:
  contents: read

concurrency:
  group: sol-link-v109-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [SOL, LINK]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assert Frozen V109 source is unchanged
        shell: bash
        run: |
          test "$(git hash-object scripts/research_lab_pair_specific_v109.py)" = "75a80eed073df2ef5e13ff3a297f94c533ac2aef" || {
            echo "FROZEN_V109_SOURCE_DRIFT" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact Binance USD-M research cache
        uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile research-only driver
        run: python -m py_compile scripts/research_sol_link_v109_autonomous.py
      - name: Run autonomous structural D/V chain
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_sol_link_v109_autonomous.py --pair "${{ matrix.pair }}"
      - name: Upload D/V research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair }}-v109-autonomous-structural
          path: |
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-v109-autonomous-structural.json
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-v109-autonomous-structural.md
            .research-state/${{ matrix.pair == 'SOL' && 'sol' || 'link' }}-v109-autonomous-structural-ledger.csv
          if-no-files-found: warn
          retention-days: 30

# Research-only independent line.
# Frozen V109 source/threshold/risk/trail are reference-only and never modified.
# Design evidence: Development/Validation only. Confirmation/Holdout are not read.
# Production/live/VPS/.env/credentials/API keys/orders/accounts/positions/approvals/realTradingEnabled untouched.
