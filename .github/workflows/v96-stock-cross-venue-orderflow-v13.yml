name: V96 Stock Cross-Venue Maker Hedge V13

on:
  pull_request:
    paths:
      - "research/v96_stock_cross_venue_orderflow_v13.py"
      - "research/v96_stock_cross_venue_orderflow_v13_engine.py"
      - "research/v96_stock_cross_venue_orderflow_v13_engine_base.py"
      - "docs/research/V96_STOCK_CROSS_VENUE_ORDERFLOW_V13_PROTOCOL_2026-07-24.md"
      - "docs/research/V96_STOCK_CROSS_VENUE_ORDERFLOW_V13_PROBE_2026-07-24.md"
      - ".github/workflows/v96-stock-cross-venue-orderflow-v13.yml"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Public-data SHADOW probe duration
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: v96-stock-cross-venue-orderflow-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public market-data dependency
        run: python -m pip install --disable-pip-version-check "websockets>=14,<16"
      - name: Syntax and deterministic self-test
        run: |
          python -m py_compile research/v96_stock_cross_venue_orderflow_v13_engine_base.py
          python -m py_compile research/v96_stock_cross_venue_orderflow_v13_engine.py
          python -m py_compile research/v96_stock_cross_venue_orderflow_v13.py
          python research/v96_stock_cross_venue_orderflow_v13.py --self-test
      - name: Run public two-venue SHADOW probe
        shell: bash
        run: |
          DURATION="75"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DURATION="${{ inputs.duration_seconds }}"
          fi
          python research/v96_stock_cross_venue_orderflow_v13.py \
            --duration-seconds "$DURATION" \
            --output-dir .research-state/v96-stock-cross-venue-orderflow-v13
      - name: Validate endpoint and symbol coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.research-state/v96-stock-cross-venue-orderflow-v13/result.json').read_text())
          assert result['safety']['orderSubmissionAllowed'] is False
          assert result['safety']['productionChanged'] is False
          assert result['safety']['liveChanged'] is False
          assert result['safety']['vpsChanged'] is False
          assert result['safety']['cryptoV96Changed'] is False
          assert len(result['coverage']['completeSymbols']) == 5, result['coverage']
          assert result['coverage']['collectorErrors'] == 0, result['coverage']
          assert 'completedCycles' in result['virtualExecution']
          print(json.dumps({
              'strategyId': result['strategyId'],
              'status': result['status'],
              'coverage': result['coverage'],
              'virtualExecution': result['virtualExecution'],
              'costScenarios': result['costScenarios'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-stock-cross-venue-orderflow-v13-${{ github.run_id }}
          path: .research-state/v96-stock-cross-venue-orderflow-v13
          retention-days: 90
          if-no-files-found: warn
