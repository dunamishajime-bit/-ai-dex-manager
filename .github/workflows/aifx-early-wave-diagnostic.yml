name: AIFX Early Wave Frozen Diagnostic

on:
  push:
    branches:
      - research/aifx-early-wave-free-bt-20260811
    paths:
      - research/aifx_early_wave_diagnostics.py
      - .github/workflows/aifx-early-wave-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run frozen diagnostic
        run: python research/aifx_early_wave_diagnostics.py
      - name: Commit diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/aifx_early_wave_diagnostics.json research/aifx_early_wave_diagnostics.md
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "research: record frozen early-wave diagnostics [skip ci]"
            git push
          fi
