name: Active4 V141 State Ownership

on:
  workflow_dispatch:
  push:
    branches:
      - research/win80-profit-optimization-v1
    paths:
      - "scripts/research_active4_v141_state_ownership.py"
      - ".github/workflows/active4-v141.yml"

permissions:
  contents: read

concurrency:
  group: active4-v141-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        candidate: [btc_probe_core_handoff_v11, btc_sponsor_reclaim_owner_v11, eth_leadership_persistence_handoff_v11, bnb_consensus_pulse_expiry_v11, avax_burst_scout_handoff_v11]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/perp-research-usdm
          key: pair-specific-v107-exact-usdm-v3-20260811
          restore-keys: |
            pair-specific-v104-exact-usdm-v3-20260810
            pair-specific-v106-usdm-
            six-pair-v98-usdm-
      - name: Compile
        run: python -m py_compile scripts/research_active4_v141_state_ownership.py
      - name: Run V141 candidate
        env:
          RESEARCH_AUTONOMOUS_STATE_DIR: .research-state
        run: python scripts/research_active4_v141_state_ownership.py --candidate "${{ matrix.candidate }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active4-v141-${{ matrix.candidate }}
          path: |
            .research-state/active4-v140-${{ matrix.candidate }}.json
            .research-state/active4-v140-${{ matrix.candidate }}.md
          if-no-files-found: warn
          retention-days: 30

# Research-only BTC/ETH/BNB/AVAX; Development/Validation only.
# Confirmation/Holdout, SOL/LINK, production/live/VPS/.env/credentials/orders/accounts/positions untouched.
