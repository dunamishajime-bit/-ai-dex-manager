name: DisDex V96 V52 Margin Risk CI

on:
  pull_request:
    paths:
      - 'config/disdexV96Runtime.ts'
      - 'config/disdexStockRouterV13DV11EqRuntime.ts'
      - 'lib/direct-trade-executor.ts'
      - 'lib/disdex-v96-execution-capacity.ts'
      - 'scripts/disdex-v96-live-runner.ts'
      - 'scripts/disdex-v96-live-preflight.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-preflight.ts'
      - 'scripts/disdex-v13d-v11eq-v96-live-runner.ts'
      - 'scripts/disdex-v13d-v11eq-v96-strategy-preflight.ts'
      - 'scripts/disdex_v96_v52_margin_risk_policy.py'
      - 'scripts/disdex_v96_v52_margin_guard.py'
      - 'scripts/disdex_v52_margin_aware_live_engine.py'
      - 'scripts/disdex-v96-v52-prepare-account-risk.py'
      - 'scripts/ops/**'
      - 'ops/systemd/**'
      - '.github/workflows/disdex-v96-v52-margin-risk-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-margin-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and strategy contracts
        run: |
          set -Eeuo pipefail
          npm run strategy:disdex-v96:typecheck
          npm run strategy:disdex-v13d-v11eq-v96:contract:typecheck
          npm run strategy:disdex-v13d-v11eq-v96:contract:selftest
          npm run strategy:disdex-v13d-v11eq-v96:supervisor:selftest
          npm run strategy:disdex-v96:execution:selftest

      - name: Validate adaptive Margin Guard and V52 runner
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/disdex_v11eq_aster_only_live_engine.py \
            scripts/disdex_v52_aster_only_live_engine.py \
            scripts/disdex_v96_v52_margin_risk_policy.py \
            scripts/disdex_v96_v52_margin_guard.py \
            scripts/disdex_v52_margin_aware_live_engine.py \
            scripts/disdex-v96-v52-prepare-account-risk.py \
            scripts/ops/root/disdex-vps-retention-cleanup
          python3 scripts/disdex_v52_aster_only_live_engine.py --self-test
          python3 scripts/disdex_v96_v52_margin_risk_policy.py
          python3 scripts/disdex_v96_v52_margin_guard.py --self-test
          python3 scripts/disdex_v52_margin_aware_live_engine.py --self-test
          python3 scripts/ops/root/disdex-vps-retention-cleanup --self-test

      - name: Validate fixed policy and storage boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/disdex-v96-v52-live-policy.sh
          bash -n scripts/ops/disdex-v96-v52-live-policy-selftest.sh
          bash -n scripts/ops/disdex-v96-v52-approval-policy-wrapper.sh
          bash -n scripts/ops/disdex-v96-v52-candidate-preflight.sh
          bash -n scripts/ops/disdex-v96-v52-live.sh
          bash -n scripts/ops/root/install-disdex-vps-control
          bash scripts/ops/disdex-v96-v52-live-policy-selftest.sh
          grep -Eq '^  export DISDEX_V96_MAX_GROSS=1\.5$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V52_STOCK_GROSS_CAP=1\.5$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V52_PORTFOLIO_GROSS_CAP=2\.5$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V96_V52_REQUIRED_INITIAL_LEVERAGE=5$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V96_V52_PREORDER_MARGIN_GUARD_ENABLED=true$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V52_MINIMUM_SECOND_STOCK_GROSS=0\.25$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -Eq '^  export DISDEX_V52_MAX_CONCURRENT_STOCK_POSITIONS=2$' scripts/ops/disdex-v96-v52-live-policy.sh
          grep -q 'HEALTHY_POLL_INTERVAL_MS = 5 \* 60_000' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q 'WARNING_POLL_INTERVAL_MS = 60_000' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q 'WARNING_MARGIN_RATIO_PCT = 50.0' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q 'REDUCE_MARGIN_RATIO_PCT = 65.0' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q 'CRITICAL_MARGIN_RATIO_PCT = 75.0' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q 'ACTIVATE_SHARED_KILL_SWITCH_FLATTEN_MANAGED' scripts/disdex_v96_v52_margin_risk_policy.py
          grep -q -- '--preorder-check' scripts/disdex_v96_v52_margin_guard.py
          grep -q -- '--preflight-readonly' scripts/disdex_v96_v52_margin_guard.py
          grep -q 'command.reduceOnly !== true' lib/direct-trade-executor.ts
          grep -q 'scripts/disdex_v96_v52_margin_guard.py' scripts/ops/disdex-v96-v52-live.sh
          grep -q 'healthyMarginPollIntervalMs=300000' scripts/ops/disdex-v96-v52-live.sh
          grep -q 'warningMarginPollIntervalMs=60000' scripts/ops/disdex-v96-v52-live.sh
          grep -q 'maximumPortfolioGross), 1.5' scripts/ops/disdex-v96-v52-approval-policy-wrapper.sh
          grep -q 'combinedPortfolioGrossCap: 2.5' scripts/ops/disdex-v96-v52-approval-policy-wrapper.sh
          grep -q 'scripts/disdex_v52_margin_aware_live_engine.py' scripts/disdex-v13d-v11eq-v96-live-runner.ts
          grep -q 'verifyManagedAccountConfiguration' scripts/disdex-v96-live-runner.ts
          grep -q 'DISDEX_V96_V52_ACCOUNT_RISK_PREPARATION_PASS' scripts/disdex-v96-v52-prepare-account-risk.py
          grep -q 'DISDEX_VPS_RETENTION_CLEANUP_SELFTEST_PASS' scripts/ops/root/disdex-vps-retention-cleanup
          grep -q 'RELEASE_KEEP_NONCURRENT = 2' scripts/ops/root/disdex-vps-retention-cleanup
          grep -q 'AUDIT_RETENTION_DAYS = 14' scripts/ops/root/disdex-vps-retention-cleanup
          grep -q 'PROMOTION_FAILURE_RETENTION_DAYS = 90' scripts/ops/root/disdex-vps-retention-cleanup
          grep -q '^Environment=DISDEX_V96_MAX_GROSS=1.5$' ops/systemd/disdex-v96-v52-live.service
          grep -q '^Environment=DISDEX_V52_PORTFOLIO_GROSS_CAP=2.5$' ops/systemd/disdex-v96-v52-live.service
          grep -q '^Environment=DISDEX_V96_V52_REQUIRED_INITIAL_LEVERAGE=5$' ops/systemd/disdex-v96-v52-live.service
          grep -q '^Environment=DISDEX_V96_V52_PREORDER_MARGIN_GUARD_ENABLED=true$' ops/systemd/disdex-v96-v52-live.service
          grep -q 'ExecStart=/usr/bin/python3 scripts/disdex-v96-v52-prepare-account-risk.py' ops/systemd/disdex-v96-v52-account-risk@.service
          grep -q 'ExecStart=/usr/local/sbin/disdex-vps-retention-cleanup --apply' ops/systemd/disdex-vps-retention.service
          grep -q '^OnCalendar=daily$' ops/systemd/disdex-vps-retention.timer
          grep -q '^SystemMaxUse=256M$' ops/systemd/90-disdex-storage-guard.conf
          grep -q '^MaxRetentionSec=14day$' ops/systemd/90-disdex-storage-guard.conf

      - name: Validate promotion rollback remains isolated
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ops/disdex-v96-v52-promotion-rollback-selftest.sh
          sudo bash scripts/ops/root/disdex-vps-control trading-promote-selftest all
