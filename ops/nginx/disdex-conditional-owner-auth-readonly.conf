# Scope this snippet inside the HTTPS server for professional-dismanager.net.
# GET /api/system/runner-health is existing authenticated session oracle.
location = /__disdex_auth_probe_protected_readonly {
    internal;
    proxy_pass http://127.0.0.1:3001/api/system/runner-health;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/system/live-portfolio {
    auth_request /__disdex_auth_probe_protected_readonly;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/system/q102-symbol-status {
    auth_request /__disdex_auth_probe_protected_readonly;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
